<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101918" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<meta name="description" content="iOS / macOS アプリの中身（Mach-O / ARM64）を、1 行ずつ日本語で解説しながら読むためのビューア。">
<title>Hex — ARM64 読み解きツール</title>
<link rel="icon" href="/manus-storage/hex-mark_4779543e.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<div class="app" id="app">

  <!-- ── タイトルバー ──────────────────────────────────────── -->
  <!-- Design philosophy: 「証拠の地図帳」。現在地・根拠・次の行動を一貫して示す。 -->
  <header class="titlebar">
    <button class="tb-btn" id="btn-open" type="button" data-i18n="btn.open">開く</button>
    <div class="brand-lockup" aria-label="Hex">
      <img src="/manus-storage/hex-mark_4779543e.png" alt="" width="32" height="32">
      <span>HEX</span>
    </div>
    <div class="tb-title">
      <span class="tb-name" id="tb-name">ファイル未選択</span>
      <span class="tb-sub" id="tb-sub">アプリの中身（Mach-O / 生バイナリ）を開いてください</span>
    </div>
    <button class="tb-btn icon" id="btn-help" type="button"
            data-i18n-aria="btn.help" aria-label="ヘルプ">？</button>
    <button class="tb-btn icon" id="btn-more" type="button"
            data-i18n-aria="btn.settings" aria-label="設定">⋯</button>
  </header>

  <!-- ── ツールバー ────────────────────────────────────────── -->
  <div class="toolbar">
    <div class="workspace-nav" role="tablist" aria-label="解析の入口">
      <button class="tb-btn strong nav-primary" id="btn-investigate" type="button" disabled data-i18n="btn.investigate">調べる</button>
      <button class="tb-btn nav-item" id="btn-tools" type="button" disabled data-i18n="btn.tools">解析</button>
      <button class="tb-btn nav-item" id="btn-functions" type="button" disabled data-i18n="btn.functions">関数</button>
    </div>
    <div class="segmented" id="mode-switch" role="tablist" aria-label="表示の切り替え">
      <button class="seg" data-mode="asm" role="tab" aria-selected="true" type="button"
              data-i18n="mode.asm">アセンブリ</button>
      <button class="seg" data-mode="hex" role="tab" aria-selected="false" type="button"
              data-i18n="mode.hex">16進</button>
    </div>
    <button class="tb-btn pill" id="btn-explain" type="button" aria-pressed="true"
            data-i18n="btn.explainToggle">解説</button>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="btn-search" type="button" disabled data-i18n="btn.search">検索</button>
    <button class="tb-btn compact-action" id="btn-jump" type="button" disabled data-i18n="btn.jump">ジャンプ</button>
    <details class="tool-overflow">
      <summary class="tb-btn compact-action" aria-label="その他の操作">その他</summary>
      <div class="tool-overflow-menu">
        <button class="tb-btn" id="btn-strings" type="button" disabled data-i18n="btn.strings">文字列</button>
        <button class="tb-btn" id="btn-sections" type="button" disabled data-i18n="btn.sections">セクション</button>
        <button class="tb-btn" id="btn-struct" type="button" disabled data-i18n="btn.struct">構造</button>
        <button class="tb-btn" id="btn-select" type="button" disabled data-i18n="btn.select">選択</button>
      </div>
    </details>
  </div>

  <!-- ── 現在位置 ──────────────────────────────────────────── -->
  <div class="addrbar">
    <span class="addr-cur mono" id="addr-cur">—</span>
    <span class="addr-region" id="addr-region"></span>
    <span class="addr-range mono" id="addr-range"></span>
  </div>

  <!-- ── 列見出し ──────────────────────────────────────────── -->
  <div class="colhead mono" id="colhead">
    <span class="c-addr" data-i18n="col.address">アドレス</span>
    <span class="c-hex" data-i18n="col.hex">16進</span>
    <span class="c-mn" data-i18n="col.instruction">命令</span>
    <span class="c-ops"></span>
    <span class="c-ascii" data-i18n="col.ascii">文字</span>
  </div>

  <!-- ── 本体 ──────────────────────────────────────────────── -->
  <div class="viewwrap">
    <div class="viewport mode-asm" id="viewport" tabindex="0">
      <div class="rows" id="rows"></div>
    </div>
    <div class="scrubber" id="scrubber" aria-hidden="true"><div class="thumb" id="scrub-thumb"></div></div>

    <div class="empty" id="empty">
      <div class="empty-backdrop" aria-hidden="true"></div>
      <div class="empty-inner">
        <div class="empty-context" aria-label="調査の流れ">
          <span class="context-label">調査の入口</span>
          <span>ファイル</span><b>›</b><span>索引</span><b>›</b><span>根拠</span><b>›</b><strong>次の一手</strong>
        </div>
        <div class="empty-frame">
          <aside class="empty-rail" aria-label="根拠の状態">
            <div class="rail-title">EVIDENCE<br>RAIL</div>
            <div class="rail-stop fact"><i></i><span>事実</span></div>
            <div class="rail-stop infer"><i></i><span>推測</span></div>
            <div class="rail-stop unknown"><i></i><span>未確定</span></div>
          </aside>
          <div class="empty-main">
            <div class="empty-kicker">LOCAL BINARY WORKBENCH</div>
            <div class="empty-title" data-i18n="empty.title">アプリの中身を、日本語で読む</div>
            <p class="empty-text" data-i18n-html="empty.text"></p>
            <div class="empty-actions">
              <button class="btn-primary" id="btn-sample" type="button" data-i18n="btn.sample">サンプルで練習する</button>
              <button class="btn-secondary" id="btn-open-2" type="button" data-i18n="btn.openFile">ファイルを開く…</button>
            </div>
            <button class="linkbtn" id="btn-learn-2" type="button" data-i18n="help.learn">学習コース（ゼロから読めるようになる）</button>
            <p class="empty-note" data-i18n="empty.firstTime">はじめての方へ：まずは「サンプルで練習する」がおすすめです。</p>
          </div>
          <section class="relation-lens" aria-label="Hexでたどる解析の関係図">
            <div class="lens-head"><span>RELATION LENS</span><b>静的な関係</b></div>
            <svg viewBox="0 0 310 176" role="img" aria-label="バイナリから根拠つきの答えへ進む関係図">
              <path class="lens-line verified" d="M52 49 H130 V93 H206" />
              <path class="lens-line inferred" d="M52 128 H130 V93" />
              <path class="lens-line muted" d="M206 93 H268" />
              <circle class="lens-node source" cx="52" cy="49" r="10" /><circle class="lens-node source" cx="52" cy="128" r="10" />
              <circle class="lens-node index" cx="130" cy="93" r="13" /><circle class="lens-node evidence" cx="206" cy="93" r="15" /><circle class="lens-node answer" cx="268" cy="93" r="11" />
              <text x="52" y="28">命令</text><text x="52" y="158">文字列</text><text x="130" y="123">索引</text><text x="206" y="124">根拠</text><text x="268" y="72">答え</text>
            </svg>
            <div class="lens-facts">
              <div><b>事実</b><span>端末の中だけで解析します</span></div>
              <div><b>次の一手</b><span>サンプルで関係をたどれます</span></div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <div class="loading" id="loading" hidden>
      <div class="spinner"></div><span id="loading-text">読み込み中…</span>
    </div>
  </div>

  <!-- ── 範囲選択バー ──────────────────────────────────────── -->
  <div class="selbar" id="selbar" hidden>
    <span class="sel-count mono" id="sel-count"></span>
    <span class="sel-range mono" id="sel-range"></span>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="btn-sel-all" type="button" data-i18n="btn.all">全部</button>
    <button class="tb-btn strong" id="btn-sel-copy" type="button" data-i18n="btn.copy">コピー</button>
    <button class="tb-btn" id="btn-sel-done" type="button" data-i18n="btn.clear">解除</button>
  </div>

  <!-- ── 状態表示 ──────────────────────────────────────────── -->
  <footer class="statusbar">
    <span id="st-left" class="mono"></span>
    <span id="st-right" class="mono"></span>
  </footer>

</div>

<input type="file" id="file-input" hidden>

<!-- シートやメニューは JS がここに作ります -->
<div id="overlays"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
