<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/ux.css">
</head>
<body>

<div class="app" id="app">

  <!-- ── タイトルバー ──────────────────────────────────────── -->
  <!-- Design philosophy: 「証拠の地図帳」。現在地・根拠・次の行動を一貫して示す。 -->
  <header class="titlebar">
    <button class="tb-btn" id="btn-open" type="button" data-i18n="btn.open">開く</button>
    <div class="brand-lockup" aria-label="Hex">
      <svg class="brand-mark" viewBox="0 0 32 32" role="img" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9v14M22 9v14M10 16h12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>HEX</span>
    </div>
    <div class="tb-title">
      <span class="tb-name" id="tb-name">ファイル未選択</span>
      <span class="tb-sub" id="tb-sub">アプリの中身（Mach-O / 生バイナリ）を開いてください</span>
    </div>
    <button class="tb-btn icon" id="btn-help" type="button"
            data-i18n-aria="btn.help" aria-label="ヘルプ">？</button>
    <button class="tb-btn icon" id="btn-more" type="button"
            data-i18n-aria="btn.settings" aria-label="設定">⋯</button>
  </header>

  <!-- ── 解析の現在位置 ───────────────────────────────────── -->
  <nav class="nav-history" id="nav-history" aria-label="解析の履歴" hidden>
    <button class="nav-history-btn" id="nav-back" type="button" aria-label="前の場所へ戻る" disabled>← <span>戻る</span></button>
    <button class="nav-history-btn" id="nav-forward" type="button" aria-label="次の場所へ進む" disabled>→ <span>進む</span></button>
    <div class="nav-crumbs" id="nav-crumbs" aria-label="現在位置"></div>
  </nav>

  <!-- ── ツールバー ────────────────────────────────────────── -->
  <div class="toolbar">
    <div class="workspace-nav" role="tablist" aria-label="解析の入口">
      <button class="tb-btn strong nav-primary" id="btn-investigate" type="button" disabled data-i18n="btn.investigate">調べる</button>
      <button class="tb-btn nav-item" id="btn-tools" type="button" disabled data-i18n="btn.tools">解析</button>
      <button class="tb-btn nav-item" id="btn-functions" type="button" disabled data-i18n="btn.functions">関数</button>
    </div>
    <div class="segmented" id="mode-switch" role="tablist" aria-label="表示の切り替え">
      <button class="seg" data-mode="asm" role="tab" aria-selected="true" type="button"
              data-i18n="mode.asm">アセンブリ</button>
      <button class="seg" data-mode="hex" role="tab" aria-selected="false" type="button"
              data-i18n="mode.hex">16進</button>
    </div>
    <button class="tb-btn pill" id="btn-explain" type="button" aria-pressed="true"
            data-i18n="btn.explainToggle">解説</button>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="btn-search" type="button" disabled data-i18n="btn.search">検索</button>
    <button class="tb-btn compact-action" id="btn-jump" type="button" disabled data-i18n="btn.jump">ジャンプ</button>
    <!--
      「その他」は、ふつうのボタンで浮かせたメニューを出す。
      ここを <details> の中に置いていたころ、ツールバー自身が overflow-x: auto で
      横に流れる箱だったため、開いたメニューがツールバーの高さで切り取られ、
      文字列・セクション・構造・選択の 4 つが押せなかった。
      中身のボタンは ID で使い回すので、DOM には残したまま隠しておく。
    -->
    <button class="tb-btn compact-action" id="btn-overflow" type="button" disabled
            aria-haspopup="menu" data-i18n="btn.overflow">その他</button>
    <div class="offscreen" aria-hidden="true">
      <button class="tb-btn" id="btn-strings" type="button" disabled data-i18n="btn.strings">文字列</button>
      <button class="tb-btn" id="btn-sections" type="button" disabled data-i18n="btn.sections">セクション</button>
      <button class="tb-btn" id="btn-struct" type="button" disabled data-i18n="btn.struct">構造</button>
      <button class="tb-btn" id="btn-select" type="button" disabled data-i18n="btn.select">選択</button>
    </div>
  </div>

  <!-- ── 現在位置 ──────────────────────────────────────────── -->
  <div class="addrbar">
    <span class="addr-cur mono" id="addr-cur">—</span>
    <span class="addr-region" id="addr-region"></span>
    <span class="addr-range mono" id="addr-range"></span>
  </div>

  <!-- ── 列見出し ──────────────────────────────────────────── -->
  <div class="colhead mono" id="colhead">
    <span class="c-addr" data-i18n="col.address">アドレス</span>
    <span class="c-hex" data-i18n="col.hex">16進</span>
    <span class="c-mn" data-i18n="col.instruction">命令</span>
    <span class="c-ops"></span>
    <span class="c-ascii" data-i18n="col.ascii">文字</span>
  </div>

  <!-- ── 本体 ──────────────────────────────────────────────── -->
  <div class="viewwrap">
    <div class="viewport mode-asm" id="viewport" tabindex="0">
      <div class="rows" id="rows"></div>
    </div>
    <div class="scrubber" id="scrubber" aria-hidden="true"><div class="thumb" id="scrub-thumb"></div></div>

    <!--
      ファイル未選択のときだけ出る、小さな入口。
      解析中の主役はコードなので、ここに大きな見出しや図を置かない。
    -->
    <div class="empty" id="empty">
      <div class="empty-inner">
        <div class="empty-kicker">LOCAL BINARY WORKBENCH</div>
        <div class="empty-title" data-i18n="empty.title">アプリの中身を、日本語で読む</div>
        <p class="empty-text" data-i18n-html="empty.text"></p>
        <div class="empty-actions">
          <button class="btn-primary" id="btn-open-welcome" type="button" data-i18n="btn.openFile">ファイルを開く…</button>
          <button class="btn-secondary" id="btn-sample" type="button" data-i18n="btn.sample">サンプルで練習する</button>
        </div>
        <button class="linkbtn" id="btn-learn-2" type="button" data-i18n="help.learn">学習コース（ゼロから読めるようになる）</button>
        <p class="empty-note" data-i18n="empty.firstTime">はじめての方へ：まずは「サンプルで練習する」がおすすめです。</p>
      </div>
    </div>

    <div class="loading" id="loading" hidden>
      <div class="spinner"></div><span id="loading-text">読み込み中…</span>
    </div>
  </div>

  <!-- ── 範囲選択バー ──────────────────────────────────────── -->
  <div class="selbar" id="selbar" hidden>
    <span class="sel-count mono" id="sel-count"></span>
    <span class="sel-range mono" id="sel-range"></span>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="btn-sel-all" type="button" data-i18n="btn.all">全部</button>
    <button class="tb-btn strong" id="btn-sel-copy" type="button" data-i18n="btn.copy">コピー</button>
    <button class="tb-btn" id="btn-sel-done" type="button" data-i18n="btn.clear">解除</button>
  </div>

  <!-- ── 状態表示 ──────────────────────────────────────────── -->
  <footer class="statusbar">
    <span id="st-left" class="mono"></span>
    <span id="st-right" class="mono"></span>
  </footer>

</div>

<input type="file" id="file-input" hidden>

<!-- シートやメニューは JS がここに作ります -->
<div id="overlays"></div>

<script type="module" src="./js/app.js"></script>
<script type="module" src="./js/ux.js"></script>
</body>
</html>
