name: Issue 529 ObjC runtime integration

on:
  push:
    branches: [fix/issue-529-objc-runtime-integration]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[issue-529-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply integration
        run: |
          python3 tools/apply-issue-529.py
          python3 tools/reconcile-issue-529.py
      - run: node tests/issue-529-objc-integration.mjs
      - run: node tests/objc-metadata.mjs
      - run: node tests/objc-runtime.mjs
      - run: node tests/decompiler-semantic.mjs
      - run: node tests/ai-tools.mjs
      - name: Static checks
        run: |
          node --check js/objc.js
          node --check js/app.js
          node --check js/tools.js
          node --check js/ai/ui/hex-context.js
          node --check js/ai/tools/registry.js
      - run: npm run lint
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/objc.js js/app.js js/tools.js js/ai/ui/hex-context.js js/ai/tools/registry.js
          git commit -m 'Fix #529 ObjC runtime integration [issue-529-applied]'
          git push
