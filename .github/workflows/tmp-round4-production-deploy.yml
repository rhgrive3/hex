name: One-shot Round 4 production probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 244a09efafdcdae46673127476fe25b51acc2db6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact build stamp fallback
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "244a09efafdcdae46673127476fe25b51acc2db6"
          env -u WORKERS_CI_COMMIT_SHA node scripts/write-deployment-identity.mjs
          grep -F 'export const DEPLOYMENT_COMMIT="244a09efafdcdae46673127476fe25b51acc2db6";' js/userscript/deployment-identity.generated.js
      - name: Wait for and verify public production bootstrap identity
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes, webcrypto } from 'node:crypto';
          const expectedCommit = '244a09efafdcdae46673127476fe25b51acc2db6';
          const expectedBuild = 'e812c4fbef995a7ba0cdb6d3';
          const loaderVersion = '2.0.2322241712';
          const endpoint = 'https://ida.rhgrive.workers.dev/runtime/bootstrap';
          const token = (n) => randomBytes(n).toString('base64url');
          for (let attempt = 1; attempt <= 18; attempt++) {
            const keys = await webcrypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
            const clientPublicKey = await webcrypto.subtle.exportKey('jwk', keys.publicKey);
            let response;
            let body = null;
            try {
              response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  nonce: token(24), loaderVersion, buildId: expectedBuild,
                  requestId: token(18), sessionIdentity: token(18), clientPublicKey,
                }),
              });
              const text = await response.text();
              try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 200) }; }
            } catch (error) {
              console.log(`attempt ${attempt}: network error ${error?.message || error}`);
            }
            if (response) {
              console.log(`attempt ${attempt}: status=${response.status} build=${body?.buildId || body?.error || 'unknown'} commit=${body?.sourceCommit || 'null'}`);
              if (response.status === 200 && body?.buildId === expectedBuild && body?.sourceCommit === expectedCommit) {
                console.log('ROUND4_PRODUCTION_IDENTITY_VERIFIED');
                process.exit(0);
              }
            }
            if (attempt < 18) await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          throw new Error('Production did not expose the exact Round 4 source/build identity within 3 minutes.');
          NODE
