name: One-shot Round 4 production deploy

on:
  push:
    branches:
      - ops/round4-production-deploy

permissions:
  contents: read

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'Run one-shot Round 4 production deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 244a09efafdcdae46673127476fe25b51acc2db6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "244a09efafdcdae46673127476fe25b51acc2db6"
          node scripts/write-deployment-identity.mjs
          grep -F 'export const DEPLOYMENT_COMMIT="244a09efafdcdae46673127476fe25b51acc2db6";' js/userscript/deployment-identity.generated.js
      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN secret is unavailable'; exit 2; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID secret is unavailable'; exit 2; }
      - name: Deploy exact main to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
