name: Unlinked issue 949 repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'work/unlinked-949-indirect-control'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconcile live main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge origin/main --no-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply issue 949 repair
        run: python3 .github/apply-unlinked-949.py
      - name: Focused regression
        run: node tests/semantic-v2/issue-949-indirect-control.test.mjs
      - name: Semantic v2 suite
        run: npm run semantic-v2:test
      - name: Rebuild canonical userscript
        run: npm run userscript:build
      - name: Remove bootstrap files
        run: rm -f .github/apply-unlinked-949.py .github/workflows/unlinked-949-repair.yml
      - name: Full repository check
        run: npm run check
      - name: Generated-output idempotence and diff hygiene
        run: |
          before=$(git diff -- userscript/hex.user.template.js userscript/release-version.json | git hash-object --stdin)
          npm run userscript:build
          after=$(git diff -- userscript/hex.user.template.js userscript/release-version.json | git hash-object --stdin)
          test "$before" = "$after"
          git diff --check
      - name: Publish verified implementation
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'fix: preserve computed indirect control targets (#949)'
          git push origin HEAD:${{ github.head_ref }}
