name: Issue 575 MNEG negation

on:
  push:
    branches: [fix/issue-575-mneg-negation]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[issue-575-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply MNEG fix
        run: python3 tools/apply-issue-575.py
      - name: Focused compiler-truth regression
        run: node tests/compiler-truth/mneg.mjs
      - name: Compiler-truth suite
        run: npm run compiler-truth
      - name: Static check
        run: node --check js/decompiler/pipeline-core.js
      - name: Full regression
        run: npm run check
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/decompiler/pipeline-core.js
          git commit -m 'Fix #575 MNEG negation preservation [issue-575-applied]'
          git push
