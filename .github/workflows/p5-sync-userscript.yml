name: Phase 5 canonical userscript sync

on:
  push:
    branches:
      - hex/p5-x86-integration

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and verify canonical generated output
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build
          test "$(git hash-object userscript/hex.user.template.js)" = be0de3dfc836785b96d57005d077269ce5497bbb
          test "$(git hash-object userscript/release-version.json)" = 2d77a9d8b90d5876e5cc38573f97d4a9c3d688f2
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp /tmp/hex.user.template.js userscript/hex.user.template.js
          cmp /tmp/release-version.json userscript/release-version.json
      - name: Commit only canonical generated files and remove sync harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/p5-sync-userscript.yml
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/p5-sync-userscript.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 5: synchronize generated userscript after P5-2 integration'
          git push origin HEAD:refs/heads/hex/p5-x86-integration
