name: Round 4 generated userscript sync

on:
  push:
    branches:
      - dev-agent-seed-r4-bootstrap-gate

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[r4-generated-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-agent-seed-r4-bootstrap-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - name: Commit canonical generated userscript files
        shell: bash
        run: |
          git add userscript/release-version.json userscript/hex.user.template.js
          if git diff --cached --quiet; then
            echo "Generated userscript files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Round 4 generated userscript [r4-generated-sync]"
          git push origin HEAD:dev-agent-seed-r4-bootstrap-gate
