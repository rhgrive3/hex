name: Phase 8 release validation

# Permanent exact-product verifier plus two one-shot P8-I transactions:
# expanded baseline capture and final cutover. Baseline capture overlays only
# measurement/corpus tooling onto the pre-Phase-8 product. Final cutover never
# pushes from Actions: it publishes a READY artifact only after exact-head
# external workflows and the permanent verifier agree, so the integration owner
# can store that evidence in a normal branch commit and re-run exact-head CI.
on:
  pull_request:
    paths:
      - 'js/decompiler/**'
      - 'tests/phase8/**'
      - 'tools/validation/phase8/**'
      - '.github/workflows/phase8-release-validation.yml'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact product SHA to verify'
        required: true
        type: string
      shadow:
        description: 'Report the verdict without failing the job'
        required: false
        default: true
        type: boolean
      gates:
        description: 'Also run the required product gates'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # Exact-head verification for a newer PR head must never queue behind a stale
  # one-shot cutover wait from an older head.
  group: phase8-release-${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

jobs:
  capture-expanded-baseline:
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect one-shot baseline request
        id: request
        run: |
          if [ -f tools/validation/phase8/p8i-baseline-request.json ]; then
            echo 'requested=true' >> "$GITHUB_OUTPUT"
          else
            echo 'requested=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.request.outputs.requested == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.request.outputs.requested == 'true'
      - name: Build the expanded frozen corpus
        if: steps.request.outputs.requested == 'true'
        run: node tools/validation/phase8/build-corpus.mjs
      - name: Capture baseline from exact pre-Phase-8 product
        if: steps.request.outputs.requested == 'true'
        env:
          BASE_SHA: bd03d1a860863814dbdcc00559709794d460189d
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/phase8-base"
          git worktree add --detach "$BASE" "$BASE_SHA"
          mkdir -p "$BASE/tests/phase8/corpus"
          overlay=(
            tools/validation/phase8/build-corpus.mjs
            tools/validation/phase8/decompile-corpus.mjs
            tools/validation/phase8/decoded-function-adapter.mjs
            tools/validation/phase8/baseline.mjs
          )
          for file in "${overlay[@]}"; do
            mkdir -p "$BASE/$(dirname "$file")"
            cp "$file" "$BASE/$file"
          done
          cp tests/phase8/corpus/functions.json "$BASE/tests/phase8/corpus/functions.json"
          (
            cd "$BASE"
            node tools/validation/phase8/baseline.mjs --force
          )
          cp "$BASE/tests/phase8/corpus/pre-phase8-observations.json" tests/phase8/corpus/pre-phase8-observations.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { stableDigest } from './js/core/identity/index.js';
          const base = 'bd03d1a860863814dbdcc00559709794d460189d';
          const overlayFiles = [
            'tools/validation/phase8/build-corpus.mjs',
            'tools/validation/phase8/decompile-corpus.mjs',
            'tools/validation/phase8/decoded-function-adapter.mjs',
            'tools/validation/phase8/baseline.mjs',
            'tests/phase8/corpus/functions.json',
          ];
          const corpus = JSON.parse(fs.readFileSync('tests/phase8/corpus/functions.json', 'utf8'));
          const baseline = JSON.parse(fs.readFileSync('tests/phase8/corpus/pre-phase8-observations.json', 'utf8'));
          const metadata = {
            schemaVersion:1,
            baseProductSha:base,
            overlayFiles,
            overlayDigest:stableDigest(overlayFiles.map((file) => ({ file, text:fs.readFileSync(file, 'utf8') }))),
            corpusDigest:corpus.corpusDigest,
            toolchain:corpus.toolchain,
            observationCount:baseline.observations.length,
            denominator:corpus.functions.map((entry) => entry.id),
            baselineObservationsDigest:baseline.observationsDigest,
            note:'Only measurement/corpus tooling and the exact expanded frozen corpus were overlaid onto the pre-Phase-8 product. No Phase 8 production implementation was backported.',
          };
          fs.writeFileSync('tests/phase8/corpus/pre-phase8-baseline-identity.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
          test "$(git -C "$BASE" rev-parse HEAD)" = "$BASE_SHA"
      - name: Commit frozen corpus and base-product baseline
        if: steps.request.outputs.requested == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm tools/validation/phase8/p8i-baseline-request.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/phase8/corpus/functions.json \
                  tests/phase8/corpus/pre-phase8-observations.json \
                  tests/phase8/corpus/pre-phase8-baseline-identity.json \
                  tools/validation/phase8/p8i-baseline-request.json
          git commit -m 'Phase 8: freeze expanded base-product baseline'
          git push origin "HEAD:${HEAD_REF}"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase 8 contract tests
        run: npm run phase8:test
      - name: Verify the exact head
        env:
          DISPATCH_EXPECT_SHA: ${{ github.event.inputs.sha }}
          DISPATCH_SHADOW: ${{ github.event.inputs.shadow || 'true' }}
          DISPATCH_GATES: ${{ github.event.inputs.gates || 'false' }}
          PR_EXPECT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          expect_sha="${DISPATCH_EXPECT_SHA}"
          shadow="${DISPATCH_SHADOW}"
          gates="${DISPATCH_GATES}"
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            expect_sha="${PR_EXPECT_SHA}"
            if node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ledger = JSON.parse(fs.readFileSync('reports/phase8/checkpoints.json', 'utf8'));
          const entries = Array.isArray(ledger) ? ledger : (ledger.checkpoints || ledger.entries || []);
          process.exit(entries.some((entry) => entry?.id === 'P8-I' && (entry?.result === 'accepted' || entry?.status === 'accepted')) ? 0 : 1);
          NODE
            then
              shadow=false
              gates=true
            else
              shadow=true
              gates=false
            fi
          fi
          args=(--expect-sha "$expect_sha")
          if [ "$shadow" = true ]; then args+=(--shadow); fi
          if [ "$gates" = true ]; then args+=(--gates); fi
          node tools/validation/phase8/verify.mjs "${args[@]}"
      - name: Publish the evidence artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-release-evidence
          path: reports/phase8/phase8-release-evidence.*
          if-no-files-found: error

  finalize-p8i:
    if: github.event_name == 'pull_request'
    needs: verify
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Detect one-shot P8-I cutover request
        id: request
        run: |
          if [ -f tools/validation/phase8/p8i-cutover-request.json ]; then
            echo 'requested=true' >> "$GITHUB_OUTPUT"
          else
            echo 'requested=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.request.outputs.requested == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.request.outputs.requested == 'true'
      - name: Wait for exact-head external evidence
        if: steps.request.outputs.requested == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.GITHUB_TOKEN;
          const repository = process.env.REPOSITORY;
          const headSha = process.env.HEAD_SHA;
          const headRef = process.env.HEAD_REF;
          const required = [
            'Generated userscript sync',
            'Generated userscript autofix',
            'Phase 8 ownership',
            'Migration guardrails',
            'Sandbox security',
            'Ghidra decompiler differential',
            'Phase 6 release validation',
            'Universal binary platform',
            'ChatGPT userscript host',
            'Phase 7 release validation',
            'Cross-binary accuracy',
            'UI regression',
            'Invariant Gates',
          ];
          const headers = { Accept:'application/vnd.github+json', Authorization:`Bearer ${token}`, 'X-GitHub-Api-Version':'2022-11-28' };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const request = async (url) => {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
            return response.json();
          };
          let ready = false;
          for (let attempt = 0; attempt < 140; attempt += 1) {
            const data = await request(`https://api.github.com/repos/${repository}/actions/runs?head_sha=${headSha}&event=pull_request&per_page=100`);
            const states = [];
            let pending = false;
            for (const name of required) {
              const matches = data.workflow_runs.filter((run) => run.name === name && run.head_sha === headSha)
                .sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
              const run = matches.at(-1);
              if (!run || run.status !== 'completed') {
                pending = true;
                states.push(`${name}=pending`);
                continue;
              }
              states.push(`${name}=${run.conclusion}`);
              if (run.conclusion !== 'success') throw new Error(`exact-head external gate ${name} concluded ${run.conclusion}`);
            }
            console.log(states.join(' | '));
            if (!pending) { ready = true; break; }
            await sleep(30000);
          }
          if (!ready) throw new Error('timed out waiting for exact-head external workflows');
          const branch = await request(`https://api.github.com/repos/${repository}/branches/${encodeURIComponent(headRef)}`);
          if (branch.commit?.sha !== headSha) throw new Error(`branch head moved during P8-I evidence wait: ${headSha} -> ${branch.commit?.sha}`);
          NODE
      - name: Run transactional P8-I acceptance and permanent verifier
        if: steps.request.outputs.requested == 'true'
        env:
          BASE_SHA: bd03d1a860863814dbdcc00559709794d460189d
          EXTERNAL_GATES: Generated userscript sync|Generated userscript autofix|Phase 8 ownership|Migration guardrails|Sandbox security|Ghidra decompiler differential|Phase 6 release validation|Universal binary platform|ChatGPT userscript host|Phase 7 release validation|Cross-binary accuracy|UI regression|Invariant Gates
        run: node tools/validation/phase8/finalize.mjs --base "$BASE_SHA" --external-gates "$EXTERNAL_GATES"
      - name: Publish P8-I cutover evidence for integration owner
        if: steps.request.outputs.requested == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-p8i-cutover-${{ github.event.pull_request.head.sha }}
          path: |
            reports/phase8/checkpoints.json
            reports/phase8/phase8-release-evidence.json
            reports/phase8/phase8-release-evidence.md
          if-no-files-found: error
