name: Verify semantic IR correctness integration
on:
  push:
    branches:
      - fix/unlinked-ir-406-423-20260815
permissions:
  contents: write
jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'ci: run semantic IR correctness integration')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply fixes
        run: python3 tools/fix-unlinked-ir.py
      - name: Focused regressions
        run: node tests/issues-406-423-unlinked.mjs
      - name: Full check
        run: npm run check
      - name: Commit verified changes
        run: |
          rm -f tools/fix-unlinked-ir.py .github/workflows/fix-unlinked-ir-406-423.yml
          git add -A
          git commit -m "fix: harden semantic IR and evidence correctness (#406-#419, #422-#423)"
          git push origin HEAD
