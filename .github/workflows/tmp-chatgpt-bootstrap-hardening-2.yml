name: Temporary ChatGPT bootstrap hardening retry
on:
  push:
    branches: [hex/chatgpt-conversation-bootstrap-fix]
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/chatgpt-conversation-bootstrap-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Harden migration guard
        run: python3 -c "from pathlib import Path; p=Path('js/userscript/chatgpt-adapter.js'); s=p.read_text(); old='if (!newConversation || !requestPresent || freshUsers.length !== 1) {'; assert s.count(old)==1; p.write_text(s.replace(old, 'if (!newConversation || !this.adapter.isGenerating() || !requestPresent || freshUsers.length !== 1) {', 1))"
      - run: npm ci
      - name: Validate
        run: |
          node tests/chatgpt-web-runtime.mjs
          node tests/chatgpt-web-bridge-contract.mjs
          npm run ai:test
          npm run userscript:test
          npm run lint
          npm run userscript:build
          git diff --check
      - name: Commit
        run: |
          rm -f .github/workflows/tmp-chatgpt-bootstrap-hardening.yml .github/workflows/tmp-chatgpt-bootstrap-hardening-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden ChatGPT provisional conversation migration"
          git push origin HEAD:hex/chatgpt-conversation-bootstrap-fix
