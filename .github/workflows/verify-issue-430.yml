name: Verify issue 430 stack escape

on:
  push:
    branches:
      - fix/latest-430-425

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-430-425
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/apply-issue-430.py
      - run: node tests/issue-430-memory-escape.mjs
      - run: npm run semantic:test
      - run: npm run decompiler:test
      - run: npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/ir-core.js package.json tests/issue-430-memory-escape.mjs
          git diff --cached --check
          git commit -m 'fix: follow propagated stack pointer escapes (#430)'
          git push origin HEAD:fix/latest-430-425
