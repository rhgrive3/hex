name: Phase 3 debug weak terminal x0 inference

on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-debug-437.yml']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Apply required finalizer narrowing in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s=p.read_text()
          old="    } else if (inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias) && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          new="    } else if (inst.extra?.stateRead && inst.extra?.localPhysicalViewProjection === true && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          p.write_text(s.replace("    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);\n", "", 1).replace(old,new,1))
          PY
      - name: Emit exact projected IR state before RET
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js';
          import { irFor, originOf } from './js/ir.js';
          import { summarizeFunction } from './js/interproc.js';
          import { valueBefore } from './js/dataflow-semantic.js';
          const BASE=0x100000000n, lines=['bl #0x100001000','ret'];
          const rows=lines.map((line,i)=>{const p=line.indexOf(' ');return {row:i,address:BASE+BigInt(i*4),mn:p<0?line:line.slice(0,p),ops:p<0?'':line.slice(p+1)}});
          const model=buildSemanticModel(rows,{startRow:0,endRow:1,rowOfAddress:a=>{const d=a-BASE;return d<0n||d>=8n?null:Number(d/4n)}});
          const ir=irFor(model), ret=ir.instructions.find(i=>i.op==='ret');
          const val=v=>v&&({id:v.id,kind:v.kind,reg:v.reg,bits:v.bits,version:v.version,origin:originOf(v),def:v.def&&({id:v.def.id,row:v.def.row,op:v.def.op,sub:v.def.sub,extra:{stateRead:!!v.def.extra?.stateRead,stateWrite:!!v.def.extra?.stateWrite,publicStateIdentity:v.def.extra?.publicStateIdentity??null,entryStateRead:v.def.extra?.entryStateRead??null,localPhysicalViewProjection:v.def.extra?.localPhysicalViewProjection??null,abiReturn:v.def.extra?.abiReturn??null,callResult:v.def.extra?.callResult??null}})});
          const inst=i=>({id:i.id,row:i.row,op:i.op,sub:i.sub,dst:val(i.dst),args:(i.args||[]).map(a=>val(a.value)),extra:{target:i.extra?.target??null,stateRead:!!i.extra?.stateRead,stateWrite:!!i.extra?.stateWrite,publicStateIdentity:i.extra?.publicStateIdentity??null,entryStateRead:i.extra?.entryStateRead??null,localPhysicalViewProjection:i.extra?.localPhysicalViewProjection??null,abiReturn:i.extra?.abiReturn??null,callResult:i.extra?.callResult??null}});
          const debug={args:[...(ir.args?.entries?.()||[])].map(([k,v])=>[k,val(v)]),values:ir.values.map(val),instructions:ir.instructions.map(inst),x0BeforeRet:val(valueBefore(ir,ret,'x0')),summary:summarizeFunction(model)};
          console.log('::warning title=P3_437_IR::'+JSON.stringify(debug,(_,v)=>typeof v==='bigint'?v.toString():v));
          NODE
      - name: Cleanup debug workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p3-debug-437.yml
          git commit -m 'Phase 3: remove temporary #437 debug workflow'
          git push origin HEAD:hex/p3-semantic-ir-integration
