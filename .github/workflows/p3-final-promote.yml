name: P3 latest-main resync gate
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['tests/.p3-promote-trigger']
permissions:
  contents: write
  actions: read
jobs:
  resync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify validated head and merge current main
        run: |
          test "$(git rev-parse HEAD)" = "03bdd329eb5db68c2f12adce7e0ac98a83d7e67b"
          git config user.name 'rhgrive3'
          git config user.email 'rhgrive@gmail.com'
          git fetch origin main hex/p3-semantic-ir-integration
          test "$(git rev-parse origin/main)" = "3f168f8a5d4009074c868ee34608d3f168f0a81a"
          if ! git merge --no-ff --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "userscript/hex.user.template.js"
            git checkout --theirs userscript/hex.user.template.js
            git add userscript/hex.user.template.js
            git commit --no-edit
          fi
      - run: npm ci
      - name: Rebuild canonical userscript from combined source
        run: npm run userscript:build
      - run: node tests/ir.mjs
      - run: node tests/semantic-v2/compat-v1-legacy-fallback-unary.test.mjs
      - run: npm run semantic-v2:test
      - run: npm test
      - run: npm run check
      - name: Guard clean resync contents
        run: |
          ! git status --short | grep -E 'p3-(unary|origin|opcode|fallback|diagnostic|promote-trigger|hotspot)'
          git diff --check
      - name: Commit generated synchronization and push canonical branch
        run: |
          git config user.name 'rhgrive3'
          git config user.email 'rhgrive@gmail.com'
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'chore(phase3): resync generated userscript after latest main'; fi
          git push origin HEAD:hex/p3-semantic-ir-integration
