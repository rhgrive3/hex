name: Verify issues 454 and 455

on:
  push:
    branches:
      - fix/issues-454-455-script-architecture

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-454-455-script-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/apply-issues-454-455.py
      - run: node tests/issues-454-455-script-architecture.mjs
      - run: npm run platform:test
      - run: npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/architecture/index.js js/script.js package.json tests/issues-454-455-script-architecture.mjs
          git diff --cached --check
          git commit -m 'fix: make script disasm and patch architecture-aware (#454 #455)'
          git push origin HEAD:fix/issues-454-455-script-architecture
