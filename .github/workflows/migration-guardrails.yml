name: Migration guardrails
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-issue-consolidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/open-issue-fixes-20260819
          fetch-depth: 0
      - name: Replace fragile #824 whole-block anchor with exact two-line anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/machine-effects.yml')
          s = p.read_text()
          start_marker = "          replace_once('js/expr.js', "
          next_marker = "          replace_once('js/ir.js', \"\"\"function sizeCompatible"
          start = s.find(start_marker)
          end = s.find(next_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('could not isolate #824 applicator block')

          replacement = '''          old_expr = "      const shifted = bin('shr', A(), constNode(lsb), bits);\\n      emit(dst, width > 0n && width < 64n ? bin('and', shifted, constNode((1n << width) - 1n), bits) : shifted);"
          new_expr = "      const destWidth = BigInt(bits);\\n      if (lsb < 0n || width <= 0n || lsb + width > destWidth) {\\n        regs.delete(dst);\\n      } else {\\n        const shifted = bin('shr', A(), constNode(lsb), bits);\\n        const field = width < destWidth ? bin('and', shifted, constNode((1n << width) - 1n), bits) : shifted;\\n        if (base === 'sbfx' && width < destWidth) {\\n          const signBit = 1n << (width - 1n);\\n          emit(dst, bin('sub', bin('xor', field, constNode(signBit), bits), constNode(signBit), bits));\\n        } else emit(dst, field);\\n      }"
          replace_once('js/expr.js', old_expr, new_expr, '#824 SBFX')
'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/migration-guardrails.yml
          git add .github/workflows/machine-effects.yml .github/workflows/migration-guardrails.yml
          git commit -m "Repair consolidated #824 applicator anchor"
          git push origin HEAD:integrate/open-issue-fixes-20260819
