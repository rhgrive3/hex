name: Phase 3 final combined validation

on:
  push:
    branches:
      - hex/p3-semantic-ir-integration

permissions:
  contents: read

jobs:
  final-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Semantic IR v2 full exit gate
        run: npm run semantic-v2:test
      - name: MachineEffects and core
        run: |
          npm run effects:test
          npm run core:test
      - name: Invariants and migration
        run: |
          npm run invariants:test
          npm run migration:test
      - name: Default semantic and decompiler regressions
        run: |
          npm run semantic:test
          npm run decompiler:test
      - name: Compiler truth
        run: npm run compiler-truth
      - name: Platform runtime and UI
        run: |
          npm run platform:test
          npm run runtime:test
          npm run ui:test
      - name: Benchmark baseline
        run: npm run benchmark:baseline
      - name: AI regressions
        run: npm run ai:test
      - name: Userscript regressions and generated artifact freshness
        run: |
          npm run userscript:test
          npm run userscript:build
          git diff --exit-code -- userscript/hex.user.template.js
      - name: Full repository check
        run: npm run check
