name: One-shot analysis abort regressions

on:
  push:
    branches:
      - fix/analysis-cancellation-settlement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analysis-cancellation-settlement
          fetch-depth: 0
      - name: Apply exact source and regression patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              src = p.read_text()
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, got {count}')
              p.write_text(src.replace(old, new))

          replace_once(
              'js/pinpoint.js',
              "      try {\n"
              "        operation = scanAccess(all, { signal: controller.signal });\n"
              "        if (controller.signal.aborted) cancelOperation();\n"
              "      } catch (error) {\n"
              "        unlinkParent();\n"
              "        throw error;\n"
              "      }",
              "      try {\n"
              "        operation = scanAccess(all, { signal: controller.signal });\n"
              "        if (controller.signal.aborted) cancelOperation();\n"
              "      } catch (error) {\n"
              "        if (timer != null) clearTimeout(timer);\n"
              "        controller.signal.removeEventListener('abort', cancelOperation);\n"
              "        unlinkParent();\n"
              "        throw error;\n"
              "      }",
              'sync scanner cleanup',
          )

          parent_abort_test = r'''
// Closing an analysis view supplies a parent AbortSignal. It must cancel the
// real batched scanner immediately rather than waiting for the 45s guard.
{
  const shapes = foldShapes({
    count: 1, capped: false,
    disp: Int32Array.of(0x20),
    size: Uint8Array.of(4),
    flags: Uint8Array.of(SHAPE.DECREASE | SHAPE.CROSS),
    amtKind: Uint8Array.of(AMOUNT.FIELD),
    amtDisp: Int32Array.of(0x30),
    addr: BigUint64Array.of(BASE + 32n),
    span: Int32Array.of(0x100),
    amtSize: Uint8Array.of(4),
    amtSpan: Int32Array.of(0x100),
  });
  let cancelled = 0;
  let markStarted;
  const scanStarted = new Promise((resolve) => { markStarted = resolve; });
  const scanAccess = () => {
    let rejectPending;
    const pending = new Promise((_, reject) => { rejectPending = reject; });
    pending.cancel = () => {
      cancelled++;
      const error = new Error('scan cancelled');
      error.name = 'AbortError';
      rejectPending(error);
    };
    markStarted();
    return pending;
  };
  const controller = new AbortController();
  const startedAt = Date.now();
  const pending = pinpointLocation({
    goal,
    ranked: [{ addr: BASE, name: 'applyDamage', strings: ['damage', 'hp'] }],
    program,
    analyze: async () => model,
    shapes,
    scanAccess,
    signal: controller.signal,
    accessScanTimeoutMs: 5000,
    budget: { left: 12 },
    limit: 10,
  });
  await scanStarted;
  controller.abort('analysis-view-closed');
  const aborted = await pending;
  eq(cancelled, 1, 'parent abort must cancel the active access scan exactly once');
  ok(Date.now() - startedAt < 1000, 'parent abort must settle well before the timeout guard');
  ok(aborted && Array.isArray(aborted.candidates), 'pinpoint should settle cleanly after parent cancellation');
}

'''.lstrip()
          marker = "process.stdout.write('  ok  pinpointLocation consumes SSA RMW + threshold\\n');"
          ir = Path('tests/ir-pinpoint-location.mjs')
          src = ir.read_text()
          if src.count(marker) != 1:
              raise SystemExit('ir parent-abort insertion marker mismatch')
          ir.write_text(src.replace(marker, parent_abort_test + marker))

          ui_contract = r'''
// The actual automatic-analysis UI adapters are private to panels.js. Pin their
// source-level wiring so a future async wrapper cannot silently drop the custom
// cancel hook or the view AbortSignal again.
{
  const { readFile } = await import('node:fs/promises');
  const panelsSource = await readFile(new URL('../js/panels.js', import.meta.url), 'utf8');
  assert.match(panelsSource,
    /controller\.abort\('auto-analysis-view-closed'\)[\s\S]{0,1200}signal: controller\.signal,[\s\S]{0,240}analyze: makeAnalyzer/,
    'overview close must abort and forward the same signal into auto analysis');
  assert.match(panelsSource,
    /controller\.abort\('candidate-analysis-view-closed'\)[\s\S]{0,1800}signal: controller\.signal/,
    'candidate close must forward its abort signal into pinpoint');
  assert.match(panelsSource,
    /return async \(addr, end, options = \{\}\) =>[\s\S]{0,900}\{ \.\.\.\(options \|\| \{\}\), texts: false \}/,
    'automatic analyzer adapter must preserve the third options bag');
  const scanner = panelsSource.match(/function makeAccessScanner\(app, region\) \{[\s\S]*?\n\}/)?.[0] || '';
  assert.ok(scanner, 'automatic access scanner adapter must exist');
  assert.doesNotMatch(scanner, /return async \(list\)/,
    'scanner adapter must not assimilate away Backend.fieldAccessMany.cancel');
  assert.match(scanner, /return app\.backend\.fieldAccessMany\(region\.id, offsets\)/,
    'scanner adapter must return the cancellable backend promise directly');
}

'''.lstrip()
          ai_marker = "// ChatGPT Web intentionally has no model-response deadline, but local analysis"
          ai = Path('tests/ai-analysis-boundary.mjs')
          src = ai.read_text()
          if src.count(ai_marker) != 1:
              raise SystemExit('AI UI-contract insertion marker mismatch')
          ai.write_text(src.replace(ai_marker, ui_contract + ai_marker))

          Path('.github/workflows/one-shot-analysis-abort-regressions.yml').unlink()
      - name: Commit exact source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pinpoint.js tests/ir-pinpoint-location.mjs tests/ai-analysis-boundary.mjs .github/workflows/one-shot-analysis-abort-regressions.yml
          git diff --cached --check
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test(analysis): lock parent abort settlement end to end"
          git push origin HEAD:fix/analysis-cancellation-settlement
