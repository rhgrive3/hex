name: Temporary userscript generated artifact

on:
  push:
    branches:
      - fix/dev-worker-send-timeout-v2

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'Refresh generated userscript outputs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - name: Commit canonical generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add userscript/hex.user.template.js userscript/release-version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh generated userscript outputs'
          git push
