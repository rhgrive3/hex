name: Temporary userscript generated artifact

on:
  push:
    branches:
      - fix/dev-worker-send-timeout-v2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - uses: actions/upload-artifact@v4
        with:
          name: generated-userscript-loader-v2
          path: |
            userscript/hex.user.template.js
            userscript/release-version.json
