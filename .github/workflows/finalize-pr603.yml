name: Finalize PR 603

on:
  push:
    branches: [chatgpt-userscript-host]
    paths: ['.github/workflows/finalize-pr603.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'js/ai/ui/bridge.js\npackage.json'
            if [ "$conflicts" != "$expected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
          fi

          git checkout --theirs -- js/ai/ui/bridge.js package.json
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('js/ai/ui/bridge.js')
          s = p.read_text()
          old = """  try {\n    const providerModule = await import('../provider/index.js');\n    if (providerModule && typeof providerModule.WorkerAIProvider === 'function') provider = new providerModule.WorkerAIProvider();\n  } catch { /* deterministic core remains available */ }\n"""
          new = """  try {\n    // Standalone Web keeps the Worker provider. The userscript host injects a\n    // browser-local ChatGPT bridge and owns the ChatGPT/Gemini selection.\n    if (globalThis.__HEX_CHATGPT_BRIDGE__) {\n      const userscriptModule = await import('../provider/chatgpt-web.js');\n      if (userscriptModule && typeof userscriptModule.UserscriptAIProvider === 'function') {\n        provider = new userscriptModule.UserscriptAIProvider({ bridge: globalThis.__HEX_CHATGPT_BRIDGE__ });\n      }\n    }\n    if (!provider) {\n      const providerModule = await import('../provider/index.js');\n      if (providerModule && typeof providerModule.WorkerAIProvider === 'function') provider = new providerModule.WorkerAIProvider();\n    }\n  } catch { /* deterministic core remains available */ }\n"""
          if old not in s:
              raise SystemExit('provider bridge anchor not found')
          s = s.replace(old, new, 1)
          old = """          if (isSafetyBoundaryError(error)) throw error;\n          onActivity?.({ type: 'error', label: 'AI core unavailable', detail: String(error?.message || error).slice(0, 120) });\n"""
          new = """          if (isSafetyBoundaryError(error)) throw error;\n          onActivity?.({ type: 'error', label: 'AI core unavailable', detail: String(error?.message || error).slice(0, 120) });\n          // Never label a local/Gemini fallback as a ChatGPT answer.\n          if (globalThis.__HEX_CHATGPT_BRIDGE__ && globalThis.__HEX_AI_PROVIDER__ !== 'gemini') throw error;\n"""
          if old not in s:
              raise SystemExit('safety boundary anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('package.json')
          data = json.loads(p.read_text())
          scripts = data.setdefault('scripts', {})
          ai = scripts['ai:test']
          extra = 'node tests/ai-chatgpt-web-provider.mjs'
          if extra not in ai:
              scripts['ai:test'] = ai + ' && ' + extra
          scripts['userscript:build'] = 'node scripts/build-userscript.mjs'
          scripts['userscript:test'] = 'npm run userscript:build && node --check userscript/hex.user.template.js && node --check userscript/platform-worker.bundle.js && node --check worker-entry.js && node tests/userscript-host.mjs && node tests/userscript-network.mjs && node tests/ai-chatgpt-web-provider.mjs'
          data.setdefault('devDependencies', {})['esbuild'] = '0.28.1'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          python - <<'PY'
          from pathlib import Path

          p = Path('js/ai/tools/registry.js')
          s = p.read_text()
          old = "completenessOf, projectBounded, projectCompare, projectDetail, projectFunction, projectGraph,"
          new = "completenessOf, projectBinaryDiff, projectBounded, projectCompare, projectDetail, projectFunction, projectGraph,"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif 'projectBinaryDiff' not in s.split("from './projections/index.js'", 1)[0]:
              raise SystemExit('projectBinaryDiff import anchor not found')

          p = Path('js/ai/render/normalize.js')
          s = p.read_text()
          old = """  'followups', 'activity', 'usage', 'limits', 'sessionId', 'error', 'task', 'proposals',\n]);"""
          new = """  'followups', 'activity', 'usage', 'limits', 'sessionId', 'scope', 'turnSnapshotId', 'error', 'task', 'proposals',\n]);"""
          if old not in s:
              raise SystemExit('normalize known-fields anchor not found')
          s = s.replace(old, new, 1)
          old = """    sessionId: source.sessionId ? String(source.sessionId) : null,\n    error: source.error ? text(source.error, 400) : null,"""
          new = """    sessionId: source.sessionId ? String(source.sessionId) : null,\n    scope: source.scope ? String(source.scope) : null,\n    turnSnapshotId: source.turnSnapshotId ? String(source.turnSnapshotId) : null,\n    error: source.error ? text(source.error, 400) : null,"""
          if old not in s:
              raise SystemExit('normalize return anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

          git add js/ai/ui/bridge.js package.json js/ai/tools/registry.js js/ai/render/normalize.js
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain'
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Install and rebuild generated userscript assets
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run userscript:build

      - name: Focused and full validation
        run: |
          npm run userscript:test
          npm run ai:test
          node tests/gemini.mjs
          node tests/worker-classic-harness.mjs
          npm run check

      - name: Browser validation
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install-deps chromium webkit
          npx --no-install playwright install chromium webkit
          npm run ui:browser

      - name: Commit validated integration and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-pr603.yml
          rm -f .github/workflows/ui-debug-temp.yml
          rm -f .github/workflows/tmp-pr603-finalize.yml
          rm -f .github/workflows/diagnose-pr603-merge.yml
          git add -A
          git status --short
          git commit -m "Merge latest main and finalize ChatGPT userscript integration"

          # The workflow file itself can advance the remote branch while this run
          # is executing. Never overwrite real concurrent work: accept only a
          # finalizer-only advance, then lease exactly that observed remote SHA.
          git fetch origin chatgpt-userscript-host
          remote_sha="$(git rev-parse origin/chatgpt-userscript-host)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            changed="$(git diff --name-only "$GITHUB_SHA" "$remote_sha" || true)"
            unexpected="$(printf '%s\n' "$changed" | grep -v '^\.github/workflows/finalize-pr603\.yml$' | sed '/^$/d' || true)"
            if [ -n "$unexpected" ]; then
              echo 'Branch advanced with non-finalizer changes; refusing to overwrite:'
              printf '%s\n' "$unexpected"
              exit 1
            fi
          fi
          git push --force-with-lease=refs/heads/chatgpt-userscript-host:"$remote_sha" origin HEAD:chatgpt-userscript-host
