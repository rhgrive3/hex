name: TEMP DOM Skill PR Driver

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire:
    if: ${{ github.head_ref == 'dev-agent/dom-skill-system' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-agent/dom-skill-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply wiring
        run: python3 scripts/tmp-wire-dom-skill.py
      - name: Focused contracts
        run: |
          node --check js/userscript/dev/skills/automation-program.js
          node --check js/userscript/dev/skills/dom-skill-registry.js
          node tests/dev-agent/dom-skill-system.mjs
          node tests/dev-agent/post-bootstrap-self-improvement-kernel.mjs
      - name: Canonical userscript build and full regression
        run: npm run userscript:test
      - name: Commit final source and generated output
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-dom-skill-pr-driver.yml
          git rm .github/workflows/tmp-dom-skill-system-wire.yml
          git rm scripts/tmp-wire-dom-skill.py
          test ! -e tmp-dom-skill-system-trigger.txt || git rm tmp-dom-skill-system-trigger.txt
          git add js/ai/dev/admin/tool-surface.js \
                  js/ai/dev/protocol/dev-supervisor-prompt.js \
                  js/userscript/dev/parent-rpc.js \
                  js/userscript/dev/parent-worker-runtime.js \
                  js/userscript/dev/skills/automation-program.js \
                  js/userscript/dev/skills/dom-skill-registry.js \
                  js/userscript/embed-child.js \
                  tests/dev-agent/dom-skill-system.mjs \
                  tests/userscript-release-version.mjs \
                  userscript/hex.user.template.js \
                  userscript/release-version.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Complete versioned DOM Skill System [dom-skill-generated]'
          git push origin HEAD:dev-agent/dom-skill-system
