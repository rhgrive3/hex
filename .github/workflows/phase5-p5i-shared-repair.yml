name: Phase 5 P5-I shared semantic repair

on:
  push:
    branches:
      - hex/p5-x86-integration

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.repository == 'rhgrive3/hex' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact P5-I shared repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} copies, found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old,new))

          # One canonical integrated semantic epoch.
          replace('js/targets/architecture/x86_64/effects/common.js',
                  "export const X86_64_MACHINE_EFFECTS_SEMANTIC_VERSION = '5.0.0-foundation';",
                  "export const X86_64_MACHINE_EFFECTS_SEMANTIC_VERSION = '5.1.0-phase5-integrated';")

          # Canonical MXCSR physical/environment state. XMM remains a lower YMM view.
          replace('js/targets/architecture/x86_64/registers-core.js',
                  "  addView('flags','rflags',64,0,'flags','replace');\n\n  for (let index = 0; index < 16; index++) {",
                  "  addView('flags','rflags',64,0,'flags','replace');\n\n  addPhysical('mxcsr',32,'fp-environment');\n  addView('mxcsr','mxcsr',32,0,'fp-environment','replace');\n\n  for (let index = 0; index < 16; index++) {")

          old_intrinsic = '''  function intrinsic(intrinsicId, inputs, outputWidths, config = {}) {
    const outputs = outputWidths.map((widthBits, index) => temporary(widthBits, `${intrinsicId}-${index}`));
    addOperation({
      kind:'intrinsic',
      intrinsicId,
      effectSummary:createIntrinsicEffectSummary({
        inputs,
        outputs,
        registersRead:config.registersRead ?? [],
        registersWritten:config.registersWritten ?? [],
        memoryRead:config.memoryRead ?? { scope:'none' },
        memoryWrite:config.memoryWrite ?? { scope:'none' },
        controlEffects:config.controlEffects ?? [],
        determinism:config.determinism ?? 'input-dependent',
        symbolicDetail:config.symbolicDetail ?? 'summary-only',
      }, options),
      metadata:{ summaryContractVersion:'x86-intrinsic-summary/v1', ...(config.metadata || {}) },
    });
    return outputs;
  }
'''
          new_intrinsic = '''  function intrinsic(intrinsicId, inputs, outputWidths, config = {}) {
    const fpEnvironmentDependency = String(config.metadata?.fpEnvironmentDependency || '');
    const usesMxcsr = fpEnvironmentDependency.includes('MXCSR');
    let effectiveInputs = [...inputs];
    let effectiveOutputWidths = [...outputWidths];
    let registersRead = [...(config.registersRead ?? [])];
    let registersWritten = [...(config.registersWritten ?? [])];
    let mxcsrOperand = null;
    if (usesMxcsr) {
      mxcsrOperand = registerOperand('mxcsr');
      const currentMxcsr = mxcsrOperand ? readRegister(mxcsrOperand) : null;
      if (!currentMxcsr) throw new TypeError('x86-mxcsr-physical-state-unavailable');
      effectiveInputs.push(currentMxcsr);
      effectiveOutputWidths.push(32);
      registersRead = [...new Set([...registersRead,'mxcsr'])].sort();
      registersWritten = [...new Set([...registersWritten,'mxcsr'])].sort();
    }
    const outputs = effectiveOutputWidths.map((widthBits, index) => temporary(widthBits, `${intrinsicId}-${index}`));
    addOperation({
      kind:'intrinsic',
      intrinsicId,
      effectSummary:createIntrinsicEffectSummary({
        inputs:effectiveInputs,
        outputs,
        registersRead,
        registersWritten,
        memoryRead:config.memoryRead ?? { scope:'none' },
        memoryWrite:config.memoryWrite ?? { scope:'none' },
        controlEffects:config.controlEffects ?? [],
        determinism:usesMxcsr ? 'input-dependent' : (config.determinism ?? 'input-dependent'),
        symbolicDetail:config.symbolicDetail ?? 'summary-only',
      }, options),
      metadata:{
        summaryContractVersion:'x86-intrinsic-summary/v1',
        ...(config.metadata || {}),
        ...(usesMxcsr ? {
          fpEnvironmentModeled:true,
          fpEnvironmentContract:'x86-mxcsr/v1',
          exactArchitecturalSummary:true,
          mxcsrState:Object.freeze({
            exceptionStatusBits:'5:0',
            denormalsAreZeroBit:6,
            exceptionMaskBits:'12:7',
            roundingControlBits:'14:13',
            flushToZeroBit:15,
            reservedBitsPreserved:true,
            output:'next-mxcsr',
          }),
        } : {}),
      },
    });
    if (usesMxcsr) {
      const nextMxcsr = outputs[outputs.length - 1];
      if (!writeRegister(mxcsrOperand,nextMxcsr)) throw new TypeError('x86-mxcsr-physical-state-write-failed');
      return outputs.slice(0, outputWidths.length);
    }
    return outputs;
  }
'''
          replace('js/targets/architecture/x86_64/effects/common.js', old_intrinsic, new_intrinsic)

          # P5-3 memory forms now use the canonical P5-2 effective-address contract.
          replace('js/targets/architecture/x86_64/effects/fp.js',
                  "function foundationAddress(ctx,operand){const memory=operand?.type==='memory'?operand.memory:null;if(!memory||memory.addressSizeBits!==64||memory.segment!=null)return null;return x86EffectiveAddressExpression(ctx.instruction,operand);}",
                  "function foundationAddress(ctx,operand){return operand?.type==='memory'?x86EffectiveAddressExpression(ctx.instruction,operand):null;}")
          replace('js/targets/architecture/x86_64/effects/simd.js',
                  "function memoryAddress(ctx,operand){const memory=operand?.type==='memory'?operand.memory:null;if(!memory||memory.addressSizeBits!==64||memory.segment!=null)return null;return x86EffectiveAddressExpression(ctx.instruction,operand);}",
                  "function memoryAddress(ctx,operand){return operand?.type==='memory'?x86EffectiveAddressExpression(ctx.instruction,operand):null;}")

          replace('js/targets/architecture/x86_64/effects/fp.js',
                  "function fpFault(operation,signaling='operation-dependent'){return Object.freeze({kind:'x86-simd-floating-point-exception',condition:{kind:'mxcsr-exception-state-unmodelled',operation,signaling},detail:{exceptionClass:'#XM',maskState:'MXCSR-unmodelled'}});}",
                  "function fpFault(operation,signaling='operation-dependent'){return Object.freeze({kind:'x86-simd-floating-point-exception',condition:{kind:'mxcsr-unmasked-floating-point-exception',operation,signaling,maskBits:'MXCSR[12:7]',statusBits:'MXCSR[5:0]'},detail:{exceptionClass:'#XM',environmentContract:'x86-mxcsr/v1'}});}")
          replace('js/targets/architecture/x86_64/effects/fp.js',
                  "function fpPartial(ctx,family,metadata,faults=[],categories=['registers','faults','other']){return ctx.partial('x86-fp-environment-state-unmodelled',categories,{family:'fp',possibleFaults:faults,detail:fpDetail(family),metadata:{operation:family,fpEnvironmentModeled:false,...metadata}});}",
                  "function fpPartial(ctx,family,metadata,faults=[],categories=['registers','faults','other']){return ctx.finish({family:'fp',possibleFaults:faults,metadata:{operation:family,fpEnvironmentModeled:true,fpEnvironmentContract:'x86-mxcsr/v1',environmentEffect:'intrinsic-consumes-and-produces-canonical-mxcsr',...metadata}});}")

          # Proven LOCKed RMW accesses map to the existing architecture-neutral seq-cst ordering.
          replace('js/targets/architecture/x86_64/effects/memory.js',
                  "  return {\n    space:address.space,\n    ...extra,\n    metadata:{ ...address.metadata, ...metadata },\n  };",
                  "  return {\n    space:address.space,\n    ...(extra.atomic === true && extra.ordering == null ? { ordering:'seq-cst' } : {}),\n    ...extra,\n    metadata:{ ...address.metadata, ...metadata },\n  };")
          old_order_mem = '''function atomicOrderingPartial(ctx, family, possibleFaults, metadata = {}, detail = {}) {
  return ctx.partial('x86-locked-memory-ordering-not-representable-by-frozen-p5-0-contract', ['memory'], {
    possibleFaults,
    detail:{
      atomicity:'represented-by-MemoryAccess.atomic',
      ordering:'intentionally-unmapped',
      reason:'x86 locked-operation ordering is stronger/more-specific than the frozen generic mapping can prove here',
      ...detail,
    },
    metadata:{
      family:'atomic-memory',
      operation:family,
      atomic:true,
      orderingMapping:'unmapped-not-seq-cst',
      ...metadata,
    },
  });
}
'''
          new_order_mem = '''function atomicOrderingPartial(ctx, family, possibleFaults, metadata = {}, detail = {}) {
  return ctx.finish({
    family:'atomic-memory',
    possibleFaults,
    metadata:{
      operation:family,
      atomic:true,
      orderingMapping:'seq-cst',
      orderingAuthority:'Intel SDM Vol.3: locked instructions have a total order and loads/stores are not reordered with locked instructions',
      orderingScope:'proven-locked-rmw-only',
      ...metadata,
      ...detail,
    },
  });
}
'''
          replace('js/targets/architecture/x86_64/effects/memory.js', old_order_mem, new_order_mem)

          replace('js/targets/architecture/x86_64/effects/atomic.js',
                  "  return { space:address.space, atomic, metadata:{ ...address.metadata, rmwId:relationshipId, rmwPhase:phase, atomicRmw:atomic, sameInstructionRelationship:true, ...metadata } };",
                  "  return { space:address.space, atomic, ...(atomic ? { ordering:'seq-cst' } : {}), metadata:{ ...address.metadata, rmwId:relationshipId, rmwPhase:phase, atomicRmw:atomic, sameInstructionRelationship:true, ...metadata } };")
          old_order_atomic = '''function orderingPartial(ctx, family, faults, metadata = {}, detail = {}) {
  return ctx.partial('x86-atomic-ordering-not-mapped-by-frozen-p5-0-contract', ['memory'], {
    possibleFaults:faults,
    detail:{ atomicity:'exact', ordering:'intentionally-unmapped', overclaimAvoided:'seq-cst-not-assigned', ...detail },
    metadata:{ family:'atomic', operation:family, atomic:true, orderingMapping:'unmapped-not-seq-cst', ...metadata },
  });
}
'''
          new_order_atomic = '''function orderingPartial(ctx, family, faults, metadata = {}, detail = {}) {
  return ctx.finish({
    family:'atomic',
    possibleFaults:faults,
    metadata:{
      operation:family,
      atomic:true,
      orderingMapping:'seq-cst',
      orderingAuthority:'Intel SDM Vol.3: locked instructions have a total order and loads/stores are not reordered with locked instructions',
      orderingScope:'proven-locked-rmw-only',
      ...metadata,
      ...detail,
    },
  });
}
'''
          replace('js/targets/architecture/x86_64/effects/atomic.js', old_order_atomic, new_order_atomic)
          replace('js/targets/architecture/x86_64/effects/atomic.js',
                  "orderingMapping:locked ? 'unmapped-not-seq-cst' : 'not-applicable'",
                  "orderingMapping:locked ? 'seq-cst' : 'not-applicable'")

          # Viewer compatibility only; semantic maturity remains partial/shadow until P5-6.
          replace('js/targets/architecture/index.js',
                  "id:'x86_64', semanticVersion:X86_64_MACHINE_EFFECTS_SEMANTIC_VERSION, instructionAlignment:1, fixedInstructionSize:null, viewerCompatible:false,",
                  "id:'x86_64', semanticVersion:X86_64_MACHINE_EFFECTS_SEMANTIC_VERSION, instructionAlignment:1, fixedInstructionSize:null, viewerCompatible:true,")
          replace('js/targets/architecture/index.js',
                  "  // P5-5 has an integrated bounded variable-length x86 viewer, but the public\n  // viewer capability remains conservative in this checkpoint because the\n  // global capability regression is outside p5-i ownership. The integrated\n  // viewer seam is verified directly under tests/phase5/** without claiming A6.",
                  "  // P5-5's bounded variable-length viewer is integration-green, so only the\n  // viewer capability is enabled here. Semantic/A6 maturity remains explicitly\n  // partial until the independent P5-6 verification corpus is complete.")

          # Update seam regressions to the integrated contracts.
          p=Path('tests/phase5/integration/x86-cross-lane.test.mjs'); text=p.read_text()
          old='''test('LOCKed cross-lane memory RMW is atomic but ordering is explicit partial, never guessed seq-cst', () => {
  const { bundle } = lift({ family:'adc', prefixes:[0xf0], operands:[mem({ base:'rax', widthBits:64, access:'read-write' }), reg('rbx', 64, 'read')] });
  assert.equal(bundle.completeness, 'partial');
  assert.match(bundle.unknownEffects.reason, /ordering-not-representable/);
  assert.equal(bundle.metadata.orderingMapping, 'unmapped-not-seq-cst');
  assert.equal(reads(bundle)[0].access.atomic, true);
  assert.equal(writes(bundle)[0].access.atomic, true);
  assert.equal(reads(bundle)[0].access.ordering, undefined);
  assert.equal(writes(bundle)[0].access.ordering, undefined);
});
'''
          new='''test('proven LOCKed cross-lane memory RMW maps to generic seq-cst; unlocked RMW does not', () => {
  const { bundle } = lift({ family:'adc', prefixes:[0xf0], operands:[mem({ base:'rax', widthBits:64, access:'read-write' }), reg('rbx', 64, 'read')] });
  assert.equal(bundle.completeness, 'exact-with-intrinsic');
  assert.equal(bundle.metadata.orderingMapping, 'seq-cst');
  assert.match(bundle.metadata.orderingAuthority, /Intel SDM Vol\.3/);
  assert.equal(reads(bundle)[0].access.atomic, true);
  assert.equal(writes(bundle)[0].access.atomic, true);
  assert.equal(reads(bundle)[0].access.ordering, 'seq-cst');
  assert.equal(writes(bundle)[0].access.ordering, 'seq-cst');

  const unlocked = lift({ family:'adc', operands:[mem({ base:'rax', widthBits:64, access:'read-write' }), reg('rbx', 64, 'read')] }).bundle;
  assert.equal(reads(unlocked)[0].access.atomic, false);
  assert.equal(writes(unlocked)[0].access.atomic, false);
  assert.equal(reads(unlocked)[0].access.ordering, undefined);
  assert.equal(writes(unlocked)[0].access.ordering, undefined);
});
'''
          if text.count(old)!=1: raise SystemExit('x86-cross-lane ordering test shape changed')
          p.write_text(text.replace(old,new))

          p=Path('tests/phase5/effects/fp-simd/moves-fp.test.mjs'); text=p.read_text()
          text=text.replace("test('scalar arithmetic and sqrt remain MXCSR-partial while lane preservation is explicit', () => {", "test('scalar arithmetic and sqrt consume and produce canonical MXCSR while preserving lane semantics', () => {")
          text=text.replace("    assert.equal(bundle.completeness,'partial',family); assert.equal(bundle.unknownEffects.reason,'x86-fp-environment-state-unmodelled',family); assert.ok(bundle.unknownEffects.detail.missingCanonicalState.some((x)=>x.startsWith('MXCSR.')),family); assert.equal(physicalWrites(bundle,'ymm0').length,1,family); assert.ok(ops(bundle,'value').some((op)=>op.opcode==='insert'&&op.metadata?.scalarLane===true),family);",
                            "    assert.equal(bundle.completeness,'exact-with-intrinsic',family); assert.equal(bundle.metadata.fpEnvironmentModeled,true,family); assert.equal(bundle.metadata.fpEnvironmentContract,'x86-mxcsr/v1',family); assert.equal(physicalWrites(bundle,'ymm0').length,1,family); assert.equal(physicalWrites(bundle,'mxcsr').length,1,family); assert.equal(ops(bundle,'register-read').filter((op)=>op.register.registerId==='mxcsr').length,1,family); assert.ok(ops(bundle,'value').some((op)=>op.opcode==='insert'&&op.metadata?.scalarLane===true),family);")
          text=text.replace("test('packed FP arithmetic remains explicit partial rather than fake exact', () => {", "test('packed FP arithmetic is exact-with-intrinsic with canonical MXCSR dependence', () => {")
          text=text.replace("    assert.equal(bundle.completeness,'partial',family); assert.equal(bundle.unknownEffects.reason,'x86-fp-environment-state-unmodelled'); assert.equal(intrinsics(bundle,'x86.fp.packed-arithmetic').length,1);",
                            "    assert.equal(bundle.completeness,'exact-with-intrinsic',family); assert.equal(bundle.metadata.fpEnvironmentModeled,true); assert.equal(physicalWrites(bundle,'mxcsr').length,1); assert.equal(intrinsics(bundle,'x86.fp.packed-arithmetic').length,1);")
          text=text.replace("test('conversion families expose known visible destination shape but remain FP-environment partial', () => {", "test('conversion families carry canonical MXCSR input/output without assuming rounding or masks', () => {")
          text=text.replace("for(const [family,operands] of cases){const bundle=effects(family,operands,{prefixes:legacy(),instructionId:`p5-3:${family}`}); assert.equal(bundle.completeness,'partial',family); assert.equal(bundle.unknownEffects.reason,'x86-fp-environment-state-unmodelled');}",
                            "for(const [family,operands] of cases){const bundle=effects(family,operands,{prefixes:legacy(),instructionId:`p5-3:${family}`}); assert.equal(bundle.completeness,'exact-with-intrinsic',family); assert.equal(bundle.metadata.fpEnvironmentContract,'x86-mxcsr/v1'); assert.equal(physicalWrites(bundle,'mxcsr').length,1);}")
          text=text.replace("const bundle=effects(family,[reg('xmm0','read'),reg('xmm1','read')],{prefixes:legacy(),instructionId:`p5-3:${family}`}); assert.equal(bundle.completeness,'partial',family);",
                            "const bundle=effects(family,[reg('xmm0','read'),reg('xmm1','read')],{prefixes:legacy(),instructionId:`p5-3:${family}`}); assert.equal(bundle.completeness,'exact-with-intrinsic',family); assert.equal(bundle.metadata.fpEnvironmentContract,'x86-mxcsr/v1'); assert.equal(physicalWrites(bundle,'mxcsr').length,1);")
          old_mem="""test('memory forms needing P5-2 address-size/TLS improvements hand off to P5-I', () => {
  const addr32=effects('movss',[reg('xmm0','write'),mem(32,{addressSizeBits:32})],{prefixes:legacyPrefix(0xf3),instructionId:'p5-3:addr32'}); assert.equal(addr32.completeness,'partial'); assert.equal(addr32.metadata.classification,'P5-I-INTEGRATION-REQUIRED');
  const fs=effects('movss',[reg('xmm0','write'),mem(32,{segment:'fs'})],{prefixes:legacyPrefix(0xf3),instructionId:'p5-3:fs'}); assert.equal(fs.completeness,'partial'); assert.equal(fs.metadata.classification,'P5-I-INTEGRATION-REQUIRED');
});
"""
          new_mem="""test('P5-3 memory forms reuse P5-2 address-size and TLS semantics', () => {
  const addr32=effects('movss',[reg('xmm0','write'),mem(32,{addressSizeBits:32})],{prefixes:legacyPrefix(0xf3),instructionId:'p5-3:addr32'}); assert.equal(addr32.completeness,'exact'); const addrRead=ops(addr32,'memory-read')[0]; assert.equal(addrRead.access.space,'memory'); assert.equal(addrRead.metadata.addressSizeBits,32);
  const fs=effects('movss',[reg('xmm0','write'),mem(32,{segment:'fs'})],{prefixes:legacyPrefix(0xf3),instructionId:'p5-3:fs'}); assert.equal(fs.completeness,'exact'); const fsRead=ops(fs,'memory-read')[0]; assert.equal(fsRead.access.space,'tls'); assert.equal(fsRead.metadata.segment,'fs');
});
"""
          if text.count(old_mem)!=1: raise SystemExit('fp memory seam test shape changed')
          p.write_text(text.replace(old_mem,new_mem))

          Path('tests/phase5/integration/p5i-shared-state.test.mjs').write_text('''import assert from 'node:assert/strict';\nimport test from 'node:test';\n\nimport { ARM64_ARCHITECTURE, X86_64_ARCHITECTURE } from '../../../js/targets/architecture/index.js';\nimport { resolveABIPlugin } from '../../../js/targets/abi/index.js';\nimport { x86RegisterDescriptor } from '../../../js/targets/architecture/x86_64/registers.js';\nimport { effects, reg, legacyPrefix, vex2, physicalWrites } from '../effects/fp-simd/helpers.mjs';\n\ntest('P5-I exposes bounded x86 viewer without overstating semantic maturity and leaves ARM64 unchanged', () => {\n  assert.equal(X86_64_ARCHITECTURE.viewerCompatible,true);\n  assert.equal(typeof X86_64_ARCHITECTURE.liftExact,'function');\n  assert.equal(X86_64_ARCHITECTURE.capabilities.semanticAnalysis,'phase5-shadow-partial');\n  assert.equal(ARM64_ARCHITECTURE.viewerCompatible,true);\n  assert.equal(ARM64_ARCHITECTURE.fixedInstructionSize,4);\n  assert.equal(ARM64_ARCHITECTURE.capabilities.semanticAnalysis,'legacy-v1');\n});\n\ntest('canonical x86 physical state has YMM-backed XMM views plus one MXCSR environment register', () => {\n  const xmm0=x86RegisterDescriptor('xmm0'), ymm0=x86RegisterDescriptor('ymm0'), mxcsr=x86RegisterDescriptor('mxcsr');\n  assert.equal(xmm0.physicalId,'ymm0'); assert.equal(xmm0.viewBits,128);\n  assert.equal(ymm0.physicalId,'ymm0'); assert.equal(ymm0.viewBits,256);\n  assert.equal(mxcsr.physicalId,'mxcsr'); assert.equal(mxcsr.viewBits,32); assert.equal(mxcsr.kind,'fp-environment');\n});\n\ntest('legacy SSE preserves upper YMM while VEX.128 zeroes it under the same physical identity', () => {\n  const legacy=effects('movaps',[reg('xmm0','write'),reg('xmm1','read')],{instructionId:'p5-i:legacy-sse'});\n  assert.equal(legacy.metadata.upperLaneBehavior,'preserve-upper-128'); assert.equal(physicalWrites(legacy,'ymm0').length,1);\n  const vex=effects('vxorps',[reg('xmm0','write'),reg('xmm1','read'),reg('xmm2','read')],{prefixes:vex2(0xf8),instructionId:'p5-i:vex128'});\n  assert.equal(vex.metadata.upperLaneBehavior,'zero-upper-128'); assert.equal(physicalWrites(vex,'ymm0').length,1);\n});\n\ntest('SysV AMD64 and Microsoft x64 ABI plugins remain independently selectable', () => {\n  assert.equal(resolveABIPlugin({architecture:'x86_64',abiId:'sysv-amd64'}).id,'sysv-amd64');\n  assert.equal(resolveABIPlugin({architecture:'x86_64',abiId:'microsoft-x64'}).id,'microsoft-x64');\n});\n''')

          # Machine-readable P5-6 gap handoff generated from the frozen manifest, without editing it.
          manifest=json.loads(Path('tests/phase5/corpus/manifest.json').read_text())
          targets=[t['id'] for t in manifest['mandatoryTargets']]
          opts=manifest['mandatoryOptimizationLevels']
          cats=manifest['mandatoryCategories']
          covered=set(manifest['source']['coveredCategories'])
          fixtures=manifest['foundationVerticalFixtures']
          actual=[]
          for f in fixtures:
              target='sysv-amd64-elf' if f['abiId']=='sysv-amd64' else 'microsoft-x64-pe'
              for c in sorted(covered):
                  if c=='sysv-amd64-abi' and target!='sysv-amd64-elf': continue
                  if c=='microsoft-x64-abi' and target!='microsoft-x64-pe': continue
                  actual.append({'target':target,'optimization':f['optimization'],'category':c,'fixture':f['path']})
          actual_keys={(x['target'],x['optimization'],x['category']) for x in actual}
          missing=[]
          for target in targets:
              for opt in opts:
                  for cat in cats:
                      if (target,opt,cat) not in actual_keys:
                          missing.append({'target':target,'optimization':opt,'category':cat,'status':'REQUIRED-FOR-P5-6-VERIFICATION'})
          report={
            'schemaVersion':'phase5-p5i-corpus-gap/v1',
            'sourceManifest':'tests/phase5/corpus/manifest.json',
            'disposition':'REQUIRED-FOR-P5-6-VERIFICATION',
            'a6ClaimAllowed':False,
            'mandatoryTargets':targets,
            'mandatoryOptimizationLevels':opts,
            'mandatoryCategories':cats,
            'foundationFixtures':[{'id':f['id'],'path':f['path'],'optimization':f['optimization'],'abiId':f['abiId']} for f in fixtures],
            'actualInstantiatedTupleCount':len(actual),
            'mandatoryTupleCount':len(targets)*len(opts)*len(cats),
            'missingTupleCount':len(missing),
            'actualInstantiatedTuples':actual,
            'missingTuples':missing,
            'p5_6Rule':'Any missing required tuple is BLOCKING, never SKIPPED/NOT-APPLICABLE/PASS.',
          }
          out=Path('reports/phase5/p5-6-required-corpus-gaps.json'); out.parent.mkdir(parents=True,exist_ok=True); out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          if report['mandatoryTupleCount'] != 144 or report['actualInstantiatedTupleCount'] != 20 or report['missingTupleCount'] != 124:
              raise SystemExit(f'unexpected corpus gap counts: {report["mandatoryTupleCount"]}/{report["actualInstantiatedTupleCount"]}/{report["missingTupleCount"]}')
          PY
          git diff --check
      - name: Focused P5-I seam tests
        run: |
          node --test --test-concurrency=1 tests/phase5/integration/x86-cross-lane.test.mjs tests/phase5/integration/p5i-shared-state.test.mjs tests/phase5/effects/fp-simd/moves-fp.test.mjs
          npm run effects:test
          npm run phase5:test
          npm run semantic-v2:test
          npm run platform:test
      - name: Canonical userscript build and idempotence
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp /tmp/hex.user.template.js userscript/hex.user.template.js
          cmp /tmp/release-version.json userscript/release-version.json
          npm run userscript:test
          git diff --check
      - name: Commit P5-I repair and canonical generated output
        shell: bash
        run: |
