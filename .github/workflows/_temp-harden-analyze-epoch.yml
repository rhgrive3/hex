name: Temp harden analyze epoch
on:
  push:
    branches:
      - review-all-hardening-integration
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-all-hardening-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/_patch-analyze-epoch.mjs
      - name: Commit source and regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/_patch-analyze-epoch.mjs
          git add js/backend.js tests/backend-open-race.mjs scripts
          git commit -m 'Reject Mach-O analysis that crosses slice epochs'
      - run: npm ci
      - run: node tests/backend-open-race.mjs
      - run: npm run userscript:build
      - run: npm run check
      - name: Commit updated bundles
        run: |
          git add userscript/hex.user.template.js userscript/platform-worker.bundle.js
          git commit -m 'Sync bundles after analysis epoch hardening'
          git push origin HEAD:review-all-hardening-integration
