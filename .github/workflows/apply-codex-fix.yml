name: Apply Codex fix
on:
  push:
    branches: [codex/harden-analysis-engine]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-analysis-engine
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          cat .codex-fix-part-* | base64 -d | gzip -d > /tmp/hex-fixes.patch
          git apply --check /tmp/hex-fixes.patch
          git apply --index /tmp/hex-fixes.patch
          git rm .codex-fix-part-* .github/workflows/apply-codex-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden analysis sandbox and improve recovery accuracy"
          git push origin HEAD:codex/harden-analysis-engine
