name: ChatGPT userscript host

on:
  pull_request:
    paths:
      - 'js/userscript/**'
      - 'js/ai/dev/**'
      - 'js/ai/provider/**'
      - 'js/ai/ui/bridge.js'
      - 'scripts/build-userscript.mjs'
      - 'userscript/**'
      - 'worker-entry.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'css/**'
      - 'tests/dev-agent/**'
      - 'tests/userscript-*.mjs'
      - 'tests/chatgpt-*.mjs'
      - '.github/workflows/userscript-host.yml'
  push:
    branches: [main]
    paths:
      - 'js/userscript/**'
      - 'js/ai/dev/**'
      - 'js/ai/provider/**'
      - 'js/ai/ui/bridge.js'
      - 'scripts/build-userscript.mjs'
      - 'userscript/**'
      - 'worker-entry.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'css/**'
      - 'tests/dev-agent/**'
      - 'tests/userscript-*.mjs'
      - 'tests/chatgpt-*.mjs'
      - '.github/workflows/userscript-host.yml'

permissions:
  contents: write

concurrency:
  group: userscript-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Opaque sandbox storage contract
        run: node tests/userscript-sandbox-storage.mjs
      - name: Embed mode security boundary
        run: node tests/userscript-embed-mode-security.mjs
      - name: Conversation routing storage boundary
        run: node tests/chatgpt-conversation-storage-security.mjs
      - name: Build and userscript tests
        run: npm run userscript:test
      - name: Round 4 production bootstrap contract
        run: node tests/dev-agent/round4-production-bootstrap.mjs
      - name: Commit canonical generated userscript for this repair
        if: github.head_ref == 'fix/rpc-close-cancels-remote'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/userscript-host.yml
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/userscript-host.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Build userscript for RPC close cancellation fix'
          git push origin HEAD:fix/rpc-close-cancels-remote
      - name: Verify tiny committed loader is current
        run: git diff --exit-code -- userscript/hex.user.template.js

  embed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build secure userscript runtime
        run: npm run userscript:build
      - name: Install matching Playwright package
        run: npm install --no-save --save-exact playwright@1.55.0
      - name: Verify pinned Chromium and WebKit image
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright';
          for (const browserType of [chromium, webkit]) {
            const browser = await browserType.launch({ headless: true });
            await browser.close();
          }
          NODE
      - name: Verify opaque srcdoc module and storage execution
        run: node tests/userscript-srcdoc-probe.mjs
      - name: Run full secure sandbox startup
        run: node tests/userscript-sandbox-browser-e2e.mjs
      - name: Capture a ChatGPT turn against the production DOM
        run: node tests/chatgpt-web-production-dom.mjs
