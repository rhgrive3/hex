name: ChatGPT userscript host

on:
  pull_request:
    paths:
      - 'js/userscript/**'
      - 'js/ai/dev/**'
      - 'js/ai/provider/**'
      - 'js/ai/ui/bridge.js'
      - 'scripts/build-userscript.mjs'
      - 'userscript/**'
      - 'worker-entry.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'css/**'
      - 'tests/dev-agent/**'
      - 'tests/userscript-*.mjs'
      - 'tests/chatgpt-*.mjs'
      - '.github/workflows/userscript-host.yml'
  push:
    branches: [main]
    paths:
      - 'js/userscript/**'
      - 'js/ai/dev/**'
      - 'js/ai/provider/**'
      - 'js/ai/ui/bridge.js'
      - 'scripts/build-userscript.mjs'
      - 'userscript/**'
      - 'worker-entry.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'css/**'
      - 'tests/dev-agent/**'
      - 'tests/userscript-*.mjs'
      - 'tests/chatgpt-*.mjs'
      - '.github/workflows/userscript-host.yml'

permissions:
  contents: read

concurrency:
  group: userscript-host-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve generated-output ownership policy
        id: generated-policy
        shell: bash
        run: echo "mode=$(node tools/validation/generated-output-policy.mjs)" >> "$GITHUB_OUTPUT"
      - name: Opaque sandbox storage contract
        run: node tests/userscript-sandbox-storage.mjs
      - name: Embed mode security boundary
        run: node tests/userscript-embed-mode-security.mjs
      - name: Conversation routing storage boundary
        run: node tests/chatgpt-conversation-storage-security.mjs
      - name: Dynamic Task Graph focused regression
        run: node tests/dev-agent/dynamic-task-graph.mjs
      - name: Build and userscript tests
        run: npm run userscript:test
      - name: Round 4 production bootstrap contract
        run: node tests/dev-agent/round4-production-bootstrap.mjs
      - name: Verify tiny committed loader is current
        if: steps.generated-policy.outputs.mode == 'enforce'
        run: git diff --exit-code -- userscript/hex.user.template.js

  # Both embed-browser suites intentionally exercise Chromium and WebKit. Run
  # them in Playwright's pinned image so every PR does not spend minutes
  # downloading 100+ MB of WebKit OS packages onto a fresh hosted runner.
  embed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build secure userscript runtime
        run: npm run userscript:build
      - name: Install matching Playwright package
        run: npm install --no-save --save-exact playwright@1.55.0
      - name: Verify pinned Chromium and WebKit image
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright';
          for (const browserType of [chromium, webkit]) {
            const browser = await browserType.launch({ headless: true });
            await browser.close();
          }
          NODE
      - name: Verify opaque srcdoc module and storage execution
        run: node tests/userscript-srcdoc-probe.mjs
      - name: Run full secure sandbox startup
        run: node tests/userscript-sandbox-browser-e2e.mjs
      - name: Capture a ChatGPT turn against the production DOM
        run: node tests/chatgpt-web-production-dom.mjs
