name: Issue 464 symbol containment

on:
  push:
    branches:
      - fix/issue-464-symbol-containment

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[issue-464-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply containment fix
        run: python3 tools/apply-issue-464.py
      - name: Focused symbol containment regression
        run: node tests/symbol-identity.mjs
      - name: Static checks
        run: |
          node --check js/symbols.js
          node --check js/app.js
      - name: Full check suite
        run: npm run check
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/symbols.js js/app.js tests/symbol-identity.mjs
          git commit -m 'Fix #464 function containment [issue-464-applied]'
          git push
