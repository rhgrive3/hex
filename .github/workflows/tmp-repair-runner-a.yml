name: One-shot repair runner A
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-issues-a-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rebase target onto current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
      - name: Apply guarded patch and validate
        run: |
          python3 tools/tmp-unlinked-issues-a.py
          npm ci
          npm run semantic-v2:test
          node tests/ir.mjs
          npm run check
          npm run userscript:build
          git diff --check
      - name: Commit canonical result
        run: |
          rm tools/tmp-unlinked-issues-a.py
          rm -f .github/workflows/tmp-repair-runner-a.yml
          git add -A
          git commit -m 'fix: close unlinked semantic correctness issues batch A'
          git push --force-with-lease origin HEAD:fix/unlinked-issues-a-20260819
