name: Export source for issue remediation

on:
  push:
    branches:
      - fix-all-open-issues

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          set -euo pipefail
          tar -czf /tmp/hex-source.tar.gz \
            --exclude='tests/TsumTsum' \
            --exclude='tests/YWP' \
            --exclude='tests/battlecats' \
            js tests package.json package-lock.json .github 2>/dev/null || \
          tar -czf /tmp/hex-source.tar.gz \
            --exclude='tests/TsumTsum' \
            --exclude='tests/YWP' \
            --exclude='tests/battlecats' \
            js tests package.json .github
      - uses: actions/upload-artifact@v4
        with:
          name: hex-source
          path: /tmp/hex-source.tar.gz
          retention-days: 1
