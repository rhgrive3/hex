name: Validate issue 572 bounded LEB
on:
  push:
    branches:
      - fix/issue-572-bounded-leb-current
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python tools/apply-issue-572.py
      - name: Syntax
        run: |
          node --check js/binary/reader.js
          node --check js/binary/macho.js
          node --check js/binary/macho-dyld.js
          node --check js/binary/elf-unwind.js
          node --check tests/issue-572-bounded-leb.mjs
      - name: Focused regressions
        run: |
          node tests/issue-572-bounded-leb.mjs
          npm run binary:test
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/reader.js js/binary/macho.js js/binary/macho-dyld.js js/binary/elf-unwind.js tests/issue-572-bounded-leb.mjs
          git commit -m "fix: bound metadata LEB decoding to logical substreams (#572)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-issue-572.py
          git commit -m "chore: finalize issue 572"
          git push origin HEAD:fix/issue-572-bounded-leb-current