name: Validate runtime intelligence imports
on:
  push:
    branches:
      - fix/runtime-intelligence-imports-current
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python tools/apply-runtime-intelligence-imports.py
      - name: Focused validation
        run: |
          node --check js/app.js
          node tests/runtime-intelligence-imports.mjs
          node tests/symbol-identity.mjs
          node tests/issue-560-multi-exec.mjs
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js tests/runtime-intelligence-imports.mjs
          git commit -m "fix: restore runtime intelligence imports"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-runtime-intelligence-imports.py
          git commit -m "chore: finalize runtime import fix"
          git push origin HEAD:fix/runtime-intelligence-imports-current