name: Validate final Mach-O truth budget
on:
  push:
    branches:
      - fix/final-macho-truth-budget-521-527-570
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical metadata budget
        run: |
          sed -i 's/function normalizeSpecialDylibOrdinal/function rawCString/' tools/apply-issue-570-v3.py
          python tools/apply-issue-570-v3.py
      - name: Apply product truth and supplemental budgets
        run: python tools/apply-issues-521-527.py
      - name: Syntax
        run: |
          node --check js/binary/macho-budget.js
          node --check js/binary/macho.js
          node --check js/binary/macho-dyld.js
          node --check js/binary/source-loaders.js
          node --check js/macho-linkage.js
          node --check js/platform/worker.js
          node --check js/backend.js
          node --check js/symbols.js
          node --check js/linkage.js
          node --check js/worker-budget.js
          node --check js/worker-legacy.js
          node --check js/chained.js
          node --check tests/issue-570-macho-metadata-budget.mjs
          node --check tests/issues-521-527-macho-product-truth.mjs
      - name: Focused regressions
        run: |
          node tests/issue-570-macho-metadata-budget.mjs
          node tests/issues-521-527-macho-product-truth.mjs
          npm run binary:test
          node tests/issues-434-450-regressions.mjs
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/macho-budget.js js/binary/macho.js js/binary/macho-dyld.js js/binary/source-loaders.js js/macho-linkage.js js/platform/worker.js js/backend.js js/symbols.js js/linkage.js js/worker-budget.js js/worker-legacy.js js/chained.js tests/issue-570-macho-metadata-budget.mjs tests/issues-521-527-macho-product-truth.mjs
          git commit -m "fix: unify Mach-O linkage truth and bound supplemental metadata (#521 #527 #570)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-issue-570-v3.py tools/apply-issues-521-527.py
          git commit -m "chore: finalize remaining Mach-O issues"
          git push origin HEAD:fix/final-macho-truth-budget-521-527-570
