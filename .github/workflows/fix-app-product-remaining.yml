name: Fix App Product remaining issues
on:
  push:
    branches: [fix/all-remaining-issues-20260815]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply fixes
        run: python tools/fix-app-product-529-531-541-543-544-545-546.py
      - name: Static syntax first
        run: |
          node --check js/app.js
          node --check js/objc.js
          node --check js/ai/ui/hex-context.js
          node --check js/ui/product.js
      - name: Focused regression guards
        run: |
          cat > tests/issues-529-531-541-543-544-545-546.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const app=fs.readFileSync('js/app.js','utf8');
          assert.match(app,/buildObjcRuntimeIndex/); assert.match(app,/buildSwiftMetadataModel/); assert.match(app,/buildSwiftRuntimeIndex/);
          assert.match(app,/protocolList/); assert.match(app,/categoryList/); assert.match(app,/this\.objcRuntime/); assert.match(app,/this\.swiftRuntime/);
          assert.match(app,/const capability = slice\?\.capability/); assert.match(app,/instructionAlignment/); assert.match(app,/analysisLevel/);
          assert.match(app,/validatedFunctionRange/); assert.match(app,/function-start-not-executable/); assert.match(app,/symbol-range-crosses-executable-region/);
          assert.match(app,/ensureRecognition/); assert.match(app,/rankApplicationFunctions/); assert.match(app,/new KnowledgeDB/);
          const ai=fs.readFileSync('js/ai/ui/hex-context.js','utf8');
          assert.match(ai,/instructionBytes\(app\)/); assert.match(ai,/scannedCount/); assert.match(ai,/truncationReason/); assert.match(ai,/coverage/);
          assert.doesNotMatch(ai,/\(start - region\.vmAddr\) \/ 4n/);
          const product=fs.readFileSync('js/ui/product.js','utf8');
          assert.match(product,/EXPLORER_SOURCE_LIMIT/); assert.match(product,/boundedItems/); assert.match(product,/upstream-incomplete/); assert.match(product,/classification:r\.classification/);
          assert.match(product,/validatedFunctionRange/);
          // Synthetic 293k recognition inventory: budget is above this target and cannot be an arbitrary prefix of 50k.
          const max=/maxFunctions:350000/.test(product); assert.equal(max,true);
          console.log('App/Product remaining issue guards passed');
          EOF
          node tests/issues-529-531-541-543-544-545-546.mjs
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Commit and finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js js/objc.js js/ai/ui/hex-context.js js/ui/product.js tests/issues-529-531-541-543-544-545-546.mjs
          git commit -m "fix: wire Apple runtime, recognition, capabilities and bounded Product views (#529 #531 #541 #543 #544 #545 #546)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/fix-app-product-529-531-541-543-544-545-546.py
          git commit -m "chore: finalize App Product fixes [autofix]"
          git push origin HEAD:fix/all-remaining-issues-20260815
