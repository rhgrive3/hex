name: Validate PE issues 535 536
on:
  push:
    branches:
      - fix/issues-535-536-pe-bounds-budget
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python tools/apply-pe-535-536.py
          python tools/apply-pe-535-536-compat.py
      - name: Syntax
        run: |
          node --check js/binary/pe-loader.js
          node --check js/binary/pe.js
          node --check tests/issues-535-536-pe-bounds-budget.mjs
      - name: Focused validation
        run: |
          node tests/issues-535-536-pe-bounds-budget.mjs
          node tests/issues-434-450-regressions.mjs
          npm run binary:test
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/pe-loader.js js/binary/pe.js tests/issues-535-536-pe-bounds-budget.mjs
          git commit -m "fix: bound PE metadata spans and resource use (#535 #536)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-pe-535-536.py tools/apply-pe-535-536-compat.py
          git commit -m "chore: finalize PE metadata hardening"
          git push origin HEAD:fix/issues-535-536-pe-bounds-budget