name: Validate issue 569 chained bounds
on:
  push:
    branches:
      - fix/issue-569-chained-segment-bounds
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: |
          python tools/apply-issue-569.py
          python tools/apply-issue-569-regression-compat.py
      - name: Focused validation
        run: |
          node --check js/binary/macho-dyld.js
          node --check js/binary/macho.js
          node tests/issue-569-chained-segment-bounds.mjs
          node tests/issue-572-bounded-leb.mjs
          node tests/issues-434-450-regressions.mjs
          npm run binary:test
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/macho-dyld.js js/binary/macho.js tests/issue-569-chained-segment-bounds.mjs tests/issues-434-450-regressions.mjs
          git commit -m "fix: bind chained fixups to owning segment and page (#569)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-issue-569.py tools/apply-issue-569-regression-compat.py
          git commit -m "chore: finalize issue 569"
          git push origin HEAD:fix/issue-569-chained-segment-bounds