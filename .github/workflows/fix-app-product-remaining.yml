name: Revalidate decompiler IR batch 1 on current main
on:
  push:
    branches:
      - fix/decompiler-ir-open-issues-20260815
permissions:
  contents: write
jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
      - name: Focused regressions
        run: |
          node tests/issues-decompiler-ir-open-1.mjs
          node tests/issue-556-address-provenance.mjs
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git rm -f .github/workflows/fix-app-product-remaining.yml
          git commit -m "chore: finalize current-main revalidation"
          git push origin HEAD:fix/decompiler-ir-open-issues-20260815
