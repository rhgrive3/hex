name: Validate Swift recognition integration
on:
  push:
    branches:
      - fix/swift-recognition-product-531-541
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration fix
        run: python tools/apply-issues-531-541.py
      - name: Syntax
        run: |
          node --check js/app.js
          node --check js/auto.js
          node --check js/panels.js
          node --check js/ai/ui/hex-context.js
          node --check js/ai/tools/registry.js
          node --check tests/issues-531-541-product-intelligence.mjs
      - name: Focused regressions
        run: |
          node tests/issues-531-541-product-intelligence.mjs
          npm run ai:test
          npm run decompiler:test
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/app.js js/auto.js js/panels.js js/ai/ui/hex-context.js js/ai/tools/registry.js tests/issues-531-541-product-intelligence.mjs
          git commit -m "fix: wire Swift and recognition intelligence into product paths (#531 #541)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-issues-531-541.py
          git commit -m "chore: finalize Swift recognition integration"
          git push origin HEAD:fix/swift-recognition-product-531-541
