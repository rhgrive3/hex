name: Validate issue 570 Mach-O metadata budget
on:
  push:
    branches:
      - fix/issue-570-macho-metadata-budget
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python tools/apply-issue-570.py
      - name: Syntax
        run: |
          node --check js/binary/macho-budget.js
          node --check js/binary/macho.js
          node --check js/binary/macho-dyld.js
          node --check tests/issue-570-macho-metadata-budget.mjs
      - name: Focused validation
        run: |
          node tests/issue-570-macho-metadata-budget.mjs
          node tests/issue-569-chained-segment-bounds.mjs
          node tests/issue-572-bounded-leb.mjs
          npm run binary:test
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/macho-budget.js js/binary/macho.js js/binary/macho-dyld.js tests/issue-570-macho-metadata-budget.mjs
          git commit -m "fix: share decoded-output budget across Mach-O metadata (#570)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-issue-570.py
          git commit -m "chore: finalize issue 570"
          git push origin HEAD:fix/issue-570-macho-metadata-budget