name: Validate issue 570 Mach-O metadata budget v3
on:
  push:
    branches:
      - fix/issue-570-macho-budget-v3
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adapt patch helper to current dyld layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-issue-570-v3.py')
          s = p.read_text()
          old = "a,b,part=fn_slice(s,'export function parseExportTrie', '\\nfunction normalizeSpecialDylibOrdinal')"
          new = "a,b,part=fn_slice(s,'export function parseExportTrie', '\\nfunction rawCString')"
          if old not in s:
              raise SystemExit('expected export-trie marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply fix
        run: python tools/apply-issue-570-v3.py
      - name: Update chained ownership regression for shared budget
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/issue-569-chained-segment-bounds.mjs')
          s = p.read_text()
          old = "assert.match(macho, /parseChainedBindingSites\\([^;]+segmentOrder\\)/);"
          new = "assert.match(macho, /parseChainedBindingSites\\([^;]+segmentOrder(?:,\\s*metadataBudget)?\\)/);"
          if old not in s:
              raise SystemExit('issue-569 chained-call assertion anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Syntax
        run: |
          node --check js/binary/macho-budget.js
          node --check js/binary/macho.js
          node --check js/binary/macho-dyld.js
          node --check tests/issue-569-chained-segment-bounds.mjs
          node --check tests/issue-570-macho-metadata-budget.mjs
      - name: Focused validation
        run: |
          node tests/issue-570-macho-metadata-budget.mjs
          node tests/issue-569-chained-segment-bounds.mjs
          node tests/issue-572-bounded-leb.mjs
          npm run binary:test
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/macho-budget.js js/binary/macho.js js/binary/macho-dyld.js tests/issue-569-chained-segment-bounds.mjs tests/issue-570-macho-metadata-budget.mjs
          git commit -m "fix: share decoded-output budget across Mach-O metadata (#570)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-issue-570-v3.py
          git commit -m "chore: finalize issue 570 v3"
          git push origin HEAD:fix/issue-570-macho-budget-v3