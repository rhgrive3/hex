name: Merge current validated progress
on:
  push:
    branches: [merge/current-progress-20260815]
permissions:
  contents: write
jobs:
  merge-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge last green integration state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin 511b9b88487a104162026f5338c9ea29d7c1dbe1
          git merge --no-edit -X ours 511b9b88487a104162026f5338c9ea29d7c1dbe1
          rm -f il2cpp-full-output.txt tools/fix-macho-linkage-521-527.py tools/fix-pe-535-536.py
      - name: Focused regressions
        run: |
          set -euo pipefail
          for t in \
            tests/issues-63-340-341-463-474.mjs \
            tests/issues-107-432-523.mjs \
            tests/issues-173-255-540-542.mjs \
            tests/issue-433-runtime-replay.mjs \
            tests/issues-496-519-520.mjs \
            tests/issue-500-matcher-budget.mjs \
            tests/issue-513-elf-symbol-budget.mjs \
            tests/issues-526-537-538-539.mjs \
            tests/issues-529-531-541-543-544-545-546.mjs \
            tests/symbol-identity.mjs; do
            test -f "$t" && node "$t"
          done
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize branch
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then git commit -m "chore: remove integration-only artifacts"; fi
          git rm -f .github/workflows/fix-app-product-remaining.yml .github/workflows/merge-current-progress.yml
          git commit -m "chore: finalize validated current progress"
          git push origin HEAD:merge/current-progress-20260815
