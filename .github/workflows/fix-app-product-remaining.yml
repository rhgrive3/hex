name: Validate decompiler IR open issue batch 1
on:
  push:
    branches: [fix/decompiler-ir-open-issues-20260815]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('js/decompiler/pipeline-core.js'); s=p.read_text()
          old="if (d.negate) out = expr.unary('neg', out, v.bits || 64, signedFor(state, v), origin(d, v));"
          new="if (d.extra?.negate) out = expr.unary('neg', out, v.bits || 64, signedFor(state, v), origin(d, v));"
          if old not in s and new not in s: raise SystemExit('current MNEG anchor missing')
          if old in s: s=s.replace(old,new,1)
          a=s.find('function controllingBranchForMemoryPhi')
          b=s.find('function memoryNodeExpression',a)
          if a < 0 or b < 0: raise SystemExit('controlling branch function missing')
          chunk=s[a:b].replace("if (term?.op !== 'cbr' || (block.succ || []).length < 2) continue;", "if (term?.op !== 'cbr' || block.succ.length < 2) continue;", 1)
          s=s[:a]+chunk+s[b:]
          p.write_text(s)
          p=Path('tools/fix-decompiler-ir-open-1.py')
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not (line.startswith("replace('js/decompiler/pipeline-core.js', 'if (d.negate)"))]
          p.write_text('\n'.join(lines)+'\n')
          PY
          python tools/fix-decompiler-ir-open-1.py
          python - <<'PY'
          from pathlib import Path
          p=Path('js/decompiler/pipeline-core.js'); s=p.read_text()
          a=s.find('function postDominators(ir) {')
          b=s.find('function controllingBranchForMemoryPhi', a)
          if a < 0 or b < 0: raise SystemExit('post-dominator helper not found')
          s=s[:a]+s[b:]
          s=s.replace('  const pdom = postDominators(state.ir);\n','',1)
          s=s.replace('    if (!pdom[yes]?.has(phi.block) || !pdom[no]?.has(phi.block)) continue;\n','',1)
          old_ret="""function returnValueAt(inst, state) {
            const explicit=valueOf(inst?.args?.[0]);
            if (explicit) return explicit;
            const reg=returnRegisterForState(state);
            if (reg) return reachingRegisterValue(state.ir, inst, reg);
            const candidate=reachingRegisterValue(state.ir, inst, 'x0');
            return candidate?.def && candidate.def.block === inst?.block ? candidate : null;
          }"""
          new_ret="""function returnValueAt(inst, state) {
            const explicit=valueOf(inst?.args?.[0]);
            if (explicit) return explicit;
            const reg=returnRegisterForState(state);
            return reg ? reachingRegisterValue(state.ir, inst, reg) : null;
          }"""
          if old_ret not in s and new_ret not in s: raise SystemExit('pipeline returnValueAt anchor missing')
          if old_ret in s: s=s.replace(old_ret,new_ret,1)
          p.write_text(s)
          p=Path('tests/decompiler-semantic.mjs'); s=p.read_text()
          old="addr: base, name: 'apply_damage', rowOfAddress, receiverType: 'Unit', beginner: false,"
          new="addr: base, name: 'apply_damage', rowOfAddress, returnType: 'int32', receiverType: 'Unit', beginner: false,"
          if old not in s and new not in s: raise SystemExit('apply_damage fixture anchor missing')
          if old in s: p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax
        run: |
          node --check js/decompiler/pipeline-core.js
          node --check js/decompiler/semantic.js
          node --check js/decompiler/loop-repair.js
          node --check js/decompiler/pretty/c.js
          node --check js/ir-core.js
          node --check tests/decompiler-semantic.mjs
      - name: Focused guards
        run: |
          cat > tests/issues-decompiler-ir-open-1.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { buildSemanticModel } from '../js/blocks.js';
          import { decompile } from '../js/decompile.js';
          const pipe=fs.readFileSync('js/decompiler/pipeline-core.js','utf8');
          const sem=fs.readFileSync('js/decompiler/semantic.js','utf8');
          const loop=fs.readFileSync('js/decompiler/loop-repair.js','utf8');
          const ir=fs.readFileSync('js/ir-core.js','utf8');
          const pretty=fs.readFileSync('js/decompiler/pretty/c.js','utf8');
          assert.doesNotMatch(pipe,/if \(d\.negate\)/); assert.match(pipe,/d\.extra\?\.negate/);
          const bs=pipe.slice(pipe.indexOf('function branchSucc'),pipe.indexOf('function branchCondition'));
          assert.match(bs,/succ\.length !== 2/); assert.doesNotMatch(bs,/yes:\s*succ\[0\]/); assert.match(bs,/yes:\s*null, no:\s*null/);
          const phi=pipe.slice(pipe.indexOf('function controllingBranchForMemoryPhi'),pipe.indexOf('function memoryNodeExpression'));
          assert.match(phi,/yr\.filter\(Boolean\)\.length !== 1/); assert.match(phi,/nr\.filter\(Boolean\)\.length !== 1/); assert.match(phi,/yr\[noIndex\] \|\| nr\[yesIndex\]/); assert.match(phi,/candidates\.length === 1/); assert.doesNotMatch(phi,/candidates\.sort\(\(a, b\) => b\.row - a\.row\)/);
          assert.match(ir,/addressDispOp/); assert.match(ir,/writebackDispOp/); assert.match(ir,/mem\?\.mode === 'post' \? 0n/); assert.match(ir,/value: writebackDisp/);
          assert.doesNotMatch(ir,/if \(irCache\.has\(model\)\)/); assert.match(ir,/function irConfigurationKey/); assert.match(ir,/prototypeRevision/); assert.match(ir,/evidenceGeneration/);
          const ret=sem.slice(sem.indexOf('function returnValueAt'),sem.indexOf('function feedsReturn'));
          assert.doesNotMatch(ret,/candidate=reachingRegisterValue/); assert.match(ret,/return reg \? reachingRegisterValue/);
          const pret=pipe.slice(pipe.indexOf('function returnValueAt(inst, state)'),pipe.indexOf('function semanticFacts'));
          assert.doesNotMatch(pret,/candidate=reachingRegisterValue/); assert.match(pret,/return reg \? reachingRegisterValue/);
          const faithful=sem.slice(sem.indexOf('function faithfulCfg'));
          assert.match(faithful,/const rv = returnValueAt\(term, ctx\)/);
          assert.match(pretty,/export function integerText/); assert.match(sem,/import \{ integerText \}/); assert.match(sem,/return integerText\(v, bits, signed\)/);
          assert.match(sem,/d\.extra\?\.widen/); assert.match(sem,/__arm64_ubfiz/); assert.match(sem,/bitfieldKind === 'bfxil'/);
          assert.match(sem,/cmp\.sub !== 'sub'/);
          assert.match(loop,/renderNZCVCondition/); assert.match(loop,/renderNZCVCondition\(cmp\.sub \|\| 'sub'/);
          function make(lines) {
            const base=0x100000000n;
            const raw=lines.map((text,row)=>{const p=text.indexOf(' ');return {row,address:base+BigInt(row*4),mn:p<0?text:text.slice(0,p),ops:p<0?'':text.slice(p+1)}});
            const rowOfAddress=(addr)=>Number((BigInt(addr)-base)/4n);
            return {model:buildSemanticModel(raw,{startRow:0,endRow:raw.length-1,rowOfAddress}),rowOfAddress,base};
          }
          {
            const {model,rowOfAddress,base}=make(['mov x0, #7','ret']);
            const unknown=decompile(model,{addr:base,name:'unknown_ret',rowOfAddress,beginner:false});
            assert.doesNotMatch(unknown.pseudocode,/return\s+(?:7|0x7)\s*;/i,unknown.pseudocode);
            const trusted=decompile(model,{addr:base,name:'known_ret',rowOfAddress,returnType:'int64',beginner:false});
            assert.match(trusted.pseudocode,/return\s+(?:7|0x7)\s*;/i,trusted.pseudocode);
          }
          assert.match(fs.readFileSync('tests/decompiler-semantic.mjs','utf8'),/name: 'apply_damage'.*returnType: 'int32'/s);
          console.log('decompiler/IR open issue batch 1 guards passed');
          EOF
          node tests/issues-decompiler-ir-open-1.mjs
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/decompiler/pipeline-core.js js/decompiler/semantic.js js/decompiler/loop-repair.js js/decompiler/pretty/c.js js/ir-core.js tests/decompiler-semantic.mjs tests/issues-decompiler-ir-open-1.mjs
          git commit -m "fix: decompiler and IR correctness batch 1 (#130 #139 #140 #317 #347 #353 #401 #417 #418 #573 #575)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/fix-decompiler-ir-open-1.py
          git commit -m "chore: finalize decompiler IR batch 1"
          git push origin HEAD:fix/decompiler-ir-open-issues-20260815
