name: Validate issues 549 561 562
on:
  push:
    branches:
      - fix/issues-549-561-562-current
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python tools/apply-issues-549-561-562.py
      - name: Syntax
        run: |
          node --check js/symbols.js
          node --check js/platform/worker.js
          node --check js/worker-legacy.js
          node --check js/chained.js
          node --check js/program.js
          node --check js/app.js
          node --check tests/issues-549-561-562.mjs
      - name: Focused regressions
        run: |
          node tests/issues-549-561-562.mjs
          node tests/symbol-identity.mjs
          node tests/issue-456-report-completeness.mjs
          node tests/issues-550-559.mjs
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/symbols.js js/platform/worker.js js/worker-legacy.js js/chained.js js/program.js js/app.js tests/issues-549-561-562.mjs
          git commit -m "fix: preserve symbol identity and analysis completeness (#549 #561 #562)"
          git rm -f .github/workflows/fix-app-product-remaining.yml tools/apply-issues-549-561-562.py
          git commit -m "chore: finalize issues 549 561 562"
          git push origin HEAD:fix/issues-549-561-562-current
