name: Revalidate ELF issues 566 567 568
on:
  push:
    branches:
      - fix/issues-566-567-568-elf-main
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Port validated ELF production diff
        run: |
          set -euo pipefail
          git diff 05d4d5567692e4e9548326e4d231d3e56ac77469 958e98bcd1c97a782764d22f92888007da3b033c -- \
            js/binary/elf.js js/binary/elf-mapping.js js/binary/elf-budget.js js/binary/elf-dynamic.js js/binary/elf-extended.js js/binary/elf-unwind.js tests/issues-566-567-568-elf-trust.mjs | git apply -3
      - name: Focused validation
        run: |
          node --check js/binary/elf.js
          node --check js/binary/elf-mapping.js
          node --check js/binary/elf-budget.js
          node --check js/binary/elf-dynamic.js
          node --check js/binary/elf-extended.js
          node --check js/binary/elf-unwind.js
          node tests/issues-566-567-568-elf-trust.mjs
          node tests/universal-binary-sectionless.mjs
          node tests/issue-572-bounded-leb.mjs
          npm run binary:test
      - name: Full validation
        run: |
          node tests/run.js
          npm run check
      - name: Finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/binary/elf.js js/binary/elf-mapping.js js/binary/elf-budget.js js/binary/elf-dynamic.js js/binary/elf-extended.js js/binary/elf-unwind.js tests/issues-566-567-568-elf-trust.mjs
          git commit -m "fix: harden ELF address domains, metadata budgets, and mapped spans (#566 #567 #568)"
          git rm -f .github/workflows/fix-app-product-remaining.yml
          git commit -m "chore: finalize ELF fixes on latest main"
          git push origin HEAD:fix/issues-566-567-568-elf-main