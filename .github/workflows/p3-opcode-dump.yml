name: P3 exact unary opcode dump
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-opcode-dump.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-real-fixtures.mjs TsumTsum
      - name: Inject MachineEffects opcode dump
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/index.js'); s=p.read_text()
          old="        if (bundle.architectureId !== architectureId) fail('semantic-v2-integration-architecture-id-mismatch');\n      }"
          new="        if (bundle.architectureId !== architectureId) fail('semantic-v2-integration-architecture-id-mismatch');\n        if (/^(rbit|clz)\\b/i.test(String(decoded.text ?? decoded.mnemonic ?? ''))) process.stderr.write(`[P3OP ${decoded.text ?? decoded.mnemonic}] ${JSON.stringify(bundle.operations.map((op) => ({kind:op.kind, opcode:op.opcode, metadata:op.metadata}))) }\\n`);\n      }"
          assert old in s; p.write_text(s.replace(old,new,1))
          PY
      - name: Decompile exact function
        run: |
          cat > tests/.p3-op-dump.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat');
          const w=await openBinary('tests/.real-fixtures/TsumTsum');
          const a=0x1011af0d4n,end=0x1011af380n;
          const m=await w.analyze(a,end);
          decompile(m,{addr:a,rowOfAddress:x=>x==null?null:Number((x-w.region.vmAddr)/4n),addrOfRow:r=>w.region.vmAddr+BigInt(r)*4n,symbolFor:x=>w.symbols.nameAt(x)});
          EOF
          node --max-old-space-size=6000 tests/.p3-op-dump.mjs
