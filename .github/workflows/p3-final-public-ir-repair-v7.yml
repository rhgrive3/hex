name: Phase 3 final public IR repair v7

on:
  push:
    branches:
      - hex/p3-semantic-ir-integration
    paths:
      - '.github/workflows/p3-final-public-ir-repair-v7.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final projection and address-lineage value-chain repair
        shell: python
        run: |
          from pathlib import Path

          p = Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s = p.read_text()
          helper = r'''
          function valueFeedsAddressOrCall(projected, root) {
            const queue = [root];
            const seen = new Set();
            while (queue.length) {
              const value = queue.shift();
              if (!value || seen.has(value.id)) continue;
              seen.add(value.id);
              for (const inst of projected.instructions) {
                if (inst.addr?.base === value || inst.addr?.index === value || inst.loc?.base === value) return true;
                const consumes = (inst.args || []).some((arg) => arg?.value === value);
                if (!consumes) continue;
                if (inst.op === V1_OP.CALL) return true;
                if (inst.op === V1_OP.MOV && inst.dst) queue.push(inst.dst);
              }
            }
            return false;
          }

          '''
          helper_anchor = 'function compactProjectedState(projected) {'
          if 'function valueFeedsAddressOrCall(projected, root)' not in s:
              if helper_anchor not in s: raise SystemExit('state compaction helper anchor missing')
              s = s.replace(helper_anchor, helper + helper_anchor)
          source_anchor = "    const source = resolveAlias(inst.args[0]?.value, aliases);\n    if (!source) continue;"
          source_replacement = "    const rawSource = inst.args[0]?.value;\n    const source = resolveAlias(rawSource, aliases);\n    if (!source) continue;\n    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);"
          if source_replacement not in s:
              if source_anchor not in s: raise SystemExit('state source alias anchor missing')
              s = s.replace(source_anchor, source_replacement, 1)
          old_write = (
              "    if (inst.extra?.stateWrite && samePublicState(inst, source, inst.dst)) {\n"
              "      const shadow = inst.dst;\n"
              "      aliases.set(shadow.id, source);\n"
              "      if (source.stateKey == null && shadow.stateKey != null) source.stateKey = shadow.stateKey;\n"
              "      shadow.reg = null;\n"
              "      shadow.stateKey = null;\n"
              "      shadow.version = 0;\n"
              "      shadow.compatDerived = 'state-ssa-shadow';\n"
              "      inst.extra.compatPublicStateSourceValueId = source.id;\n"
              "      inst.extra.compatStateShadowValueId = shadow.id;\n"
              "    } else if (inst.extra?.stateRead && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          )
          new_write = (
              "    if (inst.extra?.stateWrite && samePublicState(inst, source, inst.dst)) {\n"
              "      const shadow = inst.dst;\n"
              "      if (valueFeedsAddressOrCall(projected, shadow)) {\n"
              "        aliases.set(shadow.id, source);\n"
              "        if (source.stateKey == null && shadow.stateKey != null) source.stateKey = shadow.stateKey;\n"
              "        shadow.compatPublicIdentity = shadow.reg;\n"
              "        shadow.reg = null;\n"
              "        shadow.stateKey = null;\n"
              "        shadow.version = 0;\n"
              "        shadow.compatDerived = 'state-ssa-address-shadow';\n"
              "        inst.extra.compatPublicStateSourceValueId = source.id;\n"
              "        inst.extra.compatStateShadowValueId = shadow.id;\n"
              "      } else if (source.kind !== V1_VK.ARG && source.def && source !== shadow) {\n"
              "        source.compatPublicIdentity = source.reg;\n"
              "        source.reg = null;\n"
              "        source.stateKey = null;\n"
              "        source.version = 0;\n"
              "        source.compatDerived = 'state-write-source-shadow';\n"
              "        inst.extra.compatPublicStateSourceValueId = source.id;\n"
              "        inst.extra.compatStateDestinationValueId = shadow.id;\n"
              "      }\n"
              "    } else if (inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias) && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          )
          if old_write in s:
              s = s.replace(old_write, new_write)
          elif new_write not in s:
              raise SystemExit('state-write compaction anchor missing')
          fn = r'''
          function normalizePublicStateDefinitionOrder(projected) {
            const slots = [];
            const definitions = [];
            for (let index = 0; index < projected.values.length; index++) {
              const value = projected.values[index];
              if (!value?.reg || value.kind !== V1_VK.DEF || !value.def) continue;
              slots.push(index);
              definitions.push(value);
            }
            definitions.sort((left, right) => {
              const a = left.def;
              const b = right.def;
              if ((a.block ?? 0) !== (b.block ?? 0)) return (a.block ?? 0) - (b.block ?? 0);
              if ((a.row ?? 0) !== (b.row ?? 0)) return (a.row ?? 0) - (b.row ?? 0);
              if ((a.id ?? 0) !== (b.id ?? 0)) return (a.id ?? 0) - (b.id ?? 0);
              return (left.id ?? 0) - (right.id ?? 0);
            });
            for (let index = 0; index < slots.length; index++) projected.values[slots[index]] = definitions[index];
          }

          '''
          anchor = 'function renumberPublicStateVersions(projected) {'
          if 'function normalizePublicStateDefinitionOrder(projected)' not in s:
              if anchor not in s: raise SystemExit('public state version anchor missing')
              s = s.replace(anchor, fn + anchor)
          old = '  suppressUnusedIncomingState(projected);\n  renumberPublicStateVersions(projected);'
          new = '  suppressUnusedIncomingState(projected);\n  normalizePublicStateDefinitionOrder(projected);\n  renumberPublicStateVersions(projected);'
          if new not in s:
              if old not in s: raise SystemExit('public state finalization anchor missing')
              s = s.replace(old, new)
          p.write_text(s)

          p = Path('js/semantics/compat/semantic-ir-v2-to-v1.js')
          s = p.read_text()
          imp = "import { finalizeLegacyProjection } from './semantic-ir-v2-to-v1-finalize.js';\n"
          if imp not in s:
              anchor = "import { projectNode } from './semantic-ir-v2-to-v1-nodes.js';\n"
              if anchor not in s: raise SystemExit('projection import anchor missing')
              s = s.replace(anchor, anchor + imp)
          old = "  attachAbiProjectedArguments(projected);\n  populateLegacyArguments(projected);"
          new = "  attachAbiProjectedArguments(projected);\n  finalizeLegacyProjection(projected);\n  populateLegacyArguments(projected);"
          if new not in s:
              if old not in s: raise SystemExit('projection finalization anchor missing')
              s = s.replace(old, new)
          s = s.replace("version: '1.1.1'", "version: '1.1.2'")
          s = s.replace("contractVersion: '1.1.1'", "contractVersion: '1.1.2'")
          p.write_text(s)

          p = Path('js/ir-core.js')
          s = p.read_text()
          old = "  if (definition.block === inst.block) return Number(definition.row) <= Number(inst.row);"
          new = (
              "  if (definition.block === inst.block) {\n"
              "    const definitionRow = Number(definition.row);\n"
              "    const instructionRow = Number(inst.row);\n"
              "    if (definitionRow !== instructionRow) return definitionRow < instructionRow;\n"
              "    const block = projected.blocks?.[inst.block];\n"
              "    const instructions = block?.insts ?? projected.instructions ?? [];\n"
              "    const definitionIndex = instructions.indexOf(definition);\n"
              "    const instructionIndex = instructions.indexOf(inst);\n"
              "    return definitionIndex >= 0 && instructionIndex >= 0 && definitionIndex < instructionIndex;\n"
              "  }"
          )
          if new not in s:
              if old not in s: raise SystemExit('legacy dominance same-row anchor missing')
              s = s.replace(old, new, 1)
          old = (
              "  if (definition.block === inst.block) {\n"
              "    return { scope:2, depth:Number.MAX_SAFE_INTEGER, row:Number(definition.row ?? Number.NEGATIVE_INFINITY) };\n"
              "  }"
          )
          new = (
              "  if (definition.block === inst.block) {\n"
              "    const block = projected.blocks?.[inst.block];\n"
              "    const instructions = block?.insts ?? projected.instructions ?? [];\n"
              "    const order = instructions.indexOf(definition);\n"
              "    return { scope:2, depth:Number.MAX_SAFE_INTEGER, row:Number(definition.row ?? Number.NEGATIVE_INFINITY), order };\n"
              "  }"
          )
          if new not in s:
              if old not in s: raise SystemExit('legacy recency same-row anchor missing')
              s = s.replace(old, new, 1)
          old = "      if (leftRecency.row !== rightRecency.row) return rightRecency.row - leftRecency.row;\n      const leftWidth = Number(bits) > 0 && left.bits === Number(bits) ? 1 : 0;"
          new = "      if (leftRecency.row !== rightRecency.row) return rightRecency.row - leftRecency.row;\n      if ((leftRecency.order ?? -1) !== (rightRecency.order ?? -1)) return (rightRecency.order ?? -1) - (leftRecency.order ?? -1);\n      const leftWidth = Number(bits) > 0 && left.bits === Number(bits) ? 1 : 0;"
          if new not in s:
              if old not in s: raise SystemExit('legacy recency ordering anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('js/slice.js')
          s = p.read_text()
          old = (
              "  const addressOnly = new Set();\n"
              "  for (const inst of slice.instructions) {\n"
              "    if (!inst.addr) continue;\n"
              "    if (inst.addr.base) addressOnly.add(inst.addr.base.id);\n"
              "    if (inst.addr.index) addressOnly.add(inst.addr.index.id);\n"
              "  }\n"
              "  for (const inst of slice.instructions) for (const a of inst.args || []) if (a && a.value) addressOnly.delete(a.value.id);"
          )
          new = (
              "  const addressOnly = new Set();\n"
              "  const addressQueue = [];\n"
              "  const rememberAddressValue = (value) => {\n"
              "    if (!value || addressOnly.has(value.id)) return;\n"
              "    addressOnly.add(value.id);\n"
              "    addressQueue.push(value);\n"
              "  };\n"
              "  for (const inst of slice.instructions) {\n"
              "    if (inst.addr && inst.addr.base) rememberAddressValue(inst.addr.base);\n"
              "    if (inst.addr && inst.addr.index) rememberAddressValue(inst.addr.index);\n"
              "  }\n"
              "  while (addressQueue.length) {\n"
              "    const value = addressQueue.pop();\n"
              "    const def = value && value.def;\n"
              "    if (!def) continue;\n"
              "    for (const a of def.args || []) if (a && a.value) rememberAddressValue(a.value);\n"
              "  }\n"
              "  for (const inst of slice.instructions) {\n"
              "    if (inst.dst && addressOnly.has(inst.dst.id)) continue;\n"
              "    for (const a of inst.args || []) if (a && a.value) addressOnly.delete(a.value.id);\n"
              "  }"
          )
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit('valueChain address-lineage anchor missing')
          p.write_text(s)
      - name: Focused legacy public IR regression
        run: node tests/ir.mjs
      - name: Phase 3 semantic exit proof
        run: npm run semantic-v2:test
      - name: Core semantic and compiler regressions
        run: |
          npm run effects:test
          npm run core:test
          npm run invariants:test
          npm run migration:test
          npm run semantic:test
          npm run decompiler:test
          npm run compiler-truth
      - name: Rebuild exact userscript artifact
        run: npm run userscript:build
      - name: Commit validated repair and remove all Phase 3 temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            .github/workflows/p3-final-public-ir-repair-v7.yml \
            .github/workflows/p3-final-public-ir-repair-v6.yml \
            .github/workflows/p3-final-public-ir-repair-v5.yml \
            .github/workflows/p3-final-public-ir-repair-v4.yml \
            .github/workflows/p3-final-public-ir-repair-v3.yml \
            .github/workflows/p3-final-public-ir-repair-v2.yml \
            .github/workflows/p3-final-public-ir-repair.yml \
            .github/workflows/p3-debug-cutover-ir.yml \
            .github/workflows/p3-final-validation.yml; do
            git rm -f "$f" 2>/dev/null || true
          done
          git add js/semantics/compat/semantic-ir-v2-to-v1-finalize.js js/semantics/compat/semantic-ir-v2-to-v1.js js/ir-core.js js/slice.js userscript/hex.user.template.js
          git diff --cached --check
          git commit -m "Phase 3: complete legacy public projection after v2 cutover"
          git push origin HEAD:hex/p3-semantic-ir-integration
