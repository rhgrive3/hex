name: UI debug temp

on:
  push:
    branches: [chatgpt-userscript-host]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install-deps webkit
          npx --no-install playwright install chromium webkit
      - name: Capture viewport matrix
        id: matrix
        continue-on-error: true
        env:
          CI: '1'
          UI_SHOTS: tests/ui-shots
        run: npm run ui:browser > ui-browser.log 2>&1
      - run: cat ui-browser.log
      - uses: actions/upload-artifact@v4
        with:
          name: ui-debug-log
          path: ui-browser.log
      - name: Propagate failure
        if: steps.matrix.outcome == 'failure'
        run: exit 1
