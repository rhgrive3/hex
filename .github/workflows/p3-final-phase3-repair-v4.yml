name: Phase 3 final scoped repair v4

on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-final-phase3-repair-v4.yml']

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply scoped finalizer and provenance-aware return summary repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s = p.read_text()
          decl = "    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);\n"
          old = "    } else if (inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias) && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          new = "    } else if (inst.extra?.stateRead && inst.extra?.localPhysicalViewProjection === true && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          if s.count(decl) != 1 or s.count(old) != 1:
              raise SystemExit('required finalizer narrowing source shape not found exactly once')
          p.write_text(s.replace(decl, '', 1).replace(old, new, 1))

          p = Path('js/interproc.js')
          s = p.read_text()
          marker = "function simpleReturnExpression(value) {\n"
          helper = '''function returnArgumentIndex(value) {\n  const source = transparentMoveSource(value);\n  if (!source) return null;\n  const origin = originOf(source);\n  const reg = source.kind === VK.ARG ? source.reg : origin?.kind === 'argument' ? origin.reg : null;\n  return /^x[0-7]$/.test(String(reg || '')) ? Number(String(reg).slice(1)) : null;\n}\n\n'''
          if s.count(marker) != 1 or 'function returnArgumentIndex(value)' in s:
              raise SystemExit('unexpected interproc helper source shape')
          s = s.replace(marker, helper + marker, 1)
          old_block = '''  const a = transparentMoveSource(aArg && aArg.value);\n  const b = transparentMoveSource(bArg && bArg.value);\n  if (!a || !b) return null;\n  const bits = Number(v.bits || v.def.extra?.dstBits || aArg?.bits || 64);\n  const signed = v.signed ?? null;\n  if (a.kind === VK.ARG && /^x[0-7]$/.test(String(a.reg || '')) && b.const != null) {\n    return { kind: 'argument-arithmetic', argument: Number(a.reg.slice(1)), op: v.def.sub, constant: b.const, bits, signed };\n  }\n  if (v.def.sub === 'add' && b.kind === VK.ARG && /^x[0-7]$/.test(String(b.reg || '')) && a.const != null) {\n    return { kind: 'argument-arithmetic', argument: Number(b.reg.slice(1)), op: 'add', constant: a.const, bits, signed };\n  }'''
          new_block = '''  const a = transparentMoveSource(aArg && aArg.value);\n  const b = transparentMoveSource(bArg && bArg.value);\n  if (!a || !b) return null;\n  const aArgument = returnArgumentIndex(a);\n  const bArgument = returnArgumentIndex(b);\n  const bits = Number(v.bits || v.def.extra?.dstBits || aArg?.bits || 64);\n  const signed = v.signed ?? null;\n  if (aArgument != null && b.const != null) {\n    return { kind: 'argument-arithmetic', argument: aArgument, op: v.def.sub, constant: b.const, bits, signed };\n  }\n  if (v.def.sub === 'add' && bArgument != null && a.const != null) {\n    return { kind: 'argument-arithmetic', argument: bArgument, op: 'add', constant: a.const, bits, signed };\n  }'''
          if s.count(old_block) != 1:
              raise SystemExit('simpleReturnExpression block source shape changed')
          p.write_text(s.replace(old_block, new_block, 1))
          PY

      - name: Synchronize canonical userscript before release gates
        run: npm run userscript:build

      - name: Focused public regressions
        shell: bash
        run: |
          set -o pipefail
          node tests/ir.mjs | tee /tmp/p3-ir.log
          node tests/issues-434-450-regressions.mjs | tee /tmp/p3-regression.log

      - name: Semantic IR v2 full gate
        shell: bash
        run: |
          set -o pipefail
          npm run semantic-v2:test | tee /tmp/p3-semantic-v2.log

      - name: Full Phase 3 repository gates
        run: |
          npm run effects:test
          npm run core:test
          npm run invariants:test
          npm run migration:test
          npm run semantic:test
          npm run decompiler:test
          npm run compiler-truth
          npm run platform:test
          npm run runtime:test
          npm run ui:test
          npm run benchmark:baseline
          npm run ai:test
          npm run userscript:test
          npm run check

      - name: Canonical userscript rebuild and deterministic retest
        run: |
          cp userscript/hex.user.template.js /tmp/hex.user.before.js
          npm run userscript:build
          cmp /tmp/hex.user.before.js userscript/hex.user.template.js
          npm run userscript:test

      - name: Assert temporary Phase 3 workflow cleanup target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          allowed = {Path('.github/workflows/p3-final-phase3-repair-v4.yml')}
          temporary = {p for p in Path('.github/workflows').glob('p3-*.yml') if any(k in p.name for k in ('final','debug','repair','validation'))}
          extra = temporary - allowed
          if extra:
              raise SystemExit('unexpected temporary Phase 3 workflows: ' + ', '.join(map(str, sorted(extra))))
          PY

      - name: Commit validated product repair and generated userscript
        shell: bash
        run: |
          BUILD_ID="$(grep -oE 'buildId["'"']?[:=][[:space:]]*["'"'][0-9a-f]+' userscript/hex.user.template.js | head -n1 | grep -oE '[0-9a-f]{12,}' || true)"
          IR_SUMMARY="$(tail -n 4 /tmp/p3-ir.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          SEM_SUMMARY="$(tail -n 12 /tmp/p3-semantic-v2.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p3-final-phase3-repair-v4.yml
          git add js/semantics/compat/semantic-ir-v2-to-v1-finalize.js js/interproc.js userscript/hex.user.template.js
          git diff --cached --check
          git commit -m "Phase 3: finalize public v1 projection after semantic-v2 cutover" -m "Keep canonical state-read results public while collapsing only local physical-view bridges. Preserve source-language argument lineage for width-specific projected values via retained origin metadata, without erasing truncation semantics.\nIR: ${IR_SUMMARY}\nSemantic-v2: ${SEM_SUMMARY}\nCanonical userscript buildId: ${BUILD_ID:-unparsed}"
          git push origin HEAD:hex/p3-semantic-ir-integration

      - name: Remove temporary workflow after failed validation
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .github/workflows/p3-final-phase3-repair-v4.yml ]; then
            git rm .github/workflows/p3-final-phase3-repair-v4.yml
            git commit -m 'Phase 3: remove failed temporary final repair gate v4'
            git push origin HEAD:hex/p3-semantic-ir-integration
          fi
