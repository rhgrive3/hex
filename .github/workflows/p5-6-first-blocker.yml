name: P5-6 first blocker diagnostic

on:
  pull_request:
  push:
    branches:
      - hex/p5-6-x86-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-blocker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run compiler corpus and emit only blocker summary
        shell: bash
        run: |
          set +e
          node --test --test-concurrency=1 tests/phase5/verification/compiler-corpus-pipeline.test.mjs > /tmp/p5.log 2>&1
          status=$?
          echo '=== P5-6 concise diagnostic ==='
          grep -E 'P5-6 first blocker:|"totals":|not ok|AssertionError|tests [0-9]+|pass [0-9]+|fail [0-9]+' /tmp/p5.log | tail -20 || true
          exit "$status"
