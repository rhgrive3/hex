name: Diagnose PR987 ABI reconciliation

on:
  pull_request:
    branches:
      - integrate/all-open-prs-20260819

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-abi-526-954-955-958-959
          fetch-depth: 0
      - name: Attempt source-branch merge without committing
        shell: bash
        run: |
          # This workflow is diagnostic-only and is removed by the reconciler.
          git fetch origin fix/unlinked-abi-526-954-955-958-959
          set +e
          git merge --no-commit --no-ff origin/fix/unlinked-abi-526-954-955-958-959
          rc=$?
          echo '=== UNMERGED ==='
          git diff --name-only --diff-filter=U || true
          echo '=== STATUS ==='
          git status --short
          git merge --abort >/dev/null 2>&1 || true
          exit "$rc"