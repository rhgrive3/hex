name: Temporary long submission hydration repair

on:
  push:
    branches:
      - fix/chatgpt-long-submission-hydration
    paths:
      - .github/workflows/temp-long-submission-hydration.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-long-submission-hydration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused repair and regression
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('js/userscript/chatgpt-adapter.js')
          text = path.read_text()

          old = "const CONVERSATION_PATH = /^\\/c\\/([^/?#]+)/;"
          new = "const CONVERSATION_PATH = /^\\/c\\/([^/?#]+)/;\nconst LONG_SUBMISSION_PROMPT_THRESHOLD = 400;"
          assert old in text
          text = text.replace(old, new, 1)

          old = """    submissionMismatchGraceMs = 1500,\n    structuredCompletionQuietMs = 1000,"""
          new = """    submissionMismatchGraceMs = 1500,\n    submissionMismatchLongPromptGraceMs = 6000,\n    structuredCompletionQuietMs = 1000,"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    this.submissionMismatchGraceMs = submissionMismatchGraceMs;\n    this.structuredCompletionQuietMs = structuredCompletionQuietMs;"""
          new = """    this.submissionMismatchGraceMs = submissionMismatchGraceMs;\n    this.submissionMismatchLongPromptGraceMs = submissionMismatchLongPromptGraceMs;\n    this.structuredCompletionQuietMs = structuredCompletionQuietMs;"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    const started = Date.now();\n    const normalizedPrompt = normalizeText(prompt);"""
          new = """    const started = Date.now();\n    const normalizedPrompt = normalizeText(prompt);\n    // Long Dev/Supervisor envelopes use ChatGPT's collapsible user renderer.\n    // On iPad/WebKit its turn wrapper can exist several seconds before the full\n    // semantic message has hydrated. Keep the short-prompt interference guard\n    // strict, but give long owned submissions enough time to finish hydrating.\n    const submissionMismatchGraceMs = normalizedPrompt.length >= LONG_SUBMISSION_PROMPT_THRESHOLD\n      ? Math.max(this.submissionMismatchGraceMs, this.submissionMismatchLongPromptGraceMs)\n      : this.submissionMismatchGraceMs;"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """    let requestUserTurn = null;\n    let mismatchSince = null;"""
          new = """    let requestUserTurn = null;\n    let mismatchSince = null;\n    let mismatchPrefixLength = 0;"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """        if (explicit.length === 1) {\n          const candidate = explicit[0];\n          if (normalizeText(candidate.text) === normalizedPrompt) {\n            requestUserTurn = candidate;\n            mismatchSince = null;\n            return true;\n          }\n          if (mismatchSince === null) mismatchSince = Date.now();\n          if (Date.now() - mismatchSince >= this.submissionMismatchGraceMs) {\n            throw bridgeError('turn-controller', 'manual-interference', 'The submitted ChatGPT turn does not match the Hex request.');\n          }\n          return false;\n        }\n        mismatchSince = null;"""
          new = """        if (explicit.length === 1) {\n          const candidate = explicit[0];\n          const candidateText = normalizeText(candidate.text);\n          if (candidateText === normalizedPrompt) {\n            requestUserTurn = candidate;\n            mismatchSince = null;\n            mismatchPrefixLength = 0;\n            return true;\n          }\n          if (mismatchSince === null) mismatchSince = Date.now();\n          // A freshly submitted long turn can hydrate progressively. Only extend\n          // the grace window when the observed text is a strictly longer prefix\n          // of the exact Hex prompt; arbitrary human text or identity churn never\n          // earns more time and still trips the manual-interference guard.\n          if (candidateText && normalizedPrompt.startsWith(candidateText) && candidateText.length > mismatchPrefixLength) {\n            mismatchPrefixLength = candidateText.length;\n            mismatchSince = Date.now();\n          }\n          if (Date.now() - mismatchSince >= submissionMismatchGraceMs) {\n            throw bridgeError('turn-controller', 'manual-interference', 'The submitted ChatGPT turn does not match the Hex request.');\n          }\n          return false;\n        }\n        mismatchSince = null;\n        mismatchPrefixLength = 0;"""
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/chatgpt-web-production-dom.mjs')
          text = test.read_text()
          old = """    await scenario(context, name, 'a submitted user turn may hydrate after its wrapper appears', {\n      prompt: LONG_PROMPT, chatgpt: { userHydrationDelayMs: 120 },\n    }, (result) => {\n      assert.equal(result.ok, true, `${name}: a partial first user DOM frame must not become manual-interference (${result.error?.code})`);\n      assert.equal(result.value.text, ANSWER);\n    });"""
          new = old + """\n\n    await scenario(context, name, 'a long submitted user turn may hydrate beyond the short mismatch window', {\n      prompt: LONG_PROMPT, chatgpt: { userHydrationDelayMs: 2200 },\n    }, (result) => {\n      assert.equal(result.ok, true, `${name}: long collapsible user hydration must not become manual-interference (${result.error?.code})`);\n      assert.equal(result.value.text, ANSWER);\n    });"""
          assert old in text
          text = text.replace(old, new, 1)
          test.write_text(text)
          PY
      - name: Run focused and userscript tests
        run: |
          node tests/chatgpt-web-runtime.mjs
          npm run userscript:test
      - name: Build canonical userscript release
        run: npm run userscript:build
      - name: Commit repair and generated release
        shell: bash
        run: |
          rm .github/workflows/temp-long-submission-hydration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/userscript/chatgpt-adapter.js tests/chatgpt-web-production-dom.mjs userscript/hex.user.template.js userscript/release-version.json .github/workflows/temp-long-submission-hydration.yml
          git diff --cached --check
          git commit -m "Fix long ChatGPT submission hydration matching"
          git push origin HEAD:fix/chatgpt-long-submission-hydration
