name: repair-pr946-contract
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'fix/issues-915-921-current-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve established SysV plugin contract version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/targets/abi/sysv-amd64.js')
          s = p.read_text()
          old = "id:'sysv-amd64',\n  semanticVersion:'3',"
          new = "id:'sysv-amd64',\n  semanticVersion:'2',"
          if s.count(old) != 1:
              raise SystemExit(f'expected one SysV semanticVersion 3 anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - run: npm run userscript:build
      - run: node tests/phase5/run.mjs --group abi
      - run: node tests/phase5/run.mjs --group regressions
      - run: npm run check
      - run: git diff --check
      - name: Publish repaired clean head
        shell: bash
        run: |
          rm .github/workflows/diag-pr946-contracts.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve SysV ABI semantic contract version"
          git push origin HEAD:${{ github.head_ref }}
