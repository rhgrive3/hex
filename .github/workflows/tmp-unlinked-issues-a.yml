name: Temporary unlinked issue batch A repair

on:
  push:
    branches:
      - fix/unlinked-issues-a-20260819

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded source repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # #786 + #788: width/signed-aware conditions and conservative may-alias memory invalidation.
          replace_once('js/symbolic/executor.js',
              "import { OP, MK, COND } from '../ir.js';",
              "import { OP, MK, COND, mayAliasProvenance } from '../ir.js';")

          replace_once('js/symbolic/executor.js', '''function cmp(name, a, b) {
            if (a?.kind === SYM.CONST && b?.kind === SYM.CONST) {
              const av=a.value, bv=b.value;
              const yes = name === '==' ? av === bv : name === '!=' ? av !== bv : name === '<' ? av < bv : name === '<=' ? av <= bv : name === '>' ? av > bv : name === '>=' ? av >= bv : null;
              if (yes != null) return { ...c(yes ? 1n : 0n), boolean:true };
            }
            return { kind: SYM.OP, op: name, args: [a, b], boolean: true };
          }''', '''function cmp(name, a, b, options = {}) {
            const bits = Math.max(1, Math.min(64, Number(options.bits) || 64));
            const signed = options.signed === true ? true : options.signed === false ? false : null;
            if (a?.kind === SYM.CONST && b?.kind === SYM.CONST) {
              const au = BigInt.asUintN(bits, a.value), bu = BigInt.asUintN(bits, b.value);
              const av = signed === true ? BigInt.asIntN(bits, au) : au;
              const bv = signed === true ? BigInt.asIntN(bits, bu) : bu;
              const yes = name === '==' ? au === bu : name === '!=' ? au !== bu : name === '<' ? av < bv : name === '<=' ? av <= bv : name === '>' ? av > bv : name === '>=' ? av >= bv : null;
              if (yes != null) return { ...c(yes ? 1n : 0n), boolean:true, bits, signed };
            }
            return { kind: SYM.OP, op: name, args: [a, b], boolean: true, bits, signed };
          }
          function conditionIdentity(condition) {
            if (condition?.kind === SYM.OP && condition.boolean && ['==', '!=', '<', '<=', '>', '>='].includes(condition.op)) {
              const mode = condition.signed === true ? 's' : condition.signed === false ? 'u' : 'n';
              return `${mode}${condition.bits || 64}:${expressionText(condition)}`;
            }
            return expressionText(condition);
          }''')

          replace_once('js/symbolic/executor.js', '''  const key = expressionText(condition);
            for (const prior of existing || []) {
              if (prior?.kind === SYM.CONST && prior.boolean && prior.value === 0n) return false;
              if (expressionText(negate(prior)) === key) return false;
            }''', '''  const key = conditionIdentity(condition);
            for (const prior of existing || []) {
              if (prior?.kind === SYM.CONST && prior.boolean && prior.value === 0n) return false;
              if (conditionIdentity(negate(prior)) === key) return false;
            }''')

          replace_once('js/symbolic/executor.js', '''  const a = evalValue(cmpInst.args[0].value, state, ir, opts, memo, active);
            const b = evalValue(cmpInst.args[1].value, state, ir, opts, memo, active);
            return cmp(info.op, a, b);''', '''  const a = evalValue(cmpInst.args[0].value, state, ir, opts, memo, active);
            const b = evalValue(cmpInst.args[1].value, state, ir, opts, memo, active);
            const bits = Number(cmpInst.args[0]?.bits || cmpInst.args[0]?.value?.bits || cmpInst.args[1]?.bits || cmpInst.args[1]?.value?.bits || 64);
            return cmp(info.op, a, b, { bits, signed: info.signed });''')

          replace_once('js/symbolic/executor.js', '''  const key = locationKey(inst.loc);
            if (key && state.memory.has(key)) return state.memory.get(key);''', '''  const key = locationKey(inst.loc);
            if (key && state.memory.has(key)) {
              const remembered = state.memory.get(key);
              return remembered && remembered.value ? remembered.value : remembered;
            }''')

          replace_once('js/symbolic/executor.js', '''        const key = locationKey(inst.loc);
                const value = inst.args[0] ? evalValue(inst.args[0].value, state, ir, opts, memo, new Set()) : unknown('missing-store-value');
                if (key) state.memory.set(key, value);''', '''        const key = locationKey(inst.loc);
                const value = inst.args[0] ? evalValue(inst.args[0].value, state, ir, opts, memo, new Set()) : unknown('missing-store-value');
                for (const [knownKey, remembered] of Array.from(state.memory.entries())) {
                  const knownLocation = remembered && remembered.location ? remembered.location : null;
                  if (!knownLocation || mayAliasProvenance(knownLocation, inst.loc)) state.memory.delete(knownKey);
                }
                if (key) state.memory.set(key, { location: inst.loc, value });''')

          # #789: AArch64 integer division by zero is zero and signed/unsigned operands are width-normalized.
          replace_once('js/expr.js', "    if ((op === 'sdiv' || op === 'udiv' || op === 'smod' || op === 'umod') && cb === 0n) return null;",
              "    if ((op === 'sdiv' || op === 'udiv') && cb === 0n) return ZERO;\n    if ((op === 'smod' || op === 'umod') && cb === 0n) return null;")
          replace_once('js/expr.js', '''    case 'sdiv': return b === 0n ? null : truncDiv(a, b);
              case 'udiv': {
                if (b === 0n) return null;
                const m = MASK[w] || MASK[64];
                return (a & m) / (b & m);
              }''', '''    case 'sdiv': {
                const lhs = BigInt.asIntN(w, a), rhs = BigInt.asIntN(w, b);
                return rhs === 0n ? 0n : truncDiv(lhs, rhs);
              }
              case 'udiv': {
                const lhs = BigInt.asUintN(w, a), rhs = BigInt.asUintN(w, b);
                return rhs === 0n ? 0n : lhs / rhs;
              }''')

          # #819: memory equality tracks the current memory epoch, not only address shape.
          replace_once('js/expr.js', '''        a.signed === b.signed && a.resultBits === b.resultBits && a.extension === b.extension &&
                a.scale === b.scale && JSON.stringify(a.indexShift || null) === JSON.stringify(b.indexShift || null) &&''', '''        a.signed === b.signed && a.resultBits === b.resultBits && a.extension === b.extension &&
                a.memoryVersion === b.memoryVersion &&
                a.scale === b.scale && JSON.stringify(a.indexShift || null) === JSON.stringify(b.indexShift || null) &&''')
          replace_once('js/expr.js', '''  let flags = null;

            /*
             * sp は本体の途中では動かないか。''', '''  let flags = null;
            // Non-stack memory observations are equal only while no write/call has
            // crossed them. This is a lightweight legacy memory-version identity.
            let memoryEpoch = 0;

            /*
             * sp は本体の途中では動かないか.''')
          replace_once('js/expr.js', '''    if (insn.isCall) {
              flags = null; // NZCV is caller-clobbered and cannot be reused after a call.''', '''    if (insn.isCall) {
              memoryEpoch++;
              flags = null; // NZCV is caller-clobbered and cannot be reused after a call.''')
          replace_once('js/expr.js', '''              signed: /^(ldrs|ldurs|ldpsw)/.test(base),
                      stack: !!m.stack, addr: absolute, row,''', '''              signed: /^(ldrs|ldurs|ldpsw)/.test(base),
                      memoryVersion: m.volatile ? `volatile:${row}` : memoryEpoch,
                      stack: !!m.stack, addr: absolute, row,''')

          # #820: stack cache is exact-width and overlap-aware.
          replace_once('js/expr.js', '''  const slotKey = (m) => (m && m.stack && m.disp != null && !m.indexed
              ? m.base + '+' + m.disp.toString() : null);''', '''  const stackSlotEligible = (m) => !!(m && m.stack && m.disp != null && !m.indexed);
            const stackSlotKey = (base, disp, size) => `${base}+${BigInt(disp).toString()}:s${Number(size)}`;
            const stackRead = (m, disp, size) => {
              if (!stackSlotEligible(m)) return null;
              const entry = stack.get(stackSlotKey(m.base, disp, size));
              return entry ? entry.value : null;
            };
            const stackWrite = (m, disp, size, value) => {
              if (!stackSlotEligible(m)) return;
              const start = BigInt(disp), end = start + BigInt(size);
              for (const [key, entry] of Array.from(stack.entries())) {
                if (entry.base !== m.base) continue;
                if (start < entry.end && entry.start < end) stack.delete(key);
              }
              stack.set(stackSlotKey(m.base, start, size), { base:m.base, start, end, size:Number(size), value });
            };''')
          replace_once('js/expr.js', '''      const m = insn.memory;
              const memOp = insn.ops.find((x) => x.k === 'mem');
              const slot = slotKey(m);''', '''      const m = insn.memory;
              const memOp = insn.ops.find((x) => x.k === 'mem');
              const slot = stackSlotEligible(m);''')
          replace_once('js/expr.js', '''        const pair = base === 'ldp' || base === 'ldpsw' || base === 'ldnp';
                const list = pair ? dstOps.slice(0, 2) : dstOps.slice(0, 1);
                list.forEach((dop, k) => {''', '''        const pair = base === 'ldp' || base === 'ldpsw' || base === 'ldnp';
                const list = pair ? dstOps.slice(0, 2) : dstOps.slice(0, 1);
                const elemSize = pair ? m.size / 2 : m.size;
                list.forEach((dop, k) => {''')
          replace_once('js/expr.js', '''          else if (slot && !k && stack.has(slot)) v = stack.get(slot);
                  else if (slot && k === 1 && stack.has(m.base + '+' + (m.disp + BigInt(m.size / 2)).toString())) {
                    v = stack.get(m.base + '+' + (m.disp + BigInt(m.size / 2)).toString());
                  }''', '''          else if (slot) {
                    const stackDisp = m.disp + BigInt(k * elemSize);
                    v = stackRead(m, stackDisp, elemSize);
                  }''')
          replace_once('js/expr.js', '''      } else {
                const srcs = insn.ops.filter((x) => x.k === 'reg');
                const pair = base === 'stp' || base === 'stnp';
                const list = pair ? srcs.slice(0, 2) : srcs.slice(0, 1);
                list.forEach((sop, k) => {''', '''      } else {
                memoryEpoch++;
                const srcs = insn.ops.filter((x) => x.k === 'reg');
                const pair = base === 'stp' || base === 'stnp';
                const list = pair ? srcs.slice(0, 2) : srcs.slice(0, 1);
                const elemSize = pair ? m.size / 2 : m.size;
                list.forEach((sop, k) => {''')
          replace_once('js/expr.js', '''          const step = pair ? BigInt(k * (m.size / 2)) : 0n;
                  if (slot && m.disp != null) stack.set(m.base + '+' + (m.disp + step).toString(), v);
                  memWrites.push({
                    row, address: insn.address, baseReg: m.base,
                    disp: m.disp != null ? m.disp + step : null,
                    size: pair ? m.size / 2 : m.size, stack: !!m.stack,''', '''          const step = pair ? BigInt(k * elemSize) : 0n;
                  if (slot && m.disp != null) stackWrite(m, m.disp + step, elemSize, v);
                  memWrites.push({
                    row, address: insn.address, baseReg: m.base,
                    disp: m.disp != null ? m.disp + step : null,
                    size: elemSize, stack: !!m.stack,''')

          # #822: only derive legacy CSEL compare expressions from flag producers
          # when the selected condition is actually represented by that expression.
          replace_once('js/expr.js', '''  let cmp = null;
            if (flags && flags.a) {
              if (flags.op === 'tst' || flags.op === 'ands' || flags.op === 'bics') {
                cmp = { a: bin('and', flags.a, flags.b, 64), b: ZERO };
              } else if (flags.op === 'cmn' || flags.op === 'adds') {
                cmp = { a: bin('add', flags.a, flags.b, 64), b: ZERO };
              } else {
                cmp = { a: flags.a, b: flags.b };
              }
              if (!cmp.a) cmp = null;
            }''', '''  let cmp = null;
            if (flags && flags.a) {
              const zeroOnly = cond === 'eq' || cond === 'ne';
              if ((flags.op === 'tst' || flags.op === 'ands') && zeroOnly) {
                cmp = { a: bin('and', flags.a, flags.b, bits), b: ZERO };
              } else if (flags.op === 'bics' && zeroOnly) {
                cmp = { a: bin('and', flags.a, un('not', flags.b), bits), b: ZERO };
              } else if ((flags.op === 'cmn' || flags.op === 'adds') && zeroOnly) {
                cmp = { a: bin('add', flags.a, flags.b, bits), b: ZERO };
              } else if (flags.op === 'cmp' || flags.op === 'subs' || flags.op === 'negs' || flags.op === 'fcmp' || flags.op === 'fcmpe') {
                cmp = { a: flags.a, b: flags.b };
              }
              if (!cmp?.a || !cmp?.b) cmp = null;
            }''')
          replace_once('js/expr.js', '''    if (/^(subs|adds|ands|bics|negs)$/.test(base)) {
              flags = { op: base, a: A(), b: B() };
            }''', '''    if (/^(subs|adds|ands|bics|negs)$/.test(base)) {
              flags = base === 'negs' ? { op: base, a: ZERO, b: A() } : { op: base, a: A(), b: B() };
            }''')

          # #827: restored AAPCS64 stack locations use one canonical SP-relative coordinate.
          replace_once('js/ir-core.js', '''      const key = `stack:${BigInt.asUintN(64, offset).toString()}`;
              const existing = projected.locations?.get?.(key) ?? null;
              const loc = existing ?? {
                key,
                kind: LEGACY_MK.STACK,
                disp: inst.addr.disp ?? offset,
                size: inst.addr.size ?? inst.extra?.size ?? null,
                regionId: inst.loc?.regionId ?? null,
                origin: inst.loc?.origin ?? inst.addr?.origin ?? null,
                compatAbiPreservedAddress: true,
              };
              if (!existing) projected.locations?.set?.(key, loc);''', '''      const key = `stack:${BigInt.asUintN(64, offset).toString()}`;
              const size = inst.addr.size ?? inst.extra?.size ?? null;
              const existing = projected.locations?.get?.(key) ?? null;
              const existingMatches = !!existing && existing.kind === LEGACY_MK.STACK
                && existing.disp != null && BigInt(existing.disp) === offset
                && (existing.size == null || size == null || Number(existing.size) === Number(size));
              const locKey = existing && !existingMatches ? `${key}:s${size ?? '?'}:compat` : key;
              const loc = existingMatches ? existing : {
                key: locKey,
                kind: LEGACY_MK.STACK,
                disp: offset,
                size,
                regionId: inst.loc?.regionId ?? null,
                origin: inst.loc?.origin ?? inst.addr?.origin ?? null,
                compatAbiPreservedAddress: true,
              };
              if (!existingMatches) projected.locations?.set?.(locKey, loc);''')
          PY
      - name: Add durable regressions
        shell: bash
        run: |
          cat > tests/semantic-v2/issues-786-827-unlinked.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { buildSemanticModel } from '../../js/blocks.js';
          import { buildIR, OP, mustAlias } from '../../js/ir.js';
          import { symbolicExecute } from '../../js/symbolic/executor.js';
          import { buildValues, bin, constNode, constOf, same } from '../../js/expr.js';

          const BASE = 0x700000000n;
          function asm(lines, base = BASE) {
            return lines.map((line, row) => {
              const s = String(line).trim();
              const sp = s.indexOf(' ');
              return { row, address: base + BigInt(row) * 4n, mn: sp < 0 ? s : s.slice(0, sp), ops: sp < 0 ? '' : s.slice(sp + 1).trim() };
            });
          }
          function model(lines, base = BASE) {
            const rows = asm(lines, base);
            const rowOfAddress = (addr) => {
              const rel = addr - base;
              return rel < 0n || rel >= BigInt(lines.length) * 4n ? null : Number(rel / 4n);
            };
            return { model: buildSemanticModel(rows, { startRow:0, endRow:lines.length - 1, rowOfAddress }), rowOfAddress };
          }
          function built(lines, base = BASE) {
            const m = model(lines, base);
            return { ...m, ir: buildIR(m.model, { rowOfAddress:m.rowOfAddress }) };
          }

          // #789: SDIV/UDIV by zero return architectural zero; widths control signedness.
          assert.equal(constOf(bin('sdiv', constNode(123n), constNode(0n), 32)), 0n);
          assert.equal(constOf(bin('udiv', constNode(123n), constNode(0n), 64)), 0n);
          assert.equal(constOf(bin('sdiv', constNode(0x80000000n), constNode(-1n), 32)), -0x80000000n);
          assert.equal(BigInt.asUintN(64, constOf(bin('udiv', constNode(-1n), constNode(1n), 64))), (1n << 64n) - 1n);

          // #786: signed LT and unsigned LO must diverge for the same 32-bit bit pattern.
          function branchRun(cond, bits, lhs, rhs) {
            const r0 = bits === 32 ? 'w0' : 'x0';
            const r1 = bits === 32 ? 'w1' : 'x1';
            const lines = [
              `cmp ${r0}, ${r1}`,
              `b.${cond} #0x${(BASE + 16n).toString(16)}`,
              'mov w2, #0',
              `b #0x${(BASE + 20n).toString(16)}`,
              'mov w2, #1',
              'ret',
            ];
            const { ir } = built(lines);
            return symbolicExecute(ir, { symbolicArgs:{ 0:lhs, 1:rhs }, maxPaths:4, maxSteps:128, timeoutMs:1000 });
          }
          const signed32 = branchRun('lt', 32, 0xffffffffn, 0n);
          assert.equal(signed32.paths.length, 1);
          assert.equal(signed32.paths[0].takenBranches[0]?.taken, true);
          const unsigned32 = branchRun('lo', 32, 0xffffffffn, 0n);
          assert.equal(unsigned32.paths.length, 1);
          assert.equal(unsigned32.paths[0].takenBranches[0]?.taken, false);
          const signed64 = branchRun('ge', 64, 0xffffffffffffffffn, 0n);
          assert.equal(signed64.paths.length, 1);
          assert.equal(signed64.paths[0].takenBranches[0]?.taken, false);
          const unsigned64 = branchRun('hs', 64, 0xffffffffffffffffn, 0n);
          assert.equal(unsigned64.paths.length, 1);
          assert.equal(unsigned64.paths[0].takenBranches[0]?.taken, true);

          // #788: a store through another unresolved FIELD root may alias and must kill a stale value.
          {
            const { ir } = built([
              'str w2, [x0]',
              'str w3, [x1]',
              'ldr w4, [x0]',
              'str w4, [x5]',
              'ret',
            ]);
            const out = symbolicExecute(ir, { symbolicArgs:{ 2:7n, 3:9n }, maxSteps:128, timeoutMs:1000 });
            assert.equal(out.paths.length, 1);
            const writes = out.paths[0].touchedFields;
            assert.ok(writes.length >= 3);
            assert.notEqual(writes.at(-1).valueText, '7', 'may-alias store must invalidate x0-root remembered value');
          }

          // #819: equal loads share one memory epoch; a store/call/volatile read separates occurrences.
          {
            const { model:m } = model(['ldr w8, [x0]', 'ldr w9, [x0]', 'str w1, [x1]', 'ldr w10, [x0]', 'ret']);
            const values = buildValues(m);
            const a = values.defAt(0, 'x8'), b = values.defAt(1, 'x9'), c = values.defAt(3, 'x10');
            assert.equal(same(a, b), true, 'no-clobber loads should retain the same memory identity');
            assert.equal(same(a, c), false, 'intervening store must advance memory identity');
          }
          {
            const { model:m } = model(['ldr w8, [x0]', 'bl #0x700000010', 'ldr w9, [x0]', 'ret']);
            const values = buildValues(m);
            assert.equal(same(values.defAt(0, 'x8'), values.defAt(2, 'x9')), false, 'call must advance memory identity');
          }
          {
            const { model:m } = model(['ldr w8, [x0]', 'ldr w9, [x0]', 'ret']);
            m.instructions[0].memory.volatile = true;
            m.instructions[1].memory.volatile = true;
            const values = buildValues(m);
            assert.equal(same(values.defAt(0, 'x8'), values.defAt(1, 'x9')), false, 'volatile loads are distinct occurrences');
          }

          // #820: stack forwarding is exact-width and overlapping stores invalidate wider cached slots.
          {
            const { model:m } = model(['str x0, [sp, #0]', 'ldr w1, [sp, #0]', 'ret']);
            const v = buildValues(m);
            assert.equal(same(v.at(0, 'x0'), v.defAt(1, 'x1')), false, '8-byte store must not forward as a 4-byte load');
          }
          {
            const { model:m } = model(['str x0, [sp, #0]', 'str w1, [sp, #4]', 'ldr x2, [sp, #0]', 'ret']);
            const v = buildValues(m);
            assert.equal(same(v.at(0, 'x0'), v.defAt(2, 'x2')), false, 'partial overlap invalidates wider slot');
          }
          {
            const { model:m } = model(['str x0, [sp, #0]', 'str w1, [sp, #8]', 'ldr x2, [sp, #0]', 'ret']);
            const v = buildValues(m);
            assert.equal(same(v.at(0, 'x0'), v.defAt(2, 'x2')), true, 'disjoint stack store preserves exact slot');
          }
          {
            const { model:m } = model(['stp x0, x1, [sp, #0]', 'ldr x2, [sp, #8]', 'ret']);
            const v = buildValues(m);
            assert.equal(same(v.at(0, 'x1'), v.defAt(1, 'x2')), true, 'pair store tracks each element interval');
          }

          // #822: addition/logical flag producers are not ordinary comparisons for C/V-dependent conditions.
          {
            const { model:m } = model(['adds w8, w0, w1', 'csel w2, w3, w4, hs', 'ret']);
            const v = buildValues(m);
            assert.equal(v.defAt(1, 'x2').cmp, null, 'ADDS carry condition must remain unknown in legacy expr');
          }
          {
            const { model:m } = model(['adds w8, w0, w1', 'csel w2, w3, w4, eq', 'ret']);
            const v = buildValues(m);
            assert.ok(v.defAt(1, 'x2').cmp?.a, 'ADDS EQ is exactly result==0');
          }
          {
            const { model:m } = model(['bics w8, w0, w1', 'csel w2, w3, w4, eq', 'ret']);
            const v = buildValues(m);
            const result = v.defAt(1, 'x2').cmp?.a;
            assert.equal(result?.op, 'and');
            assert.equal(result?.b?.op, 'not', 'BICS flags come from A & ~B');
          }
          {
            const { model:m } = model(['subs w8, w0, w1', 'csel w2, w3, w4, hs', 'ret']);
            const v = buildValues(m);
            assert.ok(v.defAt(1, 'x2').cmp?.a, 'SUBS retains exact compare semantics');
          }

          // #827: all restored stack locations use the total SP-relative coordinate.
          {
            const { ir } = built([
              'add x29, sp, #16',
              'str x0, [x29, #-8]',
              'ldr x1, [sp, #8]',
              'ldr x2, [sp, #-8]',
              'ret',
            ]);
            const store = ir.instructions.find((i) => i.op === OP.STORE);
            const loads = ir.instructions.filter((i) => i.op === OP.LOAD);
            assert.equal(store.loc.disp, 8n);
            assert.equal(loads[0].loc.disp, 8n);
            assert.equal(loads[1].loc.disp, -8n);
            assert.equal(mustAlias(store.loc, loads[0].loc), true);
            assert.equal(mustAlias(store.loc, loads[1].loc), false);
          }

          console.log('issues #786 #788 #789 #819 #820 #822 #827 regressions: ok');
          EOF
      - name: Focused and full validation
        run: |
          npm run semantic-v2:test
          node tests/ir.mjs
          npm run check
          npm run userscript:build
          git diff --check
      - name: Commit canonical source, tests, and generated output
        shell: bash
