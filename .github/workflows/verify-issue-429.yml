name: Verify issue 429 range domain

on:
  push:
    branches:
      - fix/latest-429-425

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-429-425
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/apply-issue-429.py
      - run: node tests/issue-429-range-domain.mjs
      - run: npm run decompiler:test
      - run: npm run semantic:test
      - run: npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/ir.js js/decompiler/rewrite/rules.js js/range-domain.js package.json tests/issue-429-range-domain.mjs
          git diff --cached --check
          git commit -m 'fix: normalize range proofs across signedness (#429)'
          git push origin HEAD:fix/latest-429-425
