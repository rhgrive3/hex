name: Final PR594 validation
on:
  push:
    branches:
      - fix/issue-570-macho-budget-v3
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused Mach-O and ELF budget regressions
        run: |
          node tests/issue-570-macho-metadata-budget.mjs
          node tests/issue-569-chained-segment-bounds.mjs
          node tests/issue-572-bounded-leb.mjs
          node tests/issue-495-elf-relocation-budget.mjs
          node tests/issue-513-elf-symbol-budget.mjs
          npm run binary:test
      - name: Core and full repository validation
        run: |
          node tests/run.js
          npm run check
      - name: Remove temporary validator
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/validate-pr594-final.yml
          git commit -m "chore: remove PR594 final validator"
          git push origin HEAD:fix/issue-570-macho-budget-v3