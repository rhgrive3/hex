name: Verify PR 512 sync
on:
  push:
    branches:
      - fix/issue-496-il2cpp-binding-trust
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - run: node tests/issue-496-il2cpp-binding.mjs
      - run: npm run check
      - name: Finalize verified branch
        run: |
          rm -f .github/workflows/verify-pr-512-sync.yml .github/workflows/issue-496-il2cpp-binding.yml
          rm -f tools/apply-issue-496.py tools/gate-issue-496.py tools/update-issue-496-contract.py
          git add -A
          git commit -m "chore: finalize #496 after latest-main verification" || exit 0
          git push origin HEAD
