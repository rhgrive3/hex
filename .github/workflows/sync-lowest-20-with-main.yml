name: sync-lowest-20-with-main
on:
  push:
    branches: [fix-lowest-20-issues-20260815]
permissions:
  contents: write
jobs:
  merge-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-lowest-20-issues-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge latest main without committing
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main > merge.log 2>&1
          code=$?
          cat merge.log
          if [ "$code" -ne 0 ]; then
            echo '--- conflicted paths ---'
            git diff --name-only --diff-filter=U
            message=$(cat merge.log | tail -c 3000 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Latest-main merge conflict::$message"
            exit "$code"
          fi
      - name: Lowest issue regression
        run: node tests/issues-lowest-20-20260815.mjs
      - name: Semantic suite
        run: npm run semantic:test
      - name: Decompiler suite
        run: npm run decompiler:test
      - name: Full tests
        run: npm test
      - name: Commit verified merge
        run: |
          rm -f .github/workflows/sync-lowest-20-with-main.yml merge.log
          git add -A
          git diff --cached --check
          git commit -m 'merge: sync lowest issue fixes with latest main'
          git push origin HEAD:fix-lowest-20-issues-20260815
