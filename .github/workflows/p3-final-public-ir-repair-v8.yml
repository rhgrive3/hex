name: Phase 3 final public IR repair v8

on:
  push:
    branches:
      - hex/p3-semantic-ir-integration
    paths:
      - '.github/workflows/p3-final-public-ir-repair-v8.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply validated final repair script
        shell: python
        run: |
          from pathlib import Path
          lines = Path('.github/workflows/p3-final-public-ir-repair-v7.yml').read_text().splitlines()
          marker = '      - name: Apply final projection and address-lineage value-chain repair'
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
          body = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(body), '<phase3-final-repair>', 'exec'), {'__name__':'__main__'})
      - name: Focused legacy public IR regression
        run: node tests/ir.mjs
      - name: Synchronize generated userscript before semantic gate
        run: npm run userscript:build
      - name: Phase 3 semantic exit proof
        run: npm run semantic-v2:test
      - name: Core semantic and compiler regressions
        run: |
          npm run effects:test
          npm run core:test
          npm run invariants:test
          npm run migration:test
          npm run semantic:test
          npm run decompiler:test
          npm run compiler-truth
      - name: Verify generated userscript is stable
        run: |
          npm run userscript:build
          git diff --check
      - name: Commit validated repair and remove temporary Phase 3 workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            .github/workflows/p3-final-public-ir-repair-v8.yml \
            .github/workflows/p3-final-public-ir-repair-v7.yml \
            .github/workflows/p3-final-public-ir-repair-v6.yml \
            .github/workflows/p3-final-public-ir-repair-v5.yml \
            .github/workflows/p3-final-public-ir-repair-v4.yml \
            .github/workflows/p3-final-public-ir-repair-v3.yml \
            .github/workflows/p3-final-public-ir-repair-v2.yml \
            .github/workflows/p3-final-public-ir-repair.yml \
            .github/workflows/p3-debug-cutover-ir.yml \
            .github/workflows/p3-debug-issue430-callargs.yml \
            .github/workflows/p3-final-validation.yml; do
            git rm -f "$f" 2>/dev/null || true
          done
          git add js/semantics/compat/semantic-ir-v2-to-v1-finalize.js js/semantics/compat/semantic-ir-v2-to-v1.js js/ir-core.js js/slice.js userscript/hex.user.template.js
          git diff --cached --check
          git commit -m "Phase 3: complete legacy public projection after v2 cutover"
          git push origin HEAD:hex/p3-semantic-ir-integration
