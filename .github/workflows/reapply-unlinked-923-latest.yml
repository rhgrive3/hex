name: Reconcile verified issue 923 onto latest main

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/unlinked-923-eh-frame-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-923-eh-frame-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Restore verified source/test from prior exact verifier
        shell: bash
        run: |
          git fetch origin cbab789dd17bf720895b65f27619e017fc8ec7c7 --depth=1
          git show cbab789dd17bf720895b65f27619e017fc8ec7c7:js/binary/elf-unwind.js > js/binary/elf-unwind.js
          git show cbab789dd17bf720895b65f27619e017fc8ec7c7:tests/issue-923-eh-frame-validation.mjs > tests/issue-923-eh-frame-validation.mjs
      - name: Focused regression
        run: node tests/issue-923-eh-frame-validation.mjs
      - name: Binary loader suite
        run: npm run binary:test
      - name: Static checks
        run: npm run lint
      - name: Canonical userscript build
        run: npm run userscript:build
      - name: Diff hygiene
        run: git diff --check
      - name: Publish latest-main implementation
        shell: bash
        run: |
          rm .github/workflows/reapply-unlinked-923-latest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: validate eh_frame_hdr FDE function evidence (#923)'
          git push origin HEAD:fix/unlinked-923-eh-frame-validation
