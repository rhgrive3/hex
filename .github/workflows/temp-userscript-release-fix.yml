name: Temporary userscript release version repair

on:
  push:
    branches:
      - hex/fix-userscript-release-version

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply repair
        run: node scripts/temp-userscript-release-fix.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build twice and prove release identity is stable
        shell: bash
        run: |
          npm run userscript:build
          first_version="$(node -p "JSON.parse(require('fs').readFileSync('userscript/release-version.json','utf8')).serial")"
          first_identity="$(node -p "JSON.parse(require('fs').readFileSync('userscript/release-version.json','utf8')).releaseIdentity")"
          npm run userscript:build
          second_version="$(node -p "JSON.parse(require('fs').readFileSync('userscript/release-version.json','utf8')).serial")"
          second_identity="$(node -p "JSON.parse(require('fs').readFileSync('userscript/release-version.json','utf8')).releaseIdentity")"
          test "$first_version" = "2322241685"
          test "$second_version" = "$first_version"
          test "$second_identity" = "$first_identity"
          grep -q '^// @version      2\.0\.2322241685$' userscript/hex.user.template.js
      - name: Focused and broad userscript validation
        run: |
          node tests/userscript-release-version.mjs
          npm run userscript:test
          npm run ai:test
          git diff --check
      - name: Remove temporary staging files
        run: |
          rm -f scripts/temp-userscript-release-fix.mjs .github/workflows/temp-userscript-release-fix.yml
      - name: Commit final repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make userscript release versions track runtime builds"
          git push origin HEAD:${GITHUB_REF_NAME}
