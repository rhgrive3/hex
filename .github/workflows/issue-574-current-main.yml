name: Revalidate issue 574 on current main

on:
  push:
    branches: [fix/issue-574-memory-alias-soundness]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Syntax
        run: |
          node --check js/ir-core.js
          node --check js/ir.js
          node --check tests/ir-alias.mjs
      - name: Focused alias regressions
        run: node tests/ir-alias.mjs
      - name: Semantic regression suite
        run: npm run semantic:test
      - name: Full regression
        run: npm run check
      - name: Persist validated merge and remove validation workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/issue-574-current-main.yml
          git commit -m 'chore: finalize #574 current-main validation'
          git push origin HEAD:fix/issue-574-memory-alias-soundness
