name: Verify AI assembly completeness issue 467

on:
  push:
    branches:
      - fix/issue-467-ai-assembly-completeness

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-467-ai-assembly-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply completeness fix
        run: python3 tools/apply-issue-467.py
      - name: Focused regression
        run: node tests/issue-467-ai-context.mjs
      - name: Gemini regressions
        run: node tests/gemini.mjs
      - name: AI regressions
        run: npm run ai:test
      - name: Static checks
        run: |
          node --check js/gemini.js
          node --check worker.js
          npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/gemini.js worker.js package.json
          git commit -m "fix: expose AI assembly context completeness (#467)"
          git push origin HEAD:fix/issue-467-ai-assembly-completeness
