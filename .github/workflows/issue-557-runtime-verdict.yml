name: Issue 557 runtime verdict confidence

on:
  push:
    branches: [fix/issue-557-runtime-verdict-confidence]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[issue-557-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply fix
        run: python3 tools/apply-issue-557.py
      - name: Focused runtime verdict regression
        run: node tests/runtime-platform.mjs
      - name: Static check
        run: node --check js/agent/runtime.js
      - name: Full regression
        run: npm run check
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/agent/runtime.js tests/runtime-platform.mjs
          git commit -m 'Fix #557 runtime verdict confidence [issue-557-applied]'
          git push
