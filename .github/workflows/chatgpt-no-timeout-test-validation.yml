name: ChatGPT no-timeout test validation
on: [push]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update stale timeout contract tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/ai-chatgpt-web-provider.mjs')
          s=p.read_text()
          s=s.replace("assert.equal(chatgptPolicy.turnTimeoutMs('chat'), 240000);", "assert.equal(chatgptPolicy.turnTimeoutMs('chat'), null, 'ChatGPT Web has no provider-imposed default turn deadline');")
          s=s.replace("assert.equal(chatgptPolicy.turnTimeoutMs('agent'), 600000);", "assert.equal(chatgptPolicy.turnTimeoutMs('agent'), null, 'ChatGPT Web has no provider-imposed default agent deadline');")
          s=s.replace("assert.equal(provider.turnTimeoutMs('chat', { provider: 'chatgpt-web' }), 240000);", "assert.equal(provider.turnTimeoutMs('chat', { provider: 'chatgpt-web' }), null);")
          old="""  const provider = new ChatGPTWebProvider({
    timeoutMs: 120,
    bridge: {
      async request(_prompt, options) { observedTimeout = options.timeoutMs; return '{\"type\":\"final\",\"answer\":\"ok\"}'; },
    },
  });
  await provider.nextTurn({ tools: [] }, { timeoutMs: 5000 });
  assert.equal(observedTimeout, 120, 'whole-turn budget must be capped by the per-ChatGPT-call timeout');"""
          new="""  const provider = new ChatGPTWebProvider({
    bridge: {
      async request(_prompt, options) { observedTimeout = options.timeoutMs; return '{\"type\":\"final\",\"answer\":\"ok\"}'; },
    },
  });
  await provider.nextTurn({ tools: [] }, { timeoutMs: 5000 });
  assert.equal(observedTimeout, 5000, 'an explicit caller timeout must be forwarded unchanged');"""
          if old not in s: raise SystemExit('old per-call timeout test not found')
          s=s.replace(old,new,1)
          marker=new+"\n}"
          extra="""

{
  let optionsSeen = null;
  const provider = new ChatGPTWebProvider({
    bridge: {
      async request(_prompt, options) { optionsSeen = options; return '{\"type\":\"final\",\"answer\":\"ok\"}'; },
    },
  });
  await provider.nextTurn({ tools: [] });
  assert.equal(Object.hasOwn(optionsSeen, 'timeoutMs'), false, 'ChatGPT Web must not synthesize a default per-call timeout');
}"""
          if marker not in s: raise SystemExit('insertion marker not found')
          s=s.replace(marker,marker+extra,1)
          p.write_text(s)
          PY
      - run: node tests/ai-chatgpt-web-provider.mjs
      - run: npm run ai:test
      - run: npm run userscript:test
      - run: npm run lint
      - run: npm test
      - run: git diff --check
      - name: Commit validated test repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/chatgpt-no-timeout-test-validation.yml
          git add tests/ai-chatgpt-web-provider.mjs
          git commit -m "Fix ChatGPT no-timeout contract tests"
          git push origin HEAD:fix/chatgpt-no-timeout-test-contract
