name: Temp final workspace transition hardening
on:
  push:
    branches:
      - review-all-hardening-integration
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-all-hardening-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/_final-workspace-transition-hardening.mjs
      - run: npm ci
      - run: node tests/review-cross-binary-state.mjs
      - run: npm run check
      - run: npm run userscript:test
      - name: Commit source, regressions and regenerated bundles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/_final-workspace-transition-hardening.mjs .github/workflows/_temp-final-workspace-transition-hardening.yml
          git add js/workspace.js js/app.js tests/review-cross-binary-state.mjs userscript/hex.user.template.js userscript/platform-worker.bundle.js scripts .github/workflows
          git commit -m 'Invalidate workspace state at file and slice transitions'
          git push origin HEAD:review-all-hardening-integration