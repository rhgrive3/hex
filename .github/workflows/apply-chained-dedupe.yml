name: Apply chained symbol deduplication

on:
  push:
    branches:
      - accuracy-ywp-tsumtsum-20260814
    paths:
      - .github/workflows/apply-chained-dedupe.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accuracy-ywp-tsumtsum-20260814
          fetch-depth: 0
      - name: Fill anonymous symbols instead of duplicating them
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/chained.js')
          s = p.read_text()
          old = '  const entries = [];\n  const occupied = new Set();'
          new = '  const entries = [];\n  const occupied = new Set();\n  const existing = new Map();'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "    entries.push({ addr, name, kind: result.kinds ? result.kinds[i] : 0,\n      flag: result.flags ? result.flags[i] : 0 });\n    if (name) occupied.add(addr.toString());"
          new = "    entries.push({ addr, name, kind: result.kinds ? result.kinds[i] : 0,\n      flag: result.flags ? result.flags[i] : 0 });\n    existing.set(addr.toString(), entries.length - 1);\n    if (name) occupied.add(addr.toString());"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '    if (occupied.has(key)) continue;\n    occupied.add(key);\n    entries.push({ addr: e.addr, name: e.name, kind: e.kind, flag: 0 });'
          new = '    if (occupied.has(key)) continue;\n    const at = existing.get(key);\n    if (at != null && !entries[at].name) {\n      entries[at].name = e.name;\n      if (!entries[at].kind) entries[at].kind = e.kind;\n      occupied.add(key);\n      continue;\n    }\n    occupied.add(key);\n    existing.set(key, entries.length);\n    entries.push({ addr: e.addr, name: e.name, kind: e.kind, flag: 0 });'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add js/chained.js
          git commit -m 'fix: fill anonymous chained symbols without duplicate entries [chained-dedupe]'
          git push origin HEAD:accuracy-ywp-tsumtsum-20260814
