name: Temp final baseline race hardening
on:
  push:
    branches:
      - review-all-hardening-integration
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-all-hardening-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tests/review-cross-binary-state.mjs
      - run: npm run check
      - run: npm run userscript:test
      - name: Commit regenerated deployment bundles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userscript/hex.user.template.js userscript/platform-worker.bundle.js
          if ! git diff --cached --quiet; then
            git commit -m 'Sync bundles after baseline race hardening'
          fi
          git push origin HEAD:review-all-hardening-integration