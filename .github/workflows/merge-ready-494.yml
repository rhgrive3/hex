name: Sync ready PR 494
on:
  push:
    branches: [fix/latest-463-461-binary-boundaries]
permissions:
  contents: write
jobs:
  merge-main:
    if: startsWith(github.event.head_commit.message, 'ready-pr-merge-helper:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "package.json" || { echo "Unexpected conflicts: $conflicts"; exit 1; }
            git checkout --theirs package.json
            node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          const token = 'node tests/issues-461-463-binary.mjs';
          const parts = String(p.scripts['binary:test'] || '').split(' && ').filter(Boolean);
          p.scripts['binary:test'] = [token, ...parts.filter(x => x !== token)].join(' && ');
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
            git add package.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/merge-ready-494.yml
          npm run check
          git add -A
          git commit -m 'Merge latest main into #494 after #460'
          git push origin HEAD
