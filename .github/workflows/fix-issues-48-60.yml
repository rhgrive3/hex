name: Apply issues 48-60 hardening
on:
  push:
    branches: [fix/issues-48-60]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patch
        run: node tools/fix-issues-48-60.mjs
      - name: Normalize semantic defaults
        run: node tools/fix-issues-48-60-adjust.mjs
      - name: Syntax check touched modules
        run: |
          node --check js/binary/reader.js
          node --check js/binary/source.js
          node --check js/binary/source-reader.js
          node --check js/binary/source-loaders.js
          node --check js/binary/macho.js
          node --check js/binary/model.js
          node --check js/bytesource/cached.js
          node --check js/bytesource/strings.js
      - name: Binary regressions
        run: npm run binary:test
      - name: Full regression gate
        run: npm run check
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix binary source issues 48-60"
          git push origin HEAD:fix/issues-48-60
