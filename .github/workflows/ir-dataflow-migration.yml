name: IR dataflow migration

on:
  pull_request:
    paths:
      - 'js/dataflow.js'
      - 'js/dataflow-legacy.js'
      - 'js/dataflow-ir.js'
      - 'js/dataflow-ir-compare.js'
      - 'js/dataflow-semantic.js'
      - 'js/ir.js'
      - 'js/semantic.js'
      - 'js/semantic-evidence.js'
      - 'js/interproc.js'
      - 'js/query/**'
      - 'js/agent/**'
      - 'js/symbolic/**'
      - 'tests/ir-dataflow.mjs'
      - 'tests/ir-alias.mjs'
      - 'tests/ir-pinpoint-path.mjs'
      - 'tests/ir-pinpoint-location.mjs'
      - 'tests/ir-comparisons.mjs'
      - 'tests/semantic-core.mjs'
      - 'tests/semantic-nullability.mjs'
      - '.github/workflows/ir-dataflow-migration.yml'
  workflow_dispatch:

jobs:
  ir-dataflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Existing checks
        run: npm run check
      - name: IR dataflow migration regressions
        run: node tests/ir-dataflow.mjs
      - name: IR alias safety regressions
        run: node tests/ir-alias.mjs
      - name: Pinpoint verification integration
        run: node tests/ir-pinpoint-path.mjs
      - name: Pinpoint location integration
        run: node tests/ir-pinpoint-location.mjs
      - name: SSA threshold recovery
        run: node tests/ir-comparisons.mjs
      - name: Semantic core regressions
        run: node tests/semantic-core.mjs
      - name: Nullability edge regression
        run: node tests/semantic-nullability.mjs
