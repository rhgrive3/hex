name: IR dataflow migration

on:
  pull_request:
    paths:
      - 'js/dataflow.js'
      - 'js/dataflow-legacy.js'
      - 'js/dataflow-ir.js'
      - 'js/dataflow-ir-compare.js'
      - 'js/dataflow-semantic.js'
      - 'js/ir.js'
      - 'js/semantic.js'
      - 'js/semantic-evidence.js'
      - 'js/interproc.js'
      - 'js/query/**'
      - 'js/agent/**'
      - 'js/symbolic/**'
      - 'tests/ir-dataflow.mjs'
      - 'tests/ir-alias.mjs'
      - 'tests/ir-pinpoint-path.mjs'
      - 'tests/ir-pinpoint-location.mjs'
      - 'tests/ir-comparisons.mjs'
      - 'tests/semantic-core.mjs'
      - 'tests/semantic-nullability.mjs'
      - '.github/workflows/ir-dataflow-migration.yml'
  workflow_dispatch:

concurrency:
  group: ir-dataflow-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: ir-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - name: dataflow
            command: node tests/ir-dataflow.mjs
          - name: alias
            command: node tests/ir-alias.mjs
          - name: pinpoint-path
            command: node tests/ir-pinpoint-path.mjs
          - name: pinpoint-location
            command: node tests/ir-pinpoint-location.mjs
          - name: comparisons
            command: node tests/ir-comparisons.mjs
          - name: semantic-core
            command: node tests/semantic-core.mjs
          - name: nullability
            command: node tests/semantic-nullability.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run targeted regression
        run: ${{ matrix.command }}

  manual-full-check:
    name: ir-manual-full-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

  ir-dataflow:
    name: ir-dataflow
    if: always()
    needs: [regressions, manual-full-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require targeted regressions and optional manual full check
        env:
          REGRESSION_RESULT: ${{ needs.regressions.result }}
          FULL_RESULT: ${{ needs.manual-full-check.result }}
        shell: bash
        run: |
          if [[ "$REGRESSION_RESULT" != "success" ]]; then
            echo "::error::IR migration regression shard failed ($REGRESSION_RESULT)."
            exit 1
          fi
          if [[ "$FULL_RESULT" != "success" && "$FULL_RESULT" != "skipped" ]]; then
            echo "::error::Manual full check failed ($FULL_RESULT)."
            exit 1
          fi
