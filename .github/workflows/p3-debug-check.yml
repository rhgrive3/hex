      - run: npm run userscript:build
      - name: check-lint
        run: npm run lint
      - name: check-invariants
        run: npm run invariants:test
      - name: check-migration
        run: npm run migration:test
      - name: check-semantic-v2
        run: npm run semantic-v2:test
      - name: check-npm-test
        run: npm test
      - name: check-benchmark
        run: npm run benchmark:baseline
      - name: Cleanup
        if: always()
        run: |
          git reset --hard HEAD; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git rm .github/workflows/p3-debug-check.yml; git commit -m 'Phase 3: remove temporary check debug workflow'; git push origin HEAD:hex/p3-semantic-ir-integration
