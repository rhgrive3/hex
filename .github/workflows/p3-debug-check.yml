name: Phase 3 debug npm check subgate
on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-debug-check.yml']
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: hex/p3-semantic-ir-integration }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply current candidate repairs
