= summaryReturnCandidate(ir, ret);\n    const descriptor = returnDescriptor(candidate.value);','const candidate = summaryReturnCandidate(ir, ret, calls);\n    const descriptor = candidate.descriptor || returnDescriptor(candidate.value);',1); p.write_text(s)
