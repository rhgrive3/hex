name: Final CFG validation

on:
  push:
    paths:
      - '.github/workflows/final-cfg-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cfg-structuring-battlecats
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core checks
        run: npm run check
      - name: BattleCats CFG regression
        run: node --max-old-space-size=6000 tests/battlecats-cfg-regression.mjs
      - name: Install oracle dependencies
        run: python -m pip install --disable-pip-version-check lief capstone
      - name: BattleCats oracle and accuracy
        run: |
          python tests/oracle.py tests/battlecats tests/oracle.battlecats.ci.json.gz
          node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/battlecats --oracle=tests/oracle.battlecats.ci.json.gz --json | tee accuracy-BattleCats.json
      - name: YWP oracle and accuracy
        run: |
          python tests/oracle.py tests/YWP tests/oracle.YWP.json.gz
          node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/YWP --oracle=tests/oracle.YWP.json.gz --json | tee accuracy-YWP.json
      - name: TsumTsum oracle and accuracy
        run: |
          python tests/oracle.py tests/TsumTsum tests/oracle.TsumTsum.json.gz
          node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/TsumTsum --oracle=tests/oracle.TsumTsum.json.gz --json | tee accuracy-TsumTsum.json
      - name: Accuracy regression gate
        run: node tests/accuracy-gate.mjs
      - name: Remove temporary validation workflow
        run: rm -f .github/workflows/final-cfg-validation.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary CFG validation workflow'
          git push origin HEAD:fix/cfg-structuring-battlecats
