name: Validate staged issue 191+ fixes
on:
  push:
    branches: [fix-issues-191-plus]
jobs:
  validate:
    if: ${{ contains(github.event.head_commit.message, '[validate-fix191]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node tools/apply-fix191.mjs
          node tools/fix191-adjust.mjs
          node tools/apply-fix265.mjs
          node tools/fix265-adjust.mjs
          node tools/fix265-tests.mjs
          node tools/apply-fix283.mjs
          node tools/apply-fix296.mjs
      - run: |
          for f in js/analyze.js js/backend.js js/auto.js js/rank.js js/fields.js js/pinpoint.js js/verify.js js/names.js js/schema.js js/shapes.js js/program.js js/worker.js js/plugins.js js/sandbox.js js/script.js js/calib.js js/dataflow-ir.js js/report.js js/comprehend.js; do node --check "$f"; done
          node tests/issue-191-plus.mjs
          node tests/issue-265-plus.mjs
          node tests/issue-283-plus.mjs
