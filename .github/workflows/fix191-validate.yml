name: Validate staged issue 191+ fixes
on:
  push:
    branches: [fix-issues-191-plus]
jobs:
  validate:
    if: ${{ contains(github.event.head_commit.message, '[validate-fix191]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node tools/apply-fix191.mjs
          node tools/fix191-adjust.mjs
          node tools/apply-fix265.mjs
          node tools/fix265-adjust.mjs
          node tools/fix265-tests.mjs
      - run: |
          node --check js/analyze.js
          node --check js/backend.js
          node --check js/auto.js
          node --check js/rank.js
          node --check js/fields.js
          node --check js/pinpoint.js
          node --check js/verify.js
          node --check js/names.js
          node --check js/schema.js
          node --check js/shapes.js
          node --check js/program.js
          node --check js/worker.js
          node tests/issue-191-plus.mjs
          node tests/issue-265-plus.mjs
