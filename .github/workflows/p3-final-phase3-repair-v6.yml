name: Phase 3 final scoped repair v6
on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-final-phase3-repair-v6.yml']
permissions:
  contents: write
jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: hex/p3-semantic-ir-integration, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply final compatibility repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js'); s=p.read_text()
          decl="    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);\n"
          old="    } else if (inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias) && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          new="    } else if (inst.extra?.stateRead && inst.extra?.localPhysicalViewProjection === true && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          if s.count(decl)!=1 or s.count(old)!=1: raise SystemExit('finalizer source shape mismatch')
          p.write_text(s.replace(decl,'',1).replace(old,new,1))

          p=Path('js/interproc.js'); s=p.read_text()
          marker="function simpleReturnExpression(value) {\n"
          helper="""function returnArgumentIndex(value) {\n  const source = transparentMoveSource(value);\n  if (!source) return null;\n  const origin = originOf(source);\n  const reg = source.kind === VK.ARG ? source.reg : origin?.kind === 'argument' ? origin.reg : null;\n  return /^x[0-7]$/.test(String(reg || '')) ? Number(String(reg).slice(1)) : null;\n}\n\n"""
          if s.count(marker)!=1 or 'function returnArgumentIndex(value)' in s: raise SystemExit('return argument helper source shape mismatch')
          s=s.replace(marker,helper+marker,1)
          old_expr="""  const a = transparentMoveSource(aArg && aArg.value);\n  const b = transparentMoveSource(bArg && bArg.value);\n  if (!a || !b) return null;\n  const bits = Number(v.bits || v.def.extra?.dstBits || aArg?.bits || 64);\n  const signed = v.signed ?? null;\n  if (a.kind === VK.ARG && /^x[0-7]$/.test(String(a.reg || '')) && b.const != null) {\n    return { kind: 'argument-arithmetic', argument: Number(a.reg.slice(1)), op: v.def.sub, constant: b.const, bits, signed };\n  }\n  if (v.def.sub === 'add' && b.kind === VK.ARG && /^x[0-7]$/.test(String(b.reg || '')) && a.const != null) {\n    return { kind: 'argument-arithmetic', argument: Number(b.reg.slice(1)), op: 'add', constant: a.const, bits, signed };\n  }"""
          new_expr="""  const a = transparentMoveSource(aArg && aArg.value);\n  const b = transparentMoveSource(bArg && bArg.value);\n  if (!a || !b) return null;\n  const aArgument = returnArgumentIndex(a);\n  const bArgument = returnArgumentIndex(b);\n  const bits = Number(v.bits || v.def.extra?.dstBits || aArg?.bits || 64);\n  const signed = v.signed ?? null;\n  if (aArgument != null && b.const != null) {\n    return { kind: 'argument-arithmetic', argument: aArgument, op: v.def.sub, constant: b.const, bits, signed };\n  }\n  if (v.def.sub === 'add' && bArgument != null && a.const != null) {\n    return { kind: 'argument-arithmetic', argument: bArgument, op: 'add', constant: a.const, bits, signed };\n  }"""
          if s.count(old_expr)!=1: raise SystemExit('simple return expression source shape mismatch')
          s=s.replace(old_expr,new_expr,1)

          old_candidate="""function summaryReturnCandidate(ir, ret) {\n  const explicit = ret?.args?.[0]?.value || null;\n  if (explicit) return { value: explicit, inferred: false };\n\n  // Untyped RET carries no x0 SSA use. A terminal x0 definition is useful as a\n  // local hint, but it is not an ABI return contract by itself.\n  const value = valueBefore(ir, ret, 'x0');\n  if (!value || value.kind === VK.ARG || !value.def) return { value: null, inferred: false };\n  if (value.def.row == null || ret.row == null || value.def.row >= ret.row) return { value: null, inferred: false };\n  const laterUse = (value.uses || []).some((use) => use !== ret && use.row != null && use.row > value.def.row && use.row < ret.row);\n  if (laterUse) return { value: null, inferred: false };\n  return { value, inferred: true };\n}"""
          new_candidate="""function weakTerminalCallReturn(ir, ret, calls) {\n  if (ret?.row == null) return null;\n  const candidates = (ir.instructions || []).filter((inst) => inst.op === OP.CALL\n    && inst.row != null && inst.row < ret.row\n    && (inst.block == null || ret.block == null || inst.block === ret.block));\n  const call = candidates.sort((a, b) => (b.row - a.row) || (b.id - a.id))[0] || null;\n  if (!call) return null;\n  const clobbers = call.clobbers || call.extra?.clobbers || [];\n  if (!clobbers.includes('x0')) return null;\n  const overwritten = (ir.instructions || []).some((inst) => inst !== call && inst !== ret\n    && inst.row != null && inst.row > call.row && inst.row < ret.row\n    && (inst.block == null || ret.block == null || inst.block === ret.block)\n    && (inst.dst?.reg === 'x0' || inst.extra?.publicStateIdentity === 'x0'));\n  if (overwritten) return null;\n  const metadata = (calls || []).find((item) => item.row === call.row) || null;\n  return { kind: 'call', target: metadata?.target ?? call.extra?.target ?? null, instructionId: call.instructionId ?? call.id, bits: call.returnBits || 64, signed: null };\n}\n\nfunction summaryReturnCandidate(ir, ret, calls) {\n  const explicit = ret?.args?.[0]?.value || null;\n  if (explicit) return { value: explicit, descriptor: null, inferred: false };\n  const value = valueBefore(ir, ret, 'x0');\n  if (!value || value.kind === VK.ARG || !value.def) {\n    const descriptor = weakTerminalCallReturn(ir, ret, calls);\n    return descriptor ? { value: null, descriptor, inferred: true } : { value: null, descriptor: null, inferred: false };\n  }\n  if (value.def.row == null || ret.row == null || value.def.row >= ret.row) return { value: null, descriptor: null, inferred: false };\n  const laterUse = (value.uses || []).some((use) => use !== ret && use.row != null && use.row > value.def.row && use.row < ret.row);\n  if (laterUse) return { value: null, descriptor: null, inferred: false };\n  return { value, descriptor: null, inferred: true };\n}"""
          if s.count(old_candidate)!=1: raise SystemExit('summary return candidate source shape mismatch')
          s=s.replace(old_candidate,new_candidate,1)
          target='const candidate = summaryReturnCandidate(ir, ret);\n    const descriptor = returnDescriptor(candidate.value);'
          repl='const candidate = summaryReturnCandidate(ir, ret, calls);\n    const descriptor = candidate.descriptor || returnDescriptor(candidate.value);'
          if s.count(target)!=1: raise SystemExit('summary return use source shape mismatch')
          p.write_text(s.replace(target,repl,1))
          PY
      - name: Synchronize canonical userscript
        run: npm run userscript:build
      - name: Public IR and issue regressions
        run: |
          node tests/ir.mjs
          node tests/issues-434-450-regressions.mjs
      - name: Semantic IR v2 full gate
        run: npm run semantic-v2:test
      - name: effects:test
        run: npm run effects:test
      - name: core:test
        run: npm run core:test
      - name: invariants:test
        run: npm run invariants:test
      - name: migration:test
        run: npm run migration:test
      - name: semantic:test
        run: npm run semantic:test
      - name: decompiler:test
        run: npm run decompiler:test
      - name: compiler-truth
        run: npm run compiler-truth
      - name: platform:test
        run: npm run platform:test
      - name: runtime:test
        run: npm run runtime:test
      - name: ui:test
        run: npm run ui:test
      - name: benchmark:baseline
        run: npm run benchmark:baseline
      - name: ai:test
        run: npm run ai:test
      - name: userscript:test
        run: npm run userscript:test
      - name: check
        run: npm run check
      - name: Canonical userscript deterministic rebuild
        run: |
          cp userscript/hex.user.template.js /tmp/hex.user.before.js
          npm run userscript:build
          cmp /tmp/hex.user.before.js userscript/hex.user.template.js
          npm run userscript:test
      - name: Assert temporary Phase 3 workflow cleanup target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          allowed={Path('.github/workflows/p3-final-phase3-repair-v6.yml')}
          temporary={p for p in Path('.github/workflows').glob('p3-*.yml') if any(k in p.name for k in ('final','debug','repair','validation'))}
          extra=temporary-allowed
          if extra: raise SystemExit('unexpected temporary Phase 3 workflows: '+', '.join(map(str,sorted(extra))))
          PY
      - name: Commit validated product
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p3-final-phase3-repair-v6.yml
          git add js/semantics/compat/semantic-ir-v2-to-v1-finalize.js js/interproc.js userscript/hex.user.template.js
          git diff --cached --check
          git commit -m 'Phase 3: finalize public v1 projection after semantic-v2 cutover' -m 'Keep canonical state reads public, preserve argument arithmetic via retained provenance, and reconstruct only the legacy weak/untrusted terminal call-result summary from ABI clobber evidence. Unknown call memory/state effects remain conservative. All requested Phase 3 local gates pass before this commit.'
          git push origin HEAD:hex/p3-semantic-ir-integration
      - name: Cleanup failed workflow
        if: failure()
        run: |
          git reset --hard HEAD; git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; if [ -f .github/workflows/p3-final-phase3-repair-v6.yml ]; then git rm .github/workflows/p3-final-phase3-repair-v6.yml; git commit -m 'Phase 3: remove failed temporary final repair gate v6'; git push origin HEAD:hex/p3-semantic-ir-integration; fi
