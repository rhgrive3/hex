name: Phase 5 apply verified seam repair

on:
  push:
    branches:
      - hex/p5-x86-integration

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.repository == 'rhgrive3/hex' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact locally-verified P5-1/P5-2 seam patch
        shell: bash
        run: |
          set -euo pipefail
          cat .p5-repair/p52.patch.gz.b64.00 .p5-repair/p52.patch.gz.b64.01 > /tmp/p52.patch.gz.b64
          echo '69aca8ce51b044bcecd1a5798b04c6062a94396938a7999b499a8ee11bc246ed  /tmp/p52.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/p52.patch.gz.b64 | gzip -dc > /tmp/p52.patch
          git apply --check /tmp/p52.patch
          git apply /tmp/p52.patch
          test "$(git hash-object js/targets/architecture/index.js)" = e9a32c6f46f1f60a17beaa1182644068d75782b0
          test "$(git hash-object js/targets/architecture/x86_64/effects/integer.js)" = bcf112cb9a39cc341f6444c39f954c79ef913d15
          test "$(git hash-object js/targets/architecture/x86_64/effects/memory.js)" = acf15fb1fb6721246f7ce78b197d90cb4517df41
          test "$(git hash-object tests/capstone-capability.mjs)" = 749f86a330acc5ad6450be5aca1bf9c4d341fe67
          test "$(git hash-object tests/phase5/effects/int-control/integer-flags.test.mjs)" = 1f04a0954c446d2f86d6b4cda7e3c58b7d51a79b
          test "$(git hash-object tests/phase5/effects/int-control/safety-regression.test.mjs)" = 803e052ca3743986c02957795a0aacc42f662f4c
          test "$(git hash-object tests/phase5/effects/memory/handoff-safety.test.mjs)" = 44ad78192ac3ea1237af8a094420d05a57b6f453
          test "$(git hash-object tests/phase5/effects/memory/memory.test.mjs)" = af8d8d7e73f0fc91e938f93460735ff92b7d3966
      - name: Commit repaired production/test tree and remove transfer harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p5-repair
          rm -f .github/workflows/p5-apply-seam-repair.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 5: reconcile P5-1 and P5-2 x86 scalar seams'
          git push origin HEAD:refs/heads/hex/p5-x86-integration
