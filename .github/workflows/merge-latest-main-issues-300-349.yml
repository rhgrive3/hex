name: Verify issues 300-349 against latest main

on:
  push:
    branches: [fix-issues-300-349]

permissions:
  contents: write

concurrency:
  group: verify-issues-300-349-latest-main
  cancel-in-progress: false

jobs:
  merge-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-issues-300-349
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge latest main
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "js/project/index.js" ]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            # main contains newer schema validation. Keep that implementation and
            # reapply only the bounded import/export guarantees from #326/#327.
            git checkout --theirs js/project/index.js
            python3 - <<'PY'
          from pathlib import Path
          p = Path('js/project/index.js')
          s = p.read_text()
          s = s.replace(
              "const MAX_PROJECT_BYTES = 16 * 1024 * 1024;",
              "export const MAX_PROJECT_BYTES = 16 * 1024 * 1024;",
              1,
          )
          anchor = """const list = (value, name) => {
            if (value == null) return [];
            if (!Array.isArray(value)) throw new ProjectFormatError(`${name} must be an array`);
            if (value.length > MAX_COLLECTION_ITEMS) throw new ProjectFormatError(`${name} is unreasonably large`);
            return value;
          };
          """
          helper = anchor + """
          function encodedByteLength(text) { return new TextEncoder().encode(text).byteLength; }
          function assertProjectSize(bytes) {
            if (bytes > MAX_PROJECT_BYTES) throw new ProjectFormatError('project exceeds the 16 MiB safety limit', 'HEX_PROJECT_TOO_LARGE');
          }
          """
          if anchor not in s:
              raise SystemExit('list helper anchor not found')
          s = s.replace(anchor, helper, 1)
          old = """export function serializeHexProject(project) {
            const normalized = validateHexProject(project);
            return JSON.stringify(normalized, (_key, value) => typeof value === 'bigint' ? { $hexBigInt: value.toString(16) } : value, 2);
          }"""
          new = """export function serializeHexProject(project) {
            const normalized = validateHexProject(project);
            const text = JSON.stringify(normalized, (_key, value) => typeof value === 'bigint' ? { $hexBigInt: value.toString(16) } : value, 2);
            assertProjectSize(encodedByteLength(text));
            return text;
          }"""
          if old not in s:
              raise SystemExit('serializeHexProject shape not found')
          s = s.replace(old, new, 1)
          old = """  if (typeof input === 'string') text = input;
            else if (input instanceof Uint8Array) text = new TextDecoder().decode(input);
            else if (input instanceof ArrayBuffer) text = new TextDecoder().decode(new Uint8Array(input));
            else throw new ProjectFormatError('project input must be JSON text or bytes');
            if (new TextEncoder().encode(text).byteLength > MAX_PROJECT_BYTES) throw new ProjectFormatError('project exceeds the 16 MiB safety limit', 'HEX_PROJECT_TOO_LARGE');"""
          new = """  if (typeof input === 'string') text = input;
            else if (input instanceof Uint8Array) { assertProjectSize(input.byteLength); text = new TextDecoder().decode(input); }
            else if (input instanceof ArrayBuffer) { assertProjectSize(input.byteLength); text = new TextDecoder().decode(new Uint8Array(input)); }
            else throw new ProjectFormatError('project input must be JSON text or bytes');
            assertProjectSize(encodedByteLength(text));"""
          if old not in s:
              raise SystemExit('parseHexProject shape not found')
          s = s.replace(old, new, 1)
          old = "export async function importHexProject(input) { if (typeof Blob !== 'undefined' && input instanceof Blob) return parseHexProject(await input.text()); return parseHexProject(input); }"
          new = """export async function importHexProject(input) {
            if (typeof Blob !== 'undefined' && input instanceof Blob) {
              assertProjectSize(input.size);
              return parseHexProject(await input.text());
            }
            return parseHexProject(input);
          }"""
          if old not in s:
              raise SystemExit('importHexProject shape not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
            git add js/project/index.js
            git commit --no-edit
          fi
          git diff --check

      - name: Run issue regression suite
        run: node tests/issues-300-349.mjs

      - name: Run repository checks
        run: npm run check

      - name: Publish verified integration
        run: |
          set -euxo pipefail
          rm -f .github/workflows/merge-latest-main-issues-300-349.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary latest-main verification workflow'
          fi
          git push origin HEAD:fix-issues-300-349
