name: TEMP Round 4 ownership cleanup

on:
  push:
    branches:
      - fix/round4-new-chat-busy-false-positive

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[ownership-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/round4-new-chat-busy-false-positive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove cross-phase package wiring while preserving regression coverage
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- package.json
          git rm -f tests/chatgpt-new-chat-generating-guard.mjs
          node tests/chatgpt-disabled-stop-settlement.mjs
          npm run userscript:test
      - name: Commit ownership-clean test layout
        shell: bash
        run: |
          set -euo pipefail
          git add package.json tests/chatgpt-disabled-stop-settlement.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Keep busy regression inside existing userscript test [ownership-clean]'
          git push origin HEAD:fix/round4-new-chat-busy-false-positive
