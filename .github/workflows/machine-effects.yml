name: MachineEffects Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-effects-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  five-issue-verification:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issues-799-801-806-807-810' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Targeted five-issue regressions
        run: node tests/issues-799-801-806-807-810.mjs
      - name: Objective-C compatibility regressions
        run: |
          node tests/objc-metadata.mjs
          node tests/objc-runtime.mjs
      - name: Repository check
        run: npm run check

  machine-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MachineEffects contract tests
        run: npm run effects:test
