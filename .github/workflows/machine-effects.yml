name: MachineEffects Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machine-effects-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-807-format:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issues-799-801-806-807-810' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply format-aware patch
        run: python .github/apply-807-format.py
      - name: Targeted regressions
        run: |
          node tests/issues-799-801-806-807-810.mjs
          node tests/objc-metadata.mjs
          node tests/objc-runtime.mjs
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/objc-legacy.js tests/issues-799-801-806-807-810.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make ObjC chained pointer decoding format-aware"
          git push origin HEAD:${{ github.head_ref }}

  machine-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MachineEffects contract tests
        run: npm run effects:test
