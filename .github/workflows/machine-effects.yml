name: MachineEffects Contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: machine-effects-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  machine-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/open-issue-fixes-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect compare projection metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          t = Path('tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs')
          q = t.read_text()
          needle = "  const fact = firstBranchFact(build(lines, `825-${tag}`));"
          repl = "  const debug = modelOf(lines);\n  const debugIr = irFor(debug.model, { rowOfAddress:debug.rowOfAddress, decoderSemanticVersion:`issue-soundness-825-${tag}` });\n  const debugCmp = debugIr.instructions.find((inst) => inst.op === OP.CMP);\n  console.log('DEBUG_EXTRA', tag, JSON.stringify(debugCmp?.extra ?? null, (_k,v)=>typeof v==='bigint'?v.toString():v));\n  const fact = firstBranchFact(debugIr);"
          assert needle in q
          t.write_text(q.replace(needle, repl))
          PY
          node --test tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
