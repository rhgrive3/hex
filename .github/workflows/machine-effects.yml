name: MachineEffects Contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: machine-effects-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  machine-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/open-issue-fixes-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect same-instruction compare projection nodes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          t = Path('tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs')
          q = t.read_text()
          needle = "  const fact = firstBranchFact(build(lines, `825-${tag}`));"
          repl = "  const debug = build(lines, `825-${tag}`);\n  if (tag === 'w-lsl-wrap') {\n    for (const inst of debug.instructions.filter((x) => x.row === 1)) console.log('DEBUG_INST', JSON.stringify({op:inst.op,sub:inst.sub,bits:inst.bits,args:(inst.args||[]).map((a)=>({const:a?.value?.const==null?null:a.value.const.toString(),bits:a?.bits??null})),extra:inst.extra}, (_k,v)=>typeof v==='bigint'?v.toString():v));\n  }\n  const fact = firstBranchFact(debug);"
          assert needle in q
          t.write_text(q.replace(needle, repl))
          PY
          node --test tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
