name: MachineEffects Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: machine-effects-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-five-issue-fix:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/issues-799-801-806-807-810' && !contains(github.event.pull_request.head.sha, 'never') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patches
        run: python .github/apply-five.py
      - name: Targeted regression
        run: node tests/issues-799-801-806-807-810.mjs
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/decompiler/rewrite/rules.js js/expr.js js/interproc.js js/objc-legacy.js js/rtti.js tests/issues-799-801-806-807-810.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: resolve five semantic correctness issues [five-issue-applied]"
          git push origin HEAD:${{ github.head_ref }}

  machine-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MachineEffects contract tests
        run: npm run effects:test
