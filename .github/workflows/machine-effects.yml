name: MachineEffects Contract
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: final-open-pr-consolidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  machine-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/open-issue-fixes-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Materialize reviewed source fixes on the combined tree
        run: python3 tools/validation/tmp-consolidate-open-prs.py

      - name: Build canonical generated userscript
        run: npm run userscript:build

      - name: Focused regressions and mixed ownership
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --check
          node --test tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          node --test tests/phase6/abi/riscv-issues-868-872.test.mjs
          node tests/dev-agent/pool-completion-event-resume.mjs
          node tests/userscript-runtime-host-location.mjs
          node tests/issues-802-821-824-859-866.mjs
          node --test tests/phase4/ownership/mixed-integration.test.mjs
          git diff --name-only -z "$BASE_SHA" | node tools/validation/phase4/mixed-integration.mjs --files0-stdin

      - name: Full aggregate verification
        shell: bash
        run: |
          set -euo pipefail
          npm run semantic-v2:test
          npm run check
          npm run userscript:build

      - name: Publish only the verified product tree
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            .github/workflows/machine-effects.yml \
            .github/workflows/migration-guardrails.yml
          rm tools/validation/tmp-consolidate-open-prs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/ir.js \
            js/semantics/compat/semantic-ir-v2-to-v1.js \
            js/emu.js \
            js/expr.js \
            js/semantics/ir/normalize-effects.js \
            js/targets/abi/riscv-lp64.js \
            js/userscript/dev/parent-worker-runtime.js \
            tests/phase6/abi/riscv-issues-868-872.test.mjs \
            tests/dev-agent/pool-completion-event-resume.mjs \
            tests/userscript-runtime-host-location.mjs \
            tests/issues-802-821-824-859-866.mjs \
            tools/validation/phase4/mixed-integration.mjs \
            tests/phase4/ownership/mixed-integration.test.mjs \
            .github/workflows/phase4-ownership.yml \
            .github/workflows/phase4-release-validation.yml \
            package.json \
            userscript/hex.user.template.js \
            userscript/release-version.json
          git add -A -- \
            .github/workflows/machine-effects.yml \
            .github/workflows/migration-guardrails.yml \
            tools/validation/tmp-consolidate-open-prs.py
          git diff --cached --check
          git commit -m "Finalize all current issue fixes on current main"
          git push origin HEAD:integrate/open-issue-fixes-20260819
