name: MachineEffects Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: machine-effects-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  machine-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MachineEffects contract tests
        run: npm run effects:test
