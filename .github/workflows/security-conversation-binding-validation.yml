name: Conversation binding validation
on: [push]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reproduce pre-fix trust-boundary failure
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { ChatGPTConversationRouter } from './js/userscript/chatgpt-adapter.js';
          const values = new Map();
          const storage = { getItem: k => values.get(k) ?? null, setItem: (k, v) => values.set(k, String(v)) };
          storage.setItem('hex.chatgpt.conversations.v1', JSON.stringify({ victim: { id: 'attacker-chat', url: 'https://chatgpt.com/c/attacker-chat' } }));
          const previous = globalThis.localStorage;
          globalThis.localStorage = storage;
          try {
            const router = new ChatGPTConversationRouter({ conversation: () => null });
            assert.equal(router.binding('victim')?.id, 'attacker-chat');
            console.log('confirmed: page-origin storage controls default conversation binding');
          } finally {
            if (previous === undefined) delete globalThis.localStorage; else globalThis.localStorage = previous;
          }
          NODE
      - name: Apply candidate fix and regression locally
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/userscript/chatgpt-adapter.js')
          s = p.read_text()
          old = "constructor(adapter, { storage = globalThis.localStorage, storageKey = 'hex.chatgpt.conversations.v1', navigationTimeoutMs = 12000 } = {})"
          new = "constructor(adapter, { storage = null, storageKey = 'hex.chatgpt.conversations.v1', navigationTimeoutMs = 12000 } = {})"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          p = Path('tests/chatgpt-web-runtime.mjs')
          s = p.read_text()
          call = 'await testConversationRouting();\n'
          assert s.count(call) == 1
          s = s.replace(call, call + 'await testConversationRoutingIgnoresPageOriginStorageByDefault();\n', 1)
          anchor = '\nasync function testNewConversationRouteWaitsForOldTurns() {'
          assert s.count(anchor) == 1
          fn = '''\n\nasync function testConversationRoutingIgnoresPageOriginStorageByDefault() {\n  const storage = memoryStorage();\n  storage.setItem('hex.chatgpt.conversations.v1', JSON.stringify({\n    victim: { id: 'attacker-chat', url: 'https://chatgpt.com/c/attacker-chat' },\n  }));\n  const previous = globalThis.localStorage;\n  globalThis.localStorage = storage;\n  try {\n    const router = new ChatGPTConversationRouter({ conversation: () => null }, { navigationTimeoutMs: 30 });\n    assert.equal(router.binding('victim'), null, 'page-origin storage must not define Hex session routing');\n  } finally {\n    if (previous === undefined) delete globalThis.localStorage;\n    else globalThis.localStorage = previous;\n  }\n}\n'''
          p.write_text(s.replace(anchor, fn + anchor, 1))
          PY
      - run: node tests/chatgpt-web-runtime.mjs
      - run: npm run lint
      - run: npm run ai:test
      - run: npm run userscript:test
      - run: npm run userscript:build
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: validated-conversation-binding-fix
          path: |
            js/userscript/chatgpt-adapter.js
            tests/chatgpt-web-runtime.mjs
            userscript/hex.user.template.js
