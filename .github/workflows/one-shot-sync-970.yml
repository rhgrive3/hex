name: One-shot sync issue 970
on:
  push:
    branches: [work/unlinked-970-virtual-read-span]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/unlinked-970-virtual-read-span
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - name: Verify deterministic CI-derived identity
        shell: bash
        run: |
          grep -F '2.0.2322241746' userscript/hex.user.template.js
          grep -F '8c80fae433e5cee995fd00ff' userscript/hex.user.template.js
          grep -F '32c8e81ec7ad0765e3ba7dcfe6d5c7b779146cdf86af50eae7a36e48cbae3560' userscript/release-version.json
          git diff --check
      - name: Publish generated transaction and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-shot-sync-970.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A userscript/hex.user.template.js userscript/release-version.json .github/workflows/one-shot-sync-970.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: sync canonical userscript for #970'
          git push origin HEAD:work/unlinked-970-virtual-read-span
