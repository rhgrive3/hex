name: Phase 3 debug public IR 350 series
on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-debug-public-ir-350.yml']
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hex/p3-semantic-ir-integration }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Narrow required public-state compaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js'); s=p.read_text()
          old="    } else if (inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias) && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          new="    } else if (inst.extra?.stateRead && inst.extra?.localPhysicalViewProjection === true && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          s=s.replace("    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);\n",'',1).replace(old,new,1)
          p.write_text(s)
          PY
      - name: Emit narrowed production shapes
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js';
          import { buildIR, OP, originOf } from './js/ir.js';
          import { reachingRegisterValue } from './js/decompiler/semantic.js';
          const B=0x100000000n;
          function rows(lines){return lines.map((line,i)=>{const s=line.trim(),p=s.indexOf(' ');return{row:i,address:B+BigInt(i*4),mn:p<0?s:s.slice(0,p),ops:p<0?'':s.slice(p+1)}})}
          function build(lines){const rowOfAddress=a=>{const d=a-B;return d<0n||d>=BigInt(lines.length*4)?null:Number(d/4n)};const model=buildSemanticModel(rows(lines),{startRow:0,endRow:lines.length-1,rowOfAddress});return buildIR(model,{rowOfAddress})}
          function val(v){return v&&{id:v.id,kind:v.kind,reg:v.reg??null,stateKey:v.stateKey??null,bits:v.bits??null,version:v.version??null,const:v.const==null?null:String(v.const),clobbered:!!v.clobbered,origin:originOf(v),compat:v.compatDerived??null,def:v.def&&{id:v.def.id,row:v.def.row,op:v.def.op,sub:v.def.sub,extra:{stateRead:!!v.def.extra?.stateRead,stateWrite:!!v.def.extra?.stateWrite,publicStateIdentity:v.def.extra?.publicStateIdentity??null,localPhysicalViewProjection:v.def.extra?.localPhysicalViewProjection??null,compatReachingPublicValueId:v.def.extra?.compatReachingPublicValueId??null}}}}
          function inst(i){return{id:i.id,row:i.row,block:i.block,op:i.op,sub:i.sub,dst:val(i.dst),args:(i.args||[]).map(a=>val(a?.value)),loc:i.loc&&{kind:i.loc.kind,key:i.loc.key,size:i.loc.size,disp:i.loc.disp==null?null:String(i.loc.disp),base:val(i.loc.base)},addr:i.addr&&{disp:i.addr.disp==null?null:String(i.addr.disp),size:i.addr.size,base:val(i.addr.base),index:val(i.addr.index)},reachingStore:i.reachingStore?.id??null,memUse:i.memUse?.id??null,memDef:i.memDef?.id??null,clobbers:i.clobbers??i.extra?.clobbers??null,extra:{conditional:i.extra?.conditional??null,fallbackNzcv:i.extra?.fallbackNzcv??null,stateRead:!!i.extra?.stateRead,stateWrite:!!i.extra?.stateWrite,publicStateIdentity:i.extra?.publicStateIdentity??null,localPhysicalViewProjection:i.extra?.localPhysicalViewProjection??null}}
          function emit(name,ir,extra={}){console.log(`::warning title=${name}::`+JSON.stringify({values:ir.values.map(val),instructions:ir.instructions.map(inst),...extra},(_,v)=>typeof v==='bigint'?v.toString():v))}
          let ir=build(['cmp w0, #0','ccmp w1, w2, #6, eq','b.ne #0x10000000c','ret']); emit('P3_351_NARROW',ir,{conditionalCmp:ir.instructions.filter(x=>x.op===OP.CMP&&x.extra?.conditional).map(inst)});
          ir=build(['mov w0, #1','mov w1, #32','lsl w2, w0, w1','ret']); emit('P3_352_NARROW',ir,{x2:ir.values.filter(v=>v.reg==='x2').map(val)});
          ir=build(['mov x2, #7','bl #0x200000000','add x0, x2, #1','ret']); const add=ir.instructions.find(x=>x.op===OP.BIN); emit('P3_355_NARROW',ir,{reachingX2:val(reachingRegisterValue(ir,add,'x2'))});
          ir=build(['sub sp, sp, #32','str x0, [sp, #16]','str w2, [x0, #32]','ldr x3, [sp, #16]','add sp, sp, #32','ret']); const load=ir.instructions.find(x=>x.op===OP.LOAD&&x.dst?.reg==='x3'); emit('P3_359_NARROW',ir,{stackLoad:load?inst(load):null});
          NODE
      - name: Emit explicit legacy oracle shapes
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js'; import {buildIR,OP,setSemanticMigrationMode,originOf} from './js/ir.js'; import {reachingRegisterValue} from './js/decompiler/semantic.js'; setSemanticMigrationMode('legacy-v1'); const B=0x100000000n;
          function rows(lines){return lines.map((line,i)=>{const s=line.trim(),p=s.indexOf(' ');return{row:i,address:B+BigInt(i*4),mn:p<0?s:s.slice(0,p),ops:p<0?'':s.slice(p+1)}})} function build(lines){const rowOfAddress=a=>{const d=a-B;return d<0n||d>=BigInt(lines.length*4)?null:Number(d/4n)};const model=buildSemanticModel(rows(lines),{startRow:0,endRow:lines.length-1,rowOfAddress});return buildIR(model,{rowOfAddress})} function v(x){return x&&{id:x.id,kind:x.kind,reg:x.reg??null,stateKey:x.stateKey??null,bits:x.bits??null,version:x.version??null,const:x.const==null?null:String(x.const),clobbered:!!x.clobbered,origin:originOf(x),def:x.def&&{id:x.def.id,row:x.def.row,op:x.def.op,sub:x.def.sub}}} function i(x){return{id:x.id,row:x.row,block:x.block,op:x.op,sub:x.sub,dst:v(x.dst),args:(x.args||[]).map(a=>v(a?.value)),loc:x.loc&&{kind:x.loc.kind,key:x.loc.key,size:x.loc.size,disp:x.loc.disp==null?null:String(x.loc.disp),base:v(x.loc.base)},addr:x.addr&&{disp:x.addr.disp==null?null:String(x.addr.disp),size:x.addr.size,base:v(x.addr.base),index:v(x.addr.index)},reachingStore:x.reachingStore?.id??null,clobbers:x.clobbers??x.extra?.clobbers??null,extra:{conditional:x.extra?.conditional??null,fallbackNzcv:x.extra?.fallbackNzcv??null}}} function emit(n,ir,e={}){console.log(`::warning title=${n}::`+JSON.stringify({values:ir.values.map(v),instructions:ir.instructions.map(i),...e},(_,z)=>typeof z==='bigint'?z.toString():z))}
          let ir=build(['cmp w0, #0','ccmp w1, w2, #6, eq','b.ne #0x10000000c','ret']);emit('P3_351_LEGACY',ir,{conditionalCmp:ir.instructions.filter(x=>x.op===OP.CMP&&x.extra?.conditional).map(i)});
          ir=build(['mov w0, #1','mov w1, #32','lsl w2, w0, w1','ret']);emit('P3_352_LEGACY',ir,{x2:ir.values.filter(x=>x.reg==='x2').map(v)});
          ir=build(['mov x2, #7','bl #0x200000000','add x0, x2, #1','ret']);const add=ir.instructions.find(x=>x.op===OP.BIN);emit('P3_355_LEGACY',ir,{reachingX2:v(reachingRegisterValue(ir,add,'x2'))});
          ir=build(['sub sp, sp, #32','str x0, [sp, #16]','str w2, [x0, #32]','ldr x3, [sp, #16]','add sp, sp, #32','ret']);const load=ir.instructions.find(x=>x.op===OP.LOAD&&x.dst?.reg==='x3');emit('P3_359_LEGACY',ir,{stackLoad:load?i(load):null});
          NODE
      - name: Cleanup
        if: always()
        run: |
          git reset --hard HEAD
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p3-debug-public-ir-350.yml
          git commit -m 'Phase 3: remove temporary public IR 350 debug workflow'
          git push origin HEAD:hex/p3-semantic-ir-integration
