name: Phase 3 debug terminal x0 projection diff
on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-debug-437-diff.yml']
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hex/p3-semantic-ir-integration }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Emit broad projection
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js'; import {irFor,originOf} from './js/ir.js'; import {summarizeFunction} from './js/interproc.js'; import {valueBefore} from './js/dataflow-semantic.js';
          const B=0x100000000n,L=['bl #0x100001000','ret']; const rows=L.map((line,i)=>{const p=line.indexOf(' ');return{row:i,address:B+BigInt(i*4),mn:p<0?line:line.slice(0,p),ops:p<0?'':line.slice(p+1)}}); const m=buildSemanticModel(rows,{startRow:0,endRow:1,rowOfAddress:a=>{const d=a-B;return d<0n||d>=8n?null:Number(d/4n)}}); const ir=irFor(m),ret=ir.instructions.find(i=>i.op==='ret'),v=valueBefore(ir,ret,'x0'); const mini=x=>x&&({id:x.id,kind:x.kind,reg:x.reg,bits:x.bits,origin:originOf(x),def:x.def&&{id:x.def.id,row:x.def.row,op:x.def.op,sub:x.def.sub,stateRead:!!x.def.extra?.stateRead,publicStateIdentity:x.def.extra?.publicStateIdentity??null,local:x.def.extra?.localPhysicalViewProjection??null}}); console.log('::warning title=P3_437_BROAD::'+JSON.stringify({x0:mini(v),summary:summarizeFunction(m),x0Values:ir.values.filter(x=>x.reg==='x0'||x.def?.extra?.publicStateIdentity==='x0').map(mini),calls:ir.instructions.filter(i=>i.op==='call').map(i=>({id:i.id,row:i.row,dst:mini(i.dst),extra:i.extra}))},(_,v)=>typeof v==='bigint'?v.toString():v));
          NODE
      - name: Narrow finalizer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js');s=p.read_text();s=s.replace("    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);\n","",1);s=s.replace("inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias)","inst.extra?.stateRead && inst.extra?.localPhysicalViewProjection === true",1);p.write_text(s)
          PY
      - name: Emit narrow projection
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js'; import {irFor,originOf} from './js/ir.js'; import {summarizeFunction} from './js/interproc.js'; import {valueBefore} from './js/dataflow-semantic.js';
          const B=0x100000000n,L=['bl #0x100001000','ret']; const rows=L.map((line,i)=>{const p=line.indexOf(' ');return{row:i,address:B+BigInt(i*4),mn:p<0?line:line.slice(0,p),ops:p<0?'':line.slice(p+1)}}); const m=buildSemanticModel(rows,{startRow:0,endRow:1,rowOfAddress:a=>{const d=a-B;return d<0n||d>=8n?null:Number(d/4n)}}); const ir=irFor(m),ret=ir.instructions.find(i=>i.op==='ret'),v=valueBefore(ir,ret,'x0'); const mini=x=>x&&({id:x.id,kind:x.kind,reg:x.reg,bits:x.bits,origin:originOf(x),def:x.def&&{id:x.def.id,row:x.def.row,op:x.def.op,sub:x.def.sub,stateRead:!!x.def.extra?.stateRead,publicStateIdentity:x.def.extra?.publicStateIdentity??null,local:x.def.extra?.localPhysicalViewProjection??null}}); console.log('::warning title=P3_437_NARROW::'+JSON.stringify({x0:mini(v),summary:summarizeFunction(m),x0Values:ir.values.filter(x=>x.reg==='x0'||x.def?.extra?.publicStateIdentity==='x0').map(mini),calls:ir.instructions.filter(i=>i.op==='call').map(i=>({id:i.id,row:i.row,dst:mini(i.dst),extra:i.extra}))},(_,v)=>typeof v==='bigint'?v.toString():v));
          NODE
      - name: Cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git rm .github/workflows/p3-debug-437-diff.yml; git commit -m 'Phase 3: remove temporary #437 projection diff workflow'; git push origin HEAD:hex/p3-semantic-ir-integration
