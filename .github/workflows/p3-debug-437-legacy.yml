name: Phase 3 debug legacy weak terminal return oracle
on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-debug-437-legacy.yml']
permissions:
  contents: write
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hex/p3-semantic-ir-integration }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Emit explicit legacy oracle
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js'; import {irFor,originOf,setSemanticMigrationMode} from './js/ir.js'; import {summarizeFunction} from './js/interproc.js'; import {valueBefore} from './js/dataflow-semantic.js';
          setSemanticMigrationMode('legacy-v1'); const B=0x100000000n,L=['bl #0x100001000','ret']; const rows=L.map((line,i)=>{const p=line.indexOf(' ');return{row:i,address:B+BigInt(i*4),mn:p<0?line:line.slice(0,p),ops:p<0?'':line.slice(p+1)}}); const m=buildSemanticModel(rows,{startRow:0,endRow:1,rowOfAddress:a=>{const d=a-B;return d<0n||d>=8n?null:Number(d/4n)}}); const ir=irFor(m),ret=ir.instructions.find(i=>i.op==='ret'),v=valueBefore(ir,ret,'x0'); const mini=x=>x&&({id:x.id,kind:x.kind,reg:x.reg,bits:x.bits,origin:originOf(x),def:x.def&&{id:x.def.id,row:x.def.row,op:x.def.op,sub:x.def.sub,extra:x.def.extra}}); console.log('::warning title=P3_437_LEGACY::'+JSON.stringify({x0:mini(v),summary:summarizeFunction(m),x0Values:ir.values.filter(x=>x.reg==='x0').map(mini),calls:ir.instructions.filter(i=>i.op==='call').map(i=>({id:i.id,row:i.row,dst:mini(i.dst),extra:i.extra}))},(_,v)=>typeof v==='bigint'?v.toString():v));
          NODE
      - name: Cleanup
        if: always()
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git rm .github/workflows/p3-debug-437-legacy.yml; git commit -m 'Phase 3: remove temporary legacy #437 debug workflow'; git push origin HEAD:hex/p3-semantic-ir-integration
