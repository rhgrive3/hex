name: Temp isolated disposed backend epoch guard
on:
  push:
    branches:
      - review-final-disposed-epoch-isolated
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-final-disposed-epoch-isolated
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply minimal guard and regression
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          {
            const path='js/backend.js';
            const lines=fs.readFileSync(path,'utf8').split('\n');
            const at=lines.findIndex((line)=>line.trim()==='advanceEpoch() {');
            if(at<0)throw new Error('advanceEpoch not found');
            if(!lines.slice(at,at+5).some((line)=>line.includes('if (this.disposed) return this.analysisEpoch;'))){
              lines.splice(at+1,0,'    if (this.disposed) return this.analysisEpoch;');
              fs.writeFileSync(path,lines.join('\n'));
            }
          }
          {
            const path='tests/backend-disposal.mjs';
            const lines=fs.readFileSync(path,'utf8').split('\n');
            const marker='disposed backend epoch advance must be a no-op';
            if(!lines.some((line)=>line.includes(marker))){
              const needle="  assert.equal(messagesAfter,messagesBefore,'disposed backend open must not post to terminated workers');";
              const at=lines.indexOf(needle);
              if(at<0)throw new Error('backend disposal anchor not found');
              lines.splice(at+1,0,
                '  const epochAfterDispose=b.gen;',
                "  assert.equal(b.advanceEpoch(),epochAfterDispose,'disposed backend epoch advance must be a no-op');",
                '  const messagesAfterEpoch=workers.slice(0,2).reduce((sum,w)=>sum+w.sent.length,0);',
                "  assert.equal(messagesAfterEpoch,messagesAfter,'disposed backend epoch advance must not post to terminated workers');"
              );
              fs.writeFileSync(path,lines.join('\n'));
            }
          }
          EOF
      - run: npm ci
      - run: node tests/backend-disposal.mjs
      - run: npm run check
      - name: Commit source/regression and delete this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_temp-isolated-disposed-epoch.yml
          git add js/backend.js tests/backend-disposal.mjs .github/workflows
          git commit -m 'Make disposed backend epoch transitions inert'
      - name: Build and verify deployment bundle
        run: |
          npm run userscript:build
          npm run userscript:test
      - name: Commit generated bundles
        run: |
          git add userscript/hex.user.template.js userscript/platform-worker.bundle.js
          if ! git diff --cached --quiet; then
            git commit -m 'Sync bundles after disposed backend epoch hardening'
          fi
          git push origin HEAD:review-final-disposed-epoch-isolated