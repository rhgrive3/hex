name: Issue 500 matcher budget

on:
  push:
    branches:
      - fix/issue-500-matcher-budget

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[issue-500-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded matcher integration
        run: |
          python3 tools/apply-issue-500.py
          python3 tools/cleanup-issue-500.py
      - name: Focused matcher budget regression
        run: node tests/issue-500-matcher-budget.mjs
      - name: Recognition regression suite
        run: node tests/recognition-intelligence.mjs
      - name: Static checks
        run: |
          node --check js/recognition/match-budget.js
          node --check js/recognition/bounded-matching.js
          node --check js/recognition/matcher.js
          node --check tests/issue-500-matcher-budget.mjs
      - name: Full lint
        run: npm run lint
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/recognition/matcher.js
          git commit -m 'Fix #500 bounded cross-version matching [issue-500-applied]'
          git push
