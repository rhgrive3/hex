name: Temporary ready PR 485 merge helper
on:
  push:
    branches: [fix/latest-478-476-notes]
permissions:
  contents: write
jobs:
  merge-main:
    if: startsWith(github.event.head_commit.message, 'ready-pr-merge-helper:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge current main, validate, and clean helper
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/merge-ready-485.yml
          git add -A
          npm run check
          git commit -m 'Merge current main into #485'
          git push origin HEAD:fix/latest-478-476-notes
