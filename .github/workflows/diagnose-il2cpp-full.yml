name: Diagnose IL2CPP full regression
on:
  push:
    branches: [fix/all-remaining-issues-20260815]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture failing full test
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/fix-il2cpp-remaining.py'); s=p.read_text().replace("if old not in s: raise SystemExit('tools il2cpp picker anchor missing')", "if old not in s: print('tools picker patched separately')"); p.write_text(s)
          PY
          python tools/fix-il2cpp-remaining.py
          python tools/fix-il2cpp-preflight.py
          python tools/fix-il2cpp-ui.py
          node tests/run.js > il2cpp-full-output.txt 2>&1
          rc=$?
          cat il2cpp-full-output.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add il2cpp-full-output.txt
          git commit -m "chore: capture IL2CPP full regression output [skip ci]"
          git push origin HEAD:fix/all-remaining-issues-20260815
          exit $rc
