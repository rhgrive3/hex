name: Phase 6 release validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/open-issue-fixes-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply reviewed PR942 reconciliation
        run: |
          python3 - <<'PYRUN'
          from pathlib import Path

          workflow = Path('.github/workflows/generated-sync.yml').read_text()
          marker = "      - name: Apply PR942 source reconciliation\n"
          section = workflow.find(marker)
          if section < 0:
            raise SystemExit('PR942 reconciliation section not found')
          begin_marker = "          python3 - <<'PY'\n"
          begin = workflow.find(begin_marker, section)
          if begin < 0:
            raise SystemExit('PR942 reconciliation block start not found')
          begin += len(begin_marker)
          end = workflow.find("\n          PY\n", begin)
          if end < 0:
            raise SystemExit('PR942 reconciliation block end not found')
          block = workflow[begin:end]
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          exec(compile(script, 'generated-sync.yml', 'exec'))
          PYRUN
          git diff --check
      - name: Focused semantic regressions
        run: |
          node tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          node tests/issue-861-862-c-printer-signedness.mjs
          node tests/decompiler-semantic.mjs
          node tests/phase6/generic-core/degenerate-control-dependency.test.mjs
          node tests/worker-classic-harness.mjs
          node tests/phase6/run.mjs --group generic-core
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Full repository verification
        run: npm run check
      - name: Verify userscript build idempotence
        run: |
          git diff > /tmp/prebuild.diff
          npm run userscript:build
          git diff > /tmp/postbuild.diff
          diff -u /tmp/prebuild.diff /tmp/postbuild.diff
      - name: Publish verified source and restore permanent CI
        run: |
          git fetch origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout origin/main -- .github/workflows/phase6-release-validation.yml .github/workflows/generated-sync.yml
          if git cat-file -e origin/main:.github/workflows/sandbox-security.yml 2>/dev/null; then
            git checkout origin/main -- .github/workflows/sandbox-security.yml
          fi
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-pr942-ci.yml \
            .github/workflows/finalize-pr942-push.yml \
            .github/workflows/fix-pr942-range.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize PR942 branch-range semantics'
          git push origin HEAD:integrate/open-issue-fixes-current-main-20260819
