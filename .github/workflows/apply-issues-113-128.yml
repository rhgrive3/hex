name: Apply issues 113-128
on:
  push:
    branches: [fix/issues-110-122-20260815]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          python3 tools/apply-issues-113-128.py
          python3 tools/postfix-issues-113-128.py
      - name: Focused regression
        run: |
          node tests/issues-113-128.mjs
          node tests/api.mjs
          node tests/ir.mjs
          node tests/decompiler-semantic.mjs
      - run: node tests/check.mjs
      - name: Commit verified result
        run: |
          git rm tools/apply-issues-113-128.py tools/postfix-issues-113-128.py .github/workflows/apply-issues-113-128.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: correct API semantics and preserve parser diagnostics 113-128'
          git push origin HEAD:fix/issues-110-122-20260815
