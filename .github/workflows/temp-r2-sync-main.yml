name: Temporary Round 2 main sync

on:
  push:
    branches:
      - hex/dev-agent-seed-r2-single-worker

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main and resolve known userscript overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -ne 0 ]; then
            for f in \
              js/userscript/entry.js \
              js/userscript/loader.js \
              js/userscript/protected-entry.js \
              userscript/hex.user.template.js
            do
              if git ls-files -u -- "$f" | grep -q .; then
                git checkout --ours -- "$f"
                git add "$f"
              fi
            done
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unexpected merge conflicts:" >&2
            echo "$remaining" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          def insert_once(path, old, new, marker):
              p = Path(path)
              text = p.read_text()
              if marker in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected merge anchor missing in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          insert_once(
              'js/userscript/entry.js',
              '      buildId: options.buildId,\n    });',
              '      buildId: options.buildId,\n      runtimeContentHash: options.runtimeContentHash,\n    });',
              'runtimeContentHash: options.runtimeContentHash',
          )
          insert_once(
              'js/userscript/entry.js',
              '    runtimeSourceProvider: options.runtimeSourceProvider,\n    bootstrapTimeoutMs:',
              '    runtimeSourceProvider: options.runtimeSourceProvider,\n    runtimeContentHash: String(options.runtimeContentHash || \'\'),\n    bootstrapTimeoutMs:',
              "runtimeContentHash: String(options.runtimeContentHash || '')",
          )
          insert_once(
              'js/userscript/loader.js',
              '      buildId: EXPECTED_BUILD,\n      devTabMeshSecret:',
              "      buildId: EXPECTED_BUILD,\n      runtimeContentHash: String(bootstrap.manifest.contentHash || '').toLowerCase(),\n      devTabMeshSecret:",
              'runtimeContentHash: String(bootstrap.manifest.contentHash',
          )
          insert_once(
              'js/userscript/protected-entry.js',
              '      devTabMeshSecret: options.devTabMeshSecret,\n      loaderVersion:',
              "      devTabMeshSecret: options.devTabMeshSecret,\n      runtimeContentHash: String(options.runtimeContentHash || ''),\n      loaderVersion:",
              "runtimeContentHash: String(options.runtimeContentHash || '')",
          )
          PY

      - name: Install dependencies and regenerate committed userscript
        run: |
          npm ci
          npm run userscript:build

      - name: Focused validation
        run: |
          node tests/dev-agent/round1-foundation.mjs
          node tests/dev-agent/round2-single-worker.mjs
          node tests/userscript-chatgpt-sandbox-host.mjs
          node tests/userscript-dev-worker-runtime.mjs
          node tests/userscript-embed-child.mjs
          node --check userscript/hex.user.template.js
          git diff --check
          if grep -R "<<<<<<<\|=======\|>>>>>>>" -n js/userscript userscript/hex.user.template.js; then
            echo "Merge conflict marker found" >&2
            exit 1
          fi

      - name: Commit synchronized Round 2 branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Sync Round 2 with runtime-integrity hardening"
          git push origin HEAD:${GITHUB_REF_NAME}
