name: Cross-binary accuracy

# This required accuracy job is fail-closed: it may only pass when all pinned
# real-binary fixtures are configured and their heavyweight oracle checks run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/**'
      - 'tests/**'
      - 'scripts/fetch-real-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/cross-binary-accuracy.yml'

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEX_FIXTURE_BATTLECATS_URL: ${{ secrets.HEX_FIXTURE_BATTLECATS_URL }}
      HEX_FIXTURE_TSUMTSUM_URL: ${{ secrets.HEX_FIXTURE_TSUMTSUM_URL }}
      HEX_FIXTURE_YWP_URL: ${{ secrets.HEX_FIXTURE_YWP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workflow contract regression
        run: node tests/issue-497-cross-binary-workflow.mjs
      - name: Core checks
        run: npm run check
      - name: Matcher scaling regression
        run: node tests/issue-500-matcher-budget.mjs
      - name: Detect real fixture configuration
        id: fixtures
        shell: bash
        run: |
          if [[ -n "$HEX_FIXTURE_BATTLECATS_URL" && -n "$HEX_FIXTURE_TSUMTSUM_URL" && -n "$HEX_FIXTURE_YWP_URL" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require all real fixture URLs
        if: steps.fixtures.outputs.enabled != 'true'
        shell: bash
        run: |
          echo "::error::Cross-binary accuracy is a required real-binary gate; configure BattleCats, TsumTsum, and YWP fixture URLs."
          exit 1
      - name: Fetch and verify pinned real fixtures
        if: steps.fixtures.outputs.enabled == 'true'
        run: npm run fixtures:fetch
      - name: Install oracle dependencies
        if: steps.fixtures.outputs.enabled == 'true'
        run: python -m pip install --disable-pip-version-check lief capstone
      - name: Verify inputs
        if: steps.fixtures.outputs.enabled == 'true'
        run: |
          npm run fixtures:check
          file tests/.real-fixtures/battlecats tests/.real-fixtures/YWP tests/.real-fixtures/TsumTsum
          ls -lh tests/.real-fixtures/battlecats tests/.real-fixtures/YWP tests/.real-fixtures/TsumTsum
      - name: BattleCats oracle
        if: steps.fixtures.outputs.enabled == 'true'
        run: python tests/oracle.py tests/.real-fixtures/battlecats tests/oracle.battlecats.ci.json.gz
      - name: BattleCats accuracy
        if: steps.fixtures.outputs.enabled == 'true'
        run: node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/.real-fixtures/battlecats --oracle=tests/oracle.battlecats.ci.json.gz --json | tee accuracy-BattleCats.json
      - name: YWP oracle
        if: steps.fixtures.outputs.enabled == 'true'
        run: python tests/oracle.py tests/.real-fixtures/YWP tests/oracle.YWP.json.gz
      - name: YWP accuracy
        if: steps.fixtures.outputs.enabled == 'true'
        run: node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/.real-fixtures/YWP --oracle=tests/oracle.YWP.json.gz --json | tee accuracy-YWP.json
      - name: TsumTsum oracle
        if: steps.fixtures.outputs.enabled == 'true'
        run: python tests/oracle.py tests/.real-fixtures/TsumTsum tests/oracle.TsumTsum.json.gz
      - name: TsumTsum accuracy
        if: steps.fixtures.outputs.enabled == 'true'
        run: node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/.real-fixtures/TsumTsum --oracle=tests/oracle.TsumTsum.json.gz --json | tee accuracy-TsumTsum.json
      - name: Accuracy regression gate
        if: steps.fixtures.outputs.enabled == 'true'
        run: node tests/accuracy-gate.mjs
      - name: Upload results
        if: always() && steps.fixtures.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: |
            accuracy-BattleCats.json
            accuracy-YWP.json
            accuracy-TsumTsum.json
          if-no-files-found: ignore
