name: Cross-binary accuracy diagnostics

# Disposable analysis-only workflow. The branch is pinned to PR #996 final head
# and intentionally runs only root-cause diagnostics for sub-100% features.
on:
  pull_request:
    branches: [analysis/cross-binary-100pct-base]
    paths:
      - 'tests/analysis/**'
      - 'js/**'
      - '.github/workflows/cross-binary-accuracy.yml'
  workflow_dispatch:

concurrency:
  group: cross-binary-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
  HEX_FIXTURE_YWP_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/YWP
  ORACLE_PYTHON_VERSION: '3.12.13'

jobs:
  diagnose:
    name: diagnose-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: BattleCats
            fixture: battlecats
            file: battlecats
            oracle: tests/oracle.battlecats.ci.json.gz
          - name: TsumTsum
            fixture: TsumTsum
            file: TsumTsum
            oracle: tests/oracle.TsumTsum.ci.json.gz
          - name: YWP
            fixture: YWP
            file: YWP
            oracle: tests/oracle.YWP.ci.json.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned real fixture
        run: |
          node scripts/fetch-real-fixtures.mjs "${{ matrix.fixture }}"
          node scripts/fetch-real-fixtures.mjs "${{ matrix.fixture }}" --check
      - name: Build oracle cache key
        id: oracle-key
        shell: bash
        env:
          ORACLE_INPUT_HASH: ${{ hashFiles('tests/fixtures/real-binaries.json', 'tests/oracle.py', 'tests/oracle-cfg-normalize.py', 'tests/oracle-requirements.txt') }}
        run: echo "key=cross-binary-oracle-v3-${{ runner.os }}-${{ runner.arch }}-py${ORACLE_PYTHON_VERSION}-${{ matrix.fixture }}-${ORACLE_INPUT_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore exact oracle cache
        id: oracle-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.oracle }}
          key: ${{ steps.oracle-key.outputs.key }}
      - uses: actions/setup-python@v5
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          python-version: ${{ env.ORACLE_PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/oracle-requirements.txt
      - name: Install oracle dependencies on cache miss
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: python -m pip install --disable-pip-version-check -r tests/oracle-requirements.txt
      - name: Generate oracle on cache miss
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        run: |
          python tests/oracle.py "tests/.real-fixtures/${{ matrix.file }}" "${{ matrix.oracle }}"
          python tests/oracle-cfg-normalize.py "tests/.real-fixtures/${{ matrix.file }}" "${{ matrix.oracle }}"
      - name: Run focused root-cause diagnostics
        run: |
          node --max-old-space-size=6000 tests/analysis/cross-binary-diagnose.mjs \
            --target="tests/.real-fixtures/${{ matrix.file }}" \
            --oracle="${{ matrix.oracle }}" \
            --name="${{ matrix.name }}" \
            --out="diagnostics-${{ matrix.name }}.json"
          cat "diagnostics-${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cross-binary-diagnostics-${{ matrix.name }}
          path: diagnostics-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 7
