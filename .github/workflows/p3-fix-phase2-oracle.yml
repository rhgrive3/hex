name: Phase 3 fix explicit Phase 2 legacy oracle

on:
  push:
    branches:
      - hex/p3-semantic-ir-integration
    paths:
      - '.github/workflows/p3-fix-phase2-oracle.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make the historical Phase 2 compatibility oracle explicit
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/machine-effects/phase2-release-gate.test.mjs')
          s = p.read_text()
          old = "  }, { cfg:singleInstructionCfg() });"
          new = "  }, { cfg:singleInstructionCfg(), semanticMigrationMode:'legacy-v1' });"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one Phase 2 oracle call, found {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Verify MachineEffects historical release gate after Phase 3 cutover
        run: npm run effects:test
      - name: Commit the oracle fix and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p3-fix-phase2-oracle.yml
          git add tests/machine-effects/phase2-release-gate.test.mjs
          git diff --cached --check
          git commit -m "Phase 3: keep Phase 2 legacy oracle explicit after cutover"
          git push origin HEAD:hex/p3-semantic-ir-integration
