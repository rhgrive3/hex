name: Issue 495 ELF relocation budget

on:
  push:
    branches:
      - fix/issue-495-elf-relocation-budget

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[issue-495-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded relocation decoding
        run: |
          python3 tools/apply-issue-495-relr.py
          python3 tools/apply-issue-495-android.py
          python3 tools/apply-issue-495-dynamic.py
      - name: Focused budget regression
        run: node tests/issue-495-elf-relocation-budget.mjs
      - name: Static checks
        run: |
          node --check js/binary/relocation-budget.js
          node --check js/binary/elf-extended.js
          node --check js/binary/elf-dynamic.js
          node --check tests/issue-495-elf-relocation-budget.mjs
      - name: Binary regression suite
        run: npm run binary:test
      - name: Full lint
        run: npm run lint
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/binary/relocation-budget.js js/binary/elf-extended.js js/binary/elf-dynamic.js tests/issue-495-elf-relocation-budget.mjs package.json
          git commit -m 'Fix #495 bounded ELF relocation decoding [issue-495-applied]'
          git push
