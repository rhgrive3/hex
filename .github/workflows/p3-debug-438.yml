name: Phase 3 debug projected argument lineage

on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-debug-438.yml']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply required finalizer narrowing in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s=p.read_text()
          s=s.replace("    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);\n", "", 1)
          s=s.replace("inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias)", "inst.extra?.stateRead && inst.extra?.localPhysicalViewProjection === true", 1)
          p.write_text(s)
          PY
      - name: Emit exact #438 projected IR shape
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js';
          import { irFor, OP, VK, originOf } from './js/ir.js';
          import { summarizeFunction } from './js/interproc.js';
          const BASE=0x100000000n;
          const lines=['add w0, w0, #1','ret'];
          const rows=lines.map((line,i)=>{const p=line.indexOf(' ');return {row:i,address:BASE+BigInt(i*4),mn:p<0?line:line.slice(0,p),ops:p<0?'':line.slice(p+1)}});
          const model=buildSemanticModel(rows,{startRow:0,endRow:1,rowOfAddress:(a)=>{const d=a-BASE;return d<0n||d>=8n?null:Number(d/4n)}});
          const ir=irFor(model);
          const val=(v)=>v&&({id:v.id,kind:v.kind,reg:v.reg,bits:v.bits,version:v.version,const:v.const==null?null:String(v.const),semanticValueId:v.semanticValueId??null,origin:originOf(v),def:v.def&&({id:v.def.id,row:v.def.row,op:v.def.op,sub:v.def.sub,extra:{stateRead:!!v.def.extra?.stateRead,publicStateIdentity:v.def.extra?.publicStateIdentity??null,localPhysicalViewProjection:v.def.extra?.localPhysicalViewProjection??null,reachingStateSsaValueId:v.def.extra?.reachingStateSsaValueId??null,compatReachingPublicValueId:v.def.extra?.compatReachingPublicValueId??null}})});
          const inst=(i)=>({id:i.id,row:i.row,op:i.op,sub:i.sub,dst:val(i.dst),args:(i.args||[]).map(a=>({bits:a.bits,value:val(a.value)})),extra:{stateRead:!!i.extra?.stateRead,stateWrite:!!i.extra?.stateWrite,publicStateIdentity:i.extra?.publicStateIdentity??null,localPhysicalViewProjection:i.extra?.localPhysicalViewProjection??null,reachingStateSsaValueId:i.extra?.reachingStateSsaValueId??null,compatReachingPublicValueId:i.extra?.compatReachingPublicValueId??null}});
          const debug={mode:ir.semanticMigrationMode??ir.migrationMode??null,args:[...(ir.args?.entries?.()||[])].map(([k,v])=>[k,val(v)]),values:ir.values.map(val),instructions:ir.instructions.map(inst),summary:summarizeFunction(model)};
          console.log('::warning title=P3_438_IR::'+JSON.stringify(debug));
          NODE
      - name: Cleanup debug workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p3-debug-438.yml
          git commit -m 'Phase 3: remove temporary #438 debug workflow'
          git push origin HEAD:hex/p3-semantic-ir-integration
