name: Issue 923 one-shot verify and build

on:
  push:
    branches:
      - fix/unlinked-923-eh-frame-validation

permissions:
  contents: write

concurrency:
  group: issue-923-one-shot
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/unlinked-923-eh-frame-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unlinked-923-eh-frame-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused FDE validation regression
        run: node tests/issue-923-eh-frame-validation.mjs
      - name: Binary loader regressions
        run: npm run binary:test
      - name: Static checks
        run: npm run lint
      - name: Canonical userscript build
        run: npm run userscript:build
      - name: Diff hygiene
        run: git diff --check
      - name: Publish verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/issue-923-one-shot.yml .github/workflows/reapply-unlinked-923.yml .github/issue-923-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: validate eh_frame_hdr FDE function evidence (#923)'
          git push origin HEAD:fix/unlinked-923-eh-frame-validation
