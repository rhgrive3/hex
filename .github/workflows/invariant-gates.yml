name: Invariant Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invariant-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpc-close-repair:
    name: rpc-close-repair
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/rpc-close-cancels-remote'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rpc-close-cancels-remote
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply minimal fix and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rpc = Path('js/userscript/dev/parent-rpc.js')
          text = rpc.read_text()
          old = """      for (const current of pending.values()) {\n        if (current.timer) clearTimeout(current.timer);\n        current.detach?.();\n        current.reject(rpcError('transport-failure', 'Dev Worker RPC closed.'));\n      }\n"""
          new = """      for (const [id, current] of pending) {\n        if (current.timer) clearTimeout(current.timer);\n        current.detach?.();\n        post(port, { protocol: DEV_PARENT_RPC_PROTOCOL, kind: 'cancel', id, method: current.method });\n        current.reject(rpcError('transport-failure', 'Dev Worker RPC closed.'));\n      }\n"""
          if text.count(old) != 1:
              raise SystemExit('parent-rpc close block did not match exactly once')
          rpc.write_text(text.replace(old, new))

          test = Path('tests/userscript-dev-worker-runtime.mjs')
          text = test.read_text()
          anchor = "client.close(); server.close();\n\nconst protectedSources = [\n"
          regression = r'''client.close(); server.close();

{
  const { port1: cancelServerPort, port2: cancelClientPort } = new MessageChannel();
  let markStarted;
  let remoteAborted = false;
  const started = new Promise((resolve) => { markStarted = resolve; });
  const cancelServer = createDevWorkerParentRpc({
    port: cancelServerPort,
    runtime: {
      async discover(_args, { signal } = {}) {
        markStarted();
        await new Promise((resolve) => {
          signal?.addEventListener?.('abort', () => {
            remoteAborted = true;
            resolve();
          }, { once: true });
        });
        return [];
      },
    },
  });
  const cancelClient = createDevWorkerParentRpcClient({ port: cancelClientPort, timeoutMs: 60000 });
  const pendingDiscover = cancelClient.discover({});
  await started;
  cancelClient.close();
  await assert.rejects(
    pendingDiscover,
    (error) => error?.code === 'transport-failure',
    'closing the RPC client must reject its local pending request',
  );
  for (let i = 0; i < 10 && !remoteAborted; i++) await new Promise((resolve) => setTimeout(resolve, 0));
  assert.equal(remoteAborted, true, 'closing the RPC client must cancel the remote in-flight operation');
  cancelServer.close();
  cancelServerPort.close();
  cancelClientPort.close();
}

const protectedSources = [
'''
          if text.count(anchor) != 1:
              raise SystemExit('userscript RPC test anchor did not match exactly once')
          test.write_text(text.replace(anchor, regression))
          PY
      - name: Focused RPC regression
        run: node tests/userscript-dev-worker-runtime.mjs
      - name: Protected userscript validation
        run: npm run userscript:test
      - name: Full repository validation
        run: npm run check
      - name: Commit clean verified repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout origin/main -- .github/workflows/invariant-gates.yml
          git rm .github/workflows/rpc-close-repair.yml
          git add js/userscript/dev/parent-rpc.js tests/userscript-dev-worker-runtime.mjs userscript/hex.user.template.js userscript/release-version.json .github/workflows/invariant-gates.yml
          git diff --cached --check
          git commit -m 'Fix RPC close cancellation propagation'
          git push origin HEAD:fix/rpc-close-cancels-remote

  plan:
    name: check-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact npm-check shard matrix
        id: plan
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parts = String(pkg.scripts?.check || '')
            .split(/\s+&&\s+/)
            .map((command) => command.trim())
            .filter(Boolean);
          if (parts.length < 2) throw new Error('npm check must contain at least two independent top-level commands');

          const include = parts.map((command, index) => {
            const match = command.match(/^npm run ([A-Za-z0-9:_-]+)$/);
            const name = command === 'npm test' ? 'test' : (match?.[1] || `shard-${index + 1}`);
            return { name, command };
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  check-shards:
    name: check-${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare generated userscript for canonical Phase 5 component semantic check
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'hex/p5-x86-integration' &&
          matrix.name == 'semantic-v2:test' &&
          (
            github.head_ref == 'hex/p5-1-x86-int-control' ||
            github.head_ref == 'hex/p5-2-x86-memory-atomic' ||
            github.head_ref == 'hex/p5-3-x86-fp-simd-system' ||
            github.head_ref == 'hex/p5-4-x86-abis' ||
            github.head_ref == 'hex/p5-5-variable-viewer' ||
            github.head_ref == 'hex/p5-6-x86-verification'
          )
        run: npm run userscript:build

      - name: Run exact check shard
        run: ${{ matrix.command }}

  invariant-gates:
    name: invariant-gates
    if: always()
    needs: [plan, check-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete repository check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.check-shards.result }}
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Repository check failed (plan=$PLAN_RESULT, shards=$SHARD_RESULT)."
            exit 1
          fi
