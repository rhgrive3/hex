name: Invariant Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invariant-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-proof-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/bootstrap-proof-capability-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply minimal proof capability verification repair
        shell: python
        run: |
          from pathlib import Path
          source = Path('js/ai/dev/bootstrap/bootstrap-diagnostic.js')
          text = source.read_text()
          if "DEV_BOOTSTRAP_ROUND4_PROOF_CAPABILITY" not in text:
              text = "import { DEV_BOOTSTRAP_ROUND4_PROOF_CAPABILITY } from './dev-bootstrap-gate.js';\n\n" + text
          old = "const proofVerified = state === 'complete' && !!capability;"
          new = "const proofVerified = state === 'complete' && capability === DEV_BOOTSTRAP_ROUND4_PROOF_CAPABILITY;"
          if old not in text and new not in text:
              raise SystemExit('bootstrap proof predicate not found')
          source.write_text(text.replace(old, new))

          test = Path('tests/dev-agent/round4-production-bootstrap.mjs')
          body = test.read_text()
          marker = "  assert.match(presentation.detail, /proof: 検証済み/);\n"
          insertion = marker + "\n  const forgedCapability = bootstrapStatusPresentation({\n    state: 'complete',\n    capability: 'hex.dev.bootstrap.fake-proof',\n  });\n  assert.equal(forgedCapability.proofVerified, false, 'unrecognized proof capability must never be marked verified');\n  assert.doesNotMatch(forgedCapability.detail, /proof: verified/);\n"
          if "unrecognized proof capability must never be marked verified" not in body:
              if marker not in body:
                  raise SystemExit('diagnostic test insertion point not found')
              body = body.replace(marker, insertion, 1)
          test.write_text(body)
      - name: Focused Round 4 regression
        run: node tests/dev-agent/round4-production-bootstrap.mjs
      - name: Full Dev Agent suite
        run: npm run dev-agent:test
      - name: Canonical userscript suite
        run: npm run userscript:test
      - name: Commit repair and canonical generated artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/ai/dev/bootstrap/bootstrap-diagnostic.js tests/dev-agent/round4-production-bootstrap.mjs userscript/hex.user.template.js userscript/release-version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix bootstrap proof capability verification'
          git push origin "HEAD:${{ github.head_ref }}"

  plan:
    name: check-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact npm-check shard matrix
        id: plan
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parts = String(pkg.scripts?.check || '')
            .split(/\s+&&\s+/)
            .map((command) => command.trim())
            .filter(Boolean);
          if (parts.length < 2) throw new Error('npm check must contain at least two independent top-level commands');

          const include = parts.map((command, index) => {
            const match = command.match(/^npm run ([A-Za-z0-9:_-]+)$/);
            const name = command === 'npm test' ? 'test' : (match?.[1] || `shard-${index + 1}`);
            return { name, command };
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  check-shards:
    name: check-${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare generated userscript for canonical Phase 5 component semantic check
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'hex/p5-x86-integration' &&
          matrix.name == 'semantic-v2:test' &&
          (
            github.head_ref == 'hex/p5-1-x86-int-control' ||
            github.head_ref == 'hex/p5-2-x86-memory-atomic' ||
            github.head_ref == 'hex/p5-3-x86-fp-simd-system' ||
            github.head_ref == 'hex/p5-4-x86-abis' ||
            github.head_ref == 'hex/p5-5-variable-viewer' ||
            github.head_ref == 'hex/p5-6-x86-verification'
          )
        run: npm run userscript:build

      - name: Run exact check shard
        run: ${{ matrix.command }}

  invariant-gates:
    name: invariant-gates
    if: always()
    needs: [plan, check-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete repository check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.check-shards.result }}
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Repository check failed (plan=$PLAN_RESULT, shards=$SHARD_RESULT)."
            exit 1
          fi
