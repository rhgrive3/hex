name: Invariant Gates

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-five-issue-fix:
    if: github.head_ref == 'fix/issues-925-926-932-935-948-current-main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconcile live main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge origin/main --no-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply audited remaining fixes
        run: python3 .github/apply-five-issue-direct.py
      - name: Focused issue regressions
        run: node tests/issues-925-926-932-935-948.mjs
      - name: Legacy x86 regressions
        run: node --test tests/phase5/effects/int-control/decoder-byte-path.test.mjs tests/phase5/effects/int-control/shift-mul-div.test.mjs
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Remove bootstrap files and restore canonical workflow
        run: |
          git checkout origin/main -- .github/workflows/invariant-gates.yml
          rm -f .github/apply-five-issue-direct.py .github/apply-five-issue-fix-source.yml.txt
      - name: Full repository check
        run: npm run check
      - name: Diff hygiene
        run: git diff --check
      - name: Publish verified implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve ABI and register-state correctness (#925 #926 #932 #935 #948)'
          git push origin HEAD:${{ github.head_ref }}
