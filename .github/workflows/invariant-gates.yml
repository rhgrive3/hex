name: Invariant Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invariant-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-pr881:
    name: repair-pr881
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/issues-802-821-824-859-866'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded correctness repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          emu = Path('js/emu.js')
          text = emu.read_text()
          duplicate = 'await this.ensure(d+i);await this.ensure(d+i);'
          if duplicate in text:
              text = text.replace(duplicate, 'await this.ensure(d+i);', 1)
          assert "this.setFlags('subs', 0n, operand, result, wide);" in text, 'issue-802 NEGS fix missing'
          assert "BigInt.asIntN(op.bits === 32 ? 32 : 64, v) >> s" in text, 'issue-824 ASR fix missing'
          emu.write_text(text)

          ir = Path('js/ir.js').read_text()
          assert "if (a.size == null || b.size == null) return false;" in ir, 'issue-859 mustAlias fix missing'
          assert ir.count("if (x.size == null || y.size == null) return true;") >= 2, 'issue-859 mayAlias fix missing'

          lowering = Path('js/semantics/ir/normalize-effects.js').read_text()
          assert "'srem', 'urem'" in lowering, 'issue-866 remainder classification fix missing'

          expr_path = Path('js/expr.js')
          expr = expr_path.read_text()
          helper_marker = "function signExtendExtractedField(n, width, bits) {"
          if helper_marker not in expr:
              marker = "const BIN_MN = {"
              assert expr.count(marker) == 1, 'expr helper insertion marker mismatch'
              helper = r'''function signExtendExtractedField(n, width, bits) {
  const fieldBits = Number(width);
  const destinationBits = Number(bits);
  if (!Number.isSafeInteger(fieldBits) || !Number.isSafeInteger(destinationBits) ||
      fieldBits < 1 || fieldBits > destinationBits) return null;
  const c = constOf(n);
  if (c != null) return constNode(BigInt.asIntN(fieldBits, BigInt.asUintN(fieldBits, c)));
  if (fieldBits === destinationBits) return n;
  // After masking to fieldBits, the top field bit is exactly 0 or 1. Subtracting
  // that bit times 2^fieldBits is mathematical sign extension without inventing
  // a target-specific unary node or relying on host signed-shift width.
  const sign = bin('shr', n, constNode(BigInt(fieldBits - 1)), destinationBits);
  const correction = bin('mul', sign, constNode(1n << BigInt(fieldBits)), destinationBits);
  return bin('sub', n, correction, destinationBits);
}

'''
              expr = expr.replace(marker, helper + marker, 1)

          old = r'''    } else if (base === 'ubfx' || base === 'sbfx') {
      const lsb = insn.ops[2] && insn.ops[2].value != null ? insn.ops[2].value : 0n;
      const width = insn.ops[3] && insn.ops[3].value != null ? insn.ops[3].value : 0n;
      const shifted = bin('shr', A(), constNode(lsb), bits);
      emit(dst, width > 0n && width < 64n ? bin('and', shifted, constNode((1n << width) - 1n), bits) : shifted);
'''
          new = r'''    } else if (base === 'ubfx' || base === 'sbfx') {
      const lsb = insn.ops[2] && insn.ops[2].value != null ? insn.ops[2].value : 0n;
      const width = insn.ops[3] && insn.ops[3].value != null ? insn.ops[3].value : 0n;
      const destinationWidth = BigInt(bits);
      if (lsb < 0n || width <= 0n || lsb >= destinationWidth || width > destinationWidth - lsb) {
        if (dst) regs.delete(dst);
      } else {
        const shifted = bin('shr', A(), constNode(lsb), bits);
        const extracted = width === destinationWidth
          ? shifted
          : bin('and', shifted, constNode((1n << width) - 1n), bits);
        emit(dst, base === 'sbfx' ? signExtendExtractedField(extracted, width, bits) : extracted);
      }
'''
          if old in expr:
              expr = expr.replace(old, new, 1)
          else:
              assert "base === 'sbfx' ? signExtendExtractedField" in expr, 'issue-821 guarded replacement mismatch'
          expr_path.write_text(expr)
          PY
      - name: Generate canonical userscript
        run: npm run userscript:build
      - name: Focused correctness regressions
        run: |
          node tests/semantic-v2/issues-802-821-824-859.test.mjs
          node tests/semantic-v2/issue-866-riscv-remainder.test.mjs
      - name: Full repository validation
        run: npm run check
      - name: Protected userscript validation
        run: npm run userscript:test
      - name: Commit verified repair
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/emu.js js/expr.js js/ir.js js/semantics/ir/normalize-effects.js \
            tests/semantic-v2/issues-802-821-824-859.test.mjs \
            tests/semantic-v2/issue-866-riscv-remainder.test.mjs \
            userscript/hex.user.template.js userscript/release-version.json
          if git diff --cached --quiet; then
            echo 'No source/test/generated changes to commit.'
          else
            git commit -m 'Fix five analysis correctness regressions'
            git push origin HEAD:${{ github.head_ref }}
          fi

  plan:
    name: check-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact npm-check shard matrix
        id: plan
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const parts = String(pkg.scripts?.check || '')
            .split(/\s+&&\s+/)
            .map((command) => command.trim())
            .filter(Boolean);
          if (parts.length < 2) throw new Error('npm check must contain at least two independent top-level commands');

          const include = parts.map((command, index) => {
            const match = command.match(/^npm run ([A-Za-z0-9:_-]+)$/);
            const name = command === 'npm test' ? 'test' : (match?.[1] || `shard-${index + 1}`);
            return { name, command };
          });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          NODE

  check-shards:
    name: check-${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare generated userscript for canonical Phase 5 component semantic check
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'hex/p5-x86-integration' &&
          matrix.name == 'semantic-v2:test' &&
          (
            github.head_ref == 'hex/p5-1-x86-int-control' ||
            github.head_ref == 'hex/p5-2-x86-memory-atomic' ||
            github.head_ref == 'hex/p5-3-x86-fp-simd-system' ||
            github.head_ref == 'hex/p5-4-x86-abis' ||
            github.head_ref == 'hex/p5-5-variable-viewer' ||
            github.head_ref == 'hex/p5-6-x86-verification'
          )
        run: npm run userscript:build

      - name: Run exact check shard
        run: ${{ matrix.command }}

  invariant-gates:
    name: invariant-gates
    if: always()
    needs: [plan, check-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete repository check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARD_RESULT: ${{ needs.check-shards.result }}
        shell: bash
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$SHARD_RESULT" != "success" ]]; then
            echo "::error::Repository check failed (plan=$PLAN_RESULT, shards=$SHARD_RESULT)."
            exit 1
          fi
