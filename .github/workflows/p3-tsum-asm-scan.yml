name: P3 TsumTsum fallback scan
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-tsum-asm-scan.yml']
permissions:
  contents: read
  actions: read
env:
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        chunk: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch fixture and oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-real-fixtures.mjs TsumTsum
          gh run download 31988122265 -n cross-binary-oracle-TsumTsum -D tests
      - name: Scan assigned sample functions
        env:
          P3_CHUNK: ${{ matrix.chunk }}
        run: |
          cat > tests/.p3-fallback-scan.mjs <<'EOF'
          import fs from 'node:fs';
          import zlib from 'node:zlib';
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          const oracle=JSON.parse(zlib.gunzipSync(fs.readFileSync('tests/oracle.TsumTsum.ci.json.gz')));
          const starts=oracle.functionStarts;
          const cands=[];
          for(let i=0;i<starts.length-1;i++){
            const size=starts[i+1]-starts[i];
            if(size>=64&&size<=2048)cands.push([starts[i],starts[i+1]]);
          }
          const stride=(items,n)=>{
            if(items.length<=n)return items;
            const out=[];
            for(let i=0;i<n;i++)out.push(items[Math.floor(i*(items.length-1)/(n-1))]);
            return out;
          };
          const samples=stride(cands,120);
          const chunk=Number(process.env.P3_CHUNK);
          const w=await openBinary('tests/.real-fixtures/TsumTsum');
          let totalLines=0,totalAsm=0;
          for(let i=0;i<samples.length;i++){
            if(i%8!==chunk)continue;
            const [a0,e0]=samples[i],a=BigInt(a0),end=BigInt(e0);
            const t=Date.now();
            const model=await w.analyze(a,end);
            let res;
            try{res=decompile(model,{addr:a,rowOfAddress:x=>x==null?null:Number((x-w.region.vmAddr)/4n),addrOfRow:r=>w.region.vmAddr+BigInt(r)*4n,symbolFor:x=>w.symbols.nameAt(x)});}catch(err){console.error(`[P3SCAN chunk=${chunk}] 0x${a.toString(16)} ERROR ${err?.message||err}`);continue;}
            const lines=(res.lines||[]).filter(l=>l.kind==='stmt'||l.kind==='ctrl');
            const asm=lines.filter(l=>/__asm\(/.test(l.text)&&!/__asm\("br\s+x\d+"\)/.test(l.text));
            totalLines+=lines.length;totalAsm+=asm.length;
            if(asm.length) {
              console.error(`[P3SCAN chunk=${chunk}] 0x${a.toString(16)}-0x${end.toString(16)} ms=${Date.now()-t} lines=${lines.length} asm=${asm.length}`);
              for(const l of asm)console.error(`[P3SCAN-ASM] 0x${a.toString(16)} ${l.text}`);
            }
          }
          console.error(`[P3SCAN-SUMMARY chunk=${chunk}] lines=${totalLines} asm=${totalAsm}`);
          EOF
          node --max-old-space-size=6000 tests/.p3-fallback-scan.mjs
