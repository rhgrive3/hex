name: integrate-issues-101-145
on:
  push:
    branches: [fix-issues-101-145-final]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[issues-101-145 integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git and refresh peers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Integrate issues 101-128 without neighboring ranges
        run: |
          python3 tools/integrate_issues_101_145.py
          git add js/binary/pe-loader.js js/binary/pe.js js/binary/source.js js/bytesource/cached.js js/platform/worker-validation.js js/platform/worker.js js/blocks.js tests/issues-101-112.mjs tests/issues-113-128.mjs tests/issues-135-145.mjs tests/issues-101-145.mjs
          git commit -m "fix: resolve issues 101-128"
      - name: Merge verified IR/CFG and decompiler ranges
        run: |
          git merge --no-ff --no-edit origin/fix/issues-123-135-20260815
          git merge --no-ff --no-edit origin/fix/issues-136-147-20260815
          # #146/#147 both belong to switch.js; keep this PR strictly scoped to #101-145.
          git checkout origin/main -- js/decompiler/switch.js
          git rm -f tests/issues-136-147.mjs
          git add tests/issues-135-145.mjs tests/issues-101-145.mjs js/decompiler/switch.js
          git commit -m "chore: trim integration to issues 101-145"
      - name: Preserve evidence-based lazy getter reads
        run: |
          python3 tools/fix_lazy_getter_regression.py
          git add js/dataflow-semantic.js tests/issues-130-compat.mjs tests/issues-101-145.mjs
          git commit -m "fix: preserve getter evidence with unknown RET ABI"
      - name: Preserve compatible stack slot display names
        run: |
          python3 tools/fix_stack_slot_display_names.py
          git add js/ir-core.js
          git commit -m "fix: disambiguate only colliding stack slot names"
      - name: Register focused regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('package.json')
          s=p.read_text()
          old='"test": "node tests/run.js'
          new='"test": "node tests/issues-101-145.mjs && node tests/run.js'
          if new not in s:
              if s.count(old)!=1: raise SystemExit('package test script anchor changed')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Bring in latest main before final verification
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Syntax and focused regressions
        run: |
          node --check js/binary/pe-loader.js
          node --check js/platform/worker.js
          node --check js/blocks.js
          node --check js/cfg.js
          node --check js/controlflow.js
          node --check js/ir-core.js
          node --check js/dataflow-semantic.js
          node --check js/decompiler/semantic.js
          node --check js/decompiler/types/prototype.js
          node tests/issues-101-145.mjs
      - name: Full regression suite
        run: |
          npm run lint
          npm test
      - name: Remove staging machinery and push verified result
        run: |
          rm -f tools/integrate_issues_101_145.py tools/fix_lazy_getter_regression.py tools/fix_stack_slot_display_names.py .github/workflows/integrate-issues-101-145.yml
          git add -A
          git commit -m "fix: resolve issues 101-145 [issues-101-145 integrated]"
          git push origin HEAD:fix-issues-101-145-final
