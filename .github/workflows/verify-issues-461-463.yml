name: Verify binary trust boundaries 461 and 463

on:
  push:
    branches:
      - fix/latest-463-461-binary-boundaries

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-463-461-binary-boundaries
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply parser hardening
        run: python3 tools/apply-issues-461-463.py
      - name: Focused regressions
        run: node tests/issues-461-463-binary.mjs
      - name: Binary regressions
        run: npm run binary:test
      - name: Static checks
        run: |
          node --check js/binary/macho.js
          node --check js/binary/pe.js
          npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/binary/macho.js js/binary/pe.js package.json
          git commit -m "fix: enforce Mach-O command and PE entrypoint boundaries (#461 #463)"
          git push origin HEAD:fix/latest-463-461-binary-boundaries
