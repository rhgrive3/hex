name: TEMP Post-Bootstrap Kernel Production Probe

on:
  push:
    branches:
      - ops/post-bootstrap-kernel-production-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9cb00758af50a92258f096057998420061896424
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public production identity and userscript metadata
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { randomBytes, webcrypto } from 'node:crypto';
          const expectedCommit = '9cb00758af50a92258f096057998420061896424';
          const expectedBuild = '7e3340a0dde241911abec900';
          const loaderVersion = '2.0.2322241715';
          const endpoint = 'https://ida.rhgrive.workers.dev/runtime/bootstrap';
          const token = (n) => randomBytes(n).toString('base64url');
          for (let attempt = 1; attempt <= 24; attempt++) {
            let bootstrapOk = false, metaOk = false;
            try {
              const keys = await webcrypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
              const clientPublicKey = await webcrypto.subtle.exportKey('jwk', keys.publicKey);
              const response = await fetch(endpoint, {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ nonce: token(24), loaderVersion, buildId: expectedBuild, requestId: token(18), sessionIdentity: token(18), clientPublicKey }),
              });
              const body = await response.json().catch(() => ({}));
              bootstrapOk = response.status === 200 && body?.buildId === expectedBuild && body?.sourceCommit === expectedCommit;
              console.log(`attempt ${attempt}: bootstrap status=${response.status} build=${body?.buildId || body?.error || 'unknown'} commit=${body?.sourceCommit || 'null'}`);
            } catch (error) { console.log(`attempt ${attempt}: bootstrap error ${error?.message || error}`); }
            try {
              const response = await fetch('https://ida.rhgrive.workers.dev/hex.meta.js', { cache: 'no-store' });
              const text = await response.text();
              const version = text.match(/^\/\/ @version\s+(.+)$/m)?.[1]?.trim() || 'missing';
              metaOk = response.status === 200 && version === loaderVersion;
              console.log(`attempt ${attempt}: meta status=${response.status} version=${version}`);
            } catch (error) { console.log(`attempt ${attempt}: meta error ${error?.message || error}`); }
            if (bootstrapOk && metaOk) { console.log('POST_BOOTSTRAP_KERNEL_PRODUCTION_VERIFIED'); process.exit(0); }
            if (attempt < 24) await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          throw new Error('Production did not expose expected kernel identity within 4 minutes.');
          NODE
