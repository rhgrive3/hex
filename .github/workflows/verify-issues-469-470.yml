name: Verify distributed AI quota issues 469-470

on:
  push:
    branches:
      - fix/latest-470-469-distributed-quota

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-470-469-distributed-quota
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply worker quota integration
        run: python3 tools/apply-issues-469-470.py
      - name: Focused distributed quota regressions
        run: node tests/ai-quota.mjs
      - name: AI worker regressions
        run: npm run ai:test
      - name: Legacy Gemini regressions
        run: node tests/gemini.mjs
      - name: Static checks
        run: |
          node --check worker.js
          node --check js/ai/quota.js
          npm run lint
      - name: Validate Cloudflare bundle/config
        run: npx --yes wrangler@latest deploy --dry-run --outdir /tmp/hex-worker-build
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js wrangler.jsonc tests/ai-worker.mjs package.json
          git commit -m "fix: enforce distributed AI quota on both proxy routes (#469 #470)"
          git push origin HEAD:fix/latest-470-469-distributed-quota
