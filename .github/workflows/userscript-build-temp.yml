name: Userscript build temp

on:
  push:
    branches:
      - chatgpt-userscript-host

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[userscript build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build and test userscript
        run: npm run userscript:test
      - name: Relevant regression tests
        run: |
          npm run ai:test
          node tests/gemini.mjs
          node tests/worker-classic-harness.mjs
      - name: Commit generated bundle and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/hex.user.template.js userscript/platform-worker.bundle.js package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build ChatGPT userscript [userscript build]"
          git push
