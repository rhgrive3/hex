name: Temporary ARM64 memory fix patch
on:
  push:
    branches:
      - fix/arm64-memory-decoder-814-816
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arm64-memory-decoder-814-816
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact source and regression patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # --- js/words.js: split exclusive/CAS/LSE RMW classes and fix LDPSW width ---
          p = Path('js/words.js')
          s = p.read_text()
          start = s.index('  function memoryAccess(w) {')
          end = s.index('\n\n  /* ── 計算', start)
          new = r'''  function memoryAccess(w) {
    const atomicClass = masked(w, 0x3f000000);

    // Exclusive/acquire-release/CAS share the 0x08 class. Decode the operation
    // shape before interpreting ordering bits: CAS/CASP are true RMW operations.
    if (atomicClass === 0x08000000) {
      const sizeCode = (w >>> 30) & 3;
      const bit23 = ((w >>> 23) & 1) === 1;
      const acquireBit = ((w >>> 22) & 1) === 1;
      const pairBit = ((w >>> 21) & 1) === 1;
      const rs = (w >>> 16) & 0x1f;
      const releaseBit = ((w >>> 15) & 1) === 1;
      const encodedRt2 = (w >>> 10) & 0x1f;
      const rt = rd(w);
      const base = rn(w);
      const ordering = (acquire, release) => acquire ? (release ? 'acq_rel' : 'acquire') : (release ? 'release' : 'relaxed');

      // CAS (byte/half/word/dword) uses bit23=1. CASP uses the same fixed Rt2
      // field with the low size encodings and bit23=0. Pair exclusives use the
      // high size encodings, so they remain distinguishable even when Rt2==31.
      const casPair = !bit23 && pairBit && encodedRt2 === 31 && sizeCode <= 1;
      const casSingle = bit23 && pairBit && encodedRt2 === 31;
      if (casSingle || casPair) {
        const elementSize = casPair ? (sizeCode === 0 ? 4 : 8) : (1 << sizeCode);
        const compareReg = rs;
        const valueReg = rt;
        const out = {
          load: true, store: true, rmw: true, atomic: true,
          atomicOp: casPair ? 'casp' : 'cas',
          size: casPair ? elementSize * 2 : elementSize,
          elementSize, pair: casPair,
          base, reg: compareReg, compareReg, valueReg, resultReg: compareReg,
          disp: 0n,
          ordering: ordering(acquireBit, releaseBit),
          acquire: acquireBit, release: releaseBit,
        };
        if (casPair) {
          out.reg2 = (compareReg + 1) & 31;
          out.compareReg2 = out.reg2;
          out.resultReg2 = out.reg2;
          out.valueReg2 = (valueReg + 1) & 31;
        }
        return out;
      }

      const load = acquireBit;
      const exclusive = !bit23;
      const pair = exclusive && pairBit;
      const elementSize = 1 << sizeCode;
      const out = {
        load, store: !load,
        size: pair ? elementSize * 2 : elementSize,
        elementSize, pair,
        base, reg: rt, disp: 0n, atomic: true,
        atomicOp: exclusive
          ? (pair ? (load ? 'exclusive-load-pair' : 'exclusive-store-pair') : (load ? 'exclusive-load' : 'exclusive-store'))
          : (load ? 'acquire-load' : 'release-store'),
        ordering: exclusive ? ordering(load && releaseBit, !load && releaseBit) : (load ? 'acquire' : 'release'),
      };
      if (pair) out.reg2 = encodedRt2;
      if (exclusive && !load) out.statusReg = rs;
      return out;
    }

    // LSE atomic memory operations (LDADD/LDCLR/LDEOR/LDSET/LDSMAX/LDSMIN/
    // LDUMAX/LDUMIN/SWP). Bits 15:12 select the operation; LDAPR occupies a
    // different selector (0xc) and must not be mistaken for an RMW operation.
    if (atomicClass === 0x38000000 && ((w >>> 21) & 1) === 1 && ((w >>> 10) & 3) === 0) {
      const opCode = (w >>> 12) & 0xf;
      const names = ['ldadd', 'ldclr', 'ldeor', 'ldset', 'ldsmax', 'ldsmin', 'ldumax', 'ldumin', 'swp'];
      if (opCode < names.length) {
        const size = 1 << ((w >>> 30) & 3);
        const acquire = ((w >>> 23) & 1) === 1;
        const release = ((w >>> 22) & 1) === 1;
        const sourceReg = (w >>> 16) & 0x1f;
        const resultReg = rd(w);
        return {
          load: true, store: true, rmw: true, atomic: true,
          atomicOp: names[opCode], size, elementSize: size,
          base: rn(w), reg: resultReg, sourceReg, valueReg: sourceReg, resultReg,
          disp: 0n,
          ordering: acquire ? (release ? 'acq_rel' : 'acquire') : (release ? 'release' : 'relaxed'),
          acquire, release,
        };
      }
    }

    // Pair (ldp / stp / ldnp / stnp / ldpsw) — 7-bit signed scaled offset.
    if (masked(w, 0x3a000000) === 0x28000000) {
      const load = ((w >>> 22) & 1) === 1;
      const opc = (w >>> 30) & 3;
      const vector = ((w >>> 26) & 1) === 1;
      const signedWordPair = !vector && load && opc === 1; // LDPSW: two 32-bit words -> X regs
      // Integer opc=0 => W pair, opc=1 => LDPSW, opc=2 => X pair.
      // SIMD opc=0/1/2 => S/D/Q pairs.
      const elementSize = vector ? (4 << opc) : (opc === 2 ? 8 : 4);
      const imm7 = Number(signExtend(BigInt((w >>> 15) & 0x7f), 7));
      return {
        load, store: !load, size: elementSize * 2, elementSize, pair: true, vector,
        signed: signedWordPair, signExtendTo: signedWordPair ? 8 : null,
        base: rn(w), reg: rd(w), reg2: (w >>> 10) & 0x1f, disp: BigInt(imm7 * elementSize),
        mode: ((w >>> 23) & 3) === 1 ? 'post' : ((w >>> 23) & 3) === 3 ? 'pre' : 'offset',
      };
    }
    // Unsigned immediate (the most common scalar/SIMD form).
    if (masked(w, 0x3b000000) === 0x39000000) {
      const scale = transferScale(w);
      const load = transferIsLoad(w);
      return {
        load, store: !load, size: 1 << scale, vector: ((w >>> 26) & 1) === 1, base: rn(w), reg: rd(w),
        disp: BigInt((w >>> 10) & 0xfff) << BigInt(scale),
      };
    }
    // Pre/post/unscaled immediate.
    if (masked(w, 0x3b200000) === 0x38000000) {
      const load = transferIsLoad(w);
      const kind = (w >>> 10) & 3;
      const imm9 = Number(signExtend(BigInt((w >>> 12) & 0x1ff), 9));
      return {
        load, store: !load, size: 1 << transferScale(w), vector: ((w >>> 26) & 1) === 1, base: rn(w), reg: rd(w),
        disp: BigInt(imm9), mode: kind === 1 ? 'post' : kind === 3 ? 'pre' : 'offset',
      };
    }
    if (masked(w, 0x3b200c00) === 0x38200800) {
      const load = transferIsLoad(w);
      return {
        load, store: !load, size: 1 << transferScale(w), vector: ((w >>> 26) & 1) === 1,
        base: rn(w), reg: rd(w), disp: null, indexed: true,
      };
    }
    return null;
  }'''
          s = s[:start] + new + s[end:]
          p.write_text(s)

          # --- js/emu.js: LDPSW is a signed 32-bit pair load into X registers ---
          p = Path('js/emu.js')
          s = p.read_text()
          old = """    const pair = /^(ldp|ldnp)/.test(mn);\n    const size = loadSize(mn, ops[0]);\n    const signed = /^ldrs|^ldurs/.test(mn);\n\n    if (pair) {\n      const each = isWide(ops[0]) ? 8 : 4;\n      const a = await this.load(addr, each);\n      const b = await this.load(addr + BigInt(each), each);\n      this.set(ops[0].text, a);\n      this.set(ops[1].text, b);\n    } else {"""
          new = """    const signedWordPair = mn === 'ldpsw';\n    const pair = signedWordPair || /^(ldp|ldnp)/.test(mn);\n    const size = loadSize(mn, ops[0]);\n    const signed = /^ldrs|^ldurs/.test(mn);\n\n    if (pair) {\n      const each = signedWordPair ? 4 : (isWide(ops[0]) ? 8 : 4);\n      let a = await this.load(addr, each);\n      let b = await this.load(addr + BigInt(each), each);\n      if (signedWordPair) {\n        a = BigInt.asUintN(64, BigInt.asIntN(32, a));\n        b = BigInt.asUintN(64, BigInt.asIntN(32, b));\n      }\n      this.set(ops[0].text, a);\n      this.set(ops[1].text, b);\n    } else {"""
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          old_route = "if (/^(ldr|ldrb|ldrh|ldrsb|ldrsh|ldrsw|ldur|ldurb|ldurh|ldursb|ldursh|ldursw|ldp|ldnp|ldxr|ldaxr|ldar)/.test(mn))"
          new_route = "if (/^(ldr|ldrb|ldrh|ldrsb|ldrsh|ldrsw|ldur|ldurb|ldurh|ldursb|ldursh|ldursw|ldp|ldnp|ldpsw|ldxr|ldaxr|ldar)/.test(mn))"
          assert s.count(old_route) == 1
          s = s.replace(old_route, new_route)
          p.write_text(s)

          # --- worker consumers: preserve memory RMW and pair facts end-to-end ---
          p = Path('js/worker-legacy.js')
          s = p.read_text()
          old_mem = """      const memWrite = Words.memoryAccess(w);\n      if (memWrite) {\n        // FP/SIMD register numbers share the low encoding bits with xN/wN, but\n        // writing d8/q8 must not destroy an address held in x8.  Conversely,\n        // integer pair loads can overwrite both GP destinations, and pre/post\n        // indexed memory operations overwrite their base register.\n        if (memWrite.load && !memWrite.vector) {\n          provenance.kill(memWrite.reg);\n          if (memWrite.pair && memWrite.reg2 != null) provenance.kill(memWrite.reg2);\n        }\n        if (memWrite.mode === 'pre' || memWrite.mode === 'post') provenance.kill(memWrite.base);\n        continue;\n      }"""
          assert s.count(old_mem) == 2, s.count(old_mem)
          scan_mem = """      const memWrite = Words.memoryAccess(w);\n      if (memWrite) {\n        const knownBase = !memWrite.indexed && memWrite.disp != null ? provenance.base(memWrite.base, index) : null;\n        if (knownBase != null) {\n          const full = memWrite.mode === 'post' ? knownBase : knownBase + memWrite.disp;\n          addRef(pc, full, memWrite.rmw ? 3 : memWrite.load ? 1 : memWrite.store ? 2 : 0);\n        }\n        // FP/SIMD register numbers share the low encoding bits with xN/wN, but\n        // writing d8/q8 must not destroy an address held in x8.  Integer pair\n        // loads/RMWs may overwrite two GP results, while exclusive stores also\n        // write a separate status register.\n        if (memWrite.load && !memWrite.vector) {\n          provenance.kill(memWrite.reg);\n          if (memWrite.pair && memWrite.reg2 != null) provenance.kill(memWrite.reg2);\n        }\n        if (memWrite.statusReg != null) provenance.kill(memWrite.statusReg);\n        if (memWrite.mode === 'pre' || memWrite.mode === 'post') provenance.kill(memWrite.base);\n        continue;\n      }"""
          s = s.replace(old_mem, scan_mem, 1)
          xref_mem = """      const memWrite = Words.memoryAccess(w);\n      if (memWrite) {\n        const knownBase = !memWrite.indexed && memWrite.disp != null ? provenance.base(memWrite.base, index) : null;\n        if (knownBase != null) {\n          const full = memWrite.mode === 'post' ? knownBase : knownBase + memWrite.disp;\n          if (full === want) {\n            out.push({ row: byteOff / 4, addr: pc, kind: memWrite.rmw ? 'rmw' : memWrite.load ? 'load' : 'store' });\n            if (out.length >= cap) break;\n          }\n        }\n        if (memWrite.load && !memWrite.vector) {\n          provenance.kill(memWrite.reg);\n          if (memWrite.pair && memWrite.reg2 != null) provenance.kill(memWrite.reg2);\n        }\n        if (memWrite.statusReg != null) provenance.kill(memWrite.statusReg);\n        if (memWrite.mode === 'pre' || memWrite.mode === 'post') provenance.kill(memWrite.base);\n        continue;\n      }"""
          assert s.count(old_mem) == 1
          s = s.replace(old_mem, xref_mem, 1)

          s = s.replace("const SHAPE_SCALED   = 16;   // 引く量が掛け算・割り算を通っている（倍率つき）", "const SHAPE_SCALED   = 16;   // 引く量が掛け算・割り算を通っている（倍率つき）\nconst SHAPE_ATOMIC_RMW = 32; // atomic read+write。方向を片側へ潰さず明示する")

          shape_start = s.index('      const mem = Words.memoryAccess(w);\n      if (mem && !mem.pair && !mem.indexed && mem.disp != null) {')
          shape_end = s.index('\n\n      /* add / sub（レジスタどうし、シフト無し） */', shape_start)
          shape_new = r'''      const mem = Words.memoryAccess(w);
      if (mem && !mem.indexed && mem.disp != null) {
        const d = Number(mem.disp);
        noteSpan(mem.base, d);

        // Pair transfers are retained by the decoder/field-access paths but are
        // not scalar value-shape events. Do not invent a one-register mutation.
        if (mem.pair && !mem.rmw) continue;

        if (mem.rmw) {
          // RMW is simultaneously a memory read and write. Record a neutral
          // atomic mutation event instead of routing it through the old
          // load-else-store split, then preserve the old-memory result register.
          evAddr[n] = region.vmAddr + BigInt(pos + i * 4);
          evDisp[n] = d;
          evSize[n] = mem.size;
          evFlags[n] = SHAPE_ATOMIC_RMW;
          evAmtKind[n] = AMT_NONE;
          evAmtDisp[n] = 0;
          evSpan[n] = spanOf[mem.base];
          evAmtSize[n] = 0;
          evAmtSpan[n] = 0;
          n++;
          if (n >= MAX_SHAPE_EVENTS) capped = true;

          const r = mem.resultReg != null ? mem.resultReg : mem.reg;
          if (r != null && r !== 31) {
            spanOf[r] = 0;
            pBase[r] = mem.base; pDisp[r] = d; pSize[r] = mem.size;
            pDir[r] = 0; pClamp[r] = 0;
            pAmtKind[r] = AMT_NONE; pAmtBase[r] = -1; pAmtDisp[r] = 0; pAmtScaled[r] = 0;
            pAmtSize[r] = 0; pAmtSpan[r] = 0;
          }
          continue;
        }

        if (mem.load) {
          const r = mem.reg;
          if (r !== 31) {
            spanOf[r] = 0;
            pBase[r] = mem.base; pDisp[r] = d; pSize[r] = mem.size;
            pDir[r] = 0; pClamp[r] = 0;
            pAmtKind[r] = AMT_NONE; pAmtBase[r] = -1; pAmtDisp[r] = 0; pAmtScaled[r] = 0;
            pAmtSize[r] = 0; pAmtSpan[r] = 0;
          }
          continue;
        }
        // Store-back: if the value returns to the same location, record the mutation.
        const src = mem.reg;
        if (src < 31 && pBase[src] >= 0 && pDir[src] !== 0 &&
            pBase[src] === mem.base && pDisp[src] === d) {
          let flags = pDir[src] > 0 ? SHAPE_INCREASE : SHAPE_DECREASE;
          if (pClamp[src]) flags |= SHAPE_CLAMP;
          if (pAmtScaled[src]) flags |= SHAPE_SCALED;
          if (pAmtKind[src] === AMT_FIELD && pAmtBase[src] >= 0 && pAmtBase[src] !== mem.base) flags |= SHAPE_CROSS;
          evAddr[n] = region.vmAddr + BigInt(pos + i * 4);
          evDisp[n] = d;
          evSize[n] = mem.size;
          evFlags[n] = flags;
          evAmtKind[n] = pAmtKind[src];
          evAmtDisp[n] = pAmtKind[src] === AMT_FIELD ? pAmtDisp[src] : 0;
          evSpan[n] = spanOf[mem.base];
          evAmtSize[n] = pAmtSize[src];
          evAmtSpan[n] = pAmtSpan[src];
          n++;
          if (n >= MAX_SHAPE_EVENTS) capped = true;
        }
        continue;
      }'''
          s = s[:shape_start] + shape_new + s[shape_end:]

          old_filter = "if (kind !== Words.KIND.LOAD && kind !== Words.KIND.STORE) continue;"
          new_filter = "if (kind !== Words.KIND.LOAD && kind !== Words.KIND.STORE && kind !== Words.KIND.ATOMIC) continue;"
          assert s.count(old_filter) == 1
          s = s.replace(old_filter, new_filter)
          old_push = """      slot.out.push({\n        row: byteOff / 4,\n        addr: region.vmAddr + BigInt(byteOff),\n        kind: mem.load ? 'load' : 'store',\n        base: mem.base,\n        size: mem.size,\n      });\n      found++;"""
          new_push = """      const accessKinds = mem.rmw ? ['load', 'store'] : [mem.load ? 'load' : 'store'];\n      for (const accessKind of accessKinds) {\n        if (slot.out.length >= cap) break;\n        slot.out.push({\n          row: byteOff / 4,\n          addr: region.vmAddr + BigInt(byteOff),\n          kind: accessKind,\n          base: mem.base,\n          size: mem.size,\n          atomic: !!mem.atomic,\n          rmw: !!mem.rmw,\n        });\n        found++;\n      }"""
          assert s.count(old_push) == 1
          s = s.replace(old_push, new_push)
          p.write_text(s)

          # --- focused unit + emulator regression ---
          Path('tests/issues-814-816-arm64-memory.mjs').write_text(r'''import assert from 'node:assert/strict';
import fs from 'node:fs';
import path from 'node:path';
import vm from 'node:vm';
import { fileURLToPath } from 'node:url';
import { Emulator } from '../js/emu.js';

const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');
if (!globalThis.Words) vm.runInThisContext(fs.readFileSync(path.join(root, 'js', 'words.js'), 'utf8'), { filename: 'js/words.js' });
const W = globalThis.Words;
const mem = (word) => W.memoryAccess(word >>> 0);

// #814 LDPSW: two 32-bit memory elements, sign-extended into X registers.
for (const [word, disp, mode] of [
  [0x69400440, 0n, 'offset'],
  [0x69408440, 4n, 'offset'],
  [0x697f8440, -4n, 'offset'],
  [0x68c08440, 4n, 'post'],
  [0x69ff8440, -4n, 'pre'],
]) {
  const m = mem(word);
  assert.equal(m.load, true);
  assert.equal(m.pair, true);
  assert.equal(m.elementSize, 4);
  assert.equal(m.size, 8);
  assert.equal(m.disp, disp);
  assert.equal(m.mode, mode);
  assert.equal(m.signed, true);
  assert.equal(m.signExtendTo, 8);
  assert.equal(m.reg, 0);
  assert.equal(m.reg2, 1);
}
for (const [label, word, elementSize, totalSize, vector] of [
  ['ldp w', 0x29400440, 4, 8, false],
  ['ldp x', 0xa9400440, 8, 16, false],
  ['ldp s', 0x2d400440, 4, 8, true],
  ['ldp d', 0x6d400440, 8, 16, true],
  ['ldp q', 0xad400440, 16, 32, true],
]) {
  const m = mem(word);
  assert.equal(m.elementSize, elementSize, label);
  assert.equal(m.size, totalSize, label);
  assert.equal(m.vector, vector, label);
  assert.notEqual(m.signed, true, label);
}

// #815 pair-exclusive: preserve both data registers, total width and store status.
for (const [label, word, elementSize, total, load, order] of [
  ['ldxp w', 0x887f0440, 4, 8, true, 'relaxed'],
  ['ldxp x', 0xc87f0440, 8, 16, true, 'relaxed'],
  ['ldaxp x', 0xc87f8440, 8, 16, true, 'acquire'],
  ['stxp w', 0x88230440, 4, 8, false, 'relaxed'],
  ['stxp x', 0xc8230440, 8, 16, false, 'relaxed'],
  ['stlxp x', 0xc8238440, 8, 16, false, 'release'],
]) {
  const m = mem(word);
  assert.equal(m.atomic, true, label);
  assert.equal(m.pair, true, label);
  assert.equal(m.elementSize, elementSize, label);
  assert.equal(m.size, total, label);
  assert.equal(m.load, load, label);
  assert.equal(m.store, !load, label);
  assert.equal(m.reg, 0, label);
  assert.equal(m.reg2, 1, label);
  assert.equal(m.ordering, order, label);
  if (!load) assert.equal(m.statusReg, 3, label);
}

// #816 CAS/CASP and the complete base LSE RMW operation family.
for (const [label, word, size, order] of [
  ['casb', 0x08a07c41, 1, 'relaxed'],
  ['cash', 0x48a07c41, 2, 'relaxed'],
  ['cas w', 0x88a07c41, 4, 'relaxed'],
  ['cas x', 0xc8a07c41, 8, 'relaxed'],
  ['casa x', 0xc8e07c41, 8, 'acquire'],
  ['casl x', 0xc8a0fc41, 8, 'release'],
  ['casal x', 0xc8e0fc41, 8, 'acq_rel'],
]) {
  const m = mem(word);
  assert.equal(m.atomicOp, 'cas', label);
  assert.equal(m.load, true, label);
  assert.equal(m.store, true, label);
  assert.equal(m.rmw, true, label);
  assert.equal(m.size, size, label);
  assert.equal(m.compareReg, 0, label);
  assert.equal(m.valueReg, 1, label);
  assert.equal(m.resultReg, 0, label);
  assert.equal(m.base, 2, label);
  assert.equal(m.ordering, order, label);
}
for (const [label, word, element, total, order] of [
  ['casp w', 0x08207ca2, 4, 8, 'relaxed'],
  ['casp x', 0x48207c42, 8, 16, 'relaxed'],
  ['caspa x', 0x48607c42, 8, 16, 'acquire'],
  ['caspl x', 0x4820fc42, 8, 16, 'release'],
  ['caspal x', 0x4860fc42, 8, 16, 'acq_rel'],
]) {
  const m = mem(word);
  assert.equal(m.atomicOp, 'casp', label);
  assert.equal(m.pair, true, label);
  assert.equal(m.elementSize, element, label);
  assert.equal(m.size, total, label);
  assert.equal(m.compareReg, 0, label);
  assert.equal(m.compareReg2, 1, label);
  assert.equal(m.valueReg, 2, label);
  assert.equal(m.valueReg2, 3, label);
  assert.equal(m.ordering, order, label);
}
const opNames = ['ldadd', 'ldclr', 'ldeor', 'ldset', 'ldsmax', 'ldsmin', 'ldumax', 'ldumin', 'swp'];
for (let op = 0; op < opNames.length; op++) {
  const m = mem((0xb8200041 | (op << 12)) >>> 0);
  assert.equal(m.atomicOp, opNames[op]);
  assert.equal(m.load, true);
  assert.equal(m.store, true);
  assert.equal(m.rmw, true);
  assert.equal(m.sourceReg, 0);
  assert.equal(m.resultReg, 1);
  assert.equal(m.base, 2);
  assert.equal(m.size, 4);
}
for (const [label, word, size, order] of [
  ['ldaddb', 0x38200041, 1, 'relaxed'],
  ['ldaddh', 0x78200041, 2, 'relaxed'],
  ['ldadd w', 0xb8200041, 4, 'relaxed'],
  ['ldadd x', 0xf8200041, 8, 'relaxed'],
  ['ldadda x', 0xf8a00041, 8, 'acquire'],
  ['ldaddl x', 0xf8600041, 8, 'release'],
  ['ldaddal x', 0xf8e00041, 8, 'acq_rel'],
  ['swpal x', 0xf8e08041, 8, 'acq_rel'],
]) {
  const m = mem(word);
  assert.equal(m.load, true, label);
  assert.equal(m.store, true, label);
  assert.equal(m.rmw, true, label);
  assert.equal(m.size, size, label);
  assert.equal(m.ordering, order, label);
}
assert.notEqual(mem(0x38bfc041)?.rmw, true, 'LDAPR must not be classified as LSE RMW');

// #814 emulator: LDPSW reads 4-byte lanes and sign-extends each into X registers.
const emu = new Emulator({});
emu.mapZero(0x1000n, 0x100);
await emu.store(0x1000n, 4, 0xffffffffn);
await emu.store(0x1004n, 4, 0x80000000n);
emu.set('x2', 0x1000n);
await emu.execute('ldpsw', 'x0, x1, [x2]', 0n);
assert.equal(emu.get('x0'), 0xffffffffffffffffn);
