name: Temporary Dev Supervisor continuity repair v2

on:
  push:
    branches:
      - hex/fix-dev-supervisor-conversation-continuity

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/fix-dev-supervisor-conversation-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Supervisor continuity regression
        run: node tests/dev-agent/supervisor-conversation-continuity.mjs
      - name: Build protected userscript runtime
        run: npm run userscript:build
      - name: Dev Agent regression
        run: npm run dev-agent:test
      - name: AI regression
        run: npm run ai:test
      - name: Userscript regression
        run: npm run userscript:test
      - run: git diff --check
      - name: Commit generated userscript and remove temporary validation
        run: |
          rm -f .github/workflows/temp-dev-supervisor-continuity.yml .github/workflows/temp-dev-supervisor-continuity-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/temp-dev-supervisor-continuity.yml .github/workflows/temp-dev-supervisor-continuity-v2.yml
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate userscript for Supervisor continuity fix"
            git push origin HEAD:hex/fix-dev-supervisor-conversation-continuity
          fi
