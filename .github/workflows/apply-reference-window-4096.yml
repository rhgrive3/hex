name: Apply measured reference window

on:
  push:
    branches:
      - accuracy-ywp-tsumtsum-20260814
    paths:
      - .github/workflows/apply-reference-window-4096.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accuracy-ywp-tsumtsum-20260814
          fetch-depth: 0
      - name: Apply 4096 window and remove tuning workflows
        run: |
          set -euo pipefail
          sed -Ei 's/^const PAIR_WINDOW = [0-9]+;/const PAIR_WINDOW = 4096;/' js/worker.js
          grep -q '^const PAIR_WINDOW = 4096;' js/worker.js
          rm -f .github/workflows/refs-tune-high.yml
          rm -f .github/workflows/apply-reference-window-4096.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add js/worker.js .github/workflows
          git commit -m 'fix: extend ADRP pairing to measured safe window [refs-4096]'
          git push origin HEAD:accuracy-ywp-tsumtsum-20260814
