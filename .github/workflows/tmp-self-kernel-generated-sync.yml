name: TEMP Self Kernel Generated Sync

on:
  push:
    branches:
      - dev-agent/post-bootstrap-self-improvement-kernel

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[kernel-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-agent/post-bootstrap-self-improvement-kernel
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify kernel and generate canonical userscript
        run: |
          node tests/dev-agent/post-bootstrap-self-improvement-kernel.mjs
          npm run userscript:build
          node tests/userscript-release-version.mjs
      - name: Commit canonical generated output and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-self-kernel-generated-sync.yml
          test ! -e tmp-self-kernel-sync-trigger.txt || git rm tmp-self-kernel-sync-trigger.txt
          git add userscript/hex.user.template.js userscript/release-version.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Sync post-bootstrap kernel userscript [kernel-sync]'
          git push origin HEAD:dev-agent/post-bootstrap-self-improvement-kernel
