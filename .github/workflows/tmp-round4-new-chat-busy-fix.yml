name: TEMP Round 4 new-chat busy fix

on:
  push:
    branches:
      - fix/round4-new-chat-busy-false-positive

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[busy-fix-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/round4-new-chat-busy-false-positive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact busy-state repair and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          selectors_path = Path('js/userscript/chatgpt-selectors.js')
          selectors = selectors_path.read_text()
          old_stop = '''  stop: Object.freeze([\n    'button[data-testid="stop-button"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="Stop generating"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="Stop streaming"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label*="Stop" i]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label*="停止"]:not(:disabled):not([aria-disabled="true"])',\n  ]),'''
          new_stop = '''  stop: Object.freeze([\n    'button[data-testid="stop-button"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="Stop generating"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="Stop streaming"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="生成を停止"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="生成を停止する"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="応答の生成を停止"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="応答の生成を停止する"]:not(:disabled):not([aria-disabled="true"])',\n    'button[aria-label="ストリーミングを停止"]:not(:disabled):not([aria-disabled="true"])',\n  ]),'''
          if old_stop not in selectors:
              raise SystemExit('stop selector block changed unexpectedly')
          selectors = selectors.replace(old_stop, new_stop, 1)
          selectors_path.write_text(selectors)

          adapter_path = Path('js/userscript/chatgpt-adapter.js')
          adapter = adapter_path.read_text()
          old_guard = "    if (this.adapter.isGenerating()) throw bridgeError('turn-controller', 'already-generating', 'ChatGPT is already generating a response.');"
          new_guard = "    if (this.adapter.isGenerating() && !newConversation) throw bridgeError('turn-controller', 'already-generating', 'ChatGPT is already generating a response.');"
          if old_guard not in adapter:
              raise SystemExit('generating guard changed unexpectedly')
          adapter = adapter.replace(old_guard, new_guard, 1)
          adapter_path.write_text(adapter)

          test = r'''import assert from 'node:assert/strict';
          import { ChatGPTDOMAdapter, ChatGPTTurnController } from '../js/userscript/chatgpt-adapter.js';

          testUnrelatedStopControlIsNotGeneration();
          await testNewConversationDoesNotHardFailOnPreexistingGlobalStop();
          await testExistingConversationStillRejectsPreexistingGeneration();
          console.log('chatgpt new-chat generating guard: ok');

          function testUnrelatedStopControlIsNotGeneration() {
            const unrelated = control({ ariaLabel: 'Stop voice mode' });
            const doc = {
              querySelector(selector) {
                return selector.includes('aria-label*="Stop"') ? unrelated : null;
              },
            };
            const adapter = new ChatGPTDOMAdapter({ document: doc, location: { href: 'https://chatgpt.com/' } });
            assert.equal(adapter.isGenerating(), false, 'unrelated Stop-labelled UI must not mark ChatGPT as generating');

            const realStop = control({ ariaLabel: 'Stop generating' });
            const realDoc = {
              querySelector(selector) {
                return selector.startsWith('button[data-testid="stop-button"]') ? realStop : null;
              },
            };
            const realAdapter = new ChatGPTDOMAdapter({ document: realDoc, location: { href: 'https://chatgpt.com/' } });
            assert.equal(realAdapter.isGenerating(), true, 'the canonical generation Stop control must remain authoritative');
          }

          async function testNewConversationDoesNotHardFailOnPreexistingGlobalStop() {
            const adapter = minimalBusyAdapter();
            const turns = new ChatGPTTurnController(adapter, { startTimeoutMs: 2, pollMs: 1 });
            await assert.rejects(
              turns.run('bootstrap', { timeoutMs: 8, expectedConversation: null, newConversation: true }),
              (error) => {
                assert.notEqual(error?.code, 'already-generating');
                assert.equal(error?.code, 'send-unavailable');
                return true;
              },
            );
          }

          async function testExistingConversationStillRejectsPreexistingGeneration() {
            const adapter = minimalBusyAdapter();
            const turns = new ChatGPTTurnController(adapter, { startTimeoutMs: 2, pollMs: 1 });
            await assert.rejects(
              turns.run('bootstrap', { timeoutMs: 8, expectedConversation: { id: 'existing', url: 'https://chatgpt.com/c/existing' }, newConversation: false }),
              (error) => error?.code === 'already-generating',
            );
          }

          function minimalBusyAdapter() {
            const composer = { text: '', isConnected: true };
            return {
              composer: () => composer,
              isGenerating: () => true,
              assistantTurns: () => [],
              userTurns: () => [],
              conversationTurns: () => [],
              composerText: (node) => node.text,
              setComposerText: (node, value) => { node.text = String(value); },
              sendButton: () => null,
            };
          }

          function control({ ariaLabel }) {
            return {
              isConnected: true,
              disabled: false,
              getAttribute(name) {
                if (name === 'aria-disabled') return 'false';
                if (name === 'aria-label') return ariaLabel;
                return null;
              },
            };
          }
          '''
          # Strip workflow indentation from the generated JS.
          lines = test.splitlines()
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('tests/chatgpt-new-chat-generating-guard.mjs').write_text(normalized)

          pkg_path = Path('package.json')
          pkg = pkg_path.read_text()
          needle = 'node tests/chatgpt-disabled-stop-settlement.mjs && node tests/userscript-chatgpt-parent-rpc.mjs'
          replacement = 'node tests/chatgpt-disabled-stop-settlement.mjs && node tests/chatgpt-new-chat-generating-guard.mjs && node tests/userscript-chatgpt-parent-rpc.mjs'
          if needle not in pkg:
              raise SystemExit('userscript:test command changed unexpectedly')
          pkg_path.write_text(pkg.replace(needle, replacement, 1))
          PY
      - name: Focused regression
        run: node tests/chatgpt-new-chat-generating-guard.mjs
      - name: Build canonical userscript
        run: npm run userscript:build
      - name: Commit repaired source, regression, and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add js/userscript/chatgpt-selectors.js js/userscript/chatgpt-adapter.js tests/chatgpt-new-chat-generating-guard.mjs package.json userscript/hex.user.template.js userscript/release-version.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Fix new-chat generating false positive [busy-fix-generated]'
          git push origin HEAD:fix/round4-new-chat-busy-false-positive
