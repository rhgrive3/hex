name: Ghidra decompiler differential

on:
  pull_request:
    paths:
      - '.github/workflows/ghidra-differential.yml'
      - 'js/decompile.js'
      - 'js/decompiler/**'
      - 'js/arm64.js'
      - 'js/types.js'
      - 'js/controlflow.js'
      - 'js/ir.js'
      - 'js/ir-core.js'
      - 'js/dataflow.js'
      - 'js/dataflow-*.js'
      - 'js/blocks.js'
      - 'tools/decompiler/**'
      - 'tests/compiler-truth/**'
      - 'tests/issue-458-ghidra-trigger.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghidra-differential-${{ github.ref }}
  cancel-in-progress: true

env:
  GHIDRA_VERSION: '12.1.2'
  GHIDRA_BUILD_DATE: '20260605'
  GHIDRA_TAG: 'Ghidra_12.1.2_build'
  GHIDRA_SHA256: 'b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d'

jobs:
  compiler-truth-vs-ghidra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Workflow trigger contract
        run: node tests/issue-458-ghidra-trigger.mjs

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache official Ghidra
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/hex-ghidra-${{ env.GHIDRA_VERSION }}
          key: ghidra-${{ runner.os }}-${{ env.GHIDRA_VERSION }}-${{ env.GHIDRA_BUILD_DATE }}

      - name: Install official Ghidra release
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/hex-ghidra-${GHIDRA_VERSION}"
          mkdir -p "$CACHE"
          if ! find "$CACHE" -maxdepth 1 -type d -name 'ghidra_*' -print -quit | grep -q .; then
            ZIP="$RUNNER_TEMP/ghidra.zip"
            URL="https://github.com/NationalSecurityAgency/ghidra/releases/download/${GHIDRA_TAG}/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_BUILD_DATE}.zip"
            curl --fail --location --retry 4 --retry-delay 3 "$URL" -o "$ZIP"
            echo "${GHIDRA_SHA256}  ${ZIP}" | sha256sum --check --strict
            unzip -q "$ZIP" -d "$CACHE"
          fi
          GHIDRA_HOME="$(find "$CACHE" -maxdepth 1 -type d -name 'ghidra_*' -print -quit)"
          test -x "$GHIDRA_HOME/support/analyzeHeadless"
          echo "GHIDRA_HOME=$GHIDRA_HOME" >> "$GITHUB_ENV"
          echo "$GHIDRA_HOME/support" >> "$GITHUB_PATH"

      - name: Verify Ghidra headless availability
        run: |
          set -euo pipefail
          node tools/decompiler/ghidra-diff.mjs | tee ghidra-availability.log
          grep -q '"status":"available"' ghidra-availability.log

      - name: Run compiler truth and mandatory Ghidra differential
        run: |
          set -euo pipefail
          npm run compiler-truth | tee compiler-truth-ghidra.log
          grep -q '"ghidra":{"status":"ok"' compiler-truth-ghidra.log
          if grep -q '"ghidra":{"status":"skipped"' compiler-truth-ghidra.log; then
            echo 'Ghidra differential was skipped; this gate requires a real comparison.' >&2
            exit 1
          fi
          if grep -q '"ghidra":{"status":"failed"' compiler-truth-ghidra.log; then
            echo 'Ghidra differential failed.' >&2
            exit 1
          fi

      - name: Upload differential diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-compiler-truth-differential
          path: |
            ghidra-availability.log
            compiler-truth-ghidra.log
          if-no-files-found: ignore
          retention-days: 14
