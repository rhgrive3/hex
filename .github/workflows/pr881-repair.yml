name: Repair PR 881 correctness batch

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/pr881-repair.yml'
      - 'js/emu.js'
      - 'js/expr.js'
      - 'js/ir.js'
      - 'js/semantics/ir/normalize-effects.js'
      - 'tests/semantic-v2/issues-802-821-824-859.test.mjs'
      - 'tests/semantic-v2/issue-866-riscv-remainder.test.mjs'
      - 'userscript/**'

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/issues-802-821-824-859-866'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded fixes and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          emu = Path('js/emu.js')
          text = emu.read_text()
          duplicate = 'await this.ensure(d+i);await this.ensure(d+i);'
          if duplicate in text:
              text = text.replace(duplicate, 'await this.ensure(d+i);', 1)
          assert "this.setFlags('subs', 0n, operand, result, wide);" in text, 'issue-802 NEGS fix missing'
          assert "BigInt.asIntN(op.bits === 32 ? 32 : 64, v) >> s" in text, 'issue-824 ASR fix missing'
          emu.write_text(text)

          ir = Path('js/ir.js').read_text()
          assert "if (a.size == null || b.size == null) return false;" in ir, 'issue-859 mustAlias fix missing'
          assert ir.count("if (x.size == null || y.size == null) return true;") >= 2, 'issue-859 mayAlias fix missing'

          lowering = Path('js/semantics/ir/normalize-effects.js').read_text()
          assert "'srem', 'urem'" in lowering, 'issue-866 remainder classification fix missing'

          expr_path = Path('js/expr.js')
          expr = expr_path.read_text()
          helper_marker = "function signExtendExtractedField(n, width, bits) {"
          if helper_marker not in expr:
              marker = "const BIN_MN = {"
              assert expr.count(marker) == 1, 'expr helper insertion marker mismatch'
              helper = r'''function signExtendExtractedField(n, width, bits) {
  const fieldBits = Number(width);
  const destinationBits = Number(bits);
  if (!Number.isSafeInteger(fieldBits) || !Number.isSafeInteger(destinationBits) ||
      fieldBits < 1 || fieldBits > destinationBits) return null;
  const c = constOf(n);
  if (c != null) return constNode(BigInt.asIntN(fieldBits, BigInt.asUintN(fieldBits, c)));
  if (fieldBits === destinationBits) return n;
  // After masking to fieldBits, the top field bit is exactly 0 or 1. Subtracting
  // that bit times 2^fieldBits is mathematical sign extension without inventing
  // a target-specific unary node or relying on host signed-shift width.
  const sign = bin('shr', n, constNode(BigInt(fieldBits - 1)), destinationBits);
  const correction = bin('mul', sign, constNode(1n << BigInt(fieldBits)), destinationBits);
  return bin('sub', n, correction, destinationBits);
}

'''
              expr = expr.replace(marker, helper + marker, 1)

          old = r'''    } else if (base === 'ubfx' || base === 'sbfx') {
      const lsb = insn.ops[2] && insn.ops[2].value != null ? insn.ops[2].value : 0n;
      const width = insn.ops[3] && insn.ops[3].value != null ? insn.ops[3].value : 0n;
      const shifted = bin('shr', A(), constNode(lsb), bits);
      emit(dst, width > 0n && width < 64n ? bin('and', shifted, constNode((1n << width) - 1n), bits) : shifted);
'''
          new = r'''    } else if (base === 'ubfx' || base === 'sbfx') {
      const lsb = insn.ops[2] && insn.ops[2].value != null ? insn.ops[2].value : 0n;
      const width = insn.ops[3] && insn.ops[3].value != null ? insn.ops[3].value : 0n;
      const destinationWidth = BigInt(bits);
      if (lsb < 0n || width <= 0n || lsb >= destinationWidth || width > destinationWidth - lsb) {
        if (dst) regs.delete(dst);
      } else {
        const shifted = bin('shr', A(), constNode(lsb), bits);
        const extracted = width === destinationWidth
          ? shifted
          : bin('and', shifted, constNode((1n << width) - 1n), bits);
        emit(dst, base === 'sbfx' ? signExtendExtractedField(extracted, width, bits) : extracted);
      }
'''
          if old in expr:
              expr = expr.replace(old, new, 1)
          else:
              assert "base === 'sbfx' ? signExtendExtractedField" in expr, 'issue-821 guarded replacement mismatch'
          expr_path.write_text(expr)
          PY

          cat > tests/semantic-v2/issues-802-821-824-859.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { Emulator } from '../../js/emu.js';
          import { buildSemanticModel } from '../../js/blocks.js';
          import { buildValues, constOf } from '../../js/expr.js';
          import { MK, mustAlias, mayAliasProvenance } from '../../js/ir.js';

          async function executeUnaryFlags() {
            const emu = new Emulator({});
            const cases = [
              { reg: 'w1', dst: 'w0', bits: 32, value: 0n, out: 0n, flags: { n: false, z: true, c: true, v: false } },
              { reg: 'w1', dst: 'w0', bits: 32, value: 1n, out: 0xffffffffn, flags: { n: true, z: false, c: false, v: false } },
              { reg: 'w1', dst: 'w0', bits: 32, value: 0x80000000n, out: 0x80000000n, flags: { n: true, z: false, c: false, v: true } },
              { reg: 'x1', dst: 'x0', bits: 64, value: 0x8000000000000000n, out: 0x8000000000000000n, flags: { n: true, z: false, c: false, v: true } },
            ];
            for (const entry of cases) {
              emu.reset();
              emu.set(entry.reg, entry.value);
              await emu.execute('negs', `${entry.dst}, ${entry.reg}`, 0n);
              assert.equal(emu.get(entry.dst), entry.out, `NEGS ${entry.bits}-bit result`);
              assert.deepEqual(emu.nzcv, entry.flags, `NEGS ${entry.bits}-bit NZCV for ${entry.value.toString(16)}`);
            }

            emu.reset();
            emu.set('w1', 1n);
            emu.nzcv = { n: false, z: true, c: true, v: true };
            const before = { ...emu.nzcv };
            await emu.execute('neg', 'w0, w1', 0n);
            assert.deepEqual(emu.nzcv, before, 'NEG must not alter NZCV');

            emu.reset();
            emu.set('w1', 1n);
            await emu.execute('negs', 'w0, w1', 0n);
            assert.equal(emu.cond('mi'), true);
            assert.equal(emu.cond('cc'), true);
            assert.equal(emu.cond('eq'), false);
            emu.reset();
            emu.set('w1', 0x80000000n);
            await emu.execute('negs', 'w0, w1', 0n);
            assert.equal(emu.cond('vs'), true, 'NEGS overflow must drive VS');
          }

          function applyBinary(op, a, b, bits) {
            let value;
            if (op === 'add') value = a + b;
            else if (op === 'sub') value = a - b;
            else if (op === 'and') value = a & b;
            else if (op === 'orr') value = a | b;
            else if (op === 'eor') value = a ^ b;
            else throw new Error(`unknown test operation ${op}`);
            return BigInt.asUintN(bits, value);
          }

          async function shiftedAsrWidth() {
            for (const [bits, prefix, signBit] of [
              [32, 'w', 0x80000000n],
              [64, 'x', 0x8000000000000000n],
            ]) {
              const emu = new Emulator({});
              const a = bits === 32 ? 0x12345678n : 0x123456789abcdef0n;
              const shifted = BigInt.asIntN(bits, signBit) >> 1n;
              for (const op of ['add', 'sub', 'and', 'orr', 'eor']) {
                emu.reset();
                emu.set(`${prefix}1`, a);
                emu.set(`${prefix}2`, signBit);
                await emu.execute(op, `${prefix}0, ${prefix}1, ${prefix}2, asr #1`, 0n);
                assert.equal(
                  emu.get(`${prefix}0`),
                  applyBinary(op, a, shifted, bits),
                  `${op} ${prefix} shifted ASR must use ${bits}-bit sign`,
                );
              }
            }

            const emu = new Emulator({});
            emu.set('w2', 0x80000000n);
            await emu.execute('add', 'w0, wzr, w2, asr #0', 0n);
            assert.equal(emu.get('w0'), 0x80000000n);
            await emu.execute('add', 'w0, wzr, w2, asr #31', 0n);
            assert.equal(emu.get('w0'), 0xffffffffn);
            emu.set('w2', 0x7ffffffen);
            await emu.execute('add', 'w0, wzr, w2, asr #1', 0n);
            assert.equal(emu.get('w0'), 0x3fffffffn);
            emu.set('x2', 0x8000000000000000n);
            await emu.execute('add', 'x0, xzr, x2, asr #63', 0n);
            assert.equal(emu.get('x0'), 0xffffffffffffffffn);
          }

          const BASE = 0x100000000n;
          function asm(lines) {
            return lines.map((line, row) => {
              const text = String(line).trim();
              const space = text.indexOf(' ');
              return {
                row,
                address: BASE + BigInt(row) * 4n,
                mn: space < 0 ? text : text.slice(0, space),
                ops: space < 0 ? '' : text.slice(space + 1).trim(),
              };
            });
          }
          function expressionConstant(lines, row, register) {
            const instructions = asm(lines);
            const model = buildSemanticModel(instructions, { startRow: 0, endRow: instructions.length - 1 });
            return constOf(buildValues(model).defAt(row, register));
          }

          function signedBitfieldExpressions() {
            assert.equal(expressionConstant(['mov x1, #0x80', 'sbfx x0, x1, #0, #8'], 1, 'x0'), -128n);
            assert.equal(expressionConstant(['mov x1, #0x8000', 'sbfx x0, x1, #8, #8'], 1, 'x0'), -128n);
            assert.equal(expressionConstant(['mov x1, #0x7f', 'sbfx x0, x1, #0, #8'], 1, 'x0'), 127n);
            assert.equal(expressionConstant(['mov w1, #0x80', 'sbfx w0, w1, #0, #8'], 1, 'x0'), 0xffffff80n);
            assert.equal(expressionConstant(['mov x1, #0xffffffffffffffff', 'sbfx x0, x1, #0, #64'], 1, 'x0'), -1n);
            assert.equal(expressionConstant(['mov x1, #0x80', 'ubfx x0, x1, #0, #8'], 1, 'x0'), 128n, 'UBFX must stay zero-extended');
          }

          function aliasUnknownSizeSafety() {
            const stack = (disp, size) => ({ kind: MK.STACK, disp: BigInt(disp), size });
            const global = (address, size) => ({ kind: MK.GLOBAL, address: BigInt(address), size });

            assert.equal(mustAlias(stack(0, null), stack(0, 4)), false, 'unknown stack size cannot prove MustAlias');
            assert.equal(mustAlias(global(0x1000, null), global(0x1000, 8)), false, 'unknown global size cannot prove MustAlias');
            assert.equal(mayAliasProvenance(stack(0, null), stack(64, 4)), true, 'unknown stack size cannot prove NoAlias');
            assert.equal(mayAliasProvenance(global(0x1000, null), global(0x2000, 8)), true, 'unknown global size cannot prove NoAlias');

            assert.equal(mustAlias(stack(0, 4), stack(0, 4)), true, 'known identical stack access remains MustAlias');
            assert.equal(mustAlias(global(0x1000, 8), global(0x1000, 8)), true, 'known identical global access remains MustAlias');
            assert.equal(mayAliasProvenance(stack(0, 4), stack(4, 4)), false, 'known disjoint stack ranges remain NoAlias');
            assert.equal(mayAliasProvenance(global(0x1000, 8), global(0x1008, 8)), false, 'known disjoint global ranges remain NoAlias');
          }

          await executeUnaryFlags();
          await shiftedAsrWidth();
          signedBitfieldExpressions();
          aliasUnknownSizeSafety();
          console.log('issues 802/821/824/859 correctness regressions: PASS');
          EOF

          cat > tests/semantic-v2/issue-866-riscv-remainder.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { createInstructionId } from '../../js/core/identity/index.js';
          import {
            createBitVectorValue,
            createMachineEffectBundle,
            createMachineOperation,
            createRegisterValue,
            createTemporaryValue,
          } from '../../js/semantics/effects/index.js';
          import { lowerMachineEffectBundleToSemanticIr } from '../../js/semantics/ir/from-machine-effects.js';
          import { classifyMachineValueOpcode } from '../../js/semantics/ir/normalize-effects.js';

          assert.equal(classifyMachineValueOpcode('srem').kind, 'binary');
          assert.equal(classifyMachineValueOpcode('urem').kind, 'binary');

          const instructionId = createInstructionId({
            binaryId: 'bin_riscv_remainder',
            sliceId: 'slice_riscv_remainder',
            virtualAddress: 0x8000n,
            decodeMode: 'rv64gc',
            decoderSemanticVersion: '1',
          });
          const origin = {
            instructionIds: [instructionId],
            byteRanges: [{ binaryId: 'bin_riscv_remainder', start: 0n, end: 4n }],
          };
          const bv = (bits, value) => createBitVectorValue(bits, value);
          const tmp = (id, bits) => createTemporaryValue(id, bv(bits));
          const reg = (id, bits = 64) => createRegisterValue(id, bits, { view: id });
          const left = tmp('left', 64);
          const right = tmp('right', 64);
          const signedResult = tmp('signed-result', 64);
          const unsignedResult = tmp('unsigned-result', 64);

          const bundle = createMachineEffectBundle({
            instructionId,
            architectureId: 'riscv64',
            mode: 'rv64gc',
            operations: [
              createMachineOperation({ kind: 'register-read', id: 'effect.read.left', register: reg('x10'), value: left }),
              createMachineOperation({ kind: 'register-read', id: 'effect.read.right', register: reg('x11'), value: right }),
              createMachineOperation({
                kind: 'value', id: 'effect.srem', opcode: 'srem', inputs: [left, right], outputs: [signedResult],
                metadata: { divisionByZero: 'dividend', signedOverflow: 'zero' },
              }),
              createMachineOperation({
                kind: 'value', id: 'effect.urem', opcode: 'urem', inputs: [left, right], outputs: [unsignedResult],
                metadata: { divisionByZero: 'dividend' },
              }),
            ],
            controlEffect: { kind: 'fallthrough' },
            possibleFaults: [],
            origin,
            completeness: 'exact',
          });

          const lowered = lowerMachineEffectBundleToSemanticIr(bundle, {
            functionId: 'function_riscv_remainder',
            blockId: 'block_riscv_remainder',
            addressWidthBits: 64,
          });
          for (const [effectId, opcode] of [['effect.srem', 'srem'], ['effect.urem', 'urem']]) {
            const node = lowered.nodes.find((candidate) => candidate.sourceEffectIds.includes(effectId));
            assert.ok(node, `missing ${opcode} node`);
            assert.equal(node.kind, 'binary', `${opcode} must stay arithmetic, not intrinsic`);
            assert.equal(node.operator, opcode);
            assert.equal(node.inputs.length, 2);
            assert.equal(node.outputs.length, 1);
            assert.equal(node.attributes.machineEffects.architectureId, 'riscv64');
            assert.ok(node.attributes.machineEffects.operationMetadata.divisionByZero);
          }
          assert.equal(lowered.nodes.some((node) => node.sourceEffectIds.includes('effect.srem') && node.kind === 'intrinsic'), false);
          assert.equal(lowered.nodes.some((node) => node.sourceEffectIds.includes('effect.urem') && node.kind === 'intrinsic'), false);
          assert.equal(lowered.unknowns.length, 0);
          console.log('issue 866 RISC-V remainder Semantic IR lowering: PASS');
          EOF

      - name: Generate canonical userscript
        run: npm run userscript:build
      - name: Focused correctness regressions
        run: |
          node tests/semantic-v2/issues-802-821-824-859.test.mjs
          node tests/semantic-v2/issue-866-riscv-remainder.test.mjs
      - name: Full repository validation
        run: npm run check
      - name: Protected userscript validation
        run: npm run userscript:test
      - name: Verify clean generated state and commit repair
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/emu.js js/expr.js js/ir.js js/semantics/ir/normalize-effects.js \
            tests/semantic-v2/issues-802-821-824-859.test.mjs \
            tests/semantic-v2/issue-866-riscv-remainder.test.mjs \
            userscript/hex.user.template.js userscript/release-version.json
          if git diff --cached --quiet; then
            echo 'No source/test/generated changes to commit.'
          else
            git commit -m 'Fix five analysis correctness regressions'
            git push origin HEAD:${{ github.head_ref }}
          fi
