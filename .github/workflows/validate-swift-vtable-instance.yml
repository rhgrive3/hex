name: Validate Swift vtable instance flag

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/swift-vtable-instance-flag]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'fix/swift-vtable-instance-flag'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/swift-vtable-instance-flag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Focused Swift runtime regression
        run: node tests/swift-runtime.mjs
      - name: Decompiler integration suite
        run: npm run decompiler:test
      - name: Full repository check
        run: npm run check
      - name: Generate canonical userscript
        run: npm run userscript:build
      - name: Commit canonical generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add userscript/hex.user.template.js userscript/release-version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate userscript for Swift vtable flag fix"
          git push origin HEAD:fix/swift-vtable-instance-flag
