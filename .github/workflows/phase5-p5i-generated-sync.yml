name: Phase 5 P5-I canonical generated sync

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-p5i-generated-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'hex/p5-x86-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p5-x86-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build canonically and prove idempotence
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp /tmp/hex.user.template.js userscript/hex.user.template.js
          cmp /tmp/release-version.json userscript/release-version.json
          git diff --check
      - name: Commit only canonical generated outputs if needed
        shell: bash
        run: |
          set -euo pipefail
          git add userscript/hex.user.template.js userscript/release-version.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Generated output already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 5: synchronize canonical generated userscript after P5-I repairs'
          git push origin HEAD:refs/heads/hex/p5-x86-integration
