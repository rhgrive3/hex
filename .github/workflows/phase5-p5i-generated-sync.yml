name: Phase 5 p5-i generated sync

on:
  push:
    branches:
      - hex/p5-x86-integration

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonical userscript build and idempotence
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp /tmp/hex.user.template.js userscript/hex.user.template.js
          cmp /tmp/release-version.json userscript/release-version.json
      - name: Commit generated output and remove temporary p5-i harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase5-p5i-generated-sync.yml
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/phase5-p5i-generated-sync.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Phase 5: synchronize generated userscript after capability ownership repair'
          git push origin HEAD:refs/heads/hex/p5-x86-integration
