name: One-shot finalize integration generated outputs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-integration-generated
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'integrate/all-open-prs-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/all-open-prs-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply semantic root fixes in workspace
        shell: bash
        run: |
          set -euo pipefail
          git show cce0797363bfe0ddc85a89c623d132e1845dce31:js/ir.js > js/ir.js
          git show 4dae354fcebd8cfda036498183c43be45e1a80ba^:tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs > tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          python - <<'PY'
          from pathlib import Path

          nodes=Path('js/semantics/compat/semantic-ir-v2-to-v1-nodes.js')
          s=nodes.read_text()
          old="""    case 'binary': {\n      setBasic(V1_OP.BIN, node.operator || attrs.operator || 'unknown');\n      const carrier = comparisonCarrierByNodeId.get(node.id) ?? null;\n      if (carrier) {\n        const resultIsWritten = node.outputs?.[0] && hasRegisterStateWriteForValue(node.outputs[0], context);\n        if (!resultIsWritten) {\n          inst.op = V1_OP.CMP;\n          inst.dst = carrier;\n          inst.bits = Math.max(1, ...inputValues.map((value) => value.bits || 1));\n          inst.extra.comparison = 'semantic-flag-result';\n          inst.extra.semanticComparisonCarrier = true;\n          carrier.def = inst;\n        } else {\n          const cmp = appendComparisonInstruction(node, context, inst, carrier, inputValues, inst.sub, row, blockIndex);\n          if (cmp) extraInstructions.push(cmp);\n        }\n      }\n      break;\n    }\n"""
          new="""    case 'binary': {\n      setBasic(V1_OP.BIN, node.operator || attrs.operator || 'unknown');\n      const carrier = comparisonCarrierByNodeId.get(node.id) ?? null;\n      if (carrier) {\n        const resultValueId = node.outputs?.[0] ?? null;\n        const resultIsWritten = resultValueId != null && hasRegisterStateWriteForValue(resultValueId, context);\n        const resultIsConsumed = resultValueId != null && context.ir.nodes.some((candidate) =>\n          candidate.id !== node.id && candidate.inputs?.includes(resultValueId));\n        if (!resultIsWritten && !resultIsConsumed) {\n          inst.op = V1_OP.CMP;\n          inst.dst = carrier;\n          inst.bits = Math.max(1, ...inputValues.map((value) => value.bits || 1));\n          inst.extra.comparison = 'semantic-flag-result';\n          inst.extra.semanticComparisonCarrier = true;\n          carrier.def = inst;\n        } else {\n          const cmp = appendComparisonInstruction(node, context, inst, carrier, inputValues, inst.sub, row, blockIndex);\n          if (cmp) extraInstructions.push(cmp);\n        }\n      }\n      break;\n    }\n"""
          assert old in s, 'expected binary projection block not found'
          nodes.write_text(s.replace(old,new,1))

          ir=Path('js/ir.js')
          s=ir.read_text()
          old="""  const existing = valueRange(value);\n  const comparableExisting = existing\n    ? normalizeRangeDomain(existing, bits, signed)\n    : null;\n"""
          new="""  const existing = value?.range ?? null;\n  const comparableExisting = existing\n    ? normalizeRangeDomain(existing, bits, signed)\n    : null;\n"""
          assert old in s, 'expected branch-range domain block not found'
          ir.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Verify focused semantic regressions
        run: |
          node tests/machine-effects/issue-957-bti-guarded-page.test.mjs
          node tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          node tests/semantic-v2/issue-949-indirect-control.test.mjs
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Run full repository check
        run: npm run check
      - name: Prove generated output idempotence
        run: |
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp userscript/hex.user.template.js /tmp/hex.user.template.js
          cmp userscript/release-version.json /tmp/release-version.json
      - name: Publish verified fixes and restore canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          canonical=''
          while read -r commit; do
            candidate="$(git show "$commit":.github/workflows/generated-sync.yml 2>/dev/null || true)"
            if [ -n "$candidate" ] && ! grep -q '^name: One-shot finalize integration generated outputs$' <<<"$candidate"; then
              canonical="$commit"
              break
            fi
          done < <(git rev-list HEAD -- .github/workflows/generated-sync.yml)
          test -n "$canonical"
          git show "$canonical":.github/workflows/generated-sync.yml > .github/workflows/generated-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/generated-sync.yml \
            js/ir.js \
            js/semantics/compat/semantic-ir-v2-to-v1-nodes.js \
            tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs \
            userscript/hex.user.template.js \
            userscript/release-version.json
          git diff --cached --check
          git commit -m 'fix: preserve semantic comparison values and range domains'
          git push origin HEAD:integrate/all-open-prs-20260819
