name: Generated userscript sync

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: generated-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize-five-correctness-fixes:
    if: github.head_ref == 'fix/issues-924-930-934-940-941'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconcile live main
        run: |
          git fetch origin main
          git merge origin/main --no-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused correctness regressions
        run: node tests/issues-924-930-934-940-941.mjs
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Full repository check
        run: npm run check
      - name: Diff hygiene
        run: git diff --check
      - name: Restore canonical workflow and publish verified head
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/generated-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve ELF alias and Microsoft x64 correctness issues (#924 #930 #934 #940 #941)'
          git push origin HEAD:${{ github.head_ref }}
