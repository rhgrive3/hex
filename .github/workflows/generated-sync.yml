name: One-shot finalize integration generated outputs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'integrate/all-open-prs-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/all-open-prs-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply candidate fixes
        shell: bash
        run: |
          set -euo pipefail
          git show cce0797363bfe0ddc85a89c623d132e1845dce31:js/ir.js > js/ir.js
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-nodes.js'); s=p.read_text()
          old="""        const resultIsWritten = node.outputs?.[0] && hasRegisterStateWriteForValue(node.outputs[0], context);\n        if (!resultIsWritten) {\n"""
          new="""        const resultValueId = node.outputs?.[0] ?? null;\n        const resultIsWritten = resultValueId != null && hasRegisterStateWriteForValue(resultValueId, context);\n        const resultIsConsumed = resultValueId != null && context.ir.nodes.some((candidate) =>\n          candidate.id !== node.id && candidate.inputs?.includes(resultValueId));\n        if (!resultIsWritten && !resultIsConsumed) {\n"""
          assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('js/ir-base.js'); s=p.read_text()
          old="return value.range ? { min: value.range.min, max: value.range.max } : null;"
          assert old in s; p.write_text(s.replace(old,"return value.range ? { ...value.range } : null;",1))
          PY
      - name: Inspect branch-fact cache
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js';
          import { irFor, branchConstraints, valueRange } from './js/ir.js';
          const BASE=0x100000000n, lines=['and x0, x1, #0x8000000000000000','cmp x0, #0','b.lt #0x100000010','nop','ret'];
          const rows=lines.map((line,row)=>{const i=line.indexOf(' ');return {row,address:BASE+BigInt(row*4),mn:i<0?line:line.slice(0,i),ops:i<0?'':line.slice(i+1)}});
          const rowOfAddress=(a)=>{const d=BigInt(a)-BASE;return d<0n||d>=BigInt(rows.length*4)||d%4n?null:Number(d/4n)};
          const ir=irFor(buildSemanticModel(rows,{startRow:0,endRow:rows.length-1,rowOfAddress}),{rowOfAddress,decoderSemanticVersion:'diag-cache-x800'});
          const rep=(_k,v)=>typeof v==='bigint'?`${v}n`:v;
          console.log('CACHE_EXISTS',Object.prototype.hasOwnProperty.call(ir,'_branchConstraints'),JSON.stringify(ir._branchConstraints,rep));
          const before=branchConstraints(ir)[0];
          console.log('BEFORE',JSON.stringify({range:before?.taken?.range,vr:valueRange(before?.taken?.value)},rep));
          delete ir._branchConstraints;
          const after=branchConstraints(ir)[0];
          console.log('AFTER_DELETE',JSON.stringify({range:after?.taken?.range,vr:valueRange(after?.taken?.value)},rep));
          NODE
