name: Diagnose PR987 ABI reconciliation

on:
  pull_request:
    branches:
      - integrate/all-open-prs-20260819

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-abi-526-954-955-958-959
          fetch-depth: 0
      - name: Print only substantive ABI conflict hunks
        shell: bash
        run: |
          git config user.name 'integration-diagnostic'
          git config user.email 'integration-diagnostic@users.noreply.github.com'
          git fetch origin fix/unlinked-abi-526-954-955-958-959
          set +e
          git merge --no-commit --no-ff origin/fix/unlinked-abi-526-954-955-958-959
          rc=$?
          echo '=== UNMERGED ==='
          git diff --name-only --diff-filter=U || true
          for f in js/targets/abi/aapcs64.js js/targets/abi/microsoft-x64.js package.json; do
            if git ls-files -u -- "$f" | grep -q .; then
              echo "=== CONFLICT: $f ==="
              grep -n -B25 -A35 -E '^(<<<<<<<|=======|>>>>>>>)' "$f" || true
            fi
          done
          git merge --abort >/dev/null 2>&1 || true
          exit "$rc"
