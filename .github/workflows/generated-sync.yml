name: One-shot integration xref refinement

on:
  push:
    branches:
      - fix/integration-semantic-contracts

permissions:
  contents: write

concurrency:
  group: one-shot-integration-xref-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-semantic-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restrict program-index memory references to RMW evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/worker-legacy.js')
          s = p.read_text()
          old = """      const memWrite = Words.memoryAccess(w);\n      if (memWrite) {\n        const knownBase = !memWrite.indexed && memWrite.disp != null ? provenance.base(memWrite.base, index) : null;\n        if (knownBase != null) {\n          const full = memWrite.mode === 'post' ? knownBase : knownBase + memWrite.disp;\n          addRef(pc, full, memWrite.rmw ? 3 : memWrite.load ? 1 : memWrite.store ? 2 : 0);\n        }\n"""
          new = """      const memWrite = Words.memoryAccess(w);\n      if (memWrite) {\n        // scanProgram's historical reference index is evidence-oriented: broad\n        // scalar memory accesses from a propagated base are not exact xrefs and\n        // caused false string references on real binaries. Pair accesses are\n        // handled above; keep only explicit RMW memory evidence here.\n        const knownBase = memWrite.rmw && !memWrite.indexed && memWrite.disp != null\n          ? provenance.base(memWrite.base, index) : null;\n        if (knownBase != null) {\n          const full = memWrite.mode === 'post' ? knownBase : knownBase + memWrite.disp;\n          addRef(pc, full, 3);\n        }\n"""
          if s.count(old) != 1:
              raise SystemExit(f'expected one scanProgram memory-ref block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run ARM64 memory consumer regression
        run: node tests/phase4/migration/arm64-memory-consumers.test.mjs
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Restore canonical generated-sync workflow
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/generated-sync.yml > .github/workflows/generated-sync.yml
      - name: Commit refinement and generated outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/worker-legacy.js userscript/hex.user.template.js userscript/release-version.json .github/workflows/generated-sync.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No refinement changes to publish.'
            exit 0
          fi
          git commit -m 'fix: keep program-index memory xrefs evidence-backed'
          git push origin HEAD:fix/integration-semantic-contracts
