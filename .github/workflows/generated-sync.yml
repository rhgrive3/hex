name: One-shot ABI reconciliation

on:
  pull_request:
    branches:
      - integrate/all-open-prs-20260819
    paths:
      - '.github/workflows/generated-sync.yml'
      - '.github/reconcile-pr998.sh'
      - 'js/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: one-shot-abi-reconcile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.head_ref == 'fix/integration-abi-526-954-955-958-959' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-abi-526-954-955-958-959
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash .github/reconcile-pr998.sh
