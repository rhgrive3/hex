name: Generated userscript sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generated-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/open-issue-fixes-current-main-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Merge current main
        run: |
          git fetch origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/main
      - name: Apply PR942 source reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/analysis/semantic-function.js')
          text = p.read_text()
          replacements = {
            "const fallthroughBlock = byStart.get(endOf(instruction).toString()) || blocks[index + 1] || null;":
              "const fallthroughBlock = byStart.get(endOf(instruction).toString()) || null;",
            "if (fallthroughBlock) block.successors.push({ to:fallthroughBlock.key, kind:'conditional-false' });":
              "if (fallthroughBlock && fallthroughBlock.key !== targetBlock?.key) block.successors.push({ to:fallthroughBlock.key, kind:'conditional-false' });",
            "      block:instruction.block,\n      semanticNodeId:instruction.semanticNodeId ?? null,":
              "      block:instruction.block,\n      args:(instruction.args || []).map((arg) => ({\n        valueId:arg?.value?.semanticSsaValueId ?? arg?.value?.semanticValueId ?? arg?.value?.id ?? null,\n        bits:arg?.bits ?? arg?.value?.bits ?? null,\n      })),\n      semanticNodeId:instruction.semanticNodeId ?? null,",
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'semantic-function anchor expected once: {old!r}; found {text.count(old)}')
            text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('js/ir.js')
          text = p.read_text()
          old = """function shiftedConst(arg, fallbackBits = null) {
  if (!arg || !arg.value || arg.value.const == null) return null;
  const bits = Math.max(1, Math.min(64, Number(fallbackBits || arg.value.bits || 64)));
  const width = BigInt(bits);
  let v = BigInt.asUintN(bits, BigInt(arg.value.const));
  const s = arg.shift;
  if (!s) return v;
  const n = BigInt(s.amount || 0);
  if (n < 0n || n >= width) return null;
  if (s.op === 'lsl') return BigInt.asUintN(bits, v << n);
  if (s.op === 'lsr') return v >> n;
  if (s.op === 'asr') return BigInt.asUintN(bits, BigInt.asIntN(bits, v) >> n);
  if (s.op === 'ror') {
    if (n === 0n) return v;
    return BigInt.asUintN(bits, (v >> n) | (v << (width - n)));
  }
  return null;
}
"""
          new = """function projectedConstant(value, active = new Set()) {
  if (!value || active.has(value)) return null;
  const bits = Math.max(1, Math.min(64, Number(value.bits || 64)));
  if (value.const != null) return BigInt.asUintN(bits, BigInt(value.const));
  const def = value.def;
  if (!def || !Array.isArray(def.args)) return null;
  active.add(value);
  const input = (index) => projectedConstant(def.args[index]?.value, active);
  let result = null;
  if (def.op === OP.MOV && def.args.length === 1) {
    const v = input(0);
    if (v != null) result = BigInt.asUintN(bits, v);
  } else if (def.op === OP.UN && (def.sub === 'sext' || def.extra?.castKind === 'sext') && def.args.length === 1) {
    const v = input(0);
    const sourceBits = Math.max(1, Math.min(64, Number(def.extra?.sourceBits || def.args[0]?.bits || def.args[0]?.value?.bits || bits)));
    if (v != null) result = BigInt.asUintN(bits, BigInt.asIntN(sourceBits, v));
  } else if (def.op === OP.BIN && ['shl','lsl','lshr','lsr','ashr','asr','ror'].includes(def.sub) && def.args.length >= 2) {
    const lhs = input(0), rhs = input(1);
    if (lhs != null && rhs != null) {
      const width = BigInt(bits);
      const amount = BigInt(rhs);
      if (amount >= 0n && amount < width) {
        const v = BigInt.asUintN(bits, lhs);
        if (def.sub === 'shl' || def.sub === 'lsl') result = BigInt.asUintN(bits, v << amount);
        else if (def.sub === 'lshr' || def.sub === 'lsr') result = v >> amount;
        else if (def.sub === 'ashr' || def.sub === 'asr') result = BigInt.asUintN(bits, BigInt.asIntN(bits, v) >> amount);
        else if (amount === 0n) result = v;
        else result = BigInt.asUintN(bits, (v >> amount) | (v << (width - amount)));
      }
    }
  }
  active.delete(value);
  return result;
}

function shiftedConst(arg, fallbackBits = null) {
  if (!arg || !arg.value) return null;
  const bits = Math.max(1, Math.min(64, Number(fallbackBits || arg.value.bits || 64)));
  const width = BigInt(bits);
  const exact = projectedConstant(arg.value);
  if (exact == null) return null;
  let v = BigInt.asUintN(bits, exact);
  const s = arg.shift;
  if (!s) return v;
  const n = BigInt(s.amount || 0);
  if (n < 0n || n >= width) return null;
  if (s.op === 'lsl') return BigInt.asUintN(bits, v << n);
  if (s.op === 'lsr') return v >> n;
  if (s.op === 'asr') return BigInt.asUintN(bits, BigInt.asIntN(bits, v) >> n);
  if (s.op === 'ror') {
    if (n === 0n) return v;
    return BigInt.asUintN(bits, (v >> n) | (v << (width - n)));
  }
  return null;
}
"""
          if text.count(old) != 1:
            raise SystemExit(f'projectedConstant anchor expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          replacements = {
            "    return { lhs: branch.args[0].value, rhs: 0n, cond: kind === 'cbz' ? 'eq' : 'ne', cmp: null };":
              "    return { lhs: branch.args[0].value, rhs: 0n, cond: kind === 'cbz' ? 'eq' : 'ne', cmp: null, bits:branch.args[0].bits || branch.args[0].value.bits || 64 };",
            "  const rhs = shiftedConst(cmp.args[1], cmp.args[0].value.bits || 64);\n  if (rhs == null) return null;\n  return { lhs: cmp.args[0].value, rhs, cond: branch.cond || null, cmp };":
              "  const bits = cmp.args[0].bits || cmp.extra?.bits || cmp.args[0].value.bits || 64;\n  const rhs = shiftedConst(cmp.args[1], bits);\n  if (rhs == null) return null;\n  return { lhs: cmp.args[0].value, rhs, cond: branch.cond || null, cmp, bits };",
            "function constrainedRange(value, op, constant, signed) {\n  const bits = value && value.bits || 64;":
              "function constrainedRange(value, op, constant, signed, compareBits = null) {\n  const bits = compareBits || value && value.bits || 64;",
            "  const existing = valueRange(value);\n  if (existing) { if (existing.min > min) min = existing.min; if (existing.max < max) max = existing.max; }":
              "  const existing = valueRange(value);\n  const comparableExisting = existing && Number(existing.bits || bits) === Number(bits)\n    ? normalizeRangeDomain(existing, bits, signed)\n    : null;\n  if (comparableExisting) { if (comparableExisting.min > min) min = comparableExisting.min; if (comparableExisting.max < max) max = comparableExisting.max; }",
            "  const rhs = normalizeIntegerValue(c.rhs, c.lhs.bits || 64, signedForBounds);\n  const range = constrainedRange(c.lhs, relation, rhs, signedForBounds);":
              "  const compareBits = c.bits || c.lhs.bits || 64;\n  const rhs = normalizeIntegerValue(c.rhs, compareBits, signedForBounds);\n  const range = constrainedRange(c.lhs, relation, rhs, signedForBounds, compareBits);",
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'IR range anchor expected once: {old!r}; found {text.count(old)}')
            text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('tests/issue-861-862-c-printer-signedness.mjs')
          text = p.read_text()
          replacements = {
            r"assert.match(printExpression(udiv), /\(uint32_t\)a1 \/ 2/);": r"assert.match(printExpression(udiv), /\(uint32_t\)x0 \/ 2/);",
            r"assert.match(printExpression(sdiv), /\(int32_t\)a1 \/ \(int32_t\)2/);": r"assert.match(printExpression(sdiv), /\(int32_t\)x0 \/ \(int32_t\)2/);",
            r"assert.match(signedText, /\(int32_t\)a1 < \(int32_t\)0/);": r"assert.match(signedText, /\(int32_t\)x0 < \(int32_t\)0/);",
            r"assert.match(unsignedText, /\(uint32_t\)a1 < 1/);": r"assert.match(unsignedText, /\(uint32_t\)x0 < 1/);",
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'signedness assertion anchor expected once: {old!r}; found {text.count(old)}')
            text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('tests/decompiler-semantic.mjs')
          text = p.read_text()
          old = r"assert.match(r.pseudocode, /if\s*\(\s*self->hp\s*<=\s*0\s*\)/);"
          new = r"assert.match(r.pseudocode, /if\s*\(\s*(?:\(int32_t\))?self->hp\s*<=\s*(?:\(int32_t\))?0\s*\)/);"
          if text.count(old) != 1:
            raise SystemExit(f'decompiler assertion anchor expected once, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Focused regressions
        run: |
          node tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          node tests/issue-861-862-c-printer-signedness.mjs
          node tests/decompiler-semantic.mjs
          node tests/phase6/generic-core/degenerate-control-dependency.test.mjs
          node tests/worker-classic-harness.mjs
      - name: Phase 6 generic-core
        run: node tests/phase6/run.mjs --group generic-core
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Full repository verification
        run: npm run check
      - name: Verify userscript build idempotence
        run: |
          git diff > /tmp/prebuild.diff
          npm run userscript:build
          git diff > /tmp/postbuild.diff
          diff -u /tmp/prebuild.diff /tmp/postbuild.diff
      - name: Restore permanent CI and publish verified head
        run: |
          git checkout origin/main -- .github/workflows/generated-sync.yml .github/workflows/sandbox-security.yml
          git rm -f --ignore-unmatch \
            .github/workflows/finalize-pr942-ci.yml \
            .github/workflows/finalize-pr942-push.yml \
            .github/workflows/fix-pr942-range.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize PR942 on current main'
          git push origin HEAD:integrate/open-issue-fixes-current-main-20260819
