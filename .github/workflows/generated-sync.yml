name: One-shot finalize integration generated outputs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'integrate/all-open-prs-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/all-open-prs-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Apply candidate fixes
        shell: bash
        run: |
          set -euo pipefail
          git show cce0797363bfe0ddc85a89c623d132e1845dce31:js/ir.js > js/ir.js
          git show 4dae354fcebd8cfda036498183c43be45e1a80ba^:tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs > tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-nodes.js'); s=p.read_text()
          old="""        const resultIsWritten = node.outputs?.[0] && hasRegisterStateWriteForValue(node.outputs[0], context);\n        if (!resultIsWritten) {\n"""
          new="""        const resultValueId = node.outputs?.[0] ?? null;\n        const resultIsWritten = resultValueId != null && hasRegisterStateWriteForValue(resultValueId, context);\n        const resultIsConsumed = resultValueId != null && context.ir.nodes.some((candidate) =>\n          candidate.id !== node.id && candidate.inputs?.includes(resultValueId));\n        if (!resultIsWritten && !resultIsConsumed) {\n"""
          assert old in s; p.write_text(s.replace(old,new,1))

          for name in ['js/ir-base.js','js/ir.js']:
              p=Path(name); s=p.read_text()
              old="""  const existing = valueRange(value);\n  const comparableExisting = existing\n    ? normalizeRangeDomain(existing, bits, signed)\n    : null;\n"""
              if old in s:
                  s=s.replace(old,"""  const existing = value?.range ?? null;\n  const comparableExisting = existing\n    ? normalizeRangeDomain(existing, bits, signed)\n    : null;\n""",1)
              else:
                  old2="""  const existing = valueRange(value);\n  if (existing) { if (existing.min > min) min = existing.min; if (existing.max < max) max = existing.max; }\n"""
                  assert old2 in s, f'expected constrained range block not found in {name}'
                  s=s.replace(old2,"""  const existing = value?.range ?? null;\n  const comparableExisting = existing\n    ? normalizeRangeDomain(existing, bits, signed)\n    : null;\n  if (comparableExisting) {\n    if (comparableExisting.min > min) min = comparableExisting.min;\n    if (comparableExisting.max < max) max = comparableExisting.max;\n  }\n""",1)
              p.write_text(s)
          PY
          git diff --check
      - name: Verify semantic frontier
        run: |
          node tests/machine-effects/issue-957-bti-guarded-page.test.mjs
          node tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          node tests/semantic-v2/issue-949-indirect-control.test.mjs
