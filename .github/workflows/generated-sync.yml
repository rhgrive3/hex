name: Generated userscript sync

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'capstone.wasm'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-release-version.mjs'
      - 'userscript/hex.user.template.js'
      - 'userscript/release-version.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generated-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve-pr874:
    if: github.event_name == 'pull_request' && github.head_ref == 'integrate/open-issue-fixes-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/open-issue-fixes-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Restore permanent workflow before repository tests
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/generated-sync.yml
      - name: Focused Worker regression
        run: node --test tests/worker-classic-harness.mjs
      - name: Focused RISC-V same-target regression
        run: node --test tests/phase6/generic-core/degenerate-control-dependency.test.mjs
      - name: Full repository verification
        run: npm run check
      - name: Prove userscript build idempotence
        shell: bash
        run: |
          set -euo pipefail
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp userscript/hex.user.template.js /tmp/hex.user.template.js
          cmp userscript/release-version.json /tmp/release-version.json
      - name: Publish clean resolved head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/generated-sync.yml
          git diff --cached --check
          git commit -m 'chore: regenerate PR 874 userscript outputs'
          git push origin HEAD:integrate/open-issue-fixes-20260819
