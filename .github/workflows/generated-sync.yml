name: One-shot integration userscript sync

on:
  push:
    branches:
      - fix/integration-semantic-contracts

permissions:
  contents: write

concurrency:
  group: one-shot-userscript-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-semantic-contracts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Restore canonical generated-sync workflow
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/generated-sync.yml > .github/workflows/generated-sync.yml
      - name: Commit synchronized generated outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/generated-sync.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No generated changes to publish.'
            exit 0
          fi
          git commit -m 'build: synchronize userscript after semantic integration'
          git push origin HEAD:fix/integration-semantic-contracts
