name: One-shot ABI reconciliation

on:
  pull_request:
    branches:
      - integrate/all-open-prs-20260819

permissions:
  contents: write

concurrency:
  group: one-shot-abi-reconcile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-abi-526-954-955-958-959
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Merge PR987 and resolve only audited conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin integrate/all-open-prs-20260819 fix/unlinked-abi-526-954-955-958-959

          set +e
          git merge --no-commit --no-ff origin/fix/unlinked-abi-526-954-955-958-959
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo 'Merge produced the expected audited conflicts.'
          fi

          # Generated outputs/workflow are integration-owned. Keep the current
          # canonical side here, then rebuild/restore after semantic resolution.
          git checkout --ours -- .github/workflows/generated-sync.yml userscript/hex.user.template.js userscript/release-version.json
          git add .github/workflows/generated-sync.yml userscript/hex.user.template.js userscript/release-version.json

          # Microsoft x64 already has a richer variadic frontier on integration.
          # Select HEAD only inside conflict hunks, preserving all clean #987
          # changes around them (hidden sret/convention evidence).
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('js/targets/abi/microsoft-x64.js')
          s = p.read_text()
          pat = re.compile(r'^<<<<<<< HEAD\n(.*?)^=======\n.*?^>>>>>>> .*?\n', re.M | re.S)
          s2, n = pat.subn(lambda m: m.group(1), s)
          if n != 1:
              raise SystemExit(f'expected exactly one microsoft-x64 conflict, got {n}')
          if '<<<<<<<' in s2 or '>>>>>>>' in s2:
              raise SystemExit('unresolved microsoft-x64 conflict markers remain')
          p.write_text(s2)
          PY
          git add js/targets/abi/microsoft-x64.js

          # AAPCS64 starts from current integration truth (#950 aggregate/__int128,
          # #961 platform-aware x18), then layers the audited #526/#958/#959 facts.
          git checkout --ours -- js/targets/abi/aapcs64.js
          python - <<'PY'
          from pathlib import Path

          p = Path('js/targets/abi/aapcs64.js')
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one match, got {n}')
              s = s.replace(old, new, 1)

          once(
              "export function classifyAAPCS64Arguments(insn, opts = {}) {",
              """function possibleRegisterSource(reg, bits, abiClass) {
  return {
    t:'reg', reg, bits,
    possible:true,
    mustUse:false,
    purpose:'variadic-tail-candidate',
    abiClass,
  };
}

export function classifyAAPCS64Arguments(insn, opts = {}) {""",
              'possibleRegisterSource insertion',
          )

          once(
              """  if (!params) {
    for (let i=0;i<8;i++) { srcs.push({t:'reg',reg:`x${i}`,bits:64}); arguments_.push({index:i,location:'register',reg:`x${i}`,abiClass:'unknown-gp'}); }
    for (let i=0;i<8;i++) { srcs.push({t:'reg',reg:`v${i}`,bits:128}); arguments_.push({index:8+i,location:'register',reg:`v${i}`,abiClass:'unknown-fp-vector'}); }
    return { srcs, arguments:arguments_, stackArguments, stackArgsUnknown:true, stackArgsMayContainPointers:false, evidence:'conservative-aapcs64' };
  }""",
              """  if (!params) {
    for (let i=0;i<8;i++) {
      srcs.push({t:'reg',reg:`x${i}`,bits:64,possible:true,mustUse:false,abiClass:'unknown-gp'});
      arguments_.push({index:i,location:'register',reg:`x${i}`,abiClass:'unknown-gp',possible:true,mustUse:false,mayContainPointers:true});
    }
    for (let i=0;i<8;i++) {
      srcs.push({t:'reg',reg:`v${i}`,bits:128,possible:true,mustUse:false,abiClass:'unknown-fp-vector'});
      arguments_.push({index:8+i,location:'register',reg:`v${i}`,abiClass:'unknown-fp-vector',possible:true,mustUse:false});
    }
    return {
      srcs,
      arguments:arguments_,
      stackArguments,
      stackArgsUnknown:true,
      stackArgsMayContainPointers:true,
      possibleRegisterInputs:srcs.slice(),
      partial:true,
      evidence:'conservative-aapcs64',
    };
  }""",
              'unknown prototype conservative inputs',
          )

          once(
              "for(let n=0;n<regsNeeded;n++){const reg=`v${fp++}`;regs.push(reg);srcs.push({t:'reg',reg,bits:c.vector?128:c.bits});}",
              "for(let n=0;n<regsNeeded;n++){const reg=`v${fp++}`;regs.push(reg);srcs.push({t:'reg',reg,bits:c.vector?128:c.bits,possible:false,mustUse:true});}",
              'fixed fp source certainty',
          )
          once(
              "arguments_.push({index,location:'register',regs,reg:regs[0],abiClass:c.hfa?'hfa':c.vector?'vector':'fp',pointer:c.pointer,bits:c.bits});",
              "arguments_.push({index,location:'register',regs,reg:regs[0],abiClass:c.hfa?'hfa':c.vector?'vector':'fp',pointer:c.pointer,bits:c.bits,possible:false,mustUse:true});",
              'fixed fp argument certainty',
          )
          once(
              "const reg=`x${gp++}`; srcs.push({t:'reg',reg,bits:64});",
              "const reg=`x${gp++}`; srcs.push({t:'reg',reg,bits:64,possible:false,mustUse:true});",
              'fixed gp source certainty',
          )
          once(
              "arguments_.push({index,location:'register',reg,abiClass:c.pointer?'pointer':'integer',pointer:c.pointer,bits:c.bits});",
              "arguments_.push({index,location:'register',reg,abiClass:c.pointer?'pointer':'integer',pointer:c.pointer,bits:c.bits,possible:false,mustUse:true});",
              'fixed gp argument certainty',
          )
          once(
              "const entry={index,location:'stack',offset:stackOffset,bytes:slots*8,abiClass:c.hfa?'hfa':c.vector?'vector':c.fp?'fp':c.pointer?'pointer':'integer',pointer:c.pointer,bits:c.bits};",
              "const entry={index,location:'stack',offset:stackOffset,bytes:slots*8,abiClass:c.hfa?'hfa':c.vector?'vector':c.fp?'fp':c.pointer?'pointer':'integer',pointer:c.pointer,bits:c.bits,possible:false,mustUse:true};",
              'fixed stack argument certainty',
          )

          once(
              """  return {
    srcs, arguments:arguments_, stackArguments,
    stackArgsUnknown:proto?.variadic===true||proto?.varargs===true,
    stackArgsMayContainPointers,
    evidence:unsupported.length?'partial-aapcs64-unsupported-sve':'prototype-aapcs64',
    unsupported:unsupported.length>0,
    unsupportedArguments:unsupported,
  };
}""",
              """  const variadic = proto?.variadic===true||proto?.varargs===true;
  const possibleRegisterInputs = [];
  if (variadic) {
    for (let i=gp;i<8;i++) {
      const source=possibleRegisterSource(`x${i}`,64,'variadic-unknown-gp');
      srcs.push(source);
      possibleRegisterInputs.push(source);
      arguments_.push({index:null,location:'register',reg:`x${i}`,bits:64,abiClass:'variadic-unknown-gp',possible:true,mustUse:false,mayContainPointers:true});
    }
    for (let i=fp;i<8;i++) {
      const source=possibleRegisterSource(`v${i}`,128,'variadic-unknown-fp-vector');
      srcs.push(source);
      possibleRegisterInputs.push(source);
      arguments_.push({index:null,location:'register',reg:`v${i}`,bits:128,abiClass:'variadic-unknown-fp-vector',possible:true,mustUse:false});
    }
  }
  return {
    srcs,
    arguments:arguments_,
    stackArguments,
    stackArgsUnknown:variadic,
    stackArgsMayContainPointers:stackArgsMayContainPointers || variadic,
    possibleRegisterInputs,
    partial:variadic || unsupported.length>0,
    evidence:unsupported.length?'partial-aapcs64-unsupported-sve':variadic?'prototype-aapcs64-variadic':'prototype-aapcs64',
    unsupported:unsupported.length>0,
    unsupportedArguments:unsupported,
  };
}""",
              'variadic frontier plus unsupported truth',
          )

          once(
              "platformPredicate:({ platform }) => !platform || platform === 'darwin' || platform === 'apple' || platform === 'macos' || platform === 'ios' || platform === 'ipados' || platform === 'linux' || platform === 'android' || platform === 'unknown',",
              "platformPredicate:({ platform }) => !platform || platform === 'linux' || platform === 'android' || platform === 'unknown',",
              'Darwin ABI separation',
          )
          once(
              "stackRules:()=>Object.freeze({ alignment:16, stackGrows:'down', argumentSlotBytes:8 }),",
              "stackRules:()=>Object.freeze({ alignment:16, stackGrows:'down', argumentSlotBytes:8, variadicRegisterSaveAreas:true }),",
              'variadic stack rules',
          )
          once(
              "defaultUnknownCallEffects:(context)=>Object.freeze({ registerClobbers:callerSavedFor(context), memoryEffects:'unknown', mayThrow:true }),",
              "defaultUnknownCallEffects:(context)=>Object.freeze({ registerClobbers:callerSavedFor(context), memoryEffects:'unknown', mayThrow:true, stackArguments:'unknown', stackArgsMayContainPointers:true }),",
              'unknown-call stack conservatism',
          )

          if '<<<<<<<' in s or '>>>>>>>' in s:
              raise SystemExit('AAPCS64 conflict markers remain')
          p.write_text(s)
          PY
          git add js/targets/abi/aapcs64.js

          # Preserve the current full npm-test chain and add the new ABI regression.
          git checkout --ours -- package.json
          python - <<'PY'
          from pathlib import Path
          p=Path('package.json')
          s=p.read_text()
          needle='node tests/issues-521-527.mjs && '
          add='node tests/issues-526-954-955-958-959.mjs && '
          if add not in s:
              if s.count(needle) != 1:
                  raise SystemExit('could not locate issues-521-527 anchor in npm test')
              s=s.replace(needle, needle+add, 1)
          p.write_text(s)
          PY
          git add package.json

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts:'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          # Diagnostic scaffolding must not survive the real reconciliation.
          git rm -f .github/workflows/tmp-abi-reconcile.yml 2>/dev/null || true

      - run: npm ci
      - name: Verify ABI regressions and overlapping current contracts
        shell: bash
        run: |
          node tests/issues-526-954-955-958-959.mjs
          node tests/phase5/abi/foundation.test.mjs
          node tests/issues-961-971.mjs
          if [ -f tests/issues-925-926-932-935-948.mjs ]; then node tests/issues-925-926-932-935-948.mjs; fi
          npm run phase5:test
          npm run lint
      - name: Rebuild generated userscript from reconciled source
        run: npm run userscript:build
      - name: Restore canonical generated-sync workflow
        shell: bash
        run: |
          git show origin/integrate/all-open-prs-20260819:.github/workflows/generated-sync.yml > .github/workflows/generated-sync.yml
      - name: Commit reconciled ABI state
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes after reconciliation.'
            exit 0
          fi
          git commit -m 'fix: reconcile ABI correctness issues #526 #954 #955 #958 #959'
          git push origin HEAD:fix/integration-abi-526-954-955-958-959
