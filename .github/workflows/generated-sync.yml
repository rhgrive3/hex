name: Generated userscript sync

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'capstone.wasm'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-release-version.mjs'
      - 'userscript/hex.user.template.js'
      - 'userscript/release-version.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generated-sync.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'capstone.wasm'
      - 'scripts/build-userscript.mjs'
      - 'scripts/userscript-release-version.mjs'
      - 'userscript/hex.user.template.js'
      - 'userscript/release-version.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/generated-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Capture generated userscript outputs for branch reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: pr987-generated-userscript
          path: |
            userscript/hex.user.template.js
            userscript/release-version.json
      - name: Require userscript-owned generated outputs to match source
        run: >-
          git diff --exit-code --
          userscript/hex.user.template.js
          userscript/release-version.json