name: One-shot finalize integration generated outputs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-integration-generated
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'integrate/all-open-prs-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/all-open-prs-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply #825 projection root fix only
        shell: bash
        run: |
          set -euo pipefail
          git show cce0797363bfe0ddc85a89c623d132e1845dce31:js/ir.js > js/ir.js
          git show 4dae354fcebd8cfda036498183c43be45e1a80ba^:tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs > tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-nodes.js')
          s=p.read_text()
          old="""    case 'binary': {\n      setBasic(V1_OP.BIN, node.operator || attrs.operator || 'unknown');\n      const carrier = comparisonCarrierByNodeId.get(node.id) ?? null;\n      if (carrier) {\n        const resultIsWritten = node.outputs?.[0] && hasRegisterStateWriteForValue(node.outputs[0], context);\n        if (!resultIsWritten) {\n          inst.op = V1_OP.CMP;\n          inst.dst = carrier;\n          inst.bits = Math.max(1, ...inputValues.map((value) => value.bits || 1));\n          inst.extra.comparison = 'semantic-flag-result';\n          inst.extra.semanticComparisonCarrier = true;\n          carrier.def = inst;\n        } else {\n          const cmp = appendComparisonInstruction(node, context, inst, carrier, inputValues, inst.sub, row, blockIndex);\n          if (cmp) extraInstructions.push(cmp);\n        }\n      }\n      break;\n    }\n"""
          new="""    case 'binary': {\n      setBasic(V1_OP.BIN, node.operator || attrs.operator || 'unknown');\n      const carrier = comparisonCarrierByNodeId.get(node.id) ?? null;\n      if (carrier) {\n        const resultValueId = node.outputs?.[0] ?? null;\n        const resultIsWritten = resultValueId != null && hasRegisterStateWriteForValue(resultValueId, context);\n        const resultIsConsumed = resultValueId != null && context.ir.nodes.some((candidate) =>\n          candidate.id !== node.id && candidate.inputs?.includes(resultValueId));\n        if (!resultIsWritten && !resultIsConsumed) {\n          inst.op = V1_OP.CMP;\n          inst.dst = carrier;\n          inst.bits = Math.max(1, ...inputValues.map((value) => value.bits || 1));\n          inst.extra.comparison = 'semantic-flag-result';\n          inst.extra.semanticComparisonCarrier = true;\n          carrier.def = inst;\n        } else {\n          const cmp = appendComparisonInstruction(node, context, inst, carrier, inputValues, inst.sub, row, blockIndex);\n          if (cmp) extraInstructions.push(cmp);\n        }\n      }\n      break;\n    }\n"""
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Pinpoint #800 signedness path
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js';
          import { irFor, branchConstraints, rangeOnBranch, COND } from './js/ir.js';
          import { normalizeRangeDomain } from './js/range-domain.js';
          const BASE=0x100000000n;
          const lines=['and x0, x1, #0x8000000000000000','cmp x0, #0','b.lt #0x100000010','nop','ret'];
          const rows=lines.map((line,row)=>{const i=line.indexOf(' ');return {row,address:BASE+BigInt(row*4),mn:i<0?line:line.slice(0,i),ops:i<0?'':line.slice(i+1)}});
          const rowOfAddress=(a)=>{const d=BigInt(a)-BASE;return d<0n||d>=BigInt(rows.length*4)||d%4n?null:Number(d/4n)};
          const model=buildSemanticModel(rows,{startRow:0,endRow:rows.length-1,rowOfAddress});
          const ir=irFor(model,{rowOfAddress,decoderSemanticVersion:'diag-x800-signedness'});
          const branch=ir.instructions.find(x=>x.op==='cbr');
          const fact=branchConstraints(ir)[0];
          const rep=(_k,v)=>typeof v==='bigint'?`${v}n`:v;
          console.log('BRANCH',JSON.stringify({cond:branch?.cond,kind:branch?.extra?.kind,args:branch?.args?.map(a=>({bits:a.bits,def:a.value?.def?{op:a.value.def.op,sub:a.value.def.sub,row:a.value.def.row}:null}))},rep,2));
          console.log('COND_ENTRY',JSON.stringify(COND[branch?.cond] ?? null,rep,2));
          console.log('FACT',JSON.stringify({takenSignedness:fact?.taken?.signedness,takenCondition:fact?.taken?.condition,takenRange:fact?.taken?.range,lhsSigned:fact?.taken?.value?.signed,lhsRange:fact?.taken?.value?.range},rep,2));
          console.log('NORMALIZE_AS_SIGNED',JSON.stringify(normalizeRangeDomain(fact?.taken?.value?.range,64,true),rep,2));
          console.log('RANGEONBRANCH_SOURCE',String(rangeOnBranch).slice(0,1600));
          NODE
