name: One-shot finalize integration generated outputs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: one-shot-finalize-integration-generated
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'integrate/all-open-prs-20260819' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/all-open-prs-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Diagnose shifted W32 comparison projection
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js';
          import { irFor, branchConstraints } from './js/ir.js';
          const BASE = 0x100000000n;
          const lines = ['mov w1, #0x80000000', 'cmp w0, w1, lsl #1', 'b.eq #0x100000010', 'nop', 'ret'];
          const rows = lines.map((line,row) => {
            const split=line.indexOf(' ');
            return { row, address:BASE+BigInt(row*4), mn:split<0?line:line.slice(0,split), ops:split<0?'':line.slice(split+1) };
          });
          const rowOfAddress=(address)=>{const d=BigInt(address)-BASE; return d<0n||d>=BigInt(rows.length*4)||d%4n?null:Number(d/4n);};
          const model=buildSemanticModel(rows,{startRow:0,endRow:rows.length-1,rowOfAddress});
          const ir=irFor(model,{rowOfAddress,decoderSemanticVersion:'diag-825-w-lsl'});
          const simple=(v)=>v?{id:v.id,vid:v.vid,bits:v.bits,reg:v.reg,const:v.const,def:v.def?{op:v.def.op,sub:v.def.sub,row:v.def.row}:null}:null;
          const instructions=(ir?.instructions||[]).map((x)=>({op:x.op,sub:x.sub,row:x.row,bits:x.bits,cond:x.cond,dst:simple(x.dst),args:(x.args||[]).map(a=>({bits:a.bits,shift:a.shift||null,value:simple(a.value)})),extra:x.extra}));
          const replacer=(_k,v)=>typeof v==='bigint'?`${v}n`:v;
          console.log('IR825',JSON.stringify(instructions,replacer,2));
          console.log('FACT825',JSON.stringify(branchConstraints(ir),replacer,2));
          NODE
      - name: Verify focused semantic regressions
        run: |
          node tests/machine-effects/issue-957-bti-guarded-page.test.mjs
          node tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Run full repository check
        run: npm run check
      - name: Prove generated output idempotence
        run: |
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp userscript/hex.user.template.js /tmp/hex.user.template.js
          cmp userscript/release-version.json /tmp/release-version.json
      - name: Restore canonical workflow and publish verified head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show HEAD^:.github/workflows/generated-sync.yml > .github/workflows/generated-sync.yml
          git add .github/workflows/generated-sync.yml userscript/hex.user.template.js userscript/release-version.json
          git diff --cached --check
          git commit -m 'chore: finalize integration generated outputs'
          git push origin HEAD:integrate/all-open-prs-20260819
