name: Apply issues 129-134
on:
  push:
    branches: [fix/issues-123-135-20260815]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: python3 tools/apply-issues-129-134.py
      - name: Focused regression
        run: |
          node tests/issues-129-134.mjs
          node tests/ir.mjs
          node tests/cfg-structuring.mjs
          node tests/decompiler-semantic.mjs
      - run: node tests/check.mjs
      - name: Commit verified result
        run: |
          git rm tools/apply-issues-129-134.py .github/workflows/apply-issues-129-134.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: align IR ABI claims and CFG semantics 129-134'
          git push origin HEAD:fix/issues-123-135-20260815
