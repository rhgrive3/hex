name: P3 semantic fallback probe
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-unary-alias-bench.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-real-fixtures.mjs TsumTsum
      - name: Compare direct semantic and public decompile
        run: |
          cat > tests/.p3-fallback-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile, decompileSemantic } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          const w=await openBinary('tests/.real-fixtures/TsumTsum');
          const a=0x1011af0d4n,end=0x1011af380n;
          const model=await w.analyze(a,end);
          setSemanticMigrationMode('semantic-v2-compat');
          const opts={addr:a,rowOfAddress:x=>x==null?null:Number((x-w.region.vmAddr)/4n),addrOfRow:r=>w.region.vmAddr+BigInt(r)*4n,symbolFor:x=>w.symbols.nameAt(x)};
          const direct=decompileSemantic(model,opts);
          const pub=decompile(model,opts);
          const report=(name,r)=>{
            const asm=(r?.lines||[]).filter(l=>/__asm\(/.test(l.text||''));
            console.error(`[${name}] semantic=${r?.semantic} legacyFallback=${r?.legacyFallback||false} unknown=${r?.ctx?.unknownInstructions||0} coverage=${JSON.stringify(r?.coverage||{})} asm=${asm.length}`);
            console.error(`[${name}-WARN] ${JSON.stringify(r?.warnings||[])}`);
            for(const l of asm) console.error(`[${name}-ASM] ${l.text}`);
          };
          report('DIRECT',direct); report('PUBLIC',pub);
          EOF
          node --max-old-space-size=6000 tests/.p3-fallback-probe.mjs
