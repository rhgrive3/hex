name: P3 projected unary row dump
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-unary-alias-bench.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-real-fixtures.mjs TsumTsum
      - name: Dump projected rows
        run: |
          cat > tests/.p3-row-dump.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { buildIR, setSemanticMigrationMode } from '../js/ir.js';
          const w=await openBinary('tests/.real-fixtures/TsumTsum');
          const a=0x1011af0d4n,end=0x1011af380n;
          const model=await w.analyze(a,end);
          setSemanticMigrationMode('semantic-v2-compat');
          const rowOfAddress=x=>x==null?null:Number((x-w.region.vmAddr)/4n);
          const ir=buildIR(model,{rowOfAddress});
          const wanted=new Set(model.instructions.filter(x=>/^(rbit|clz)$/i.test(String(x.mnemonic||''))).map(x=>x.row));
          for(const row of [...wanted].sort((x,y)=>x-y)) {
            const src=model.instructions.find(x=>x.row===row);
            console.error(`[SRC row=${row}] ${src?.mnemonic} ${src?.operands||''}`);
            for(const inst of ir.instructions.filter(x=>x.row===row)) console.error(`[IR row=${row}] op=${inst.op} sub=${inst.sub} text=${inst.text||''} dst=${inst.dst?.reg||''} extra=${JSON.stringify(inst.extra||{},(_,v)=>typeof v==='bigint'?v.toString():v)}`);
          }
          EOF
          node --max-old-space-size=6000 tests/.p3-row-dump.mjs
