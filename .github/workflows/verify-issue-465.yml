name: Verify issue 465
on:
  push:
    branches:
      - fix/issue-465-macho-symbol-types-v2
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure and sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Patch symbol semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/binary/macho.js'); s=p.read_text()
          old="""    const ntype = type & 0x0e;\n    const external = !!(type & 1);\n    const undefinedSymbol = ntype === 0 && value === 0n;\n    const sym = { name, address: value, size: null, kind: ntype === 0x0e ? 'section' : undefinedSymbol ? 'undefined' : 'other', binding: external ? 'global' : 'local', defined: !undefinedSymbol, sectionIndex: sect, desc, source: 'LC_SYMTAB' };\n    image.symbols.push(sym);\n    if (undefinedSymbol && external) {\n      const ordinal = (desc >>> 8) & 0xff;\n      image.imports.push({ name, library: dylibForOrdinal(image, ordinal), ordinal, weak: !!(desc & 0x40), source: 'symbol-table', sites: [] });\n    } else if (external && value !== 0n) {\n      image.exports.push({ name, address: value, kind: 'symbol', source: 'symbol-table' });\n    }"""
          new="""    const ntype = type & 0x0e;\n    const external = !!(type & 1);\n    const isUndefinedType = ntype === 0;\n    // For N_UNDF with non-zero n_value, Mach-O defines a tentative/common\n    // symbol: n_value is the requested byte size, never a VM address.\n    const commonSymbol = isUndefinedType && value !== 0n;\n    const undefinedSymbol = isUndefinedType && !commonSymbol;\n    const sym = {\n      name,\n      address: isUndefinedType ? 0n : value,\n      size: commonSymbol ? value : null,\n      common: commonSymbol,\n      kind: ntype === 0x0e ? 'section' : commonSymbol ? 'common' : undefinedSymbol ? 'undefined' : 'other',\n      binding: external ? 'global' : 'local',\n      defined: !isUndefinedType,\n      sectionIndex: sect, desc, source: 'LC_SYMTAB',\n    };\n    image.symbols.push(sym);\n    if (undefinedSymbol && external) {\n      const ordinal = (desc >>> 8) & 0xff;\n      image.imports.push({ name, library: dylibForOrdinal(image, ordinal), ordinal, weak: !!(desc & 0x40), source: 'symbol-table', sites: [] });\n    } else if (!isUndefinedType && external && value !== 0n) {\n      image.exports.push({ name, address: value, kind: 'symbol', source: 'symbol-table' });\n    }"""
          if 'const commonSymbol = isUndefinedType && value !== 0n;' not in s:
              if old not in s: raise SystemExit('symbol table anchor missing')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - run: node tests/issue-465-macho-symbol-types.mjs
      - run: npm run check
      - name: Commit verified implementation
        run: |
          rm -f .github/workflows/verify-issue-465.yml
          git add -A
          git commit -m "fix: preserve Mach-O common symbols without fake addresses (#465)"
          git push origin HEAD
