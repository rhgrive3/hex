name: Verify issue 425 planner budget

on:
  push:
    branches:
      - fix/issue-425-planner-budget

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-425-planner-budget
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/apply-issue-425.py
      - run: node tests/issue-425-planner-budget.mjs
      - run: npm run semantic:test
      - run: npm run ai:test
      - run: npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/query/planner.js package.json tests/issue-425-planner-budget.mjs
          git diff --cached --check
          git commit -m 'fix: expose goal planner function-budget truncation (#425)'
          git push origin HEAD:fix/issue-425-planner-budget
