name: Recognition review hardening v3

on:
  push:
    branches: [finish-recognition-knowledge-intelligence]

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed patch and projection fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/recognition-review-hardening-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end])
          exec(compile(script, '<review-hardening-v2>', 'exec'), {})

          p = Path('js/fingerprint/index.js')
          s = p.read_text()
          old = "      cfgHash:source.cfgHash, cfg:source.cfg, strings:(source.strings||[]).slice(0,4), imports:(source.imports||[]).slice(0,4), semanticHash:null,"
          new = "      cfgHash:source.cfgHash, cfg:source.cfg, strings:(source.strings||[]).slice(0,4), imports:(source.imports||[]).slice(0,4), semanticHash:source.semanticHash || null,"
          if s.count(old) != 1:
              raise SystemExit('fast full->fast semantic projection marker missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Core and recognition regressions
        run: npm run check
      - name: Platform suite
        run: npm run platform:test
      - name: Binary suite
        run: npm run binary:test
      - name: Binary gate
        run: npm run binary:gate
      - name: Commit reviewed hardening
        shell: bash
        run: |
          rm -f .github/workflows/recognition-review-hardening-v2.yml .github/workflows/recognition-review-hardening-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden recognition false-positive controls after review'
          git push origin HEAD:finish-recognition-knowledge-intelligence
