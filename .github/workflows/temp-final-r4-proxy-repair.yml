name: TEMP Final R4 frozen-bridge repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r4-proxy-progress-budget-v4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact frozen bridge regression
        run: node tests/dev-agent/supervisor-progress-budget.mjs
      - name: Build canonical userscript
        run: npm run userscript:build
      - name: Canonical userscript contract
        run: npm run userscript:test
      - name: Round 4 production bootstrap contract
        run: node tests/dev-agent/round4-production-bootstrap.mjs
      - name: Commit generated release and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-final-r4-proxy-repair.yml
          git add userscript/hex.user.template.js userscript/release-version.json
          git commit -m "Sync R4 frozen-bridge repair release"
          git push origin HEAD:fix/r4-proxy-progress-budget-v4
