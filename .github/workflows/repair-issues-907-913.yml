name: Repair Issues 907 909 910 913

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-issues-907-913-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'fix/issues-907-909-910-913-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/issues-907-909-910-913-20260819
          fetch-depth: 0

      - name: Rebase onto current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded repair
        run: |
          node scripts/repair-issues-907-909-910-913.mjs
          node scripts/repair-issues-907-909-followup.mjs
          node scripts/repair-issue-909-section-scope.mjs
          node scripts/repair-test-907-ialign32.mjs
          node scripts/repair-issue-913-abi-locations.mjs
          node scripts/repair-compiler-truth-explicit-abi.mjs
          node scripts/repair-acceptance-909-910.mjs
          node scripts/repair-issue-909-g-abbrev.mjs

      - name: Focused regressions
        run: node --test --test-reporter=spec --test-concurrency=1 tests/phase6/generic-core/issues-907-909-910-913.test.mjs

      - name: Regenerate userscript
        run: npm run userscript:build

      - name: Full repository verification
        run: npm run check

      - name: Diff validation
        run: git diff --check

      - name: Commit verified source
        run: |
          rm scripts/repair-issues-907-909-910-913.mjs
          rm scripts/repair-issues-907-909-followup.mjs
          rm scripts/repair-issue-909-section-scope.mjs
          rm scripts/repair-test-907-ialign32.mjs
          rm scripts/repair-issue-913-abi-locations.mjs
          rm scripts/repair-compiler-truth-explicit-abi.mjs
          rm scripts/repair-acceptance-909-910.mjs
          rm scripts/repair-issue-909-g-abbrev.mjs
          rm .github/workflows/repair-issues-907-913.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve issues 907 909 910 and 913'
          git push --force-with-lease origin HEAD:fix/issues-907-909-910-913-20260819
