name: Temp regenerate userscript
on:
  push:
    branches: [review-backend-open-race]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-backend-open-race
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - name: Commit generated deployment bundles
        run: |
          if git diff --quiet -- userscript/hex.user.template.js userscript/platform-worker.bundle.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userscript/hex.user.template.js userscript/platform-worker.bundle.js
          git commit -m 'Regenerate userscript deployment bundles'
          git push origin HEAD:review-backend-open-race
