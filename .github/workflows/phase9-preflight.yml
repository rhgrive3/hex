name: Phase 9 preflight

on:
  pull_request:
    paths:
      - 'js/symbolic/**'
      - 'js/analysis/**'
      - 'js/ai/tools/registry.js'
      - 'js/ai/tools/storage/observation-store.js'
      - 'tests/phase9/**'
      - 'reports/phase9/**'
      - 'docs/PHASE9_*'
      - '.github/workflows/phase9-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase 9 foundation contracts
        run: node tests/phase9/run.mjs
      - name: Phase 8 handoff regression
        run: npm run phase8:test
      - name: Migration guardrails
        run: npm run migration:test
      - name: Semantic v2 contract
        run: npm run semantic-v2:test
