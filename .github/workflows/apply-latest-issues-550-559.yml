name: Apply latest issue fixes 550-559

on:
  push:
    branches:
      - fix-latest-issues-550-559

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-latest-issues-550-559
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted fixes
        run: python3 tools/apply-latest-issue-fixes.py
      - name: Targeted regression tests
        run: node tests/issues-550-559.mjs
      - name: Static and full regression suite
        run: npm test
      - name: Commit verified changes
        run: |
          git rm tools/apply-latest-issue-fixes.py .github/workflows/apply-latest-issues-550-559.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve issues 550 through 559"
          git push origin HEAD:fix-latest-issues-550-559
