name: Phase 10 release validation

# Permanent exact-product verifier for the Runtime Provider phase. Exact-SHA
# dispatch prevents validation-only PRs (EP-012). Broad repository validation
# runs only at release boundaries; draft inner-loop pushes stay focused.
on:
  push:
    branches:
      - main
      - "phase10/**"
    paths:
      - "js/runtime/**"
      - "js/debug/**"
      - "js/adapters/**"
      - "js/runtime-evidence/**"
      - "js/core/identity/**"
      - "js/core/evidence/**"
      - "tests/phase10/**"
      - "tests/runtime-platform.mjs"
      - "tests/runtime-evidence-fusion.mjs"
      - "tools/validation/phase10/**"
      - ".github/workflows/phase10-release-validation.yml"
      - ".github/workflows/_phase-release-validation.yml"
      - "package.json"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "js/runtime/**"
      - "js/debug/**"
      - "js/adapters/**"
      - "js/runtime-evidence/**"
      - "js/core/identity/**"
      - "js/core/evidence/**"
      - "tests/phase10/**"
      - "tests/runtime-platform.mjs"
      - "tests/runtime-evidence-fusion.mjs"
      - "tools/validation/phase10/**"
      - ".github/workflows/phase10-release-validation.yml"
      - "package.json"
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character commit SHA to verify"
        required: true
        type: string
      shadow:
        description: "Report without failing the job"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase10-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Stage 1 completion owns the aggregate product candidate. Phase 10's
    # component ownership gate must not reinterpret that cross-phase diff as a
    # Phase 10 candidate merely because package.json is shared.
    if: >-
      ${{ github.event_name != 'pull_request' ||
          github.head_ref != 'completion/stage1-integration' }}
    uses: ./.github/workflows/_phase-release-validation.yml
    with:
      phase_name: "Phase 10"
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha || github.sha }}
      expected_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
      shadow: ${{ github.event_name == 'workflow_dispatch' && inputs.shadow || false }}
      run_broad_regression: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
      ownership_script: "tools/validation/phase10/ownership-check.mjs"
      verify_script: "tools/validation/phase10/verify.mjs"
      artifact_prefix: "phase10-release-evidence"
      artifact_suffix: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha || github.sha }}
      evidence_paths: |
        reports/phase10/phase10-release-evidence.json
        reports/phase10/checkpoints.json
      timeout_minutes: 60
