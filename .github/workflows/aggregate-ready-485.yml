name: Aggregate remaining ready PRs into 485
on:
  push:
    branches:
      - fix/latest-478-476-notes
permissions:
  contents: write
jobs:
  aggregate:
    if: startsWith(github.event.head_commit.message, 'ready-pr-merge-helper:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aggregate ready heads and validate
        run: bash .github/aggregate-ready-485.sh
