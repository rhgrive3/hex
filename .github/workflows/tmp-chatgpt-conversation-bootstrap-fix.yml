name: Temporary ChatGPT conversation bootstrap repair

on:
  push:
    branches:
      - hex/chatgpt-conversation-bootstrap-fix

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/chatgpt-conversation-bootstrap-fix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply evidence-based conversation lifecycle repair
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          # Prefer ChatGPT's stable logical turn id over renderer-local ids.
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "    const explicit = node.getAttribute?.('data-message-id') || node.getAttribute?.('data-testid') || node.id;",
              """    // Production traces show that ChatGPT can rewrite both the renderer's\n    // conversation-turn test id and data-message-id while one logical response\n    // is still alive. data-turn-id survives those re-hydrations, so it is the\n    // strongest DOM-provided identity when a conversation wrapper exposes it.\n    const explicit = node.getAttribute?.('data-turn-id')\n      || node.getAttribute?.('data-message-id')\n      || node.getAttribute?.('data-testid')\n      || node.id;""",
          )

          # A new-chat route is not ready until the old conversation turns are gone.
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              """    const fresh = this.adapter.newChatButton();\n    if (fresh) fresh.click();\n    else throw bridgeError('conversation-router', 'new-chat-unavailable', 'ChatGPT New Chat control was not found.');\n    const ready = await waitFor(() => !this.adapter.conversation() && this.adapter.composer(), timeoutMs, signal);\n    if (!ready) throw bridgeError('conversation-router', 'new-chat-timeout', 'ChatGPT did not open a new conversation.');\n    return { conversation: null, isNew: true };""",
              """    // ChatGPT changes /c/<id> -> / before it removes the old turn DOM.\n    // If Hex starts the next request in that gap, the old conversation becomes\n    // the new request's baseline. Wait until every previously visible logical\n    // turn is gone; an already-empty home page still resolves immediately.\n    const priorTurns = conversationTurnIds(this.adapter);\n    const fresh = this.adapter.newChatButton();\n    if (fresh) fresh.click();\n    else throw bridgeError('conversation-router', 'new-chat-unavailable', 'ChatGPT New Chat control was not found.');\n    const ready = await waitFor(() => {\n      if (this.adapter.conversation()) return null;\n      const composer = this.adapter.composer();\n      if (!composer) return null;\n      return priorTurnsCleared(this.adapter, priorTurns) ? composer : null;\n    }, timeoutMs, signal);\n    if (!ready) throw bridgeError('conversation-router', 'new-chat-timeout', 'ChatGPT did not open a new conversation.');\n    return { conversation: null, isNew: true };""",
          )

          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "  async run(prompt, { signal, timeoutMs = 110000, expectedConversation = null, onConversation } = {}) {",
              "  async run(prompt, { signal, timeoutMs = 110000, expectedConversation = null, newConversation = expectedConversation === null, onConversation } = {}) {",
          )

          replace_once(
              'js/userscript/chatgpt-adapter.js',
              """    let latest = '', latestId = null, lastChangedAt = Date.now(), sawGenerating = this.adapter.isGenerating(), observedConversation = expectedConversation;\n    let stopObserving = NOOP;\n    try {\n      while (Date.now() - started < timeoutMs) {\n        if (signal?.aborted) throw abortError(signal.reason);\n        // Scope error detection to the turns this request created. Fall back to\n        // the unscoped read when no turn node is known, so a build whose turn\n        // wrappers Hex cannot resolve loses no error detection at all.\n        const activeNodes = this.conversationTurns()\n          .filter((turn) => !baselineConversation.has(turn.id))\n          .map((turn) => turn.node)\n          .filter(Boolean);\n        if (!activeNodes.length && requestUserTurn?.node) activeNodes.push(requestUserTurn.node);\n        const error = this.adapter.errorState(activeNodes.length ? activeNodes : null);\n        if (error) throw bridgeError('turn-controller', 'response-error', 'ChatGPT reported an error while generating the Hex turn.', { error });\n        const conversation = this.adapter.conversation();\n        if (!observedConversation && conversation) { observedConversation = conversation; onConversation?.(conversation); }\n        // A routing gap reports no conversation at all. Unknown must stay\n        // unknown: only a different, concretely identified conversation proves\n        // that ChatGPT moved this request somewhere else.\n        if (observedConversation && conversation && conversation.id !== observedConversation.id) {\n          throw bridgeError('turn-controller', 'conversation-switched', 'ChatGPT conversation changed while a Hex request was in flight.', { expected: observedConversation, actual: conversation });\n        }\n        if (this.adapter.isGenerating()) sawGenerating = true;\n\n        const explicit = this.assistantTurns().filter((turn) => !baselineAssistant.has(turn.id));\n        if (explicit.length > 1) throw bridgeError('turn-controller', 'manual-interference', 'Multiple assistant turns appeared while one Hex request was in flight.');\n        const turn = explicit[0] || this.fallbackResponseTurn({ baselineConversation, baselineUsers, requestUserTurn, normalizedPrompt });""",
              """    let latest = '', latestId = null, lastChangedAt = Date.now(), sawGenerating = this.adapter.isGenerating(), observedConversation = expectedConversation;\n    let missingConversationSince = null, bootstrapMigrated = false;\n    let stopObserving = NOOP;\n    try {\n      while (Date.now() - started < timeoutMs) {\n        if (signal?.aborted) throw abortError(signal.reason);\n\n        // Read one logical snapshot before judging navigation. The production\n        // lifecycle proves that a brand-new chat can move provisional CID A ->\n        // final CID B while the same user turn and data-turn-id stay alive. A\n        // real navigation replaces that request turn instead.\n        const conversationTurns = this.conversationTurns();\n        const userTurns = this.userTurns();\n        const freshUsers = userTurns.filter((turn) => !baselineUsers.has(turn.id));\n        const requestPresent = requestTurnIsPresent(requestUserTurn, userTurns, conversationTurns, normalizedPrompt);\n        const conversation = this.adapter.conversation();\n\n        if (conversation) {\n          missingConversationSince = null;\n          if (!observedConversation) {\n            observedConversation = conversation;\n            onConversation?.(conversation);\n          } else if (conversation.id !== observedConversation.id) {\n            // Existing sessions keep strict conversation isolation. Only a\n            // request that started from New Chat may migrate its provisional CID,\n            // and only while the exact submitted user turn is still present and\n            // no competing user turn appeared.\n            if (!newConversation || !requestPresent || freshUsers.length !== 1) {\n              throw bridgeError('turn-controller', 'conversation-switched', 'ChatGPT conversation changed while a Hex request was in flight.', { expected: observedConversation, actual: conversation });\n            }\n            observedConversation = conversation;\n            bootstrapMigrated = true;\n            onConversation?.(conversation);\n          }\n        } else if (observedConversation) {\n          if (missingConversationSince === null) missingConversationSince = Date.now();\n          if (Date.now() - missingConversationSince >= this.conversationGraceMs) {\n            throw bridgeError('turn-controller', 'conversation-switched', 'ChatGPT conversation disappeared while a Hex request was in flight.', { expected: observedConversation });\n          }\n        }\n\n        // If a provisional CID was accepted and the request turn then disappears,\n        // this was navigation to another conversation, not bootstrap migration.\n        if (bootstrapMigrated && !requestPresent) {\n          throw bridgeError('turn-controller', 'conversation-switched', 'ChatGPT left the Hex request after a new-conversation identity migration.', { expected: observedConversation });\n        }\n        if (freshUsers.length > 1) {\n          throw bridgeError('turn-controller', 'manual-interference', 'Another user turn appeared while one Hex request was in flight.');\n        }\n\n        // Scope error detection to the turns this request created. Fall back to\n        // the unscoped read when no turn node is known, so a build whose turn\n        // wrappers Hex cannot resolve loses no error detection at all.\n        const activeNodes = conversationTurns\n          .filter((turn) => !baselineConversation.has(turn.id))\n          .map((turn) => turn.node)\n          .filter(Boolean);\n        if (!activeNodes.length && requestUserTurn?.node) activeNodes.push(requestUserTurn.node);\n        const error = this.adapter.errorState(activeNodes.length ? activeNodes : null);\n        if (error) throw bridgeError('turn-controller', 'response-error', 'ChatGPT reported an error while generating the Hex turn.', { error });\n        if (this.adapter.isGenerating()) sawGenerating = true;\n\n        const explicit = this.assistantTurns().filter((turn) => !baselineAssistant.has(turn.id));\n        if (explicit.length > 1) throw bridgeError('turn-controller', 'manual-interference', 'Multiple assistant turns appeared while one Hex request was in flight.');\n        const turn = explicit[0] || this.fallbackResponseTurn({ baselineConversation, baselineUsers, requestUserTurn, normalizedPrompt });""",
          )

          replace_once(
              'js/userscript/chatgpt-adapter.js',
              """          if (settled) {\n            const identity = conversation || observedConversation;\n            if (identity || settledFor >= Math.max(this.quietMs, this.conversationGraceMs)) {\n              return { text: latest.trim(), conversation: identity || null, turnId: turn.id };\n            }\n          }""",
              """          if (settled) {\n            // A known conversation that temporarily reads as null is not safe to\n            // finalize. A short SPA gap will recover; a real New Chat navigation\n            // is rejected above after conversationGraceMs.\n            if (observedConversation && !conversation) {\n              await delay(this.pollMs, signal);\n              continue;\n            }\n            const identity = conversation || observedConversation;\n            if (identity || settledFor >= Math.max(this.quietMs, this.conversationGraceMs)) {\n              return { text: latest.trim(), conversation: identity || null, turnId: turn.id };\n            }\n          }""",
          )

          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "function bridgeError(stage, code, message, details = null) { return new ChatGPTBridgeError(code, message, details, stage); }",
              """function conversationTurnIds(adapter) {\n  if (typeof adapter?.conversationTurns !== 'function') return new Set();\n  return new Set((adapter.conversationTurns() || []).map((turn) => String(turn?.id || '')).filter(Boolean));\n}\nfunction priorTurnsCleared(adapter, priorTurns) {\n  if (!priorTurns?.size) return true;\n  const current = conversationTurnIds(adapter);\n  for (const id of priorTurns) if (current.has(id)) return false;\n  return true;\n}\nfunction requestTurnIsPresent(request, userTurns, conversationTurns, normalizedPrompt) {\n  if (!request) return false;\n  const matches = (turn) => {\n    if (!turn) return false;\n    const sameIdentity = turn.id === request.id || (!!turn.node && !!request.node && turn.node === request.node);\n    return sameIdentity && normalizeText(turn.text) === normalizedPrompt;\n  };\n  return (userTurns || []).some(matches) || (conversationTurns || []).some(matches);\n}\nfunction bridgeError(stage, code, message, details = null) { return new ChatGPTBridgeError(code, message, details, stage); }""",
          )

          # Do not persist a provisional new-chat CID. Persist only the identity
          # returned after the request has safely settled.
          replace_once(
              'js/userscript/chatgpt-bridge.js',
              """        let bound = routed.conversation;\n        const result = await turns.run(String(prompt || ''), {\n          signal: controller.signal,\n          timeoutMs: requestOptions.timeoutMs || options.timeoutMs || DEFAULT_TIMEOUT_MS,\n          expectedConversation: routed.conversation,\n          onConversation: (conversation) => { bound = router.bind(requestOptions.sessionKey, conversation); },\n        });\n        bound = result.conversation ? router.bind(requestOptions.sessionKey, result.conversation) : bound;\n        return { text: result.text, conversation: bound, selection, turnId: result.turnId };""",
              """        const result = await turns.run(String(prompt || ''), {\n          signal: controller.signal,\n          timeoutMs: requestOptions.timeoutMs || options.timeoutMs || DEFAULT_TIMEOUT_MS,\n          expectedConversation: routed.conversation,\n          newConversation: routed.isNew === true,\n        });\n        // New Chat can expose a provisional /c/<id> and replace it while the\n        // same logical request is generating. Never persist that intermediate\n        // identity; bind only the settled conversation returned by the turn.\n        const bound = result.conversation\n          ? router.bind(requestOptions.sessionKey, result.conversation)\n          : routed.conversation;\n        return { text: result.text, conversation: bound, selection, turnId: result.turnId };""",
          )

          # Bridge contract: one final bind, and explicit newConversation intent.
          replace_once(
              'tests/chatgpt-web-bridge-contract.mjs',
              "await testRequestContract();\nawait testSingleInflightAndBusyCleanup();",
              "await testRequestContract();\nawait testNewConversationBindingIsDeferred();\nawait testSingleInflightAndBusyCleanup();",
          )
          replace_once(
              'tests/chatgpt-web-bridge-contract.mjs',
              "  const interimConversation = { id: 'conversation-interim', url: 'https://chatgpt.com/c/conversation-interim' };\n",
              "",
          )
          replace_once(
              'tests/chatgpt-web-bridge-contract.mjs',
              """    async run(prompt, requestOptions) {\n      calls.runs.push({ prompt, ...requestOptions });\n      requestOptions.onConversation(interimConversation);\n      return { text: 'contract result', conversation: finalConversation, turnId: 'turn-contract-1' };\n    },""",
              """    async run(prompt, requestOptions) {\n      calls.runs.push({ prompt, ...requestOptions });\n      return { text: 'contract result', conversation: finalConversation, turnId: 'turn-contract-1' };\n    },""",
          )
          replace_once(
              'tests/chatgpt-web-bridge-contract.mjs',
              """  assert.equal(calls.runs[0].timeoutMs, 4321);\n  assert.equal(calls.runs[0].expectedConversation, routedConversation);\n\n  assert.deepEqual(calls.binds, [\n    { sessionKey: 'session-contract', conversation: interimConversation },\n    { sessionKey: 'session-contract', conversation: finalConversation },\n  ]);""",
              """  assert.equal(calls.runs[0].timeoutMs, 4321);\n  assert.equal(calls.runs[0].expectedConversation, routedConversation);\n  assert.equal(calls.runs[0].newConversation, false);\n  assert.equal(calls.runs[0].onConversation, undefined);\n\n  assert.deepEqual(calls.binds, [\n    { sessionKey: 'session-contract', conversation: finalConversation },\n  ]);""",
          )
          replace_once(
              'tests/chatgpt-web-bridge-contract.mjs',
              "async function testSingleInflightAndBusyCleanup() {",
              """async function testNewConversationBindingIsDeferred() {\n  const finalConversation = { id: 'conversation-final-new', url: 'https://chatgpt.com/c/conversation-final-new' };\n  const binds = [];\n  const bridge = freshBridge({\n    adapter: fakeAdapter(),\n    router: {\n      route: async () => ({ conversation: null, isNew: true }),\n      bind(sessionKey, conversation) { binds.push({ sessionKey, conversation }); return conversation; },\n      binding: () => null,\n    },\n    models: fakeModels(),\n    turns: {\n      async run(_prompt, options) {\n        assert.equal(options.expectedConversation, null);\n        assert.equal(options.newConversation, true);\n        assert.equal(options.onConversation, undefined, 'provisional CIDs must not be persisted by the bridge');\n        return { text: 'new result', conversation: finalConversation, turnId: 'turn-new-final' };\n      },\n    },\n  });\n\n  const result = await bridge.request('new conversation', { sessionKey: 'session-new' });\n  assert.deepEqual(binds, [{ sessionKey: 'session-new', conversation: finalConversation }]);\n  assert.equal(result.conversation, finalConversation);\n  clearBridge();\n}\n\nasync function testSingleInflightAndBusyCleanup() {""",
          )

          # Runtime regressions from the captured iPad lifecycle.
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              """await testConversationRouting();\nawait testModelSelection();\nawait testLogicalTurnCanonicalization();""",
              """await testConversationRouting();\nawait testNewConversationRouteWaitsForOldTurns();\nawait testModelSelection();\nawait testLogicalTurnCanonicalization();\nawait testStableTurnIdentityUsesDataTurnId();""",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              """await testTransientConversationGapIsNotASwitch();\nawait testHistoricalErrorTurnDoesNotPoisonARequest();""",
              """await testTransientConversationGapIsNotASwitch();\nawait testNewConversationIdentityMigration();\nawait testNewConversationNavigationAwayIsRejected();\nawait testPersistentConversationGapIsRejected();\nawait testHistoricalErrorTurnDoesNotPoisonARequest();""",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "async function testModelSelection() {",
              """async function testNewConversationRouteWaitsForOldTurns() {\n  let current = { id: 'old', url: 'https://chatgpt.com/c/old' };\n  let turns = [{ id: 'old-user' }, { id: 'old-assistant' }];\n  let clicks = 0;\n  const adapter = {\n    conversation: () => current,\n    conversationTurns: () => turns,\n    composer: () => ({}),\n    newChatButton: () => ({ click() {\n      clicks++;\n      current = null;\n      setTimeout(() => { turns = []; }, 20);\n    } }),\n    all: () => [],\n  };\n  const router = new ChatGPTConversationRouter(adapter, { storage: memoryStorage(), navigationTimeoutMs: 250 });\n  const routed = await router.route('fresh-session');\n  assert.equal(clicks, 1);\n  assert.equal(routed.isNew, true);\n  assert.equal(routed.conversation, null);\n  assert.equal(turns.length, 0, 'new-chat routing must wait for the old conversation DOM to leave');\n}\n\nasync function testModelSelection() {""",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "async function testRoleScopedTurnTextExtraction() {",
              """async function testStableTurnIdentityUsesDataTurnId() {\n  let testId = 'conversation-turn-2';\n  const node = {\n    id: '',\n    getAttribute(name) {\n      if (name === 'data-turn-id') return 'request-WEB:stable-turn';\n      if (name === 'data-testid') return testId;\n      return null;\n    },\n  };\n  const adapter = new ChatGPTDOMAdapter({ document: null, location: { href: 'https://chatgpt.com/c/alpha' } });\n  assert.equal(adapter.identity(node), 'request-WEB:stable-turn');\n  testId = 'conversation-turn-5';\n  assert.equal(adapter.identity(node), 'request-WEB:stable-turn', 'renderer test-id churn must not change logical turn identity');\n}\n\nasync function testRoleScopedTurnTextExtraction() {""",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "async function testHistoricalErrorTurnDoesNotPoisonARequest() {",
              """async function testNewConversationIdentityMigration() {\n  const alpha = { id: 'alpha', url: 'https://chatgpt.com/c/alpha' };\n  const beta = { id: 'beta', url: 'https://chatgpt.com/c/beta' };\n  const state = { generating: false, assistants: [], users: [], turns: [], conversation: null };\n  const user = { id: 'hex-user-turn', text: 'prompt', node: plainNode('hex-user-turn') };\n  const assistant = { id: 'hex-assistant-turn', text: '', node: plainNode('hex-assistant-turn') };\n  const adapter = turnAdapter(state, () => {\n    state.users.push(user);\n    state.assistants.push(assistant);\n    state.turns.push(user, assistant);\n    state.generating = true;\n    setTimeout(() => { state.conversation = alpha; }, 4);\n    setTimeout(() => { state.conversation = beta; }, 12);\n    setTimeout(() => { assistant.text = '{\"type\":\"final\"}'; state.generating = false; }, 24);\n  });\n  const seen = [];\n  const result = await new ChatGPTTurnController(adapter, { quietMs: 5, pollMs: 2, startTimeoutMs: 40, conversationGraceMs: 20 })\n    .run('prompt', { timeoutMs: 400, newConversation: true, onConversation: (conversation) => seen.push(conversation.id) });\n  assert.equal(result.conversation.id, 'beta', 'the final CID must replace the provisional CID');\n  assert.equal(result.turnId, 'hex-assistant-turn');\n  assert.ok(seen.includes('alpha'));\n  assert.ok(seen.includes('beta'));\n}\n\nasync function testNewConversationNavigationAwayIsRejected() {\n  const alpha = { id: 'alpha', url: 'https://chatgpt.com/c/alpha' };\n  const beta = { id: 'beta', url: 'https://chatgpt.com/c/beta' };\n  const state = { generating: false, assistants: [], users: [], turns: [], conversation: null };\n  const requestUser = { id: 'hex-user-turn', text: 'prompt', node: plainNode('hex-user-turn') };\n  const requestAssistant = { id: 'hex-assistant-turn', text: 'partial', node: plainNode('hex-assistant-turn') };\n  const adapter = turnAdapter(state, () => {\n    state.users.push(requestUser);\n    state.assistants.push(requestAssistant);\n    state.turns.push(requestUser, requestAssistant);\n    state.generating = true;\n    setTimeout(() => { state.conversation = alpha; }, 4);\n    // The URL can change before ChatGPT replaces the old DOM. This first looks\n    // like bootstrap migration; the disappearing request turn proves navigation.\n    setTimeout(() => { state.conversation = beta; }, 12);\n    setTimeout(() => {\n      const otherUser = { id: 'other-user', text: 'other prompt', node: plainNode('other-user') };\n      const otherAssistant = { id: 'other-assistant', text: 'other response', node: plainNode('other-assistant') };\n      state.users = [otherUser];\n      state.assistants = [otherAssistant];\n      state.turns = [otherUser, otherAssistant];\n      state.generating = false;\n    }, 24);\n  });\n  await assert.rejects(\n    new ChatGPTTurnController(adapter, { quietMs: 20, pollMs: 2, startTimeoutMs: 40, conversationGraceMs: 20 })\n      .run('prompt', { timeoutMs: 300, newConversation: true }),\n    (error) => error.code === 'conversation-switched' && error.stage === 'turn-controller',\n  );\n}\n\nasync function testPersistentConversationGapIsRejected() {\n  const alpha = { id: 'alpha', url: 'https://chatgpt.com/c/alpha' };\n  const state = { generating: false, assistants: [], users: [], turns: [], conversation: alpha };\n  const user = { id: 'hex-user', text: 'prompt', node: plainNode('hex-user') };\n  const assistant = { id: 'hex-assistant', text: 'partial', node: plainNode('hex-assistant') };\n  const adapter = turnAdapter(state, () => {\n    state.users.push(user);\n    state.assistants.push(assistant);\n    state.turns.push(user, assistant);\n    state.generating = true;\n    setTimeout(() => { state.conversation = null; }, 4);\n    setTimeout(() => { assistant.text = '{\"type\":\"final\"}'; state.generating = false; }, 8);\n  });\n  await assert.rejects(\n    new ChatGPTTurnController(adapter, { quietMs: 3, pollMs: 2, startTimeoutMs: 40, conversationGraceMs: 12 })\n      .run('prompt', { timeoutMs: 200, expectedConversation: alpha }),\n    (error) => error.code === 'conversation-switched',\n    'a persistent /c/<id> -> / transition must not finalize against the old conversation',\n  );\n}\n\nasync function testHistoricalErrorTurnDoesNotPoisonARequest() {""",
          )

          # Production-shaped fixture: distinguish CID migration from real navigation.
          replace_once(
              'tests/fixtures/chatgpt-production-dom.mjs',
              """  function assistantBody(section) {\n    return section.querySelector('[data-message-author-role=\"assistant\"]');\n  }\n\n  function stream(section, chunks, done) {""",
              """  function assistantBody(section) {\n    return section.querySelector('[data-message-author-role=\"assistant\"]');\n  }\n\n  function openNewChat(domDelayMs = 0) {\n    history.replaceState({}, '', '/');\n    showSend();\n    const clear = () => { thread.replaceChildren(); turnIndex = 0; };\n    if (domDelayMs > 0) setTimeout(clear, domDelayMs);\n    else clear();\n  }\n\n  function replaceWithConversation(conversationId) {\n    history.replaceState({}, '', '/c/' + conversationId);\n    thread.replaceChildren();\n    turnIndex = 0;\n    appendUserTurn('別の既存会話', 'other-user-' + conversationId);\n    const assistant = appendAssistantTurn('other-assistant-' + conversationId);\n    assistantBody(assistant).innerHTML = '<div class=\"markdown\">別の既存会話の回答</div>';\n    showSend();\n  }\n\n  function stream(section, chunks, done) {""",
          )
          replace_once(
              'tests/fixtures/chatgpt-production-dom.mjs',
              """      if (options.switchToConversation) {\n        setTimeout(() => history.replaceState({}, '', '/c/' + options.switchToConversation), options.switchAtMs ?? 40);\n      }""",
              """      if (options.migrateToConversation) {\n        // Real new-chat traces keep the exact user/assistant data-turn-id while\n        // ChatGPT replaces a provisional conversation id with its final id.\n        setTimeout(() => history.replaceState({}, '', '/c/' + options.migrateToConversation), options.migrateAtMs ?? 40);\n      }\n      if (options.navigateToConversation) {\n        // A real switch loads another turn set; the active Hex request identity\n        // disappears instead of migrating with the route.\n        setTimeout(() => replaceWithConversation(options.navigateToConversation), options.navigateAtMs ?? 40);\n      }\n      if (options.navigateToNewChat) {\n        // Production changes the route before tearing down the old turn DOM.\n        setTimeout(() => openNewChat(options.navigationDomDelayMs ?? 300), options.navigateAtMs ?? 40);\n      }""",
          )
          replace_once(
              'tests/fixtures/chatgpt-production-dom.mjs',
              """  history_nav.addEventListener('click', (event) => {\n    if (!event.target.closest('[data-testid=\"create-new-chat-button\"]')) return;\n    thread.replaceChildren();\n    turnIndex = 0;\n    history.replaceState({}, '', '/');\n    showSend();\n  });""",
              """  history_nav.addEventListener('click', (event) => {\n    if (!event.target.closest('[data-testid=\"create-new-chat-button\"]')) return;\n    openNewChat(options.newChatDomDelayMs || 0);\n  });""",
          )

          replace_once(
              'tests/chatgpt-web-production-dom.mjs',
              """    await scenario(context, name, 'a stale historical error turn does not poison a healthy request', {""",
              """    await scenario(context, name, 'a new chat may replace its provisional conversation id', {\n      prompt: LONG_PROMPT, chatgpt: { migrateToConversation: OTHER_CONVERSATION, migrateAtMs: 40, streamMs: 12 },\n    }, (result) => {\n      assert.equal(result.ok, true, `${name}: a same-request CID migration must stay attached (${result.error?.code})`);\n      assert.equal(result.value.text, ANSWER);\n      assert.equal(result.value.conversation.id, OTHER_CONVERSATION);\n    });\n\n    await scenario(context, name, 'a stale historical error turn does not poison a healthy request', {""",
          )
