name: Trigger five correctness fixes
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/issues-828-832-860-875-880' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-828-832-860-875-880
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute guarded workflow body
        shell: bash
        run: |
          rm .github/workflows/apply-issues-trigger.yml
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          lines = Path('.github/workflows/apply-issues-828-832-860-867-880.yml').read_text().splitlines()
          scripts = []
          i = 0
          while i < len(lines):
              if lines[i] == '        run: |':
                  i += 1
                  body = []
                  while i < len(lines) and (lines[i].startswith('          ') or lines[i] == ''):
                      body.append(lines[i][10:] if lines[i].startswith('          ') else '')
                      i += 1
                  scripts.append('\n'.join(body))
                  continue
              i += 1
          if not scripts:
              raise SystemExit('no guarded run steps found')
          for index, script in enumerate(scripts, 1):
              print(f'==> guarded step {index}/{len(scripts)}', flush=True)
              subprocess.run(script, shell=True, executable='/bin/bash', check=True)
          PY
