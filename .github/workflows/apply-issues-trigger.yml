name: Trigger five correctness fixes
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/issues-828-832-860-875-880' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-828-832-860-875-880
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded source patches
        run: |
          python3 .github/adjust-five-fixes.py
          python3 .github/apply-five-fixes.py
      - name: Build generated runtime
        run: npm run userscript:build
      - name: Targeted regression
        run: node tests/semantic-v2/issues-828-832-860-867-880.test.mjs
      - name: Semantic v2 suite
        run: npm run semantic-v2:test
      - name: Decompiler suite
        run: npm run decompiler:test
      - name: Lint
        run: npm run lint
      - name: Repository tests
        run: npm test
      - name: Commit verified result
        shell: bash
        run: |
          rm -f .github/workflows/apply-issues-trigger.yml .github/workflows/apply-issues-828-832-860-867-880.yml .github/apply-five-fixes.py .github/adjust-five-fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: resolve five analysis correctness issues'
          git push
