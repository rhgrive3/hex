name: Decompiler hotspot profile

on:
  pull_request:
    paths:
      - 'js/decompile*.js'
      - 'js/decompiler/**'
      - 'tests/profile-decompile-hotspot.mjs'
      - '.github/workflows/decompiler-hotspot-profile.yml'

concurrency:
  group: decompiler-hotspot-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  battlecats-hotspot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned BattleCats fixture
        env:
          HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
        run: |
          node scripts/fetch-real-fixtures.mjs battlecats
          node scripts/fetch-real-fixtures.mjs battlecats --check
      - name: Profile pathological production decompile stages
        run: node tests/profile-decompile-hotspot.mjs tests/.real-fixtures/battlecats 0x100d13b84 1024
