name: Phase 11 release validation

# Permanent exact-product verifier for the Managed Frontends phase. Exact-SHA
# dispatch prevents validation-only PRs (EP-012). Broad repository validation
# runs only at release boundaries; draft inner-loop pushes stay focused.
on:
  push:
    branches:
      - main
      - 'phase11/**'
    paths:
      - 'js/managed/**'
      - 'js/platform/capability-maturity.js'
      - 'tests/phase11/**'
      - 'tests/capability-maturity.mjs'
      - 'tools/validation/phase11/**'
      - '.github/workflows/phase11-release-validation.yml'
      - 'docs/SUPPORT_MATRIX.md'
      - 'userscript/hex.user.template.js'
      - 'userscript/release-version.json'
      - 'package.json'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'js/managed/**'
      - 'js/platform/capability-maturity.js'
      - 'tests/phase11/**'
      - 'tests/capability-maturity.mjs'
      - 'tools/validation/phase11/**'
      - '.github/workflows/phase11-release-validation.yml'
      - 'docs/SUPPORT_MATRIX.md'
      - 'package.json'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-character commit SHA to verify'
        required: true
        type: string
      shadow:
        description: 'Report without failing the job'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase11-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Resolve current main for ownership proof
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Phase 11 ownership inventory
        run: node tools/validation/phase11/ownership-check.mjs
      - name: Phase 11 exact-product verifier
        env:
          EXPECT_SHA: ${{ github.event.inputs.sha }}
          SHADOW: ${{ github.event.inputs.shadow }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${EXPECT_SHA:-}" ]; then args+=(--expect-sha "$EXPECT_SHA"); fi
          if [ "${SHADOW:-false}" = "true" ]; then args+=(--shadow); fi
          node tools/validation/phase11/verify.mjs "${args[@]}"
      - name: Broad repository regression at release boundary
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
        run: npm run check
      - name: Publish validated Phase 11 evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-release-evidence-${{ github.event.inputs.sha || github.sha }}
          path: |
            reports/phase11/phase11-release-evidence.json
            reports/phase11/checkpoints.json
          if-no-files-found: error
