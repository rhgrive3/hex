name: Phase 11 release validation

# Permanent exact-product verifier for the Managed Frontends phase. Exact-SHA
# dispatch prevents validation-only PRs (EP-012). Broad repository validation
# runs only at release boundaries; draft inner-loop pushes stay focused.
on:
  push:
    branches:
      - main
      - "phase11/**"
    paths:
      - "js/managed/**"
      - "js/platform/capability-maturity.js"
      - "tests/phase11/**"
      - "tests/capability-maturity.mjs"
      - "tools/validation/phase11/**"
      - ".github/workflows/phase11-release-validation.yml"
      - ".github/workflows/_phase-release-validation.yml"
      - "docs/SUPPORT_MATRIX.md"
      - "userscript/hex.user.template.js"
      - "userscript/release-version.json"
      - "package.json"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "js/managed/**"
      - "js/platform/capability-maturity.js"
      - "tests/phase11/**"
      - "tests/capability-maturity.mjs"
      - "tools/validation/phase11/**"
      - ".github/workflows/phase11-release-validation.yml"
      - ".github/workflows/_phase-release-validation.yml"
      - "docs/SUPPORT_MATRIX.md"
      - "package.json"
  workflow_dispatch:
    inputs:
      sha:
        description: "Exact 40-character commit SHA to verify"
        required: true
        type: string
      shadow:
        description: "Report without failing the job"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phase11-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/_phase-release-validation.yml
    with:
      phase_name: "Phase 11"
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha || github.sha }}
      expected_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
      shadow: ${{ github.event_name == 'workflow_dispatch' && inputs.shadow || false }}
      run_broad_regression: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
      ownership_script: "tools/validation/phase11/ownership-check.mjs"
      verify_script: "tools/validation/phase11/verify.mjs"
      artifact_prefix: "phase11-release-evidence"
      artifact_suffix: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha || github.sha }}
      evidence_paths: |
        reports/phase11/phase11-release-evidence.json
        reports/phase11/checkpoints.json
      timeout_minutes: 60
