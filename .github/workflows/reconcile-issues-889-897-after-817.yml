name: Reconcile issues 889 and 897 after issue 817
on:
  push:
    branches: [fix/issues-889-897-after-817]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-889-897-after-817
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore verified source/test delta from PR943 candidate
        shell: bash
        run: |
          git fetch origin 6b7e88c2b30f274bd4ef89cf89cc76960bc4b594
          for path in \
            js/analysis/semantic-function.js \
            js/targets/architecture/index.js \
            js/targets/architecture/riscv64/effects/control.js \
            tests/phase6/generic-core/issues-889-897.test.mjs; do
            git show FETCH_HEAD:$path > $path
          done
      - name: Focused regression
        run: node tests/phase6/generic-core/issues-889-897.test.mjs
      - name: Phase 6 regression suite
        run: npm run phase6:test
      - name: Build canonical userscript outputs from current merge tree
        run: npm run userscript:build
      - name: Publish reconciled candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/reconcile-issues-889-897-after-817.yml
          git add js/analysis/semantic-function.js js/targets/architecture/index.js js/targets/architecture/riscv64/effects/control.js tests/phase6/generic-core/issues-889-897.test.mjs userscript/hex.user.template.js userscript/release-version.json
          git diff --cached --check
          git commit -m 'fix: preserve RISC-V linked jumps and noreturn CFG semantics (#889 #897)'
          git push origin HEAD:fix/issues-889-897-after-817
