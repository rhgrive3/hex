name: One-shot RV64C HINT repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/riscv64-rvc-hints-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebase target onto current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
      - name: Apply exact guarded RV64C HINT repair
        run: python3 tools/repair-riscv64-rvc-hints.py
      - name: Focused RV64C HINT regressions
        run: node --test tests/phase6/effects/rvc-hints.test.mjs tests/phase6/effects/compressed.test.mjs
      - name: Regenerate canonical userscript before sync gates
        run: npm run userscript:build
      - name: Repository verification
        run: npm run check
      - name: Canonical userscript idempotence
        run: |
          cp userscript/hex.user.js /tmp/hex.user.js
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          npm run userscript:build
          cmp userscript/hex.user.js /tmp/hex.user.js
          cmp userscript/hex.user.template.js /tmp/hex.user.template.js
      - name: Commit verified source result
        run: |
          rm -f tools/repair-riscv64-rvc-hints.py
          rm -f .github/workflows/tmp-rvc-hint-repair.yml .github/workflows/tmp-repair-runner-890-895.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(riscv64): model compressed HINTs as exact no-ops'
          git push --force-with-lease origin HEAD:fix/riscv64-rvc-hints-20260819
