name: Issue 464 App region wiring

on:
  push:
    branches:
      - fix/issue-464-app-region-wiring

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[issue-464-app-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply App region wiring fix
        run: python3 tools/apply-issue-464-app-regions.py
      - name: Symbol/Program containment regression
        run: node tests/symbol-identity.mjs
      - name: Core regression suite
        run: node tests/run.js
      - name: Static checks
        run: |
          node --check js/app.js
          node --check tests/symbol-identity.mjs
      - name: Full lint
        run: npm run lint
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js tests/symbol-identity.mjs
          git commit -m 'Finish #464 normal App region containment [issue-464-app-applied]'
          git push
