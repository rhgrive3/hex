name: Phase 3 debug projected argument lineage v2

on:
  push:
    branches: [hex/p3-semantic-ir-integration]
    paths: ['.github/workflows/p3-debug-438-v2.yml']

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Apply required finalizer narrowing in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s=p.read_text()
          old="    } else if (inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias) && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          new="    } else if (inst.extra?.stateRead && inst.extra?.localPhysicalViewProjection === true && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          s=s.replace("    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);\n", "", 1).replace(old,new,1)
          p.write_text(s)
          PY
      - name: Emit exact projected IR shape
        run: |
          node --input-type=module <<'NODE'
          import { buildSemanticModel } from './js/blocks.js';
          import { irFor, originOf } from './js/ir.js';
          import { summarizeFunction } from './js/interproc.js';
          const BASE=0x100000000n, lines=['add w0, w0, #1','ret'];
          const rows=lines.map((line,i)=>{const p=line.indexOf(' ');return {row:i,address:BASE+BigInt(i*4),mn:p<0?line:line.slice(0,p),ops:p<0?'':line.slice(p+1)}});
          const model=buildSemanticModel(rows,{startRow:0,endRow:1,rowOfAddress:a=>{const d=a-BASE;return d<0n||d>=8n?null:Number(d/4n)}});
          const ir=irFor(model);
          const val=v=>v&&({id:v.id,kind:v.kind,reg:v.reg,bits:v.bits,version:v.version,semanticValueId:v.semanticValueId??null,defId:v.def?.id??null,defRow:v.def?.row??null,defOp:v.def?.op??null,defSub:v.def?.sub??null,defStateRead:!!v.def?.extra?.stateRead,defPublicStateIdentity:v.def?.extra?.publicStateIdentity??null,defLocalPhysicalViewProjection:v.def?.extra?.localPhysicalViewProjection??null,origin:originOf(v)});
          const inst=i=>({id:i.id,row:i.row,op:i.op,sub:i.sub,dst:val(i.dst),args:(i.args||[]).map(a=>({bits:a.bits,value:val(a.value)})),extra:{stateRead:!!i.extra?.stateRead,stateWrite:!!i.extra?.stateWrite,publicStateIdentity:i.extra?.publicStateIdentity??null,localPhysicalViewProjection:i.extra?.localPhysicalViewProjection??null,reachingStateSsaValueId:i.extra?.reachingStateSsaValueId??null,compatReachingPublicValueId:i.extra?.compatReachingPublicValueId??null}});
          const debug={args:[...(ir.args?.entries?.()||[])].map(([k,v])=>[k,val(v)]),values:ir.values.map(val),instructions:ir.instructions.map(inst),summary:summarizeFunction(model)};
          const json=JSON.stringify(debug,(_,v)=>typeof v==='bigint'?v.toString():v);
          console.log('::warning title=P3_438_IR::'+json);
          NODE
      - name: Cleanup debug workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p3-debug-438-v2.yml
          git commit -m 'Phase 3: remove temporary #438 debug workflow v2'
          git push origin HEAD:hex/p3-semantic-ir-integration
