name: Temporary sandbox mode validation

on:
  push:
    branches:
      - hex/security-sandbox-mode-downgrade

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/security-sandbox-mode-downgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused embed mode security regression
        run: node tests/userscript-embed-mode-security.mjs
      - name: Static checks
        run: npm run lint
      - name: Build and userscript tests
        run: npm run userscript:test
      - name: AI and worker regressions
        run: |
          npm run ai:test
          node tests/gemini.mjs
          node tests/worker-classic-harness.mjs
      - name: Install pinned browser engines
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install-deps chromium webkit
          npx --no-install playwright install chromium webkit
      - name: Browser sandbox regressions
        run: |
          node tests/userscript-srcdoc-probe.mjs
          node tests/userscript-sandbox-browser-e2e.mjs
          node tests/chatgpt-web-production-dom.mjs
      - name: Commit generated loader if changed
        id: generated
        run: |
          if git diff --quiet -- userscript/hex.user.template.js; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add userscript/hex.user.template.js
            git commit -m 'Regenerate userscript loader for sandbox mode hardening'
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify generated loader is deterministic
        run: |
          npm run userscript:build
          git diff --exit-code -- userscript/hex.user.template.js
      - name: Push generated loader
        if: steps.generated.outputs.changed == 'true'
        run: git push origin HEAD:hex/security-sandbox-mode-downgrade
