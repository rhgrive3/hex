name: AI evaluation contract

on:
  pull_request:
    paths:
      - 'js/ai/**'
      - 'js/agent/**'
      - 'js/query/**'
      - 'js/gemini.js'
      - 'js/goalc.js'
      - 'js/semantic-evidence.js'
      - 'worker.js'
      - 'tests/ai-eval/**'
      - 'docs/ai-integration-contract.md'
      - 'docs/ai-quality-gate.md'
      - '.github/workflows/ai-eval-contract.yml'
  push:
    branches: [main]
    paths:
      - 'js/ai/**'
      - 'js/agent/**'
      - 'js/query/**'
      - 'js/gemini.js'
      - 'js/goalc.js'
      - 'js/semantic-evidence.js'
      - 'worker.js'
      - 'tests/ai-eval/**'
      - 'docs/ai-integration-contract.md'
      - 'docs/ai-quality-gate.md'
      - '.github/workflows/ai-eval-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate workflow trigger coverage
        run: node tests/ai-eval/workflow-trigger.mjs
      - name: Validate AI evaluation corpus
        run: node tests/ai-eval/selftest.mjs
      - name: Exercise grader with example trace
        run: node tests/ai-eval/grade.mjs tests/ai-eval/results.example.jsonl /tmp/ai-eval-report.json
      - name: Ensure release mode rejects an incomplete corpus
        run: |
          if node tests/ai-eval/grade.mjs tests/ai-eval/results.example.jsonl /tmp/ai-eval-partial.json --require-all; then
            echo 'Expected --require-all to reject a one-case trace.' >&2
            exit 1
          fi
