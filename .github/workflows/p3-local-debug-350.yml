name: P3 dataflow compatibility validation v19
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths:
      - '.github/workflows/p3-local-debug-350.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 tools/validation/p3-debug-apply.py
      - run: python3 tools/validation/p3-debug-apply-interproc.py
      - run: python3 tools/validation/p3-debug-apply-137.py
      - run: python3 tools/validation/p3-debug-stackname-collision.py
      - run: python3 tools/validation/p3-debug-dataflow-compat.py
      - run: npm run userscript:build
      - run: node tests/issues-129-134.mjs
      - run: node tests/issues-130-interproc.mjs
      - run: node tests/issues-135-145.mjs
      - run: node tests/issues-350-399.mjs
      - run: node tests/issues-434-450-regressions.mjs
      - run: node tests/issues-437-438-interproc.mjs
      - run: node tests/ir.mjs
      - run: node tests/run.js
      - run: npm run semantic-v2:test
      - run: npm test
      - run: npm run effects:test
      - run: npm run check
