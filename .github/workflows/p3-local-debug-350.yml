name: P3 finalizer stage timing
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3aa37912a67c0b6d3efb03c93d19ed64b5dad0ff
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/fetch-real-fixtures.mjs battlecats
          node scripts/fetch-real-fixtures.mjs battlecats --check
      - name: Instrument finalizer stages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s = p.read_text()
          start = s.index('export function finalizeLegacyProjection(projected) {')
          end = s.index('\n}', start) + 2
          lines = [
            'export function finalizeLegacyProjection(projected) {',
            "  let t = Date.now(); process.stderr.write('[P3FIN compact:start]\\n');",
            "  compactProjectedState(projected); process.stderr.write(`[P3FIN compact:end] ${Date.now()-t}ms\\n`);",
            "  t = Date.now(); process.stderr.write('[P3FIN defuse:start]\\n');",
            "  rebuildDefUse(projected); process.stderr.write(`[P3FIN defuse:end] ${Date.now()-t}ms\\n`);",
            "  t = Date.now(); process.stderr.write('[P3FIN suppress:start]\\n');",
            "  suppressUnusedIncomingState(projected); process.stderr.write(`[P3FIN suppress:end] ${Date.now()-t}ms\\n`);",
            "  t = Date.now(); process.stderr.write('[P3FIN order:start]\\n');",
            "  normalizePublicStateDefinitionOrder(projected); process.stderr.write(`[P3FIN order:end] ${Date.now()-t}ms\\n`);",
            "  t = Date.now(); process.stderr.write('[P3FIN versions:start]\\n');",
            "  renumberPublicStateVersions(projected); process.stderr.write(`[P3FIN versions:end] ${Date.now()-t}ms\\n`);",
            "  t = Date.now(); process.stderr.write('[P3FIN stackflow:start]\\n');",
            "  recoverLocalStackFlow(projected); process.stderr.write(`[P3FIN stackflow:end] ${Date.now()-t}ms\\n`);",
            "  t = Date.now(); process.stderr.write('[P3FIN constants:start]\\n');",
            "  propagateConstants(projected); process.stderr.write(`[P3FIN constants:end] ${Date.now()-t}ms\\n`);",
            "  t = Date.now(); process.stderr.write('[P3FIN slots:start]\\n');",
            "  recoverStackSlots(projected); process.stderr.write(`[P3FIN slots:end] ${Date.now()-t}ms\\n`);",
            '  return projected;',
            '}',
          ]
          s = s[:start] + '\n'.join(lines) + s[end:]
          p.write_text(s)
          PY
      - name: Create exact-function probe
        run: |
          cat > tests/.p3-stage-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat');
          const w = await openBinary('tests/.real-fixtures/battlecats');
          const a = 0x10033fd24n, end = 0x100340074n;
          const model = await w.analyze(a, end);
          const t = Date.now();
          const res = decompile(model, { addr:a, rowOfAddress:(x)=>w.rowOf(x), addrOfRow:(r)=>w.region.vmAddr+BigInt(r)*4n, symbolFor:(x)=>w.symbols.nameAt(x) });
          console.error(`[P3BENCH exact] ms=${Date.now()-t} lines=${res?.lines?.length ?? -1}`);
          EOF
      - name: Run exact function
        run: |
          timeout --signal=TERM --kill-after=5s 25s node --max-old-space-size=6000 tests/.p3-stage-probe.mjs
