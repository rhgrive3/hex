name: P3 projection isolate
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3aa37912a67c0b6d3efb03c93d19ed64b5dad0ff
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/fetch-real-fixtures.mjs battlecats
          node scripts/fetch-real-fixtures.mjs battlecats --check
      - name: Inject projection diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1.js')
          s=p.read_text()
          reps=[
            ("export function projectSemanticIrV2ToLegacyV1(input, options = {}) {\n  const ir = validateSemanticIrFunction(input, options.validationOptions || {});", "export function projectSemanticIrV2ToLegacyV1(input, options = {}) {\n  process.stderr.write('[P3PROJ validate-ir:start]\\n');\n  const ir = validateSemanticIrFunction(input, options.validationOptions || {});\n  process.stderr.write('[P3PROJ validate-ir:end]\\n');"),
            ("  const ssaInput = options.ssa ?? options.semanticSsa ?? null;", "  process.stderr.write('[P3PROJ ssa-contract:start]\\n');\n  const ssaInput = options.ssa ?? options.semanticSsa ?? null;"),
            ("  const memorySsaInput = options.memorySsa ?? null;", "  process.stderr.write(`[P3PROJ ssa-contract:end] defs=${ssa?.definitions?.length ?? -1}\\n`);\n  process.stderr.write('[P3PROJ memory-contract:start]\\n');\n  const memorySsaInput = options.memorySsa ?? null;"),
            ("  const canonicalCfg = options.cfg ?? options.semanticCfg ?? null;", "  process.stderr.write(`[P3PROJ memory-contract:end] defs=${memorySsa?.definitions?.length ?? -1} uses=${memorySsa?.uses?.length ?? -1}\\n`);\n  const canonicalCfg = options.cfg ?? options.semanticCfg ?? null;"),
            ("  const graph = graphFacts(", "  process.stderr.write('[P3PROJ graph:start]\\n');\n  const graph = graphFacts("),
            ("  for (const block of legacyBlocks) block.isExit = block.succ.length === 0;", "  process.stderr.write('[P3PROJ graph:end]\\n');\n  for (const block of legacyBlocks) block.isExit = block.succ.length === 0;"),
            ("  const { values, byId: valuesById } = buildLegacyValues(ir, ssa);", "  process.stderr.write('[P3PROJ values:start]\\n');\n  const { values, byId: valuesById } = buildLegacyValues(ir, ssa);"),
            ("  preserveIncomingPhysicalState(ssa, valuesById);", "  process.stderr.write(`[P3PROJ values:end] values=${values.length}\\n`);\n  preserveIncomingPhysicalState(ssa, valuesById);"),
            ("  const projected = {", "  process.stderr.write('[P3PROJ metadata:start]\\n');\n  const projected = {"),
            ("  const instructionBySemanticId = new Map();", "  process.stderr.write('[P3PROJ metadata:end]\\n');\n  process.stderr.write('[P3PROJ nodes:start]\\n');\n  const instructionBySemanticId = new Map();"),
            ("  addScalarSsaPhis(projected, ssa, valuesById, blockIndexById, instructionBySemanticId);", "  process.stderr.write(`[P3PROJ nodes:end] inst=${projected.instructions.length}\\n`);\n  process.stderr.write('[P3PROJ scalar-phis:start]\\n');\n  addScalarSsaPhis(projected, ssa, valuesById, blockIndexById, instructionBySemanticId);"),
            ("  appendFunctionUnknowns(projected, ir);", "  appendFunctionUnknowns(projected, ir);\n  process.stderr.write('[P3PROJ scalar-phis:end]\\n');"),
            ("  if (memorySsa) attachMemorySsa(projected, memorySsa, valuesById, instructionBySemanticId, blockIndexById);", "  process.stderr.write('[P3PROJ attach-memory:start]\\n');\n  if (memorySsa) attachMemorySsa(projected, memorySsa, valuesById, instructionBySemanticId, blockIndexById);"),
            ("  else attachFallbackMemory(projected);", "  else attachFallbackMemory(projected);\n  process.stderr.write('[P3PROJ attach-memory:end]\\n');"),
            ("  assignInstructionIds(projected);", "  process.stderr.write('[P3PROJ ids:start]\\n');\n  assignInstructionIds(projected);"),
            ("  attachAbiProjectedArguments(projected);", "  process.stderr.write('[P3PROJ ids:end]\\n');\n  attachAbiProjectedArguments(projected);\n  process.stderr.write('[P3PROJ finalize:start]\\n');"),
            ("  finalizeLegacyProjection(projected);", "  finalizeLegacyProjection(projected);\n  process.stderr.write('[P3PROJ finalize:end]\\n');"),
          ]
          for old,new in reps:
            if old not in s:
              raise SystemExit('missing '+old[:90])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/index.js'); s=p.read_text()
          old="  const legacyV1 = projectSemanticIrV2ToLegacyV1(ir, {"
          new="  process.stderr.write('[P3PIPE projection:start]\\n');\n  const legacyV1 = projectSemanticIrV2ToLegacyV1(ir, {"
          assert old in s; p.write_text(s.replace(old,new,1))
          PY
      - name: Create exact-function probe
        run: |
          cat > tests/.p3-stage-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat');
          const w=await openBinary('tests/.real-fixtures/battlecats');
          const a=0x10033fd24n, end=0x100340074n;
          const model=await w.analyze(a,end);
          console.error(`[P3PROBE model] insns=${model?.instructions?.length ?? -1}`);
          const t=Date.now();
          const res=decompile(model,{addr:a,rowOfAddress:(x)=>w.rowOf(x),addrOfRow:(r)=>w.region.vmAddr+BigInt(r)*4n,symbolFor:(x)=>w.symbols.nameAt(x)});
          console.error(`[P3PROBE done] ${Date.now()-t}ms lines=${res?.lines?.length ?? -1}`);
          EOF
      - name: Run exact function
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 50s node --max-old-space-size=6000 tests/.p3-stage-probe.mjs 2>&1 | tee stage.log
