name: P3 validate and promote stackflow fix
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: write
jobs:
  validate-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply clean stackflow fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s=p.read_text()
          start=s.index('function valueDependsOnRoots(value, roots, seen = new Set()) {')
          end=s.index('\n\nfunction recoverLocalStackFlow(projected) {', start)
          lines=[
            'function stackDependentValueIds(projected, roots) {',
            '  const dependentsByValueId = new Map();',
            '  const addDependent = (dependency, value) => {',
            '    if (!dependency || !value) return;',
            '    let dependents = dependentsByValueId.get(dependency.id);',
            '    if (!dependents) {',
            '      dependents = new Set();',
            '      dependentsByValueId.set(dependency.id, dependents);',
            '    }',
            '    dependents.add(value.id);',
            '  };',
            '  for (const value of projected.values) {',
            '    const def = value?.def;',
            '    if (!def) continue;',
            '    for (const arg of def.args || []) addDependent(arg?.value, value);',
            '    addDependent(def.addr?.base, value);',
            '    addDependent(def.addr?.index, value);',
            '  }',
            '  const dependent = new Set(roots);',
            '  const queue = [...roots];',
            '  let cursor = 0;',
            '  while (cursor < queue.length) {',
            '    const sourceId = queue[cursor++];',
            '    for (const valueId of dependentsByValueId.get(sourceId) || []) {',
            '      if (dependent.has(valueId)) continue;',
            '      dependent.add(valueId);',
            '      queue.push(valueId);',
            '    }',
            '  }',
            '  return dependent;',
            '}',
            '',
            'function callEscapesLocalStack(inst, stackDependent) {',
            '  if (inst.op !== V1_OP.CALL) return false;',
            '  for (const arg of inst.args || []) {',
            '    if (arg?.value && stackDependent.has(arg.value.id)) return true;',
            '  }',
            '  return false;',
            '}',
          ]
          s=s[:start]+'\n'.join(lines)+s[end:]
          anchor='function recoverLocalStackFlow(projected) {\n  const roots = stackRootIds(projected);'
          replacement='function recoverLocalStackFlow(projected) {\n  const roots = stackRootIds(projected);\n  const stackDependent = stackDependentValueIds(projected, roots);'
          if anchor not in s: raise SystemExit('recoverLocalStackFlow anchor missing')
          s=s.replace(anchor,replacement,1)
          old='if (callEscapesLocalStack(inst, roots)) stores.clear();'
          if old not in s: raise SystemExit('call escape anchor missing')
          s=s.replace(old,'if (callEscapesLocalStack(inst, stackDependent)) stores.clear();',1)
          p.write_text(s)
          PY
      - name: Validate focused IR
        run: node tests/ir.mjs
      - name: Validate Semantic IR v2 suite
        run: npm run semantic-v2:test
      - name: Ensure only production file changed
        run: |
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -Fx ' M js/semantics/compat/semantic-ir-v2-to-v1-finalize.js'
          git diff --check
      - name: Commit clean fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/semantics/compat/semantic-ir-v2-to-v1-finalize.js
          git commit -m 'fix(phase3): linearize stack escape dependency analysis'
          git push origin HEAD:hex/p3-semantic-ir-integration
