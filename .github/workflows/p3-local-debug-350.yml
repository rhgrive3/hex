name: P3 TsumTsum pseudoc function diff
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
  actions: read
env:
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            ref: b132f5add38a9bb335281315146fa5643a7481b5
          - label: phase3
            ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch fixture and oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-real-fixtures.mjs TsumTsum
          node scripts/fetch-real-fixtures.mjs TsumTsum --check
          gh run download 31988122265 -n cross-binary-oracle-TsumTsum -D tests
          test -s tests/oracle.TsumTsum.ci.json.gz
      - name: Inject per-function diagnostics
        env:
          P3_LABEL: ${{ matrix.label }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/accuracy.mjs'); s=p.read_text()
          a="  for (const [a, end] of samples) {\n    const model = await w.analyze(BigInt(a), BigInt(end));"
          b="  for (const [a, end] of samples) {\n    const __p3t = Date.now();\n    const model = await w.analyze(BigInt(a), BigInt(end));"
          assert a in s; s=s.replace(a,b,1)
          a="    done++;\n    for (const l of res.lines) {"
          b="    done++;\n    let __p3lines = 0, __p3asm = 0;\n    for (const l of res.lines) {"
          assert a in s; s=s.replace(a,b,1)
          a="      lines++;\n      // A register-indirect `br` has no statically knowable target."
          b="      lines++;\n      __p3lines++;\n      // A register-indirect `br` has no statically knowable target."
          assert a in s; s=s.replace(a,b,1)
          a='      if (/__asm\\(/.test(l.text) && !/__asm\\(\"br\\s+x\\d+\"\\)/.test(l.text)) asmLines++;\n    }\n  }'
          b='      if (/__asm\\(/.test(l.text) && !/__asm\\(\"br\\s+x\\d+\"\\)/.test(l.text)) { asmLines++; __p3asm++; }\n    }\n    process.stderr.write(`[P3FDIFF ${process.env.P3_LABEL}] 0x${BigInt(a).toString(16)}-0x${BigInt(end).toString(16)} ms=${Date.now()-__p3t} lines=${__p3lines} asm=${__p3asm}\\n`);\n  }'
          assert a in s; s=s.replace(a,b,1)
          p.write_text(s)
          PY
      - name: Run pseudoc partition
        env:
          P3_LABEL: ${{ matrix.label }}
        run: |
          node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/.real-fixtures/TsumTsum --oracle=tests/oracle.TsumTsum.ci.json.gz --only=pseudoc --json
