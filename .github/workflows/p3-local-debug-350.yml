name: P3 cross-binary hang pinpoint
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths:
      - '.github/workflows/p3-local-debug-350.yml'
permissions:
  contents: read
  actions: read
jobs:
  pinpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BattleCats-pseudoc
            fixture: battlecats
            file: battlecats
            oracle_artifact: cross-binary-oracle-BattleCats
            oracle: tests/oracle.battlecats.ci.json.gz
            only: pseudoc
          - name: TsumTsum-core
            fixture: TsumTsum
            file: TsumTsum
            oracle_artifact: cross-binary-oracle-TsumTsum
            oracle: tests/oracle.TsumTsum.ci.json.gz
            only: sections,funcs,funcs-guess,disasm,kinds,calls,refs,imports,objc,selstub,strings,xrefs,funcname,selffield,role,apimeaning,summary,expr,formula
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3aa37912a67c0b6d3efb03c93d19ed64b5dad0ff
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact real fixture
        run: |
          node scripts/fetch-real-fixtures.mjs "${{ matrix.fixture }}"
          node scripts/fetch-real-fixtures.mjs "${{ matrix.fixture }}" --check
      - name: Download oracle from failing canonical run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 31985496555 -n "${{ matrix.oracle_artifact }}" -D tests
          test -s "${{ matrix.oracle }}"
          gzip -t "${{ matrix.oracle }}"
      - name: Inject temporary stderr diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/accuracy.mjs')
          s = p.read_text()
          old = """    const t = Date.now();\n    let r;\n    try {\n      r = await f.fn({ w, o });\n"""
          new = """    const t = Date.now();\n    process.stderr.write(`[P3DIAG feature:start] ${f.id}\\n`);\n    let r;\n    try {\n      r = await f.fn({ w, o });\n"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """    r.id = f.id; r.label = f.label; r.ms = Date.now() - t;\n    rows.push(r);\n"""
          new = """    r.id = f.id; r.label = f.label; r.ms = Date.now() - t;\n    process.stderr.write(`[P3DIAG feature:end] ${f.id} ${r.ms}ms\\n`);\n    rows.push(r);\n"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """  for (const [a, end] of samples) {\n    const model = await w.analyze(BigInt(a), BigInt(end));\n    if (!model) continue;\n    let res;\n    try {\n      res = decompile(model, {\n"""
          new = """  for (const [a, end] of samples) {\n    process.stderr.write(`[P3DIAG pseudoc:analyze:start] 0x${BigInt(a).toString(16)}-0x${BigInt(end).toString(16)}\\n`);\n    const model = await w.analyze(BigInt(a), BigInt(end));\n    process.stderr.write(`[P3DIAG pseudoc:analyze:end] 0x${BigInt(a).toString(16)}\\n`);\n    if (!model) continue;\n    let res;\n    try {\n      process.stderr.write(`[P3DIAG pseudoc:decompile:start] 0x${BigInt(a).toString(16)}\\n`);\n      res = decompile(model, {\n"""
          assert old in s
          s = s.replace(old, new, 1)
          old = """        symbolFor: (x) => w.symbols.nameAt(x),\n      });\n    } catch { continue; }\n"""
          new = """        symbolFor: (x) => w.symbols.nameAt(x),\n      });\n      process.stderr.write(`[P3DIAG pseudoc:decompile:end] 0x${BigInt(a).toString(16)}\\n`);\n    } catch (err) {\n      process.stderr.write(`[P3DIAG pseudoc:decompile:error] 0x${BigInt(a).toString(16)} ${err?.stack || err}\\n`);\n      continue;\n    }\n"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Run diagnostic partition with short hard timeout
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 180s \
            node --max-old-space-size=6000 tests/accuracy.mjs \
              --target="tests/.real-fixtures/${{ matrix.file }}" \
              --oracle="${{ matrix.oracle }}" \
              --only="${{ matrix.only }}" \
              --json 2>&1 | tee "diag-${{ matrix.name }}.log"
