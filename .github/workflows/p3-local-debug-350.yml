name: P3 local debug 350
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: hex/p3-local-debug-350 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run 350-series with current broad compatibility compaction
        run: node tests/issues-350-399.mjs
