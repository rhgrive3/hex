name: P3 SSA MemorySSA stage timing
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-real-fixtures.mjs battlecats
      - name: Inject stage timers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/index.js')
          s=p.read_text()
          s=s.replace(
            '  const ssa = buildSemanticSsa(ir, cfg, options.ssaOptions ?? {});\n  validateSemanticSsa(ssa, ir, cfg, options.ssaValidationOptions ?? {});',
            "  let __p3t = Date.now();\n  const ssa = buildSemanticSsa(ir, cfg, options.ssaOptions ?? {});\n  process.stderr.write(`[P3TIME ssa-build] ${Date.now()-__p3t}ms\\n`);\n  __p3t = Date.now();\n  validateSemanticSsa(ssa, ir, cfg, options.ssaValidationOptions ?? {});\n  process.stderr.write(`[P3TIME ssa-validate] ${Date.now()-__p3t}ms\\n`);"
          )
          s=s.replace(
            '  validateMemorySsa(memorySsa, { cfg, ...(options.memorySsaValidationOptions ?? {}) });',
            "  process.stderr.write(`[P3TIME memory-build] ${Date.now()-__p3t}ms\\n`);\n  __p3t = Date.now();\n  validateMemorySsa(memorySsa, { cfg, ...(options.memorySsaValidationOptions ?? {}) });\n  process.stderr.write(`[P3TIME memory-validate] ${Date.now()-__p3t}ms\\n`);"
          )
          anchor='  const memorySsa = buildMemorySsa(ir, cfg, {'
          s=s.replace(anchor, '  __p3t = Date.now();\n'+anchor, 1)
          p.write_text(s)
          PY
      - name: Create pathological probe
        run: |
          cat > tests/.p3-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat');
          const w=await openBinary('tests/.real-fixtures/battlecats');
          const a=0x10033fd24n, end=0x100340074n;
          const m=await w.analyze(a,end);
          const t=Date.now();
          const r=decompile(m,{addr:a,rowOfAddress:x=>w.rowOf(x),addrOfRow:r=>w.region.vmAddr+BigInt(r)*4n,symbolFor:x=>w.symbols.nameAt(x)});
          console.error(`[P3TIME total] ${Date.now()-t}ms lines=${r?.lines?.length??-1}`);
          EOF
          timeout --signal=TERM --kill-after=5s 20s node --max-old-space-size=6000 tests/.p3-probe.mjs
