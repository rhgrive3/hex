name: P3 phi provenance worklist benchmark
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-real-fixtures.mjs battlecats
      - name: Apply exact phi-origin worklist candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/ssa/build.js'); s=p.read_text()
          start=s.index('function resolvePhiOrigins(phiDefinitions, definitionByValue, irBlocks, tick) {')
          end=s.index('\n\nfunction finalizePhi(', start)
          lines=[
            'function resolvePhiOrigins(phiDefinitions, definitionByValue, irBlocks, tick) {',
            '  const ordered = phiDefinitions.slice().sort((a, b) => a.valueId.localeCompare(b.valueId));',
            '  const phiIds = new Set(ordered.map((phi) => phi.valueId));',
            '  const sourceOrigins = new Map();',
            '  const sourcesByPhi = new Map();',
            '  const dependentsByPhi = new Map(ordered.map((phi) => [phi.valueId, new Set()]));',
            '',
            '  for (const phi of ordered) {',
            '    tick();',
            "    const baseId = `base:${phi.valueId}`;",
            '    sourceOrigins.set(baseId, safeOrigin(irBlocks.get(phi.blockId)?.origin, createOriginSet({ parentEntityIds: [phi.blockId] })));',
            '    const sources = new Set([baseId]);',
            '    for (const incoming of phi.incoming) {',
            '      tick();',
            '      const incomingDefinition = definitionByValue.get(incoming.valueId);',
            "      if (!incomingDefinition) fail('semantic-ssa-dangling-phi-value-id');",
            '      if (incomingDefinition.kind === \'phi\' && phiIds.has(incomingDefinition.valueId)) {',
            '        dependentsByPhi.get(incomingDefinition.valueId).add(phi.valueId);',
            '      } else {',
            "        const sourceId = `def:${incomingDefinition.valueId}`;",
            '        sourceOrigins.set(sourceId, incomingDefinition.origin);',
            '        sources.add(sourceId);',
            '      }',
            '    }',
            '    sourcesByPhi.set(phi.valueId, sources);',
            '  }',
            '',
            '  const queue = ordered.map((phi) => phi.valueId);',
            '  const queued = new Set(queue);',
            '  let cursor = 0;',
            '  while (cursor < queue.length) {',
            '    tick();',
            '    const sourcePhiId = queue[cursor++];',
            '    queued.delete(sourcePhiId);',
            '    const sourceSet = sourcesByPhi.get(sourcePhiId);',
            '    for (const dependentId of [...dependentsByPhi.get(sourcePhiId)].sort()) {',
            '      tick();',
            '      const targetSet = sourcesByPhi.get(dependentId);',
            '      let changed = false;',
            '      for (const sourceId of sourceSet) {',
            '        if (targetSet.has(sourceId)) continue;',
            '        targetSet.add(sourceId);',
            '        changed = true;',
            '      }',
            '      if (changed && !queued.has(dependentId)) {',
            '        queue.push(dependentId);',
            '        queued.add(dependentId);',
            '      }',
            '    }',
            '  }',
            '',
            '  const resolved = new Map();',
            '  for (const phi of ordered) {',
            '    tick();',
            '    const origins = [...sourcesByPhi.get(phi.valueId)].sort().map((id) => sourceOrigins.get(id));',
            '    resolved.set(phi.valueId, safeOrigin(...origins));',
            '  }',
            '  return resolved;',
            '}',
          ]
          s=s[:start]+'\n'.join(lines)+s[end:]
          p.write_text(s)
          PY
      - name: Benchmark pathological function
        run: |
          cat > tests/.p3-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat');
          const w=await openBinary('tests/.real-fixtures/battlecats');
          const a=0x10033fd24n,end=0x100340074n;
          const m=await w.analyze(a,end);
          const t=Date.now();
          const r=decompile(m,{addr:a,rowOfAddress:x=>w.rowOf(x),addrOfRow:r=>w.region.vmAddr+BigInt(r)*4n,symbolFor:x=>w.symbols.nameAt(x)});
          console.error(`[P3PHI total] ${Date.now()-t}ms lines=${r?.lines?.length??-1}`);
          EOF
          timeout --signal=TERM --kill-after=5s 20s node --max-old-space-size=6000 tests/.p3-probe.mjs
      - name: Focused IR regressions
        run: node tests/ir.mjs
      - name: Semantic v2 suite
        run: npm run semantic-v2:test
