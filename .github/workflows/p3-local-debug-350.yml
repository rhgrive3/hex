name: P3 finalizer isolate
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with: { ref: 3aa37912a67c0b6d3efb03c93d19ed64b5dad0ff, fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node scripts/fetch-real-fixtures.mjs battlecats
      - name: Instrument finalizer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js'); s=p.read_text()
          old='''export function finalizeLegacyProjection(projected) {
  compactProjectedState(projected);
  rebuildDefUse(projected);
  suppressUnusedIncomingState(projected);
  normalizePublicStateDefinitionOrder(projected);
  renumberPublicStateVersions(projected);
  recoverLocalStackFlow(projected);
  propagateConstants(projected);
  recoverStackSlots(projected);
  return projected;
}'''
          new='''export function finalizeLegacyProjection(projected) {
  process.stderr.write('[P3FIN compact:start]\\n');
  compactProjectedState(projected);
  process.stderr.write('[P3FIN compact:end]\\n[P3FIN defuse:start]\\n');
  rebuildDefUse(projected);
  process.stderr.write('[P3FIN defuse:end]\\n[P3FIN suppress:start]\\n');
  suppressUnusedIncomingState(projected);
  process.stderr.write('[P3FIN suppress:end]\\n[P3FIN order:start]\\n');
  normalizePublicStateDefinitionOrder(projected);
  process.stderr.write('[P3FIN order:end]\\n[P3FIN versions:start]\\n');
  renumberPublicStateVersions(projected);
  process.stderr.write('[P3FIN versions:end]\\n[P3FIN stackflow:start]\\n');
  recoverLocalStackFlow(projected);
  process.stderr.write('[P3FIN stackflow:end]\\n[P3FIN constants:start]\\n');
  propagateConstants(projected);
  process.stderr.write('[P3FIN constants:end]\\n[P3FIN slots:start]\\n');
  recoverStackSlots(projected);
  process.stderr.write('[P3FIN slots:end]\\n');
  return projected;
}'''
          assert old in s; p.write_text(s.replace(old,new,1))
          PY
      - name: Probe
        run: |
          cat > tests/.p3-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs'; import { decompile } from '../js/decompile.js'; import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat'); const w=await openBinary('tests/.real-fixtures/battlecats'); const a=0x10033fd24n,end=0x100340074n; const m=await w.analyze(a,end); console.error('[P3PROBE go]'); const t=Date.now(); const r=decompile(m,{addr:a,rowOfAddress:x=>w.rowOf(x),addrOfRow:r=>w.region.vmAddr+BigInt(r)*4n,symbolFor:x=>w.symbols.nameAt(x)}); console.error(`[P3PROBE done] ${Date.now()-t}ms ${r?.lines?.length??-1}`);
          EOF
          timeout --signal=TERM --kill-after=3s 20s node --max-old-space-size=6000 tests/.p3-probe.mjs
