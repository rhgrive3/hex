name: P3 compact projection benchmark
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3aa37912a67c0b6d3efb03c93d19ed64b5dad0ff
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/fetch-real-fixtures.mjs battlecats
          node scripts/fetch-real-fixtures.mjs battlecats --check
      - name: Apply candidate compact-state performance fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s = p.read_text()
          start = s.index('function valueFeedsAddressOrCall(projected, root) {')
          end = s.index('\n\nfunction compactProjectedState(projected) {', start)
          lines = [
            'function buildProjectedConsumerIndex(projected) {',
            '  const consumers = new Map();',
            '  const add = (value, kind, inst) => {',
            '    if (!value) return;',
            '    let list = consumers.get(value.id);',
            '    if (!list) { list = []; consumers.set(value.id, list); }',
            '    list.push({ kind, inst });',
            '  };',
            '  for (const inst of projected.instructions) {',
            "    if (inst.addr?.base) add(inst.addr.base, 'address', inst);",
            "    if (inst.addr?.index) add(inst.addr.index, 'address', inst);",
            "    if (inst.loc?.base) add(inst.loc.base, 'address', inst);",
            "    for (const arg of inst.args || []) if (arg?.value) add(arg.value, 'arg', inst);",
            '  }',
            '  return consumers;',
            '}',
            '',
            'function valueFeedsAddressOrCall(root, consumers, memo) {',
            '  if (!root) return false;',
            '  if (memo.has(root.id)) return memo.get(root.id);',
            '  const queue = [root];',
            '  const seen = new Set();',
            '  let cursor = 0;',
            '  while (cursor < queue.length) {',
            '    const value = queue[cursor++];',
            '    if (!value || seen.has(value.id)) continue;',
            '    if (memo.get(value.id) === true) {',
            '      for (const id of seen) memo.set(id, true);',
            '      memo.set(root.id, true);',
            '      return true;',
            '    }',
            '    seen.add(value.id);',
            '    for (const use of consumers.get(value.id) || []) {',
            "      if (use.kind === 'address' || use.inst.op === V1_OP.CALL) {",
            '        for (const id of seen) memo.set(id, true);',
            '        memo.set(root.id, true);',
            '        return true;',
            '      }',
            '      if (use.inst.op === V1_OP.MOV && use.inst.dst) queue.push(use.inst.dst);',
            '    }',
            '  }',
            '  for (const id of seen) memo.set(id, false);',
            '  memo.set(root.id, false);',
            '  return false;',
            '}',
          ]
          s = s[:start] + '\n'.join(lines) + s[end:]
          anchor = 'function compactProjectedState(projected) {\n  const aliases = new Map();'
          replacement = 'function compactProjectedState(projected) {\n  const aliases = new Map();\n  const consumers = buildProjectedConsumerIndex(projected);\n  const feedMemo = new Map();'
          if anchor not in s: raise SystemExit('compact anchor missing')
          s = s.replace(anchor, replacement, 1)
          call = 'valueFeedsAddressOrCall(projected, shadow)'
          if call not in s: raise SystemExit('feed call missing')
          s = s.replace(call, 'valueFeedsAddressOrCall(shadow, consumers, feedMemo)', 1)
          p.write_text(s)
          PY
      - name: Create exact-function probe
        run: |
          cat > tests/.p3-stage-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat');
          const w = await openBinary('tests/.real-fixtures/battlecats');
          const a = 0x10033fd24n, end = 0x100340074n;
          const model = await w.analyze(a, end);
          const t = Date.now();
          const res = decompile(model, { addr:a, rowOfAddress:(x)=>w.rowOf(x), addrOfRow:(r)=>w.region.vmAddr+BigInt(r)*4n, symbolFor:(x)=>w.symbols.nameAt(x) });
          console.error(`[P3BENCH exact] ms=${Date.now()-t} lines=${res?.lines?.length ?? -1} semantic=${!!res?.semantic}`);
          EOF
      - name: Run exact function
        run: |
          timeout --signal=TERM --kill-after=5s 20s node --max-old-space-size=6000 tests/.p3-stage-probe.mjs
      - name: Run focused IR regression
        run: |
          node tests/ir.mjs
