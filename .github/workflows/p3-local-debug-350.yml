name: P3 npm test diagnostic v12
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths:
      - '.github/workflows/p3-local-debug-350.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 tools/validation/p3-debug-apply.py
      - run: python3 tools/validation/p3-debug-apply-interproc.py
      - run: python3 tools/validation/p3-debug-apply-137.py
      - run: python3 tools/validation/p3-debug-stackname-collision.py
      - run: npm run userscript:build
      - name: Capture npm test output on scratch only
        shell: bash
        run: |
          set +e
          npm test > /tmp/p3-npm-test-v12.log 2>&1
          status=$?
          set -e
          tail -n 1000 /tmp/p3-npm-test-v12.log || true
          cp /tmp/p3-npm-test-v12.log tools/validation/p3-debug-npm-test-output.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/validation/p3-debug-npm-test-output.txt
          git commit -m "Debug: persist current Phase 3 npm test output" || true
          git push origin HEAD:hex/p3-local-debug-350
          exit "$status"
