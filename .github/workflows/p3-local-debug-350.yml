name: P3 semantic SSA build profiling
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-real-fixtures.mjs battlecats
      - name: Inject SSA phase timers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/ssa/build.js'); s=p.read_text()
          reps=[
            ('  const tick = makeWorkCounter(options);', "  const tick = makeWorkCounter(options);\n  let __p3t = Date.now();"),
            ("  const dominance = analyzeSemanticDominance(cfg, { signal: options.signal, budget: { maxWorkItems: limit(options, 'maxWorkItems') } });", "  process.stderr.write(`[P3SSA normalize] ${Date.now()-__p3t}ms\\n`); __p3t=Date.now();\n  const dominance = analyzeSemanticDominance(cfg, { signal: options.signal, budget: { maxWorkItems: limit(options, 'maxWorkItems') } });\n  process.stderr.write(`[P3SSA dominance] ${Date.now()-__p3t}ms\\n`); __p3t=Date.now();"),
            ('  const model = collectModel(ir, options, tick);', "  const model = collectModel(ir, options, tick);\n  process.stderr.write(`[P3SSA collect-model] ${Date.now()-__p3t}ms variants=${model.variants.length}\\n`); __p3t=Date.now();"),
            ('  const phiBlocks = computePhiBlocks(model, dominance, reachable, options, tick);', "  const phiBlocks = computePhiBlocks(model, dominance, reachable, options, tick);\n  process.stderr.write(`[P3SSA phi-placement] ${Date.now()-__p3t}ms\\n`); __p3t=Date.now();"),
            ('  const nodePositions = new Map();', "  process.stderr.write(`[P3SSA semantic-defs] ${Date.now()-__p3t}ms defs=${definitions.length}\\n`); __p3t=Date.now();\n  const nodePositions = new Map();"),
            ('  for (const variant of model.variants) {\n    const seed = seedDefinition', "  process.stderr.write(`[P3SSA scalar-uses] ${Date.now()-__p3t}ms uses=${uses.length} defs=${definitions.length}\\n`); __p3t=Date.now();\n\n  for (const variant of model.variants) {\n    const seed = seedDefinition"),
            ('  const children = new Map(cfg.blocks.map((block) => [block.id, []]));', "  process.stderr.write(`[P3SSA seeds-phis] ${Date.now()-__p3t}ms defs=${definitions.length}\\n`); __p3t=Date.now();\n  const children = new Map(cfg.blocks.map((block) => [block.id, []]));"),
            ('  renameReachable(cfg.entryBlockId);', "  renameReachable(cfg.entryBlockId);\n  process.stderr.write(`[P3SSA rename] ${Date.now()-__p3t}ms defs=${definitions.length} uses=${uses.length}\\n`); __p3t=Date.now();"),
            ('  const phiDefinitions = definitions.filter((definition) => definition.kind === \'phi\');', "  process.stderr.write(`[P3SSA unreachable] ${Date.now()-__p3t}ms defs=${definitions.length} uses=${uses.length}\\n`); __p3t=Date.now();\n  const phiDefinitions = definitions.filter((definition) => definition.kind === 'phi');"),
            ('  const finalizedDefinitions = definitions.map((definition) => definition.kind === \'phi\'', "  process.stderr.write(`[P3SSA phi-origins] ${Date.now()-__p3t}ms phis=${phiDefinitions.length}\\n`); __p3t=Date.now();\n  const finalizedDefinitions = definitions.map((definition) => definition.kind === 'phi'"),
            ('  return createSemanticSsaContract({ functionId: ir.functionId, definitions: finalizedDefinitions, uses }, {', "  process.stderr.write(`[P3SSA finalize-checks] ${Date.now()-__p3t}ms\\n`); __p3t=Date.now();\n  const __p3contract = createSemanticSsaContract({ functionId: ir.functionId, definitions: finalizedDefinitions, uses }, {"),
            ('    },\n  });\n}\n\nexport const buildScalarSsa', "    },\n  });\n  process.stderr.write(`[P3SSA contract] ${Date.now()-__p3t}ms\\n`);\n  return __p3contract;\n}\n\nexport const buildScalarSsa")
          ]
          for old,new in reps:
            if old not in s: raise SystemExit('missing anchor: '+old[:70])
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Run pathological function
        run: |
          cat > tests/.p3-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat');
          const w=await openBinary('tests/.real-fixtures/battlecats');
          const a=0x10033fd24n,end=0x100340074n;
          const m=await w.analyze(a,end);
          const t=Date.now();
          decompile(m,{addr:a,rowOfAddress:x=>w.rowOf(x),addrOfRow:r=>w.region.vmAddr+BigInt(r)*4n,symbolFor:x=>w.symbols.nameAt(x)});
          console.error(`[P3SSA total-decompile] ${Date.now()-t}ms`);
          EOF
          timeout --signal=TERM --kill-after=5s 20s node --max-old-space-size=6000 tests/.p3-probe.mjs
