name: P3 resync main and promote validated fix
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge exact latest main without dropping newer work
        run: |
          set -euo pipefail
          EXPECTED_MAIN=b132f5add38a9bb335281315146fa5643a7481b5
          git fetch origin main
          ACTUAL_MAIN=$(git rev-parse origin/main)
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          set +e
          git merge --no-ff "$ACTUAL_MAIN" -m 'Merge latest main into Phase 3 integration'
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            printf 'merge conflicts:\n%s\n' "$CONFLICTS"
            test "$CONFLICTS" = 'userscript/hex.user.template.js'
            git checkout --theirs userscript/hex.user.template.js
            git add userscript/hex.user.template.js
            git commit --no-edit
          fi
          test "$(git merge-base --is-ancestor "$ACTUAL_MAIN" HEAD; echo $?)" = '0'
      - name: Install dependencies
        run: npm ci
      - name: Apply clean linear stack dependency fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s=p.read_text()
          start=s.index('function valueDependsOnRoots(value, roots, seen = new Set()) {')
          end=s.index('\n\nfunction recoverLocalStackFlow(projected) {', start)
          lines=[
            'function stackDependentValueIds(projected, roots) {',
            '  const dependentsByValueId = new Map();',
            '  const addDependent = (dependency, value) => {',
            '    if (!dependency || !value) return;',
            '    let dependents = dependentsByValueId.get(dependency.id);',
            '    if (!dependents) {',
            '      dependents = new Set();',
            '      dependentsByValueId.set(dependency.id, dependents);',
            '    }',
            '    dependents.add(value.id);',
            '  };',
            '  for (const value of projected.values) {',
            '    const def = value?.def;',
            '    if (!def) continue;',
            '    for (const arg of def.args || []) addDependent(arg?.value, value);',
            '    addDependent(def.addr?.base, value);',
            '    addDependent(def.addr?.index, value);',
            '  }',
            '  const dependent = new Set(roots);',
            '  const queue = [...roots];',
            '  let cursor = 0;',
            '  while (cursor < queue.length) {',
            '    const sourceId = queue[cursor++];',
            '    for (const valueId of dependentsByValueId.get(sourceId) || []) {',
            '      if (dependent.has(valueId)) continue;',
            '      dependent.add(valueId);',
            '      queue.push(valueId);',
            '    }',
            '  }',
            '  return dependent;',
            '}',
            '',
            'function callEscapesLocalStack(inst, stackDependent) {',
            '  if (inst.op !== V1_OP.CALL) return false;',
            '  for (const arg of inst.args || []) {',
            '    if (arg?.value && stackDependent.has(arg.value.id)) return true;',
            '  }',
            '  return false;',
            '}',
          ]
          s=s[:start]+'\n'.join(lines)+s[end:]
          anchor='function recoverLocalStackFlow(projected) {\n  const roots = stackRootIds(projected);'
          replacement='function recoverLocalStackFlow(projected) {\n  const roots = stackRootIds(projected);\n  const stackDependent = stackDependentValueIds(projected, roots);'
          if anchor not in s: raise SystemExit('recoverLocalStackFlow anchor missing')
          s=s.replace(anchor,replacement,1)
          old='if (callEscapesLocalStack(inst, roots)) stores.clear();'
          if old not in s: raise SystemExit('call escape anchor missing')
          s=s.replace(old,'if (callEscapesLocalStack(inst, stackDependent)) stores.clear();',1)
          p.write_text(s)
          PY
      - name: Generate canonical combined userscript
        run: npm run userscript:build
      - name: Validate focused IR
        run: node tests/ir.mjs
      - name: Validate full Semantic IR v2 suite
        run: npm run semantic-v2:test
      - name: Validate production diff
        run: |
          git restore node_modules 2>/dev/null || true
          git diff --check
          git status --short
          CHANGED=$(git status --short | awk '{print $2}' | grep -v '^dist/' | sort -u)
          EXPECTED=$(printf '%s\n' 'js/semantics/compat/semantic-ir-v2-to-v1-finalize.js' 'userscript/hex.user.template.js' | sort -u)
          test "$CHANGED" = "$EXPECTED"
      - name: Commit validated production repair and generated artifact
        run: |
          git add js/semantics/compat/semantic-ir-v2-to-v1-finalize.js userscript/hex.user.template.js
          git commit -m 'fix(phase3): linearize stack escape analysis and resync userscript'
          git push origin HEAD:hex/p3-semantic-ir-integration
