name: P3 linear stack escape benchmark
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-local-debug-350.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_BATTLECATS_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/battlecats
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3aa37912a67c0b6d3efb03c93d19ed64b5dad0ff
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node scripts/fetch-real-fixtures.mjs battlecats
          node scripts/fetch-real-fixtures.mjs battlecats --check
      - name: Apply linear stack dependency candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s = p.read_text()
          start = s.index('function valueDependsOnRoots(value, roots, seen = new Set()) {')
          end = s.index('\n\nfunction recoverLocalStackFlow(projected) {', start)
          lines = [
            'function stackDependentValueIds(projected, roots) {',
            '  const dependentsByValueId = new Map();',
            '  const addDependent = (dependency, value) => {',
            '    if (!dependency || !value) return;',
            '    let dependents = dependentsByValueId.get(dependency.id);',
            '    if (!dependents) { dependents = new Set(); dependentsByValueId.set(dependency.id, dependents); }',
            '    dependents.add(value.id);',
            '  };',
            '  for (const value of projected.values) {',
            '    const def = value?.def;',
            '    if (!def) continue;',
            '    for (const arg of def.args || []) addDependent(arg?.value, value);',
            '    addDependent(def.addr?.base, value);',
            '    addDependent(def.addr?.index, value);',
            '  }',
            '  const dependent = new Set(roots);',
            '  const queue = [...roots];',
            '  let cursor = 0;',
            '  while (cursor < queue.length) {',
            '    const sourceId = queue[cursor++];',
            '    for (const valueId of dependentsByValueId.get(sourceId) || []) {',
            '      if (dependent.has(valueId)) continue;',
            '      dependent.add(valueId);',
            '      queue.push(valueId);',
            '    }',
            '  }',
            '  return dependent;',
            '}',
            '',
            'function callEscapesLocalStack(inst, stackDependent) {',
            '  if (inst.op !== V1_OP.CALL) return false;',
            '  for (const arg of inst.args || []) if (arg?.value && stackDependent.has(arg.value.id)) return true;',
            '  return false;',
            '}',
          ]
          s = s[:start] + '\n'.join(lines) + s[end:]
          anchor = 'function recoverLocalStackFlow(projected) {\n  const roots = stackRootIds(projected);'
          replacement = 'function recoverLocalStackFlow(projected) {\n  const roots = stackRootIds(projected);\n  const stackDependent = stackDependentValueIds(projected, roots);'
          if anchor not in s: raise SystemExit('recover anchor missing')
          s = s.replace(anchor, replacement, 1)
          call = 'if (callEscapesLocalStack(inst, roots)) stores.clear();'
          if call not in s: raise SystemExit('escape call missing')
          s = s.replace(call, 'if (callEscapesLocalStack(inst, stackDependent)) stores.clear();', 1)
          p.write_text(s)
          PY
      - name: Create exact-function probe
        run: |
          cat > tests/.p3-stage-probe.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          import { setSemanticMigrationMode } from '../js/ir.js';
          setSemanticMigrationMode('semantic-v2-compat');
          const w = await openBinary('tests/.real-fixtures/battlecats');
          const a = 0x10033fd24n, end = 0x100340074n;
          const model = await w.analyze(a, end);
          const t = Date.now();
          const res = decompile(model, { addr:a, rowOfAddress:(x)=>w.rowOf(x), addrOfRow:(r)=>w.region.vmAddr+BigInt(r)*4n, symbolFor:(x)=>w.symbols.nameAt(x) });
          console.error(`[P3BENCH exact] ms=${Date.now()-t} lines=${res?.lines?.length ?? -1} semantic=${!!res?.semantic}`);
          EOF
      - name: Run exact function
        run: |
          timeout --signal=TERM --kill-after=5s 20s node --max-old-space-size=6000 tests/.p3-stage-probe.mjs
      - name: Run IR regressions
        run: |
          node tests/ir.mjs
