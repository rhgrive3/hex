name: Final sync ready PR 460
on:
  push:
    branches: [fix/issue-456-report-completeness]
permissions:
  contents: write
jobs:
  merge-main:
    if: startsWith(github.event.head_commit.message, 'ready-pr-merge-helper:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "package.json" || { echo "Unexpected conflicts: $conflicts"; exit 1; }
            git checkout --theirs package.json
            node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          const additions = {
            test: ['node tests/issue-193-matching.mjs','node tests/issue-456-report-completeness.mjs','node tests/issue-428-schema-provenance.mjs'],
            'semantic:test': ['node tests/issue-425-planner-budget.mjs','node tests/issues-426-427-semantic-facts.mjs','node tests/issue-430-memory-escape.mjs'],
            'decompiler:test': ['node tests/issue-429-range-domain.mjs'],
          };
          for (const [name,tokens] of Object.entries(additions)) {
            const parts = String(p.scripts[name] || '').split(' && ').filter(Boolean);
            p.scripts[name] = [...tokens, ...parts.filter(x => !tokens.includes(x))].join(' && ');
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
            git add package.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/merge-ready-460-final.yml
          npm run check
          git add -A
          git commit -m 'Merge latest main into #460 after #492'
          git push origin HEAD
