name: Verify issue 456 report completeness

on:
  push:
    branches:
      - fix/issue-456-report-completeness

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-456-report-completeness
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/apply-issue-456.py
      - run: node tests/issue-456-report-completeness.mjs
      - run: node tests/run.js
      - run: npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/report.js package.json tests/issue-456-report-completeness.mjs
          git diff --cached --check
          git commit -m 'fix: guard report absence facts by index completeness (#456)'
          git push origin HEAD:fix/issue-456-report-completeness
