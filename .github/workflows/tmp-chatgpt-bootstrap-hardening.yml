name: Temporary ChatGPT bootstrap hardening

on:
  push:
    branches:
      - hex/chatgpt-conversation-bootstrap-fix

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/chatgpt-conversation-bootstrap-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require active generation for provisional CID migration
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/userscript/chatgpt-adapter.js')
          s = p.read_text()
          old = "if (!newConversation || !requestPresent || freshUsers.length !== 1) {"
          new = "if (!newConversation || !this.adapter.isGenerating() || !requestPresent || freshUsers.length !== 1) {"
          if s.count(old) != 1:
              raise SystemExit(f'guard match count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/chatgpt-web-runtime.mjs')
          s = p.read_text()
          old = "await testNewConversationNavigationAwayIsRejected();\nawait testPersistentConversationGapIsRejected();"
          new = "await testNewConversationNavigationAwayIsRejected();\nawait testCompletedNewConversationCannotMigrate();\nawait testPersistentConversationGapIsRejected();"
          if s.count(old) != 1:
              raise SystemExit('test list anchor missing')
          s = s.replace(old, new, 1)
          anchor = "async function testPersistentConversationGapIsRejected() {"
          test = '''async function testCompletedNewConversationCannotMigrate() {
  const alpha = { id: 'alpha', url: 'https://chatgpt.com/c/alpha' };
  const beta = { id: 'beta', url: 'https://chatgpt.com/c/beta' };
  const state = { generating: false, assistants: [], users: [], turns: [], conversation: null };
  const user = { id: 'hex-user-turn', text: 'prompt', node: plainNode('hex-user-turn') };
  const assistant = { id: 'hex-assistant-turn', text: '{"type":"final"}', node: plainNode('hex-assistant-turn') };
  const adapter = turnAdapter(state, () => {
    state.users.push(user);
    state.assistants.push(assistant);
    state.turns.push(user, assistant);
    state.generating = true;
    setTimeout(() => { state.conversation = alpha; }, 4);
    setTimeout(() => { state.generating = false; }, 10);
    setTimeout(() => { state.conversation = beta; }, 14);
  });
  await assert.rejects(
    new ChatGPTTurnController(adapter, { quietMs: 30, pollMs: 2, startTimeoutMs: 40, conversationGraceMs: 20 })
      .run('prompt', { timeoutMs: 250, newConversation: true }),
    (error) => error.code === 'conversation-switched',
    'CID migration after generation ended must be treated as navigation',
  );
}

'''
          if s.count(anchor) != 1:
              raise SystemExit('test insertion anchor missing')
          p.write_text(s.replace(anchor, test + anchor, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run lifecycle and bridge tests
        run: |
          node tests/chatgpt-web-runtime.mjs
          node tests/chatgpt-web-bridge-contract.mjs
          npm run ai:test
          npm run userscript:test
          npm run lint
      - name: Regenerate userscript and validate diff
        run: |
          npm run userscript:build
          git diff --check
      - name: Commit hardening and remove temporary workflow
        run: |
          rm .github/workflows/tmp-chatgpt-bootstrap-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/userscript/chatgpt-adapter.js tests/chatgpt-web-runtime.mjs userscript/hex.user.template.js .github/workflows/tmp-chatgpt-bootstrap-hardening.yml
          git commit -m "Harden ChatGPT provisional conversation migration"
          git push origin HEAD:hex/chatgpt-conversation-bootstrap-fix
