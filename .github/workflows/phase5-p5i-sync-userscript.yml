name: Phase 5 P5-I canonical userscript sync

on:
  push:
    branches:
      - hex/p5-x86-integration

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.repository == 'rhgrive3/hex' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Canonical build and idempotence check
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp /tmp/hex.user.template.js userscript/hex.user.template.js
          cmp /tmp/release-version.json userscript/release-version.json
          git diff --check
      - name: Commit only canonical generated output and remove sync harness
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase5-p5i-sync-userscript.yml
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/phase5-p5i-sync-userscript.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 5: synchronize generated userscript after main reconciliation'
          git push origin HEAD:refs/heads/hex/p5-x86-integration
