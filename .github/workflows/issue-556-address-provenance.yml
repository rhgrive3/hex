name: Issue 556 address provenance

on:
  push:
    branches: [fix/issue-556-address-provenance]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[issue-556-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply worker integration
        run: python3 tools/apply-issue-556.py
      - name: Focused worker provenance regression
        run: node tests/issue-556-address-provenance.mjs
      - name: Standard ARM64 word gate
        run: node tests/words.mjs
      - name: Static checks
        run: |
          node --check js/address-provenance.js
          node --check js/worker-legacy.js
          node --check tests/issue-556-address-provenance.mjs
      - name: Full regression
        run: npm run check
      - name: Commit validated worker integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/worker-legacy.js
          git commit -m 'Fix #556 control-flow-aware address provenance [issue-556-applied]'
          git push
