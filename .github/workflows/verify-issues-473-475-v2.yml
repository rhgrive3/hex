name: Verify latest-main platform issues 473-475

on:
  push:
    branches:
      - fix/latest-475-473-platform-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-475-473-platform-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixes to latest main
        run: python3 tools/apply-issues-473-475-v2.py
      - name: Focused regressions
        run: node tests/issues-473-475-platform.mjs
      - name: Platform regressions
        run: npm run platform:test
      - name: Static checks
        run: |
          node --check js/platform/describe.js
          node --check js/architecture/index.js
          node --check js/binary/macho.js
          node --check js/binary/model.js
          node --check js/platform/worker.js
          npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/platform/describe.js js/architecture/index.js js/binary/macho.js js/binary/model.js js/platform/worker.js tests/capstone-capability.mjs package.json
          git commit -m "fix: preserve ARM64e capability and function extent provenance (#473 #474 #475)"
          git push origin HEAD:fix/latest-475-473-platform-v2
