name: Phase 4 ownership

on:
  pull_request:
    paths:
      - 'js/core/artifacts/**'
      - 'js/core/scheduler/**'
      - 'js/core/budgets/**'
      - 'js/project/**'
      - 'js/bytesource/cached.js'
      - 'js/cache/**'
      - 'js/backend.js'
      - 'js/worker*.js'
      - 'tests/phase4/**'
      - 'tools/validation/phase4/**'
      - 'tools/validation/phase4-ownership.mjs'
      - 'tools/validation/phase-ownership/phase4.json'
      - 'reports/phase4/**'
      - '.github/workflows/phase4-*.yml'
      # Shared generated userscript outputs remain manifest-governed when a
      # real Phase 4 lane runs, but must not alone require a Phase 4 branch.
      - 'package.json'

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve cross-phase ownership lane from canonical branch naming
        id: lane
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            hex/p4-artifact-foundation) phase=4; lane=p4-0 ;;
            hex/p4-1-*) phase=4; lane=p4-1 ;;
            hex/p4-2-*) phase=4; lane=p4-2 ;;
            hex/p4-3-*) phase=4; lane=p4-3 ;;
            hex/p4-4-*) phase=4; lane=p4-4 ;;
            hex/p4-5-*) phase=4; lane=p4-5 ;;
            hex/p4-6-*) phase=4; lane=p4-6 ;;
            hex/p4-artifact-store-scheduler-integration) phase=4; lane=p4-7 ;;
            hex/p4-integration-contract-repair) phase=4; lane=p4-r ;;
            hex/p5-0-x86-foundation) phase=5; lane=p5-0 ;;
            hex/p5-1-*) phase=5; lane=p5-1 ;;
            hex/p5-2-*) phase=5; lane=p5-2 ;;
            hex/p5-3-*) phase=5; lane=p5-3 ;;
            hex/p5-4-*) phase=5; lane=p5-4 ;;
            hex/p5-5-*) phase=5; lane=p5-5 ;;
            hex/p5-6-*) phase=5; lane=p5-6 ;;
            hex/p5-x86-integration) phase=5; lane=p5-i ;;
            hex/p6-riscv64-integration) phase=6; lane=p6 ;;
            *)
              echo "::error::Phase 4-owned files require a canonical Phase 4 or Phase 5 lane branch, or the canonical Phase 6 integration branch; got '$HEAD_REF'."
              exit 1
              ;;
          esac
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
      - name: Prove direct Phase 4 ownership simulations
        if: steps.lane.outputs.phase == '4'
        shell: bash
        run: |
          set -euo pipefail
          expect_fail() {
            if "$@"; then
              echo "::error::expected ownership command to fail: $*"
              exit 1
            fi
          }

          node tools/validation/phase4-ownership.mjs --lane p4-3 --files js/project/artifact-index.js
          expect_fail node tools/validation/phase4-ownership.mjs --lane p4-2 --files js/core/scheduler/index.js
          node tools/validation/phase4-ownership.mjs --lane p4-7 --files js/core/scheduler/index.js
          expect_fail node tools/validation/phase4-ownership.mjs --lane p4-7 --files js/core/artifacts/contracts.js
          node tools/validation/phase4-ownership.mjs --lane p4-r --files tools/validation/phase-ownership/phase4.json
          expect_fail node tools/validation/phase4-ownership.mjs --lane p4-r --files js/backend.js
      - name: Run Phase 4 ownership governance regressions
        if: steps.lane.outputs.phase == '4'
        run: node --test tests/phase4/ownership/integration-contract-repair.test.mjs
      - name: Enforce machine-readable ownership manifest
        if: steps.lane.outputs.phase == '4'
        run: node tools/validation/phase4-ownership.mjs --lane "${{ steps.lane.outputs.lane }}" --base "origin/${{ github.base_ref }}"
      - name: Enforce exact Phase 5 ownership inventory at the Phase 4 boundary
        if: steps.lane.outputs.phase == '5'
        run: >-
          node tools/validation/phase5-ownership.mjs
          --lane "${{ steps.lane.outputs.lane }}"
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
      - name: Enforce exact Phase 6 ownership inventory at the Phase 4 boundary
        if: steps.lane.outputs.phase == '6'
        run: >-
          node tools/validation/phase6-ownership.mjs
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --head-sha "${{ github.event.pull_request.head.sha }}"
