name: Issue 514 diff completeness

on:
  push:
    branches:
      - fix/issue-514-diff-completeness

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[issue-514-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply diff completeness fix
        run: python3 tools/apply-issue-514.py
      - name: Focused diff regression
        run: node tests/diff-platform.mjs
      - name: Platform regression suite
        run: npm run platform:test
      - name: Static checks
        run: |
          node --check js/diff/index.js
          node --check tests/diff-platform.mjs
      - name: Full lint
        run: npm run lint
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/diff/index.js tests/diff-platform.mjs
          git commit -m 'Fix #514 preserve diff completeness [issue-514-applied]'
          git push
