name: Temporary ChatGPT Web production hardening
on:
  push:
    branches: [hex/chatgpt-web-production-hardening-final]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/chatgpt-web-production-hardening-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply production hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'non-unique patch anchor in {path}: {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # 1) Whole-investigation ceilings: enough for real ChatGPT reasoning and two chat model calls.
          replace_once(
              'js/ai/schema.js',
              "  chat: Object.freeze({ maxModelCalls: 2, maxToolCalls: 2, maxFunctions: 4, maxDisassembly: 8000, maxCost: 12, timeoutMs: 30000, contextBytes: 64 * 1024 }),\n  agent: Object.freeze({ maxModelCalls: 12, maxToolCalls: 24, maxFunctions: 48, maxDisassembly: 50000, maxCost: 160, timeoutMs: 120000, contextBytes: 128 * 1024 }),",
              "  chat: Object.freeze({ maxModelCalls: 2, maxToolCalls: 2, maxFunctions: 4, maxDisassembly: 8000, maxCost: 12, timeoutMs: 240000, contextBytes: 64 * 1024 }),\n  agent: Object.freeze({ maxModelCalls: 12, maxToolCalls: 24, maxFunctions: 48, maxDisassembly: 50000, maxCost: 160, timeoutMs: 600000, contextBytes: 128 * 1024 }),",
          )

          # 2) Per-model-call cap: a single ChatGPT hang cannot consume the whole investigation budget.
          replace_once('js/ai/provider/chatgpt-web.js', "const DEFAULT_TIMEOUT_MS = 110000;", "const DEFAULT_TIMEOUT_MS = 120000;")
          replace_once(
              'js/ai/provider/chatgpt-web.js',
              "      const response = await this.bridge.request(buildChatGPTTurnPrompt(request), {\n        signal: controller.signal,\n        timeoutMs: options.timeoutMs || this.timeoutMs,",
              "      const response = await this.bridge.request(buildChatGPTTurnPrompt(request), {\n        signal: controller.signal,\n        timeoutMs: boundedTimeout(options.timeoutMs, this.timeoutMs),",
          )
          replace_once(
              'js/ai/provider/chatgpt-web.js',
              "function apiEndpoint(path) {\n  const base = globalThis.__HEX_API_BASE__;",
              "function boundedTimeout(requested, ceiling) {\n  const rawCeiling = Number(ceiling);\n  const cap = Number.isFinite(rawCeiling) && rawCeiling > 0 ? Math.floor(rawCeiling) : DEFAULT_TIMEOUT_MS;\n  const rawRequested = Number(requested);\n  if (!Number.isFinite(rawRequested) || rawRequested <= 0) return cap;\n  return Math.max(1, Math.min(cap, Math.floor(rawRequested)));\n}\n\nfunction apiEndpoint(path) {\n  const base = globalThis.__HEX_API_BASE__;",
          )

          # 3) Do not burn the last seconds on a repair request that cannot realistically complete.
          replace_once(
              'js/ai/control/turn-executor.js',
              "} from './runtime-support.js';\n\nexport async function executeTurn",
              "} from './runtime-support.js';\n\nconst MIN_MODEL_REPAIR_REMAINING_MS = 45000;\n\nexport async function executeTurn",
          )
          replace_once(
              'js/ai/control/turn-executor.js',
              "              const normalized = normalizeError(error, signal);\n              if ((normalized.type === 'invalid_model_output' || normalized.type === 'invalid_tool_call') && repairs++ === 0 && modelCalls < budget.maxModelCalls) {\n                observations.push({ tool: 'protocol_guardrail', summary: `Previous model response rejected: ${normalized.message}`, evidenceIds: [] });\n                addActivity({ type: 'model-repair', label: '不正なモデル出力を1回だけ修復' }); continue;\n              }\n              throw normalized;",
              "              const normalized = normalizeError(error, signal);\n              const repairable = normalized.type === 'invalid_model_output' || normalized.type === 'invalid_tool_call';\n              if (repairable && repairs === 0 && modelCalls < budget.maxModelCalls) {\n                const repairRemainingMs = remainingTime(started, budget.timeoutMs);\n                if (repairRemainingMs >= MIN_MODEL_REPAIR_REMAINING_MS) {\n                  repairs++;\n                  observations.push({ tool: 'protocol_guardrail', summary: `Previous model response rejected: ${normalized.message}`, evidenceIds: [] });\n                  addActivity({ type: 'model-repair', label: 'モデル出力の形式を1回だけ再確認', remainingMs: repairRemainingMs });\n                  continue;\n                }\n                addActivity({ type: 'model-repair-skip', label: '残り時間が少ないためモデル出力の再確認を省略', remainingMs: repairRemainingMs });\n              }\n              throw normalized;",
          )

          # 4) Track new page-level ChatGPT error signals, but never re-consume historical alerts.
          replace_once(
              'js/userscript/chatgpt-selectors.js',
              "  error: Object.freeze([\n    '[data-testid=\"conversation-turn-error\"]',\n  ]),",
              "  error: Object.freeze([\n    '[data-testid=\"conversation-turn-error\"]',\n  ]),\n  // Page-level failures (for example a transient invalid-input toast) are only\n  // authoritative when they are newly observed after Hex submits its turn.\n  // The turn controller baselines these nodes before send, so historical ARIA\n  // announcements cannot poison later requests.\n  pageError: Object.freeze([\n    '[role=\"alert\"]',\n    '[aria-live=\"assertive\"]',\n    '[data-testid*=\"error\"]',\n  ]),",
          )

          # 5) Prefer the longer semantic user-message representation. WebKit can expose a
          # visually clipped innerText while textContent still contains the full submitted prompt.
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "    const semanticBody = body || scope;\n    return String(semanticBody.innerText || semanticBody.textContent || '').trim();",
              "    const semanticBody = body || scope;\n    const inner = String(semanticBody.innerText || '');\n    const raw = String(semanticBody.textContent || '');\n    if (roleName === 'user') {\n      // iOS/WebKit can report a line-clamped innerText before the collapsible\n      // renderer has fully hydrated. The semantic content node's textContent is\n      // not layout-clipped. Prefer it only when it clearly carries more content;\n      // otherwise keep innerText so block separators remain intact.\n      const innerLength = normalizeText(inner).length;\n      const rawLength = normalizeText(raw).length;\n      return String(rawLength > innerLength ? raw : (inner || raw)).trim();\n    }\n    return String(inner || raw).trim();",
          )

          # 6) Add page-error collection/observation beside the existing turn-scoped error path.
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "  errorState(scopeNodes = null) {\n    for (const node of scopeNodes ? this.errorNodesWithin(scopeNodes) : this.all('error')) {\n      const text = this.text(node);\n      if (text && /error|failed|try again|something went wrong|エラー|失敗|再試行/i.test(text)) return text.slice(0, 1000);\n    }\n    return null;\n  }\n\n  errorNodesWithin(scopeNodes) {",
              "  errorState(scopeNodes = null) {\n    for (const node of scopeNodes ? this.errorNodesWithin(scopeNodes) : this.all('error')) {\n      const text = this.text(node);\n      if (isFailureText(text)) return text.slice(0, 1000);\n    }\n    return null;\n  }\n\n  pageErrorSignal(node) {\n    if (!node) return null;\n    try { if (node.closest?.('[data-testid^=\"conversation-turn-\"]')) return null; } catch { /* selector unsupported */ }\n    try { if (node.closest?.('[id^=\"hex-\"], [data-hex]')) return null; } catch { /* selector unsupported */ }\n    if (node.hidden || node.getAttribute?.('aria-hidden') === 'true') return null;\n    const text = String(node.innerText || node.textContent || '').replace(/\\s+/g, ' ').trim();\n    if (!isFailureText(text)) return null;\n    return { node, id: this.identity(node), text: text.slice(0, 1000) };\n  }\n\n  pageErrorSignals() {\n    const seen = new Set(), out = [];\n    for (const selector of this.selectors.pageError || []) {\n      let values = [];\n      try { values = this.document?.querySelectorAll?.(selector) || []; } catch { values = []; }\n      for (const node of values) {\n        if (seen.has(node)) continue;\n        seen.add(node);\n        const signal = this.pageErrorSignal(node);\n        if (signal) out.push(signal);\n      }\n    }\n    return out;\n  }\n\n  pageErrorState(baseline = null) {\n    for (const signal of this.pageErrorSignals()) {\n      if (baseline?.has?.(pageErrorSignature(signal))) continue;\n      return signal.text;\n    }\n    return null;\n  }\n\n  observePageErrors(callback) {\n    const Observer = globalThis.MutationObserver;\n    const root = this.document?.documentElement || this.document?.body || null;\n    if (!root || typeof Observer !== 'function') return () => {};\n    const selectors = this.selectors.pageError || [];\n    const candidates = (raw) => {\n      const element = raw?.nodeType === 1 ? raw : raw?.parentElement;\n      if (!element) return [];\n      const found = new Set();\n      for (const selector of selectors) {\n        try { if (element.matches?.(selector)) found.add(element); } catch { /* selector unsupported */ }\n        try { const enclosing = element.closest?.(selector); if (enclosing) found.add(enclosing); } catch { /* selector unsupported */ }\n        try { for (const node of element.querySelectorAll?.(selector) || []) found.add(node); } catch { /* selector unsupported */ }\n      }\n      return [...found];\n    };\n    const observer = new Observer((records) => {\n      for (const record of records || []) {\n        const values = [record.target, ...(record.addedNodes || [])];\n        for (const raw of values) {\n          for (const node of candidates(raw)) {\n            const signal = this.pageErrorSignal(node);\n            if (signal) { callback?.(signal); return; }\n          }\n        }\n      }\n    });\n    observer.observe(root, {\n      subtree: true, childList: true, characterData: true, attributes: true,\n      attributeFilter: ['role', 'aria-live', 'aria-hidden', 'data-testid'],\n    });\n    return () => observer.disconnect();\n  }\n\n  errorNodesWithin(scopeNodes) {",
          )

          # 7) Give the submitted user turn a short hydration grace instead of failing on the
          # first partial DOM frame. A persistent mismatch remains a hard guard failure.
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "  constructor(adapter, { quietMs = 1500, pollMs = 120, startTimeoutMs = 10000, conversationGraceMs = 3000 } = {}) {\n    this.adapter = adapter;\n    this.quietMs = quietMs;\n    this.pollMs = pollMs;\n    this.startTimeoutMs = startTimeoutMs;\n    this.conversationGraceMs = conversationGraceMs;\n  }",
              "  constructor(adapter, { quietMs = 1500, pollMs = 120, startTimeoutMs = 10000, conversationGraceMs = 3000, submissionMismatchGraceMs = 1500 } = {}) {\n    this.adapter = adapter;\n    this.quietMs = quietMs;\n    this.pollMs = pollMs;\n    this.startTimeoutMs = startTimeoutMs;\n    this.conversationGraceMs = conversationGraceMs;\n    this.submissionMismatchGraceMs = submissionMismatchGraceMs;\n  }",
          )
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "    const baselineAssistant = new Set(this.assistantTurns().map((turn) => turn.id));\n    const baselineUsers = new Set(this.userTurns().map((turn) => turn.id));\n    const baselineConversation = new Set(this.conversationTurns().map((turn) => turn.id));",
              "    const baselineAssistant = new Set(this.assistantTurns().map((turn) => turn.id));\n    const baselineUsers = new Set(this.userTurns().map((turn) => turn.id));\n    const baselineConversation = new Set(this.conversationTurns().map((turn) => turn.id));\n    const baselinePageErrors = pageErrorSignatures(this.adapter);",
          )
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "    send.click();\n\n    let requestUserTurn = null;\n    const submitted = await waitFor(() => {\n      const explicit = this.userTurns().filter((turn) => !baselineUsers.has(turn.id));\n      if (explicit.length > 1) throw bridgeError('turn-controller', 'manual-interference', 'Another user turn appeared while Hex was submitting its request.');\n      if (explicit.length === 1) {\n        if (normalizeText(explicit[0].text) !== normalizedPrompt) throw bridgeError('turn-controller', 'manual-interference', 'The submitted ChatGPT turn does not match the Hex request.');\n        requestUserTurn = explicit[0];\n        return true;\n      }",
              "    send.click();\n\n    let requestUserTurn = null;\n    let mismatchCandidateId = null, mismatchSince = null;\n    let pageErrorObserved = null;\n    const capturePageError = (signal = null) => {\n      if (pageErrorObserved) return;\n      if (signal && !baselinePageErrors.has(pageErrorSignature(signal))) {\n        pageErrorObserved = signal.text;\n        return;\n      }\n      const current = this.adapter.pageErrorState?.(baselinePageErrors);\n      if (current) pageErrorObserved = current;\n    };\n    const stopObservingPageErrors = this.adapter.observePageErrors?.(capturePageError) || NOOP;\n    capturePageError();\n\n    let submitted = null;\n    try {\n      submitted = await waitFor(() => {\n        capturePageError();\n        if (pageErrorObserved) throw bridgeError('turn-controller', 'page-error', 'ChatGPT reported a page-level error while handling the Hex turn.', { error: pageErrorObserved });\n        const explicit = this.userTurns().filter((turn) => !baselineUsers.has(turn.id));\n        if (explicit.length > 1) throw bridgeError('turn-controller', 'manual-interference', 'Another user turn appeared while Hex was submitting its request.');\n        if (explicit.length === 1) {\n          const candidate = explicit[0];\n          if (normalizeText(candidate.text) === normalizedPrompt) {\n            requestUserTurn = candidate;\n            mismatchCandidateId = null;\n            mismatchSince = null;\n            return true;\n          }\n          const candidateId = String(candidate.id || '');\n          if (mismatchCandidateId !== candidateId) {\n            mismatchCandidateId = candidateId;\n            mismatchSince = Date.now();\n          }\n          if (Date.now() - mismatchSince >= this.submissionMismatchGraceMs) {\n            throw bridgeError('turn-controller', 'manual-interference', 'The submitted ChatGPT turn does not match the Hex request.');\n          }\n          return false;\n        }\n        mismatchCandidateId = null;\n        mismatchSince = null;",
          )
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "      return false;\n    }, Math.min(this.startTimeoutMs, remaining(started, timeoutMs)), signal);\n    if (!submitted || !requestUserTurn) throw bridgeError('turn-controller', 'submission-unverified', 'The ChatGPT user turn could not be matched to the Hex request.');\n\n    let latest = '', latestId = null, lastChangedAt = Date.now(), sawGenerating = this.adapter.isGenerating(), observedConversation = expectedConversation;\n    let missingConversationSince = null, bootstrapMigrated = false;\n    let stopObserving = NOOP;\n    try {",
              "        return false;\n      }, Math.min(this.startTimeoutMs, remaining(started, timeoutMs)), signal);\n    } catch (error) {\n      stopObservingPageErrors();\n      throw error;\n    }\n    if (!submitted || !requestUserTurn) {\n      stopObservingPageErrors();\n      throw bridgeError('turn-controller', 'submission-unverified', 'The ChatGPT user turn could not be matched to the Hex request.');\n    }\n\n    let latest = '', latestId = null, lastChangedAt = Date.now(), sawGenerating = this.adapter.isGenerating(), observedConversation = expectedConversation;\n    let missingConversationSince = null, bootstrapMigrated = false, completed = false;\n    let stopObserving = NOOP;\n    try {",
          )
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "        if (signal?.aborted) throw abortError(signal.reason);\n\n        // Read one logical snapshot before judging navigation.",
              "        if (signal?.aborted) throw abortError(signal.reason);\n        capturePageError();\n        if (pageErrorObserved) throw bridgeError('turn-controller', 'page-error', 'ChatGPT reported a page-level error while handling the Hex turn.', { error: pageErrorObserved });\n\n        // Read one logical snapshot before judging navigation.",
          )
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "              return { text: latest.trim(), conversation: identity || null, turnId: turn.id };",
              "              completed = true;\n              return { text: latest.trim(), conversation: identity || null, turnId: turn.id };",
          )
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "    } finally { stopObserving(); }\n  }\n\n  fallbackResponseTurn",
              "    } finally {\n      stopObserving();\n      stopObservingPageErrors();\n      if (!completed) this.stopOwnedGeneration({ requestUserTurn, normalizedPrompt, observedConversation });\n    }\n  }\n\n  stopOwnedGeneration({ requestUserTurn, normalizedPrompt, observedConversation } = {}) {\n    if (!requestUserTurn || !this.adapter.isGenerating?.()) return false;\n    const current = this.adapter.conversation?.() || null;\n    // Never click Stop after navigation to a concretely different conversation:\n    // that button can belong to the user's unrelated ChatGPT turn.\n    if (observedConversation && current && current.id !== observedConversation.id) return false;\n    const users = this.userTurns();\n    const turns = this.conversationTurns();\n    if (!requestTurnIsPresent(requestUserTurn, users, turns, normalizedPrompt)) return false;\n    try { return this.adapter.stop?.() === true; } catch { return false; }\n  }\n\n  fallbackResponseTurn",
          )

          # 8) Shared helpers for error matching and baseline signatures.
          replace_once(
              'js/userscript/chatgpt-adapter.js',
              "function bridgeError(stage, code, message, details = null) { return new ChatGPTBridgeError(code, message, details, stage); }\nfunction validConversation(value)",
              "function isFailureText(value) {\n  return /error|failed|invalid input|invalid request|unable to|something went wrong|try again|エラー|失敗|不正な入力|無効な入力|問題が発生|送信できません|処理できません|再試行/i.test(String(value || ''));\n}\nfunction pageErrorSignature(value) { return `${String(value?.id || '')}\\u0000${normalizeText(value?.text || '')}`; }\nfunction pageErrorSignatures(adapter) {\n  if (typeof adapter?.pageErrorSignals !== 'function') return new Set();\n  return new Set((adapter.pageErrorSignals() || []).map(pageErrorSignature));\n}\nfunction bridgeError(stage, code, message, details = null) { return new ChatGPTBridgeError(code, message, details, stage); }\nfunction validConversation(value)",
          )

          # 9) Safe visible diagnostic for page-level ChatGPT failure.
          replace_once(
              'js/ai/control/runtime-support.js',
              "  'response-error': 'ChatGPT reported an error for the active response.',",
              "  'response-error': 'ChatGPT reported an error for the active response.',\n  'page-error': 'ChatGPT reported a page-level error for the active request.',",
          )

          # 10) Node regressions: WebKit clipped innerText, hydration grace, owned-stop, budgets, per-call cap.
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "await testCollapsibleUserMessageTextExtraction();\nawait testTurnCompletionAndStaleProtection();",
              "await testCollapsibleUserMessageTextExtraction();\nawait testSubmittedUserHydrationGrace();\nawait testTurnCompletionAndStaleProtection();",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "  const content = { innerText: prompt, textContent: prompt };",
              "  const content = { innerText: prompt.slice(0, 72), textContent: prompt };",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "  assert.match(roleNode.innerText, /表示を増やす/, 'fixture must reproduce ChatGPT collapsible-message UI text inside the user role');",
              "  assert.ok(content.innerText.length < content.textContent.length, 'fixture must reproduce a WebKit-clipped semantic innerText');\n  assert.match(roleNode.innerText, /表示を増やす/, 'fixture must reproduce ChatGPT collapsible-message UI text inside the user role');",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "async function testTurnCompletionAndStaleProtection() {",
              "async function testSubmittedUserHydrationGrace() {\n  const conversation = { id: 'alpha', url: 'https://chatgpt.com/c/alpha' };\n  const state = { generating: false, assistants: [], users: [], turns: [], conversation };\n  const user = { id: 'hex-user', text: 'partial', node: plainNode('hex-user') };\n  const adapter = turnAdapter(state, () => {\n    state.users.push(user); state.turns.push(user); state.generating = true;\n    setTimeout(() => { user.text = 'prompt'; }, 8);\n    setTimeout(() => {\n      const assistant = { id: 'hex-assistant', text: '{\"type\":\"final\"}', node: plainNode('hex-assistant') };\n      state.assistants.push(assistant); state.turns.push(assistant); state.generating = false;\n    }, 16);\n  });\n  const result = await new ChatGPTTurnController(adapter, { quietMs: 5, pollMs: 2, startTimeoutMs: 50, submissionMismatchGraceMs: 20 })\n    .run('prompt', { timeoutMs: 200, expectedConversation: conversation });\n  assert.equal(result.turnId, 'hex-assistant', 'a partial first DOM frame must hydrate into the exact Hex request');\n\n  const bad = { generating: false, assistants: [], users: [], turns: [], conversation };\n  const badAdapter = turnAdapter(bad, () => {\n    const wrong = { id: 'wrong-user', text: 'not the Hex prompt', node: plainNode('wrong-user') };\n    bad.users.push(wrong); bad.turns.push(wrong); bad.generating = true;\n  });\n  await assert.rejects(\n    new ChatGPTTurnController(badAdapter, { pollMs: 2, startTimeoutMs: 60, submissionMismatchGraceMs: 10 })\n      .run('prompt', { timeoutMs: 100, expectedConversation: conversation }),\n    (error) => error.code === 'manual-interference',\n    'a persistent single-turn mismatch must remain a hard integrity failure',\n  );\n}\n\nasync function testTurnCompletionAndStaleProtection() {",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "  const state = { generating: false, assistants: [], users: [], conversation: { id: 'alpha', url: 'https://chatgpt.com/c/alpha' } };",
              "  const state = { generating: false, assistants: [], users: [], stopCalls: 0, conversation: { id: 'alpha', url: 'https://chatgpt.com/c/alpha' } };",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "  await assert.rejects(new ChatGPTTurnController(adapter, { pollMs: 2, quietMs: 3 }).run('prompt', { timeoutMs: 15, expectedConversation: state.conversation }), (error) => error.code === 'timeout');\n  state.generating = false; state.users = [];",
              "  await assert.rejects(new ChatGPTTurnController(adapter, { pollMs: 2, quietMs: 3 }).run('prompt', { timeoutMs: 15, expectedConversation: state.conversation }), (error) => error.code === 'timeout');\n  assert.equal(state.stopCalls, 1, 'a timed-out owned ChatGPT generation must be stopped');\n  state.generating = false; state.users = [];",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "  const pending = new ChatGPTTurnController(adapter, { pollMs: 2 }).run('prompt', { timeoutMs: 100, signal: controller.signal, expectedConversation: state.conversation });\n  controller.abort('cancel'); await assert.rejects(pending, (error) => error.name === 'AbortError');",
              "  const pending = new ChatGPTTurnController(adapter, { pollMs: 2 }).run('prompt', { timeoutMs: 100, signal: controller.signal, expectedConversation: state.conversation });\n  await new Promise((resolve) => setTimeout(resolve, 5));\n  controller.abort('cancel'); await assert.rejects(pending, (error) => error.name === 'AbortError');\n  assert.equal(state.stopCalls, 2, 'a cancelled owned ChatGPT generation must be stopped');",
          )
          replace_once(
              'tests/chatgpt-web-runtime.mjs',
              "    conversation: () => state.conversation,\n  };\n}",
              "    conversation: () => state.conversation,\n    stop: () => { state.stopCalls = Number(state.stopCalls || 0) + 1; state.generating = false; return true; },\n  };\n}",
          )

          replace_once(
              'tests/ai-chatgpt-web-provider.mjs',
              "import {\n  ChatGPTWebProvider,",
              "import { aiBudget } from '../js/ai/schema.js';\nimport {\n  ChatGPTWebProvider,",
          )
          replace_once(
              'tests/ai-chatgpt-web-provider.mjs',
              "const tools = [{",
              "assert.equal(aiBudget('chat').timeoutMs, 240000, 'interactive chat needs enough wall time for real reasoning plus a second model call');\nassert.equal(aiBudget('agent').timeoutMs, 600000, 'agent mode must not inherit the old two-minute whole-investigation ceiling');\nassert.equal(aiBudget('chat', { timeoutMs: 999999 }).timeoutMs, 240000, 'caller overrides cannot exceed the reviewed chat ceiling');\n\nconst tools = [{",
          )
          replace_once(
              'tests/ai-chatgpt-web-provider.mjs',
              "{\n  const provider = new ChatGPTWebProvider({\n    bridge: {\n      async request() {\n        const error = new Error('ChatGPT response capture timed out.');",
              "{\n  let observedTimeout = null;\n  const provider = new ChatGPTWebProvider({\n    timeoutMs: 120,\n    bridge: {\n      async request(_prompt, options) { observedTimeout = options.timeoutMs; return '{\"type\":\"final\",\"answer\":\"ok\"}'; },\n    },\n  });\n  await provider.nextTurn({ tools: [] }, { timeoutMs: 5000 });\n  assert.equal(observedTimeout, 120, 'whole-turn budget must be capped by the per-ChatGPT-call timeout');\n}\n\n{\n  const provider = new ChatGPTWebProvider({\n    bridge: {\n      async request() {\n        const error = new Error('ChatGPT response capture timed out.');",
          )
          replace_once(
              'tests/ai-chatgpt-web-provider.mjs',
              "for (const [code, stage] of [['manual-interference', 'turn-controller'], ['conversation-switched', 'turn-controller'], ['already-active', 'bridge'], ['RPC_UNSAFE_RESULT', null]])",
              "for (const [code, stage] of [['manual-interference', 'turn-controller'], ['conversation-switched', 'turn-controller'], ['page-error', 'turn-controller'], ['already-active', 'bridge'], ['RPC_UNSAFE_RESULT', null]])",
          )

          # 11) Runtime regression: low remaining time must report invalid output instead of launching a doomed repair and timing out.
          replace_once(
              'tests/chatgpt-web-agent-loop.mjs',
              "console.log('chatgpt-web-agent-loop: ok');",
              "{\n  let invalidCalls = 0;\n  const invalid = new ChatGPTWebProvider({\n    bridge: { async request() { invalidCalls++; return 'not-json'; }, cancel() {} },\n  });\n  const invalidRuntime = new AIRuntime({\n    context: { binaryId: 'chatgpt-repair-budget', searchStrings: async () => [], addressExists: () => true },\n    provider: invalid, planner: false,\n  });\n  const failed = await invalidRuntime.turn({\n    mode: 'chat', scope: 'binary', goal: 'test repair budget', provider: 'chatgpt-web',\n    budget: { timeoutMs: 1000, maxModelCalls: 2 },\n  });\n  assert.equal(invalidCalls, 1, 'a repair must not start when the remaining whole-turn budget is too small');\n  assert.equal(failed.activity.find((item) => item.type === 'error')?.errorType, 'invalid_model_output');\n  assert.ok(failed.activity.some((item) => item.type === 'model-repair-skip'));\n}\n\nconsole.log('chatgpt-web-agent-loop: ok');",
