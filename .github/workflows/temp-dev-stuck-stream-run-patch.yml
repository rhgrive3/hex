name: Temporary Dev Supervisor stuck-stream validation

on:
  push:
    branches: [hex/fix-dev-supervisor-stuck-stream]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/fix-dev-supervisor-stuck-stream
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply forensic repair
        run: |
          python tools/temp-dev-stuck-stream-patch.py
          python tools/temp-dev-stuck-stream-followup.py
      - name: Exact runtime regression
        run: node tests/chatgpt-web-runtime.mjs
      - name: Dev Agent regressions
        run: npm run dev-agent:test
      - name: AI regressions
        run: npm run ai:test
      - name: Build protected userscript
        run: npm run userscript:build
      - name: Userscript regressions
        run: npm run userscript:test
      - name: Install pinned browser engines
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install-deps chromium webkit
          npx --no-install playwright install chromium webkit
      - name: Chromium and WebKit production-DOM regression
        run: node tests/chatgpt-web-production-dom.mjs
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated repair and generated release
        run: |
          rm .github/workflows/temp-dev-stuck-stream-run-patch.yml
          rm tools/temp-dev-stuck-stream-patch.py
          rm tools/temp-dev-stuck-stream-followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            js/userscript/chatgpt-adapter.js \
            js/userscript/chatgpt-bridge.js \
            tests/chatgpt-web-runtime.mjs \
            tests/chatgpt-web-production-dom.mjs \
            tests/fixtures/chatgpt-production-dom.mjs \
            userscript/hex.user.template.js \
            userscript/release-version.json \
            .github/workflows/temp-dev-stuck-stream-run-patch.yml \
            tools/temp-dev-stuck-stream-patch.py \
            tools/temp-dev-stuck-stream-followup.py
          git commit -m "Recover completed Dev JSON from stuck ChatGPT streaming"
          git push origin HEAD:hex/fix-dev-supervisor-stuck-stream
