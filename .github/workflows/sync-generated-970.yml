name: Sync generated output for issue 970

on:
  push:
    branches:
      - work/unlinked-970-virtual-read-span

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/unlinked-970-virtual-read-span
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild canonical userscript outputs
        run: npm run userscript:build
      - name: Verify expected generated ownership
        shell: bash
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(userscript/hex\.user\.template\.js|userscript/release-version\.json|\.github/workflows/sync-generated-970\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --check
      - name: Commit canonical generated output and remove helper
        shell: bash
        run: |
          rm .github/workflows/sync-generated-970.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/sync-generated-970.yml
          git commit -m 'build: sync userscript for issue #970'
          git push origin HEAD:work/unlinked-970-virtual-read-span
