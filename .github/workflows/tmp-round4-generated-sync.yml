name: TEMP Round 4 generated sync

on:
  push:
    branches:
      - fix/round4-opaque-runtime-location

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[generated-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/round4-opaque-runtime-location
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - name: Commit canonical generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add userscript/hex.user.template.js userscript/release-version.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Sync Round 4 generated userscript [generated-sync]'
          git push origin HEAD:fix/round4-opaque-runtime-location
