name: Temporary Round 2 final build

on:
  push:
    branches:
      - hex/r2-single-tab-conversation-worker

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Regenerate userscript
        run: npm run userscript:build
      - name: Focused final validation
        run: |
          npm run dev-agent:test
          node tests/chatgpt-new-chat-routing.mjs
          node tests/chatgpt-web-runtime.mjs
          node tests/userscript-dev-worker-runtime.mjs
          npm run userscript:test
          git diff --check
      - name: Commit generated userscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/hex.user.template.js
          if git diff --cached --quiet; then
            echo "Generated userscript already current."
            exit 0
          fi
          git commit -m "Regenerate userscript for single-tab Dev runtime"
          git push origin HEAD:${GITHUB_REF_NAME}
