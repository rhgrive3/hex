name: Temporary reconcile remaining integration PRs

on:
  push:
    branches:
      - integrate/all-open-prs-20260819

permissions:
  contents: write

concurrency:
  group: tmp-reconcile-remaining-prs
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/all-open-prs-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge PR 987 ABI implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin fix/unlinked-abi-526-954-955-958-959
          before="$(git rev-parse HEAD)"
          set +e
          git merge --no-ff --no-commit origin/fix/unlinked-abi-526-954-955-958-959
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "PR987 conflicts:"
            printf '%s\n' "$conflicts"
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              case "$f" in
                .github/workflows/generated-sync.yml|userscript/hex.user.template.js|userscript/release-version.json)
                  git checkout --ours -- "$f"
                  git add "$f"
                  ;;
                *)
                  echo "Unexpected PR987 conflict: $f" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi
          # PR987 carried branch-local generated-output bootstrap plumbing. Keep
          # the canonical integration workflow and regenerate outputs later.
          git checkout "$before" -- .github/workflows/generated-sync.yml
          rm -f .github/workflows/tmp-pr987-userscript-build.yml
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m 'merge: absorb PR 987 ABI correctness fixes'

      - name: Merge PR 992 guarded-page BTI implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/issue-957-bti-guarded-page
          before="$(git rev-parse HEAD)"
          set +e
          git merge --no-ff --no-commit origin/fix/issue-957-bti-guarded-page
          rc=$?
          set -e
          if [[ $rc -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            echo "PR992 conflicts:"
            printf '%s\n' "$conflicts"
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              case "$f" in
                js/targets/architecture/arm64/effects/index.js)
                  git checkout --ours -- "$f"
                  git add "$f"
                  ;;
                *)
                  echo "Unexpected PR992 conflict: $f" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi
          # Keep the current integration index (which already has semantic v3 and
          # later ADR/ADRP normalization) and add only PR992's BTI decorator hook.
          git checkout "$before" -- js/targets/architecture/arm64/effects/index.js
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/targets/architecture/arm64/effects/index.js')
          s = p.read_text()
          imp = "import { decorateArm64BtiGuardedPageEffects } from './bti-guard-state.js';\n"
          if imp not in s:
              s = imp + s
          old = "    if (result != null) return result;"
          new = "    if (result != null) return decorateArm64BtiGuardedPageEffects(instruction, result, familyContext);"
          if old not in s:
              raise SystemExit('ARM64 MachineEffects return anchor changed')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m 'merge: absorb PR 992 guarded-page BTI semantics'

      - name: Repair W32 signed comparison domain on canonical integration head
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/ir.js')
          s = p.read_text()
          old = """  // Semantic-v2 compatibility can expose a 64-bit physical register view while
  // the machine comparison itself is width-exact W32. Prefer the canonical
  // projected comparison width, then exact effect/bundle metadata, before the
  // widened physical-state view.
  const semanticBits = Number(
    cmp.extra?.widthBits
      ?? cmp.extra?.attributes?.machineEffects?.operationMetadata?.widthBits
      ?? cmp.extra?.attributes?.machineEffects?.bundleMetadata?.widthBits
      ?? 0,
  );"""
          new = """  // Semantic-v2 compatibility can expose a 64-bit physical register view while
  // the machine comparison itself is width-exact W32. MachineEffects metadata
  // is the authoritative machine-width evidence; projected compatibility width
  // can be widened by a later physical-state view and is only a fallback.
  const semanticBits = Number(
    cmp.extra?.attributes?.machineEffects?.operationMetadata?.widthBits
      ?? cmp.extra?.attributes?.machineEffects?.bundleMetadata?.widthBits
      ?? cmp.extra?.widthBits
      ?? 0,
  );"""
          if old not in s:
              raise SystemExit('W32 compare-width anchor changed')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify focused regressions and full repository check
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node tests/issues-526-954-955-958-959.mjs
          node tests/machine-effects/issue-957-bti-guarded-page.test.mjs
          node tests/semantic-v2/issues-791-797-800-825-ir-soundness.test.mjs
          npm run userscript:build
          npm run check
          npm run userscript:build
          git diff --check

      - name: Publish reconciled integration head
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tmp-reconcile-remaining-prs.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: reconcile remaining correctness PRs on integration head'
          git push origin HEAD:integrate/all-open-prs-20260819
