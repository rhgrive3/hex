name: Temporary rebuild no-timeout runtime
on:
  push:
    branches: [hex/chatgpt-no-default-timeout]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/chatgpt-no-default-timeout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply no-default-timeout change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: anchor count {text.count(old)}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('js/ai/provider/chatgpt-web.js', "const DEFAULT_TIMEOUT_MS = 120000;", "const DEFAULT_WORKER_TIMEOUT_MS = 120000;")
          replace_once('js/ai/provider/chatgpt-web.js', "  constructor({ bridge = globalThis.__HEX_CHATGPT_BRIDGE__, timeoutMs = DEFAULT_TIMEOUT_MS } = {}) {\n    super({ capabilities: { provider: 'chatgpt-web' } });\n    this.bridge = bridge || null;\n    this.timeoutMs = timeoutMs;", "  constructor({ bridge = globalThis.__HEX_CHATGPT_BRIDGE__ } = {}) {\n    super({ capabilities: { provider: 'chatgpt-web' } });\n    this.bridge = bridge || null;")
          replace_once('js/ai/provider/chatgpt-web.js', "  turnTimeoutMs(mode) { return mode === 'agent' ? 600000 : 240000; }", "  turnTimeoutMs() { return null; }")
          replace_once('js/ai/provider/chatgpt-web.js', "    try {\n      const response = await this.bridge.request(buildChatGPTTurnPrompt(request), {\n        signal: controller.signal,\n        timeoutMs: boundedTimeout(options.timeoutMs, this.timeoutMs),", "    try {\n      const timeoutMs = explicitTimeout(options.timeoutMs);\n      const response = await this.bridge.request(buildChatGPTTurnPrompt(request), {\n        signal: controller.signal,\n        ...(timeoutMs == null ? {} : { timeoutMs }),")
          replace_once('js/ai/provider/chatgpt-web.js', "    timeoutMs = DEFAULT_TIMEOUT_MS,", "    timeoutMs = DEFAULT_WORKER_TIMEOUT_MS,")
          replace_once('js/ai/provider/chatgpt-web.js', "    this.chatgpt = new ChatGPTWebProvider({ bridge, timeoutMs });", "    this.chatgpt = new ChatGPTWebProvider({ bridge });")
          replace_once('js/ai/provider/chatgpt-web.js', "function boundedTimeout(requested, ceiling) {\n  const rawCeiling = Number(ceiling);\n  const cap = Number.isFinite(rawCeiling) && rawCeiling > 0 ? Math.floor(rawCeiling) : DEFAULT_TIMEOUT_MS;\n  const rawRequested = Number(requested);\n  if (!Number.isFinite(rawRequested) || rawRequested <= 0) return cap;\n  return Math.max(1, Math.min(cap, Math.floor(rawRequested)));\n}", "function explicitTimeout(value) {\n  const raw = Number(value);\n  return Number.isFinite(raw) && raw > 0 ? Math.floor(raw) : null;\n}")

          replace_once('js/ai/control/turn-executor.js', "    const budgetOverrides = { ...request.budget, ...options.budget };\n    if (budgetOverrides.timeoutMs == null) {\n      const providerDefault = Number(this.provider?.turnTimeoutMs?.(request.mode, request));\n      budgetOverrides.timeoutMs = Number.isFinite(providerDefault) && providerDefault > 0\n        ? Math.floor(providerDefault)\n        : (request.mode === 'agent' ? 120000 : 30000);\n    }\n    const budget = aiBudget(request.mode, budgetOverrides);", "    const budgetOverrides = { ...request.budget, ...options.budget };\n    const providerTimeout = this.provider?.turnTimeoutMs?.(request.mode, request);\n    const providerHasNoDefaultTimeout = providerTimeout == null;\n    if (budgetOverrides.timeoutMs == null && !providerHasNoDefaultTimeout) {\n      const providerDefault = Number(providerTimeout);\n      budgetOverrides.timeoutMs = Number.isFinite(providerDefault) && providerDefault > 0\n        ? Math.floor(providerDefault)\n        : (request.mode === 'agent' ? 120000 : 30000);\n    }\n    const budget = aiBudget(request.mode, budgetOverrides);\n    const turnTimeoutMs = providerHasNoDefaultTimeout && budgetOverrides.timeoutMs == null ? Infinity : budget.timeoutMs;")
          p = Path('js/ai/control/turn-executor.js')
          p.write_text(p.read_text().replace('budget.timeoutMs', 'turnTimeoutMs'))
          # The replacement above also rewrites the ternary fallback; correct it explicitly.
          p = Path('js/ai/control/turn-executor.js')
          text = p.read_text()
          text = text.replace('const turnTimeoutMs = providerHasNoDefaultTimeout && budgetOverrides.timeoutMs == null ? Infinity : turnTimeoutMs;', 'const turnTimeoutMs = providerHasNoDefaultTimeout && budgetOverrides.timeoutMs == null ? Infinity : budget.timeoutMs;')
          p.write_text(text)
          replace_once('js/ai/control/turn-executor.js', "    const deadline = setTimeout(() => turnController.abort('timeout'), turnTimeoutMs);", "    const deadline = Number.isFinite(turnTimeoutMs) ? setTimeout(() => turnController.abort('timeout'), turnTimeoutMs) : null;")
          replace_once('js/ai/control/turn-executor.js', "              }, { signal, timeoutMs: remainingTime(started, turnTimeoutMs) });", "              }, {\n                signal,\n                ...(Number.isFinite(turnTimeoutMs) ? { timeoutMs: remainingTime(started, turnTimeoutMs) } : {}),\n              });")
          replace_once('js/ai/control/turn-executor.js', "                const repairRemainingMs = remainingTime(started, turnTimeoutMs);\n                if (repairRemainingMs >= MIN_MODEL_REPAIR_REMAINING_MS) {\n                  repairs++;\n                  observations.push({ tool: 'protocol_guardrail', summary: `Previous model response rejected: ${normalized.message}`, evidenceIds: [] });\n                  addActivity({ type: 'model-repair', label: 'モデル出力の形式を1回だけ再確認', remainingMs: repairRemainingMs });", "                const repairRemainingMs = Number.isFinite(turnTimeoutMs) ? remainingTime(started, turnTimeoutMs) : null;\n                if (repairRemainingMs == null || repairRemainingMs >= MIN_MODEL_REPAIR_REMAINING_MS) {\n                  repairs++;\n                  observations.push({ tool: 'protocol_guardrail', summary: `Previous model response rejected: ${normalized.message}`, evidenceIds: [] });\n                  addActivity({ type: 'model-repair', label: 'モデル出力の形式を1回だけ再確認', ...(repairRemainingMs == null ? {} : { remainingMs: repairRemainingMs }) });")

          replace_once('js/userscript/chatgpt-bridge.js', "const DEFAULT_TIMEOUT_MS = 110000;\n\n", "")
          replace_once('js/userscript/chatgpt-bridge.js', "          timeoutMs: requestOptions.timeoutMs || options.timeoutMs || DEFAULT_TIMEOUT_MS,", "          timeoutMs: explicitTimeout(requestOptions.timeoutMs ?? options.timeoutMs) ?? Infinity,")
          p = Path('js/userscript/chatgpt-bridge.js')
          p.write_text(p.read_text() + "\nfunction explicitTimeout(value) {\n  const raw = Number(value);\n  return Number.isFinite(raw) && raw > 0 ? Math.floor(raw) : null;\n}\n")
          PY
      - run: npm ci
      - name: Build generated userscript
        run: npm run userscript:build
      - name: Commit only requested change
        run: |
          git checkout HEAD -- node_modules/.package-lock.json || true
          rm .github/workflows/tmp-chatgpt-no-timeout-rebase.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove default ChatGPT response timeout"
          git push origin HEAD:hex/chatgpt-no-default-timeout
