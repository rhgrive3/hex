name: Temporary Dev Supervisor continuity repair

on:
  push:
    branches:
      - hex/fix-dev-supervisor-conversation-continuity

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/fix-dev-supervisor-conversation-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Reproduce and verify Supervisor continuity
        run: node tests/dev-agent/supervisor-conversation-continuity.mjs
      - name: Build protected userscript runtime
        run: npm run userscript:build
      - name: Dev Agent regression
        run: npm run dev-agent:test
      - name: AI regression
        run: npm run ai:test
      - name: Userscript regression
        run: npm run userscript:test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit generated userscript and remove temporary workflow
        run: |
          rm .github/workflows/temp-dev-supervisor-continuity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/temp-dev-supervisor-continuity.yml
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate userscript for Supervisor continuity fix"
            git push origin HEAD:hex/fix-dev-supervisor-conversation-continuity
          fi
