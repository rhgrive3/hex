name: Cross-binary accuracy

on:
  push:
    branches:
      - accuracy-ywp-tsumtsum-20260814
  workflow_dispatch:

jobs:
  accuracy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core checks
        run: npm run check
      - name: Install oracle dependencies
        run: python -m pip install --disable-pip-version-check lief capstone
      - name: Verify inputs
        run: |
          file tests/battlecats tests/YWP tests/TsumTsum
          ls -lh tests/battlecats tests/YWP tests/TsumTsum
      - name: BattleCats oracle
        run: python tests/oracle.py tests/battlecats tests/oracle.battlecats.ci.json.gz
      - name: BattleCats accuracy
        run: node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/battlecats --oracle=tests/oracle.battlecats.ci.json.gz --json | tee accuracy-BattleCats.json
      - name: YWP oracle
        run: python tests/oracle.py tests/YWP tests/oracle.YWP.json.gz
      - name: YWP accuracy
        run: node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/YWP --oracle=tests/oracle.YWP.json.gz --json | tee accuracy-YWP.json
      - name: TsumTsum oracle
        run: python tests/oracle.py tests/TsumTsum tests/oracle.TsumTsum.json.gz
      - name: TsumTsum accuracy
        run: node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/TsumTsum --oracle=tests/oracle.TsumTsum.json.gz --json | tee accuracy-TsumTsum.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-results
          path: |
            accuracy-BattleCats.json
            accuracy-YWP.json
            accuracy-TsumTsum.json
          if-no-files-found: ignore
