name: Semantic IR verifier v2
on:
  push:
    branches:
      - fix/unlinked-ir-406-423-20260815
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git fetch origin main
      - run: git merge --no-edit origin/main
      - name: Make patch driver idempotent against newer main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/fix-unlinked-ir.py')
          s=p.read_text()
          old='''    if old not in s:\n        raise SystemExit(f"missing patch anchor {label} in {path}")\n    p.write_text(s.replace(old, new, 1))'''
          new='''    if old not in s:\n        print(f"skip already-changed anchor {label} in {path}")\n        return\n    p.write_text(s.replace(old,new,1))'''
          if old not in s:
              raise SystemExit('patch-driver rep() anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - run: python3 tools/fix-unlinked-ir.py
      - name: Enforce exact Memory-SSA version for RMW
        run: |
          python3 - <<'PY'
          from pathlib import Path
          guard="if (!store.memDef || !load.memUse || load.memUse !== store.memDef.prev) continue;"
          p=Path('js/ir-core.js'); s=p.read_text()
          if guard not in s:
              start=s.index('export function readModifyWrite')
              pos=s.index('    if (!load) continue;', start)
              insert=pos+len('    if (!load) continue;')
              s=s[:insert]+"\n    // A load is a current-value RMW source only when it observes the memory\n    // version immediately preceding this store. Same-location but stale loads\n    // must not survive an intervening write.\n    "+guard+s[insert:]
              p.write_text(s)

          p=Path('js/ir.js'); s=p.read_text()
          old="""      if (def.op === OP.LOAD) {
        if (mustAlias(def.loc, store.loc) && !unknownStoreBetween(ir, def, store)) load = def;
        continue;
      }"""
          new="""      if (def.op === OP.LOAD) {
        // Proven aliasing is not sufficient for an RMW: the load must also
        // observe the exact memory version immediately preceding this store.
        // Otherwise an intervening write makes the load stale (#407).
        const currentMemoryVersion = !!(store.memDef && def.memUse && def.memUse === store.memDef.prev);
        if (currentMemoryVersion && mustAlias(def.loc, store.loc) && !unknownStoreBetween(ir, def, store)) load = def;
        continue;
      }"""
          if 'const currentMemoryVersion = !!(store.memDef && def.memUse && def.memUse === store.memDef.prev);' not in s:
              if old not in s: raise SystemExit('public RMW anchor missing')
              p.write_text(s.replace(old,new,1))
          PY
      - name: Assert semantic fixes are present
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const checks = {
            'js/decompiler/semantic.js': ['const written = valueOf(rmw.store?.args?.[0]);'],
            'js/ir-core.js': ['...Array.from({ length: 8 }, (_, i) => `v${i}`)', 'const extShift = (x)', "kind: 'movk'", 'load.memUse !== store.memDef.prev'],
            'js/ir.js': ['const currentMemoryVersion = !!(store.memDef && def.memUse && def.memUse === store.memDef.prev);'],
            'js/decompiler/pipeline-core.js': ['function returnValueFor(', "d.extra?.toward === 'left'", "d.extra?.kind === 'bfxil'", "'fcmp_' + cond", 'shiftedExtend'],
            'js/decompiler/ast/nodes.js': ["floatConstant(value"],
            'js/decompiler/pretty/c.js': ["case 'float-const'"],
            'js/semantic-evidence.js': ['semanticProofVerified', 'runtimeComplete(runtimeResult)']
          };
          for (const [file, needles] of Object.entries(checks)) {
            const s=fs.readFileSync(file,'utf8');
            for (const n of needles) if (!s.includes(n)) throw new Error(`${file}: missing ${n}`);
          }
          NODE
      - run: node tests/issues-406-423-unlinked.mjs
      - run: npm run check
      - name: Commit verified implementation
        run: |
          rm -f tools/fix-unlinked-ir.py .github/workflows/fix-unlinked-ir-406-423.yml .github/workflows/verify-unlinked-ir-v2.yml
          git add -A
          git commit -m "fix: harden semantic IR and evidence correctness (#406-#419, #422-#423)"
          git push origin HEAD
