name: Temporary PR 711 userscript sync
on:
  push:
    branches: [hex/fix-dev-worker-supervisor-anchor-refresh]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/fix-dev-worker-supervisor-anchor-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - run: npm run userscript:test
      - name: Commit canonical generated userscript and remove temporary workflow
        run: |
          rm .github/workflows/temp-pr711-userscript-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/temp-pr711-userscript-sync.yml
          git commit -m "Sync userscript release for Supervisor anchor refresh"
          git push origin HEAD:hex/fix-dev-worker-supervisor-anchor-refresh
