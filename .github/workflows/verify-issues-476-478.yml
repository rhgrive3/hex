name: Verify note persistence issues 476-478

on:
  push:
    branches:
      - fix/latest-478-476-notes

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-478-476-notes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply persistence fixes
        run: python3 tools/apply-issues-476-478.py
      - name: Focused regressions
        run: node tests/issues-476-478-notes.mjs
      - name: Platform regressions
        run: npm run platform:test
      - name: Parse touched modules
        run: |
          node --check js/names.js
          node --check js/platform/hash.js
          node --check js/app.js
          node --check js/types-legacy.js
          node --check js/tools.js
      - name: Existing static checks
        run: npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/names.js js/platform/hash.js js/app.js js/types-legacy.js js/tools.js package.json
          git commit -m "fix: harden note identity and persistence (#476 #477 #478)"
          git push origin HEAD:fix/latest-478-476-notes
