name: One-shot analysis view abort propagation

on:
  push:
    branches:
      - fix/analysis-cancellation-settlement

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analysis-cancellation-settlement
          fetch-depth: 0
      - name: Apply exact abort propagation patch and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              src = p.read_text()
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, got {count}')
              p.write_text(src.replace(old, new))

          replace_once(
              'js/panels.js',
              "    const box = progressBox(later, pick('中身を調べています…', 'Looking inside…'));\n"
              "    let cancelled = false;\n"
              "    sheet.onClose = () => { cancelled = true; app.backend.cancelSearch(); app.backend.onScanProgress = null; };",
              "    const box = progressBox(later, pick('中身を調べています…', 'Looking inside…'));\n"
              "    let cancelled = false;\n"
              "    const controller = new AbortController();\n"
              "    sheet.onClose = () => {\n"
              "      cancelled = true;\n"
              "      if (!controller.signal.aborted) controller.abort('auto-analysis-view-closed');\n"
              "      app.backend.cancelSearch();\n"
              "      app.backend.onScanProgress = null;\n"
              "    };",
              'overview abort controller',
          )

          replace_once(
              'js/panels.js',
              "        shapes, recognition,\n"
              "        analyze: makeAnalyzer(app, region),",
              "        shapes, recognition,\n"
              "        signal: controller.signal,\n"
              "        analyze: makeAnalyzer(app, region),",
              'overview signal forwarding',
          )

          replace_once(
              'js/panels.js',
              "export function showCandidates(app, goal) {\n"
              "  if (!goal) return;\n"
              "  app.lastGoal = goal;\n"
              "  const sheet = new Sheet(goalLabel(goal), {\n"
              "    onClose: () => { app.backend.cancelSearch(); app.backend.onScanProgress = null; },\n"
              "  });",
              "export function showCandidates(app, goal) {\n"
              "  if (!goal) return;\n"
              "  app.lastGoal = goal;\n"
              "  const controller = new AbortController();\n"
              "  const sheet = new Sheet(goalLabel(goal), {\n"
              "    onClose: () => {\n"
              "      if (!controller.signal.aborted) controller.abort('candidate-analysis-view-closed');\n"
              "      app.backend.cancelSearch();\n"
              "      app.backend.onScanProgress = null;\n"
              "    },\n"
              "  });",
              'candidate abort controller',
          )

          replace_once(
              'js/panels.js',
              "    const pin = await pinnedFor(app, goal, {\n"
              "      strings, program, shapes, region, box, ranked: ranked.candidates,\n"
              "    });",
              "    const pin = await pinnedFor(app, goal, {\n"
              "      strings, program, shapes, region, box, ranked: ranked.candidates,\n"
              "      signal: controller.signal,\n"
              "    });",
              'candidate signal forwarding',
          )

          replace_once(
              'js/panels.js',
              "    region,\n"
              "    map: report ? report.map : null,\n"
              "    // 形から立てた候補を開いて確かめるとき、参照している文言もそこで読む",
              "    region,\n"
              "    map: report ? report.map : null,\n"
              "    signal: ctx.signal || null,\n"
              "    // 形から立てた候補を開いて確かめるとき、参照している文言もそこで読む",
              'pinnedFor signal forwarding',
          )

          replace_once(
              'js/auto.js',
              "  const progress = o.onProgress || (() => {});\n"
              "  const cancelled = o.isCancelled || (() => false);\n"
              "  const deepLimit = o.deepLimit != null ? o.deepLimit : 12;",
              "  const progress = o.onProgress || (() => {});\n"
              "  const cancelled = () => !!o.signal?.aborted || !!o.isCancelled?.();\n"
              "  const deepLimit = o.deepLimit != null ? o.deepLimit : 12;",
              'auto cancellation predicate',
          )

          replace_once(
              'js/auto.js',
              "        shapes: o.shapes || null, analyze: memo, scanAccess: o.scanAccess || null,\n"
              "        isCancelled: cancelled, limit: 12,",
              "        shapes: o.shapes || null, analyze: memo, scanAccess: o.scanAccess || null,\n"
              "        signal: o.signal || null, isCancelled: cancelled, limit: 12,",
              'auto pinpoint signal forwarding',
          )

          replace_once(
              'js/auto.js',
              "        model = await (memo || o.analyze)(t.addr, range ? range.end : null);",
              "        model = await (memo || o.analyze)(t.addr, range ? range.end : null, { signal: o.signal || null });",
              'auto deep signal forwarding',
          )

          replace_once(
              'js/pinpoint.js',
              "    let timer = null;\n"
              "    let operation = null;\n"
              "    const timeout = new Promise((_, reject) => {\n"
              "      timer = setTimeout(() => {\n"
              "        if (!controller.signal.aborted) controller.abort('pinpoint-analysis-timeout');\n"
              "        try { operation?.cancel?.(); } catch { /* timeout remains authoritative */ }\n"
              "        reject(timeoutError(ms));\n"
              "      }, ms);\n"
              "    });\n"
              "    try {\n"
              "      operation = analyze(...analyzeArgsWithSignal(args, controller.signal));\n"
              "      return await Promise.race([Promise.resolve(operation), timeout]);\n"
              "    } catch (error) {",
              "    let timer = null;\n"
              "    let operation = null;\n"
              "    const cancelOperation = () => {\n"
              "      try { operation?.cancel?.(); } catch { /* abort remains authoritative */ }\n"
              "    };\n"
              "    controller.signal.addEventListener('abort', cancelOperation, { once: true });\n"
              "    const timeout = new Promise((_, reject) => {\n"
              "      timer = setTimeout(() => {\n"
              "        if (!controller.signal.aborted) controller.abort('pinpoint-analysis-timeout');\n"
              "        else cancelOperation();\n"
              "        reject(timeoutError(ms));\n"
              "      }, ms);\n"
              "    });\n"
              "    try {\n"
              "      operation = analyze(...analyzeArgsWithSignal(args, controller.signal));\n"
              "      if (controller.signal.aborted) cancelOperation();\n"
              "      return await Promise.race([Promise.resolve(operation), timeout]);\n"
              "    } catch (error) {",
              'analysis parent abort cancellation',
          )

          replace_once(
              'js/pinpoint.js',
              "      if (timer != null) clearTimeout(timer);\n"
              "      unlinkParent();\n"
              "    }\n"
              "  };\n"
              "}",
              "      if (timer != null) clearTimeout(timer);\n"
              "      controller.signal.removeEventListener('abort', cancelOperation);\n"
              "      unlinkParent();\n"
              "    }\n"
              "  };\n"
              "}",
              'analysis abort listener cleanup',
          )

          replace_once(
              'js/pinpoint.js',
              "      let timer = null;\n"
              "      let operation = null;\n"
              "      const timeout = new Promise((_, reject) => {\n"
              "        timer = setTimeout(() => {\n"
              "          if (!controller.signal.aborted) controller.abort('pinpoint-access-timeout');\n"
              "          try { operation?.cancel?.(); } catch { /* timeout remains authoritative */ }\n"
              "          reject(accessTimeoutError(ms));\n"
              "        }, ms);\n"
              "      });\n"
              "      try {\n"
              "        operation = scanAccess(all, { signal: controller.signal });\n"
              "      } catch (error) {",
              "      let timer = null;\n"
              "      let operation = null;\n"
              "      const cancelOperation = () => {\n"
              "        try { operation?.cancel?.(); } catch { /* abort remains authoritative */ }\n"
              "      };\n"
              "      controller.signal.addEventListener('abort', cancelOperation, { once: true });\n"
              "      const timeout = new Promise((_, reject) => {\n"
              "        timer = setTimeout(() => {\n"
              "          if (!controller.signal.aborted) controller.abort('pinpoint-access-timeout');\n"
              "          else cancelOperation();\n"
              "          reject(accessTimeoutError(ms));\n"
              "        }, ms);\n"
              "      });\n"
              "      try {\n"
              "        operation = scanAccess(all, { signal: controller.signal });\n"
              "        if (controller.signal.aborted) cancelOperation();\n"
              "      } catch (error) {",
              'access parent abort cancellation',
          )

          replace_once(
              'js/pinpoint.js',
              "        .finally(() => {\n"
              "          if (timer != null) clearTimeout(timer);\n"
              "          unlinkParent();\n"
              "          state.promise = null;\n"
              "        });",
              "        .finally(() => {\n"
              "          if (timer != null) clearTimeout(timer);\n"
              "          controller.signal.removeEventListener('abort', cancelOperation);\n"
              "          unlinkParent();\n"
              "          state.promise = null;\n"
              "        });",
              'access abort listener cleanup',
          )

          Path('.github/workflows/one-shot-analysis-view-abort.yml').unlink()
      - name: Commit exact source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/panels.js js/auto.js js/pinpoint.js .github/workflows/one-shot-analysis-view-abort.yml
          git diff --cached --check
          git diff --cached --exit-code && exit 1 || true
          git commit -m "fix(auto): abort analysis work when result views close"
          git push origin HEAD:fix/analysis-cancellation-settlement
