name: Temporary reapply P4 ARM64 memory consumers
on:
  pull_request:
    branches:
      - fix/arm64-memory-decoder-814-816
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'hex/p4-5-arm64-memory-consumers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p4-5-arm64-memory-consumers
          fetch-depth: 0
      - name: Reapply validated worker consumers, fix xref ordering, and self-remove
        shell: bash
        run: |
          git checkout 53ec6a7994deec6505800e6d8ec8442a5ffd4d3f -- js/worker-legacy.js
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/worker-legacy.js')
          s = p.read_text()
          old = '''      const pair = pairedOffset(w);
      const base = pair ? provenance.base(pair.rn, index) : null;
      if (pair && base != null) {
        const full = base + pair.imm;
        if (full === want) {
          out.push({
            row: byteOff / 4, addr: pc,
            kind: pair.load ? 'load' : pair.store ? 'store' : 'address',
          });
          if (out.length >= cap) break;
        }
        if (!pair.load && !pair.store) provenance.note(pair.rd, full, index);
        else if (pair.load && pair.gpDest !== false) provenance.kill(pair.rd);
        continue;
      }
      const memWrite = Words.memoryAccess(w);
      if (memWrite) {
        const knownBase = !memWrite.indexed && memWrite.disp != null ? provenance.base(memWrite.base, index) : null;
        if (knownBase != null) {
          const full = memWrite.mode === 'post' ? knownBase : knownBase + memWrite.disp;
          if (full === want) {
            out.push({ row: byteOff / 4, addr: pc, kind: memWrite.rmw ? 'rmw' : memWrite.load ? 'load' : 'store' });
            if (out.length >= cap) break;
          }
        }
        if (memWrite.load && !memWrite.vector) {
          provenance.kill(memWrite.reg);
          if (memWrite.pair && memWrite.reg2 != null) provenance.kill(memWrite.reg2);
        }
        if (memWrite.statusReg != null) provenance.kill(memWrite.statusReg);
        if (memWrite.mode === 'pre' || memWrite.mode === 'post') provenance.kill(memWrite.base);
        continue;
      }'''
          new = '''      // Canonical memory semantics must run before the legacy pairedOffset
      // helper. pairedOffset historically scales LDPSW like an X pair, so letting
      // it consume memory instructions here recreates the exact #814 false xref.
      const memWrite = Words.memoryAccess(w);
      if (memWrite) {
        const knownBase = !memWrite.indexed && memWrite.disp != null ? provenance.base(memWrite.base, index) : null;
        if (knownBase != null) {
          const full = memWrite.mode === 'post' ? knownBase : knownBase + memWrite.disp;
          if (full === want) {
            out.push({ row: byteOff / 4, addr: pc, kind: memWrite.rmw ? 'rmw' : memWrite.load ? 'load' : 'store' });
            if (out.length >= cap) break;
          }
        }
        if (memWrite.load && !memWrite.vector) {
          provenance.kill(memWrite.reg);
          if (memWrite.pair && memWrite.reg2 != null) provenance.kill(memWrite.reg2);
        }
        if (memWrite.statusReg != null) provenance.kill(memWrite.statusReg);
        if (memWrite.mode === 'pre' || memWrite.mode === 'post') provenance.kill(memWrite.base);
        continue;
      }
      const pair = pairedOffset(w);
      const base = pair ? provenance.base(pair.rn, index) : null;
      if (pair && base != null) {
        const full = base + pair.imm;
        if (full === want) {
          out.push({ row: byteOff / 4, addr: pc, kind: 'address' });
          if (out.length >= cap) break;
        }
        provenance.note(pair.rd, full, index);
        continue;
      }'''
          assert s.count(old) == 1, f'findXrefs block drifted: {s.count(old)}'
          p.write_text(s.replace(old, new))
          PY

          cat > tests/phase4/migration/arm64-memory-consumers.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { NodeBackend } from '../../harness.mjs';

          function fileFromWords(name, words) {
            const raw = new Uint8Array(words.length * 4);
            const dv = new DataView(raw.buffer);
            for (let i = 0; i < words.length; i++) dv.setUint32(i * 4, words[i] >>> 0, true);
            return {
              name, size: raw.length,
              slice(start, end) {
                const part = raw.subarray(start, end);
                return { arrayBuffer: async () => part.buffer.slice(part.byteOffset, part.byteOffset + part.byteLength) };
              },
            };
          }

          // #814: canonical LDPSW displacement/width must survive every worker consumer.
          {
            const b = new NodeBackend();
            const opened = await b.open(fileFromWords('ldpsw-worker.bin', [0x10000002, 0x69408440]));
            const id = opened.raw.id;
            const scan = await b.scanProgram(id);
            assert.equal(scan.kinds[1], globalThis.Words.KIND.LOAD);
            const ref = Array.from({ length: scan.refCount }, (_, i) => ({ from: scan.refFrom[i], to: scan.refTo[i], kind: scan.refKind[i] }))
              .find((x) => x.from === 4n);
            assert.deepEqual(ref, { from: 4n, to: 4n, kind: 1 });
            const fields = await b.fieldAccess({ regionId: id, offset: 4n, size: 8, limit: 8 });
            assert.equal(fields.results.length, 1);
            assert.equal(fields.results[0].size, 8);
            assert.equal(fields.results[0].kind, 'load');
            const xrefs = await b.xrefs({ regionId: id, target: 4n, limit: 8 });
            assert.ok(xrefs.results.some((x) => x.addr === 4n && x.kind === 'load'));
          }

          // #815: pair exclusives keep total width and stay out of scalar value-shape inference.
          {
            const b = new NodeBackend();
            const opened = await b.open(fileFromWords('exclusive-pair-worker.bin', [0xc87f0440, 0xc8230440]));
            const id = opened.raw.id;
            const scan = await b.scanProgram(id);
            assert.deepEqual(Array.from(scan.kinds.slice(0, 2)), [globalThis.Words.KIND.ATOMIC, globalThis.Words.KIND.ATOMIC]);
            const fields = await b.fieldAccess({ regionId: id, offset: 0n, size: 16, limit: 8 });
            assert.deepEqual(fields.results.map((x) => x.kind), ['load', 'store']);
            assert.ok(fields.results.every((x) => x.size === 16 && x.atomic === true));
            const shapes = await b.valueShapes(id);
            assert.equal(shapes.count, 0);
          }

          // #816: atomic RMW remains both a read and a write and is neutral in valueShapes.
          {
            const b = new NodeBackend();
            const opened = await b.open(fileFromWords('lse-rmw-worker.bin', [0xc8a07c41, 0xf8200041]));
            const id = opened.raw.id;
            const scan = await b.scanProgram(id);
            assert.deepEqual(Array.from(scan.kinds.slice(0, 2)), [globalThis.Words.KIND.ATOMIC, globalThis.Words.KIND.ATOMIC]);
            const fields = await b.fieldAccess({ regionId: id, offset: 0n, size: 8, limit: 8 });
            assert.deepEqual(fields.results.map((x) => x.kind), ['load', 'store', 'load', 'store']);
            assert.ok(fields.results.every((x) => x.atomic === true && x.rmw === true));
            const shapes = await b.valueShapes(id);
            assert.equal(shapes.count, 2);
            assert.ok(Array.from(shapes.flags).every((f) => (f & 32) !== 0));
          }

          console.log('phase4 ARM64 memory consumer regressions: ok');
          EOF

          node tests/words.mjs
          node tests/phase4/migration/arm64-memory-consumers.test.mjs
          node tests/phase4/run.mjs

          git rm .github/workflows/_tmp-reapply-p4-worker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/worker-legacy.js tests/phase4/migration/arm64-memory-consumers.test.mjs
          git commit -m "fix: preserve ARM64 pair and RMW facts in worker consumers"
          git push origin HEAD:hex/p4-5-arm64-memory-consumers
