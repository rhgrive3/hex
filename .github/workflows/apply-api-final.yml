name: Apply standard API classifications

on:
  push:
    branches:
      - accuracy-ywp-tsumtsum-20260814
    paths:
      - .github/workflows/apply-api-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accuracy-ywp-tsumtsum-20260814
          fetch-depth: 0
      - name: Add standard runtime API knowledge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/blocks.js')
          s = p.read_text()

          old = 'storeEnumTagMultiPayload|getEnumCaseMultiPayload|arrayInitWithCopy|bridgeObjectRetain|bridgeObjectRelease)'
          new = 'storeEnumTagMultiPayload|getEnumCaseMultiPayload|arrayInitWithCopy|arrayDestroy|initStaticObject|setDeallocating|unexpectedError|bridgeObjectRetain|bridgeObjectRelease)'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = "  { id: 'concurrency', re: /^_?(pthread_|dispatch_(async|sync|once|after|semaphore)|NSOperation|NSThread)/i,"
          new = "  { id: 'concurrency', re: /^_?(pthread_|dispatch_(async|sync|once|after|semaphore|get_global_queue|get_main_queue)|NSOperation|NSThread)/i,"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          marker = "  { id: 'ui', re: /UIAlert|UIView|UIViewController|presentViewController|UILabel|UIButton|NSAlert|SwiftUI/i,\n    cat: 'ui', args: null, ret: 'object', effect: 'ui' },"
          insert = "  { id: 'geometry', re: /^_?CGRectGet(Width|Height|MinX|MinY|MaxX|MaxY|MidX|MidY)$/i,\n    cat: 'ui', args: ['rect'], ret: 'number', effect: 'read' },\n" + marker
          assert s.count(marker) == 1
          s = s.replace(marker, insert, 1)

          marker = "  { id: 'errorobj', re: /NSError|NSException|error(WithDomain|Description)/i, cat: 'error',\n    args: null, ret: 'object', effect: 'error' },"
          insert = "  { id: 'errno', re: /^_+error$/i, cat: 'runtime', args: null, ret: 'ptr', effect: 'read' },\n" + marker
          assert s.count(marker) == 1
          s = s.replace(marker, insert, 1)

          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add js/blocks.js
          git commit -m 'fix: classify remaining standard Apple and Swift runtime APIs [api-final]'
          git push origin HEAD:accuracy-ywp-tsumtsum-20260814
