name: P3 final TsumTsum hotspots
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-final-hotspots.yml']
permissions:
  contents: read
  actions: read
env:
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        chunk: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch fixture and oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/fetch-real-fixtures.mjs TsumTsum
          gh run download 31988122265 -n cross-binary-oracle-TsumTsum -D tests
      - name: Apply final candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/decompile-legacy.js'); s=p.read_text(); a="  if (base === 'mvn' && dst) {\n"; i="  if (base === 'rbit' && dst && insn.ops[1]) {\n    return mk(varOf(dst, ctx) + ' = reverse_bits(' + operandText(insn.ops[1], ctx, insn) + ');', { dst, pure: true });\n  }\n  if (base === 'clz' && dst && insn.ops[1]) {\n    return mk(varOf(dst, ctx) + ' = count_leading_zeros(' + operandText(insn.ops[1], ctx, insn) + ');', { dst, pure: true });\n  }\n"; assert a in s; p.write_text(s.replace(a,i+a,1))
          p=Path('js/core/identity/origin.js'); s=p.read_text(); s=s.replace("export const ORIGIN_SCHEMA_VERSION = 1;\n", "export const ORIGIN_SCHEMA_VERSION = 1;\nconst CANONICAL_ORIGIN_SETS = new WeakSet();\n",1); old="function uniqueSorted(values) {\n  return Array.from(new Map(values.map((value) => [stableStringify(value), value])).values())\n    .sort((a, b) => stableStringify(a).localeCompare(stableStringify(b)));\n}"; new="function uniqueSorted(values) {\n  const byKey = new Map(values.map((value) => [stableStringify(value), value]));\n  return [...byKey.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([, value]) => value);\n}"; assert old in s; s=s.replace(old,new,1); old="export function createOriginSet(input = {}) {\n  if (input == null) input = {};"; new="export function createOriginSet(input = {}) {\n  if (input && typeof input === 'object' && CANONICAL_ORIGIN_SETS.has(input)) return input;\n  if (input == null) input = {};"; assert old in s; s=s.replace(old,new,1); old="  return deepFreeze(out);\n}\n\nexport function mergeOriginSets"; new="  const frozen = deepFreeze(out);\n  CANONICAL_ORIGIN_SETS.add(frozen);\n  return frozen;\n}\n\nexport function mergeOriginSets"; assert old in s; p.write_text(s.replace(old,new,1))
          p=Path('js/semantics/ssa/build.js'); s=p.read_text(); start=s.index('function resolvePhiOrigins('); end=s.index('\nfunction finalizePhi(',start); lines=["function resolvePhiOrigins(phiDefinitions, definitionByValue, irBlocks, tick) {","  const sorted = phiDefinitions.slice().sort((a, b) => a.valueId.localeCompare(b.valueId));","  const phiIds = new Set(sorted.map((phi) => phi.valueId));","  const origins = []; const originByKey = new Map(); const roots = new Map();","  const dependents = new Map(sorted.map((phi) => [phi.valueId, new Set()]));","  const addOrigin = (key, origin) => { if (originByKey.has(key)) return originByKey.get(key); const index = origins.length; origins.push(origin); originByKey.set(key, index); return index; };","  for (const phi of sorted) {","    tick(); const set = new Set([addOrigin('base:' + phi.valueId, safeOrigin(irBlocks.get(phi.blockId)?.origin, createOriginSet({ parentEntityIds: [phi.blockId] })))]);","    const incoming = phi.incoming.slice().sort((a, b) => a.predecessorBlockId.localeCompare(b.predecessorBlockId) || a.valueId.localeCompare(b.valueId));","    for (const item of incoming) { tick(); const definition = definitionByValue.get(item.valueId); if (!definition) fail('semantic-ssa-dangling-phi-value-id');","      if (definition.kind === 'phi') { if (!phiIds.has(definition.valueId)) fail('semantic-ssa-dangling-phi-value-id'); dependents.get(definition.valueId).add(phi.valueId); } else set.add(addOrigin('definition:' + definition.valueId, definition.origin)); }","    roots.set(phi.valueId, set);","  }","  const queue = sorted.map((phi) => phi.valueId); const queued = new Set(queue);","  for (let cursor = 0; cursor < queue.length; cursor++) { tick(); const sourceId = queue[cursor]; queued.delete(sourceId); const source = roots.get(sourceId);","    for (const targetId of [...dependents.get(sourceId)].sort()) { tick(); const target = roots.get(targetId); const before = target.size; for (const index of source) target.add(index); if (target.size !== before && !queued.has(targetId)) { queue.push(targetId); queued.add(targetId); } }","  }","  const resolved = new Map();","  for (const phi of sorted) { tick(); resolved.set(phi.valueId, safeOrigin(...[...roots.get(phi.valueId)].sort((a, b) => a - b).map((index) => origins[index]))); }","  return resolved;","}"]; p.write_text(s[:start]+'\n'.join(lines)+s[end:])
          PY
      - name: Profile assigned functions
        env:
          P3_CHUNK: ${{ matrix.chunk }}
        run: |
          cat > tests/.p3-hotspots.mjs <<'EOF'
          import fs from 'node:fs'; import zlib from 'node:zlib';
          import { openBinary } from './harness.mjs'; import { decompile } from '../js/decompile.js';
          const o=JSON.parse(zlib.gunzipSync(fs.readFileSync('tests/oracle.TsumTsum.ci.json.gz'))); const starts=o.functionStarts; const c=[];
          for(let i=0;i<starts.length-1;i++){const n=starts[i+1]-starts[i];if(n>=64&&n<=2048)c.push([starts[i],starts[i+1]]);}
          const samples=[]; for(let i=0;i<120;i++) samples.push(c[Math.floor(i*(c.length-1)/119)]);
          const w=await openBinary('tests/.real-fixtures/TsumTsum'); const chunk=Number(process.env.P3_CHUNK); let sum=0,max=0;
          for(let i=0;i<samples.length;i++){if(i%8!==chunk)continue; const [aa,ee]=samples[i],a=BigInt(aa),e=BigInt(ee); const m=await w.analyze(a,e); const t=Date.now(); const r=decompile(m,{addr:a,rowOfAddress:x=>x==null?null:Number((x-w.region.vmAddr)/4n),addrOfRow:n=>w.region.vmAddr+BigInt(n)*4n,symbolFor:x=>w.symbols.nameAt(x)}); const ms=Date.now()-t; sum+=ms; max=Math.max(max,ms); console.error(`[HOT chunk=${chunk} i=${i}] 0x${a.toString(16)}-0x${e.toString(16)} ms=${ms} lines=${r?.lines?.length??-1} fallback=${r?.legacyFallback||false}`); }
          console.error(`[HOT-SUM chunk=${chunk}] ms=${sum} max=${max}`);
          EOF
          node --max-old-space-size=6000 tests/.p3-hotspots.mjs
