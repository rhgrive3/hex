name: Reconcile issues 915 919 920 921 on current main
on:
  push:
    branches: [fix/issues-915-921-current-main]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-915-921-current-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore non-overlapping reviewed source/test delta from PR927
        shell: bash
        run: |
          git fetch origin 81be41fd9d8c36d7b1ffb2ddb32b045aa0ef3b8f
          for path in \
            js/decompiler/pipeline-core.js \
            js/semantics/compat/semantic-ir-v2-to-v1.js \
            js/targets/abi/sysv-amd64.js \
            tests/phase5/regressions/issues-915-921.test.mjs; do
            git show FETCH_HEAD:$path > $path
          done
      - name: Compose ABI implicit-input projection onto current semantic-function
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('js/analysis/semantic-function.js')
          text = p.read_text()
          old = """      const classified = abiPlugin.classifyArguments(instruction, options);\n      const returned = abiPlugin.classifyCallReturn(instruction, options) ?? null;\n      return {\n        arguments:classified.arguments ?? null,\n        stackArguments:classified.stackArguments ?? null,\n"""
          new = """      const classified = abiPlugin.classifyArguments(instruction, options);\n      const returned = abiPlugin.classifyCallReturn(instruction, options) ?? null;\n      const explicitArguments = Array.isArray(classified.arguments) ? classified.arguments : null;\n      const implicitInputs = Array.isArray(classified.implicitInputs)\n        ? classified.implicitInputs.map((input, index) => Object.freeze({\n          ...input,\n          index:`implicit:${index}`,\n          location:input.location ?? 'register',\n          abiClass:input.abiClass ?? 'abi-implicit-input',\n          implicit:true,\n          variadicVectorRegisterCount:classified.variadicVectorRegisterCount ?? null,\n          countKnown:Number.isSafeInteger(classified.variadicVectorRegisterCount),\n        }))\n        : [];\n      return {\n        // `arguments` is the compatibility projection's physical call-input set,\n        // not the source-language formal parameter list. Keep implicit ABI inputs\n        // in that set so generic SSA/def-use can retain their producers.\n        arguments:explicitArguments == null ? (implicitInputs.length ? implicitInputs : null) : [...explicitArguments, ...implicitInputs],\n        explicitArguments,\n        implicitInputs,\n        variadicVectorRegisterCount:classified.variadicVectorRegisterCount ?? null,\n        partial:classified.partial === true,\n        completeness:classified.partial === true ? 'partial' : 'complete',\n        stackArguments:classified.stackArguments ?? null,\n"""
          if text.count(old) != 1:
              raise SystemExit(f'semantic-function composition anchor count={text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - name: Focused semantic correctness regression
        run: node tests/phase5/regressions/issues-915-921.test.mjs
      - name: Main regression suite
        run: npm test
      - name: Build canonical userscript outputs from current merge tree
        run: npm run userscript:build
      - name: Publish reconciled candidate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/reconcile-issues-915-921-current-main.yml
          git add js/analysis/semantic-function.js js/decompiler/pipeline-core.js js/semantics/compat/semantic-ir-v2-to-v1.js js/targets/abi/sysv-amd64.js tests/phase5/regressions/issues-915-921.test.mjs userscript/hex.user.template.js userscript/release-version.json
          git diff --cached --check
          git commit -m 'fix: preserve SysV ABI and signed stack semantics (#915 #919 #920 #921)'
          git push origin HEAD:fix/issues-915-921-current-main
