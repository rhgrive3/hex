name: Repair issues 890-895

on:
  push:
    branches:
      - fix/issues-890-895-control-profile-20260819
    paths:
      - .github/workflows/repair-issues-890-895.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-890-895-control-profile-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact guarded repair
        run: python3 tools/repair-issues-890-895.py
      - name: Focused regressions
        run: node --test tests/phase6/generic-core/issues-890-895.test.mjs
      - name: Repository verification
        run: npm run check
      - name: Canonical userscript idempotence
        run: |
          npm run userscript:build
          cp userscript/hex.user.js /tmp/hex.user.js
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          npm run userscript:build
          cmp userscript/hex.user.js /tmp/hex.user.js
          cmp userscript/hex.user.template.js /tmp/hex.user.template.js
      - name: Commit verified source result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js tests/phase6/generic-core/issues-890-895.test.mjs userscript/hex.user.js userscript/hex.user.template.js
          git diff --cached --check
          git commit -m 'fix: close control and profile correctness issues 890-895'
          git push origin HEAD:fix/issues-890-895-control-profile-20260819
