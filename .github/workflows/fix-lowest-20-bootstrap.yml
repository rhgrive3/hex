name: fix-lowest-20-bootstrap
on:
  push:
    branches: [fix-lowest-20-issues-20260815]
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-lowest-20-issues-20260815
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Adapt patch anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/fix-lowest-20.py')
          s=p.read_text()
          start=s.index("# #407 — RMW proof")
          end=s.index("write(p, s)", start)+len("write(p, s)")
          replacement='''# #407 — RMW proof must use the exact Memory-SSA version read by the load.\np = 'js/ir-core.js'; s = read(p)\ns = replace_once(s, """    if (!load) continue;\n    out.push({""", """    if (!load) continue;\n    if (store.memDef && load.memUse !== store.memDef.prev) continue;\n    out.push({""", '#407 memory version')\nwrite(p, s)'''
          s=s[:start]+replacement+s[end:]
          old='''s=replace_once(s, """  if (sub === 'sub') {""", insert + """  if (sub === 'sub') {""", '#419 fp expression')'''
          new='''s=replace_once(s, """  if (!FLAG_SUBS.has(sub) || !CONDITIONS.has(cond) || !left || !right) return null;\n\n  if (sub === 'sub') {""", """  if (!FLAG_SUBS.has(sub) || !CONDITIONS.has(cond) || !left || !right) return null;\n\n""" + insert + """  if (sub === 'sub') {""", '#419 fp expression')'''
          if old not in s: raise SystemExit('workflow adapter: #419 script anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply fixes
        shell: bash
        run: |
          set +e
          python3 .github/scripts/fix-lowest-20.py > patch.log 2>&1
          code=$?
          cat patch.log
          if [ "$code" -ne 0 ]; then
            message=$(tail -n 1 patch.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Patch failure::$message"
            exit "$code"
          fi
      - name: Complete fixes
        run: python3 .github/scripts/complete-lowest-20.py
      - name: Syntax check
        run: |
          node --check js/ir-core.js
          node --check js/decompiler/pipeline-core.js
          node --check js/decompiler/semantic.js
          node --check js/decompiler/flag-semantics.js
          node --check js/decompiler/type-recovery.js
          node --check js/semantic-evidence.js
      - name: Batch regression
        shell: bash
        run: |
          set +e
          node tests/issues-lowest-20-20260815.mjs > batch.log 2>&1
          code=$?
          cat batch.log
          if [ "$code" -ne 0 ]; then
            message=$(head -c 2200 batch.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Batch regression::$message"
            exit "$code"
          fi
      - name: Semantic suite
        run: npm run semantic:test
      - name: Decompiler suite
        run: npm run decompiler:test
      - name: Full tests
        run: npm test
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/fix-lowest-20-bootstrap.yml .github/scripts/fix-lowest-20.py .github/scripts/complete-lowest-20.py .github/retrigger-lowest-20 patch.log batch.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve lowest open issue batch'
          git push origin HEAD:fix-lowest-20-issues-20260815
