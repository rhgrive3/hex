name: Verify issue 458
on:
  push:
    branches:
      - fix/issue-458-ghidra-trigger
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure and sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - run: node tests/issue-458-ghidra-trigger.mjs
      - run: npm run check
      - name: Remove verifier and commit sync
        run: |
          rm -f .github/workflows/verify-issue-458.yml
          git add -A
          git commit -m "chore: sync #458 with latest main after verification" || exit 0
          git push origin HEAD
