name: Temp sync merge-stable userscript
on:
  push:
    branches: [fix-userscript-merge-version-drift]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-userscript-merge-version-drift
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - run: node tests/userscript-version.mjs
      - name: Commit generated bundles only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userscript/hex.user.template.js userscript/platform-worker.bundle.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync merge-stable userscript bundle'
          git push origin HEAD:fix-userscript-merge-version-drift
