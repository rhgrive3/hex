name: Temporary iframe Worker document rebind
on:
  push:
    branches: [fix/iframe-worker-document-rebind]
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/iframe-worker-document-rebind
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Add production-faithful initial Document regression
        run: python3 .github/tmp/patch-iframe-worker-document-rebind.py test
      - name: Prove old runtime binding fails the new regression
        shell: bash
        run: |
          set +e
          node tests/dev-agent/iframe-worker-pool.mjs > /tmp/iframe-baseline.log 2>&1
          status=$?
          set -e
          cat /tmp/iframe-baseline.log
          if [ "$status" -eq 0 ]; then
            echo "Expected old iframe runtime binding to fail the navigation Document replacement regression"
            exit 1
          fi
          grep -F "the committed ChatGPT Document must become the authoritative Worker realm" /tmp/iframe-baseline.log
      - name: Apply minimal runtime Document rebind repair
        run: python3 .github/tmp/patch-iframe-worker-document-rebind.py source
      - name: Focused Worker pool regression
        run: node tests/dev-agent/iframe-worker-pool.mjs
      - name: Canonical userscript build and release regressions
        run: |
          npm run userscript:build
          npm run userscript:test
      - name: Diff hygiene
        run: git diff --check
      - name: Commit validated repair and generated release identity
        shell: bash
        run: |
          rm .github/tmp/patch-iframe-worker-document-rebind.py .github/workflows/temp-iframe-worker-document-rebind.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebind iframe Worker runtime after document navigation"
          git push origin HEAD:fix/iframe-worker-document-rebind
