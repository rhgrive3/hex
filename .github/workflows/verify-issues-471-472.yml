name: Verify legacy type issues 471-472

on:
  push:
    branches:
      - fix/latest-472-471-legacy-types

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-472-471-legacy-types
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply legacy type fixes
        run: python3 tools/apply-issues-471-472.py
      - name: Focused regressions
        run: node tests/issues-471-472-legacy-types.mjs
      - name: Decompiler regressions
        run: npm run decompiler:test
      - name: Parse touched module
        run: node --check js/types-legacy.js
      - name: Existing static checks
        run: npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/types-legacy.js package.json
          git commit -m "fix: harden legacy alias lifetime and SIMD typing (#471 #472)"
          git push origin HEAD:fix/latest-472-471-legacy-types
