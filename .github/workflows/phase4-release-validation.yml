name: Phase 4 exact-SHA release validation

# Phase 4 is complete. Keep its permanent exact-SHA verifier available for
# explicit release/audit proof, but do not rerun the historical cutover suite
# on ordinary product PRs.
on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact product commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

env:
  PRODUCT_SHA: ${{ inputs.product_sha }}
  PHASE4_BASE: 9c67832485f8e9b6101915d460fae2a74bccfec5

concurrency:
  group: phase4-exact-sha-${{ inputs.product_sha }}
  cancel-in-progress: false

jobs:
  exact-sha-proof:
    name: phase4-exact-sha-proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run complete Phase 4 product rehearsal
        run: npm run phase4:rehearsal

      - name: Run independent Phase 4 verifier
        run: npm run phase4:verify -- --base "$PHASE4_BASE" --head "$PRODUCT_SHA" --lane p4-7

      - name: Run persistence browser proof
        run: npm run phase4:browser

      - name: Run protected userscript proof on artifact route
        run: HEX_ANALYSIS_ROUTE=artifact npm run userscript:test

      - name: Prove generated userscript synchronization
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build
          git diff --exit-code -- \
            userscript/hex.user.template.js \
            userscript/release-version.json \
            js/userscript/deployment-identity.generated.js

      - name: Write exact-SHA evidence
        if: success()
        shell: bash
        run: |
          printf '{"phase":4,"productSha":"%s","exactShaProof":true}\n' "$PRODUCT_SHA" > phase4-exact-sha-evidence.json

      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-exact-sha-evidence-${{ env.PRODUCT_SHA }}
          path: |
            phase4-exact-sha-evidence.json
            reports/phase4/verification-*.json
            reports/phase4/verification-*.md
          if-no-files-found: warn
          retention-days: 30
