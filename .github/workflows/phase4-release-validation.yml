name: Phase 4 exact-SHA release validation

on:
  workflow_dispatch:
    inputs:
      product_sha:
        description: Exact product commit SHA to validate
        required: true
        type: string
  pull_request:
    # Post-cutover generated userscript updates are intentionally not triggers.
    # Generic product changes rebuild these files, and must not be reclassified
    # as P4-7 ownership work. They are still verified whenever a real Phase 4
    # path triggers this workflow, and by explicit workflow_dispatch.
    paths:
      - 'js/core/artifacts/**'
      - 'js/core/scheduler/**'
      - 'js/core/budgets/**'
      - 'js/project/**'
      - 'js/cache/**'
      - 'js/backend.js'
      - 'js/worker*.js'
      - 'tests/phase4/**'
      - 'tools/validation/phase4/**'
      - 'tools/validation/phase4-ownership.mjs'
      - 'tools/validation/phase-ownership/phase4.json'
      - '.github/workflows/phase4-*.yml'
      - 'package.json'

permissions:
  contents: read

env:
  PRODUCT_SHA: ${{ inputs.product_sha || github.event.pull_request.head.sha }}
  PHASE4_BASE: 9c67832485f8e9b6101915d460fae2a74bccfec5

concurrency:
  group: phase4-exact-sha-${{ inputs.product_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  core:
    name: exact-sha-core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$PRODUCT_SHA"
          printf '{"productSha":"%s","actualSha":"%s"}\n' "$PRODUCT_SHA" "$ACTUAL" > phase4-exact-sha-core.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Phase 4 aggregate contracts and current product regression
        run: npm run check
      - name: Upload exact-SHA core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-exact-sha-core-${{ env.PRODUCT_SHA }}
          path: phase4-exact-sha-core.json
          if-no-files-found: error
          retention-days: 30

  cutover-rehearsal:
    name: exact-sha-cutover-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Force artifact route through complete product suite
        run: npm run phase4:rehearsal
      - name: Force artifact route through canonical userscript suite
        run: HEX_ANALYSIS_ROUTE=artifact npm run userscript:test

  independent-verifier:
    name: exact-sha-independent-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Resolve exact ownership verifier for the product branch
        id: ownership
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            hex/p5-0-x86-foundation) mode=phase5; lane=p5-0 ;;
            hex/p5-1-*) mode=phase5; lane=p5-1 ;;
            hex/p5-2-*) mode=phase5; lane=p5-2 ;;
            hex/p5-3-*) mode=phase5; lane=p5-3 ;;
            hex/p5-4-*) mode=phase5; lane=p5-4 ;;
            hex/p5-5-*) mode=phase5; lane=p5-5 ;;
            hex/p5-6-*) mode=phase5; lane=p5-6 ;;
            hex/p5-x86-integration) mode=phase5; lane=p5-i ;;
            hex/p6-riscv64-integration) mode=phase6; lane=p6 ;;
            *) mode=phase4; lane=p4-7 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
      - name: Independent Phase 4 verifier — blocking release gate
        if: steps.ownership.outputs.mode == 'phase4'
        shell: bash
        run: npm run phase4:verify -- --base "$PHASE4_BASE" --head "$PRODUCT_SHA" --lane p4-7
      - name: Independent Phase 4 verifier with exact Phase 5 ownership — blocking release gate
        if: steps.ownership.outputs.mode == 'phase5'
        shell: bash
        env:
          OWNERSHIP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          npm run phase4:verify --
          --base "$PHASE4_BASE"
          --head "$PRODUCT_SHA"
          --ownership-base "$OWNERSHIP_BASE_SHA"
          --phase5-lane "${{ steps.ownership.outputs.lane }}"
      - name: Independent Phase 4 verifier with exact Phase 6 ownership — blocking release gate
        if: steps.ownership.outputs.mode == 'phase6'
        shell: bash
        env:
          OWNERSHIP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Phase 4's static/dynamic verifier remains unchanged. Its embedded
          # P4-7 ownership sub-check is scoped to an empty diff because the full
          # exact changed-file inventory is verified immediately afterward by
          # the canonical single-owner Phase 6 gate.
          npm run phase4:verify -- \
            --base "$PHASE4_BASE" \
            --head "$PRODUCT_SHA" \
            --ownership-base "$PRODUCT_SHA" \
            --lane p4-7
          node tools/validation/phase6-ownership.mjs \
            --base-sha "$OWNERSHIP_BASE_SHA" \
            --head-sha "$PRODUCT_SHA"
      - name: Upload independent verifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-independent-verifier-${{ env.PRODUCT_SHA }}
          path: |
            reports/phase4/verification-*.json
            reports/phase4/verification-*.md
          if-no-files-found: error
          retention-days: 30

  browser-persistence:
    name: exact-sha-browser-persistence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install browser used by permanent persistence gate
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Real IndexedDB close/reopen proof
        run: npm run phase4:browser

  userscript-sync:
    name: exact-sha-userscript-sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
      - name: Prove exact checkout
        run: test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Rebuild canonical userscript and capture actual buildId
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build | tee userscript-build.log
          BUILD_ID="$(sed -n 's/^built protected runtime \([^ ]*\).*/\1/p' userscript-build.log | tail -1)"
          test -n "$BUILD_ID"
          printf '{"productSha":"%s","userscriptBuildId":"%s"}\n' "$PRODUCT_SHA" "$BUILD_ID" > userscript-build-evidence.json
      - name: Require committed generated outputs to match source
        run: git diff --exit-code -- userscript/hex.user.template.js userscript/release-version.json
      - name: Upload canonical userscript evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-userscript-${{ env.PRODUCT_SHA }}
          path: |
            userscript/hex.user.template.js
            userscript/release-version.json
            userscript-build.log
            userscript-build-evidence.json
          if-no-files-found: error
          retention-days: 30

  evidence:
    name: exact-sha-evidence
    if: always()
    needs: [core, cutover-rehearsal, independent-verifier, browser-persistence, userscript-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Write machine-readable exact-SHA result
        shell: bash
        env:
          CORE_RESULT: ${{ needs.core.result }}
          REHEARSAL_RESULT: ${{ needs.cutover-rehearsal.result }}
          VERIFIER_RESULT: ${{ needs.independent-verifier.result }}
          BROWSER_RESULT: ${{ needs.browser-persistence.result }}
          USERSCRIPT_RESULT: ${{ needs.userscript-sync.result }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          keys = ("CORE_RESULT", "REHEARSAL_RESULT", "VERIFIER_RESULT", "BROWSER_RESULT", "USERSCRIPT_RESULT")
          report = {
            "phase": 4,
            "productSha": os.environ["PRODUCT_SHA"],
            "baseMainSha": os.environ.get("BASE_SHA") or None,
            "coreResult": os.environ["CORE_RESULT"],
            "cutoverRehearsalResult": os.environ["REHEARSAL_RESULT"],
            "phase4VerifierResult": os.environ["VERIFIER_RESULT"],
            "browserPersistenceResult": os.environ["BROWSER_RESULT"],
            "userscriptSynchronizationResult": os.environ["USERSCRIPT_RESULT"],
            "phase4ExactShaCoreSatisfied": all(os.environ[k] == "success" for k in keys),
          }
          with open("phase4-exact-sha-evidence.json", "w", encoding="utf-8") as f:
            json.dump(report, f, indent=2, sort_keys=True)
            f.write("\n")
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-exact-sha-evidence-${{ env.PRODUCT_SHA }}
          path: phase4-exact-sha-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Require every exact-SHA prerequisite
        shell: bash
        env:
          CORE_RESULT: ${{ needs.core.result }}
          REHEARSAL_RESULT: ${{ needs.cutover-rehearsal.result }}
          VERIFIER_RESULT: ${{ needs.independent-verifier.result }}
          BROWSER_RESULT: ${{ needs.browser-persistence.result }}
          USERSCRIPT_RESULT: ${{ needs.userscript-sync.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$REHEARSAL_RESULT" = success
          test "$VERIFIER_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$USERSCRIPT_RESULT" = success
