name: Temporary Round 2 single-tab repair

on:
  push:
    branches:
      - hex/r2-single-tab-conversation-worker

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source repair
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('scripts/temp-r2-single-tab-fix.mjs'); t=p.read_text(); a=\"function write(path, content) { fs.mkdirSync(path.split('/').slice(0, -1).join('/'), { recursive: true }); fs.writeFileSync(path, content); }\"; b=\"function write(path, content) { const parent = path.split('/').slice(0, -1).join('/'); if (parent) fs.mkdirSync(parent, { recursive: true }); fs.writeFileSync(path, content); }\"; assert a in t; p.write_text(t.replace(a,b,1))"
          node scripts/temp-r2-single-tab-fix.mjs
          node scripts/temp-r2-foundation-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Regenerate protected userscript
        run: npm run userscript:build
      - name: Focused routing and Dev tests
        run: |
          node tests/chatgpt-new-chat-routing.mjs
          npm run dev-agent:test
          node tests/userscript-dev-worker-runtime.mjs
          node tests/chatgpt-web-runtime.mjs
          node tests/userscript-chatgpt-sandbox-host.mjs
          node tests/userscript-embed-child.mjs
          node --check userscript/hex.user.template.js
          git diff --check
      - name: Broader AI and userscript validation
        run: |
          npm run ai:test
          npm run userscript:test
      - name: Architecture assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "BroadcastChannel\|hex-worker=1\|isManualWorkerTab" -n \
            js/userscript/dev/parent-worker-runtime.js \
            js/userscript/dev/single-tab \
            js/ai/dev/supervisor/dev-supervisor-engine-v0.js
          test ! -e js/userscript/dev/tab-mesh/transport.js
          test ! -e js/userscript/dev/tab-mesh/single-worker-coordinator.js
          test ! -e js/userscript/dev/worker-host/worker-host.js
      - name: Commit repaired Round 2 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Round 2 for single-tab conversation Workers"
          git push origin HEAD:${GITHUB_REF_NAME}
