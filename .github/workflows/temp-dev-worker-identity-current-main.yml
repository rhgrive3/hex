name: Temporary Dev Worker identity current main
on:
  push:
    branches: [hex/fix-dev-worker-runtime-owned-identity-main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/fix-dev-worker-runtime-owned-identity-main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dev-agent:test
      - run: npm run ai:test
      - run: npm run userscript:build
      - run: npm run userscript:test
      - run: git diff --check
      - name: Commit generated release and remove temporary workflow
        run: |
          rm .github/workflows/temp-dev-worker-identity-current-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add userscript/hex.user.template.js userscript/release-version.json .github/workflows/temp-dev-worker-identity-current-main.yml
          git commit -m "Regenerate userscript for Dev Worker identity fix"
          git push origin HEAD:hex/fix-dev-worker-runtime-owned-identity-main
