name: Apply issues 61-73 Mach-O hardening
on:
  push:
    branches: [fix/issues-61-73]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patch
        run: node tools/fix-issues-61-73.mjs
      - name: Syntax check
        run: |
          node --check js/binary/model.js
          node --check js/binary/macho.js
          node --check js/binary/macho-dyld.js
          node --check tests/universal-binary.mjs
      - name: Binary regressions
        run: npm run binary:test
      - name: Full regression gate
        run: npm run check
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Fix Mach-O issues 61-73"
          git push origin HEAD:fix/issues-61-73
