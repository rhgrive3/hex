name: Harden CFG repair

on:
  push:
    paths:
      - '.github/workflows/harden-cfg-fix.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cfg-structuring-battlecats
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hardening
        run: python scripts/_harden_cfg_fix.py
      - name: Core checks
        run: npm run check
      - name: BattleCats CFG regression
        run: node --max-old-space-size=6000 tests/battlecats-cfg-regression.mjs
      - name: Remove temporary hardening files
        run: rm -f scripts/_harden_cfg_fix.py .github/workflows/harden-cfg-fix.yml
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden CFG coverage and indirect branch handling'
          git push origin HEAD:fix/cfg-structuring-battlecats
