name: Temp fix backend disposal
on:
  push:
    branches: [review-backend-resource-disposal]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-backend-resource-disposal
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch lifecycle disposal
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('js/backend.js'); s=p.read_text()
          old="    this.contentHash = null;\n    this.analysisCache = new AnalysisCache();"
          new="    this.contentHash = null;\n    this.disposed = false;\n    this.analysisCache = new AnalysisCache();"
          if old not in s: raise SystemExit('backend constructor snippet missing')
          s=s.replace(old,new,1)
          old="  _callTo(workerName, t, payload = {}, transfer, onProgress) {\n    const id = this.seq++;"
          new="  _callTo(workerName, t, payload = {}, transfer, onProgress) {\n    if (this.disposed) {\n      const error = new Error('Backend has been disposed.'); error.code = 'BACKEND_DISPOSED';\n      const promise = Promise.reject(error); promise.requestId = null; promise.cancel = () => {}; return promise;\n    }\n    const id = this.seq++;"
          if old not in s: raise SystemExit('backend _callTo snippet missing')
          s=s.replace(old,new,1)
          old="  resetCache() {\n    this.cache.clear();"
          new="  dispose() {\n    if (this.disposed) return;\n    this.disposed = true;\n    const failure = new Error('Backend has been disposed.'); failure.code = 'BACKEND_DISPOSED';\n    this.analysisEpoch++; this.transportEpoch++;\n    this.resetCache();\n    this._releaseDisassembly(failure);\n    for (const pending of this.pending.values()) pending.reject(failure);\n    this.pending.clear();\n    for (const worker of [this.legacyWorker, this.platformWorker]) { try { worker.terminate(); } catch { /* best effort */ } }\n    if (typeof document !== 'undefined' && this._memoryPressureHandler) {\n      document.removeEventListener('visibilitychange', this._memoryPressureHandler);\n      this._memoryPressureHandler = null;\n    }\n  }\n\n  resetCache() {\n    this.cache.clear();"
          if old not in s: raise SystemExit('backend resetCache snippet missing')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('js/workspace.js'); s=p.read_text()
          old="  async loadBaseline(file,{backend=null}={}){\n    if(!file)throw new Error('baseline-file-required');\n    if(!this.identity)await this.bind();\n    const other=backend||this.backendFactory();\n    const info=await other.open(file);const currentArch=this.identity?.metadata?.architecture||null;const sliceIndex=chooseSlice(info,currentArch);\n    if(sliceIndex<0)throw new Error('baseline-slice-unavailable');\n    const slice=info.slices[sliceIndex];const arch=slice?.capability?.architecture||slice?.info?.architecture||slice?.info?.cpu||null;\n    if(currentArch&&arch&&currentArch!==arch){const error=new Error(`architecture mismatch: ${currentArch} vs ${arch}`);error.code='DIFF_ARCH_MISMATCH';throw error;}\n    const hash=await other.ensureContentHash();const result=await other.analyze(sliceIndex);const symbols=new SymbolIndex({...result,regions:slice?.regions||[]});\n    const functions=functionsFromSymbols(symbols);\n    this.baseline={file,backend:other,info,sliceIndex,slice,architecture:arch,hash,symbols,functions,complete:functions.complete===true};\n    this.diffState=null;return this.baseline;\n  }"
          new="  async loadBaseline(file,{backend=null}={}){\n    if(!file)throw new Error('baseline-file-required');\n    if(!this.identity)await this.bind();\n    const ownedBackend=!backend, other=backend||this.backendFactory();\n    try{\n      const info=await other.open(file);const currentArch=this.identity?.metadata?.architecture||null;const sliceIndex=chooseSlice(info,currentArch);\n      if(sliceIndex<0)throw new Error('baseline-slice-unavailable');\n      const slice=info.slices[sliceIndex];const arch=slice?.capability?.architecture||slice?.info?.architecture||slice?.info?.cpu||null;\n      if(currentArch&&arch&&currentArch!==arch){const error=new Error(`architecture mismatch: ${currentArch} vs ${arch}`);error.code='DIFF_ARCH_MISMATCH';throw error;}\n      const hash=await other.ensureContentHash();const result=await other.analyze(sliceIndex);const symbols=new SymbolIndex({...result,regions:slice?.regions||[]});\n      const functions=functionsFromSymbols(symbols);\n      const previous=this.baseline;\n      this.baseline={file,backend:other,ownedBackend,info,sliceIndex,slice,architecture:arch,hash,symbols,functions,complete:functions.complete===true};\n      if(previous?.ownedBackend&&previous.backend!==other)previous.backend?.dispose?.();\n      this.diffState=null;return this.baseline;\n    }catch(error){if(ownedBackend)other?.dispose?.();throw error;}\n  }\n  dispose(){\n    if(this.baseline?.ownedBackend)this.baseline.backend?.dispose?.();\n    this.baseline=null;this.diffState=null;this.busy=null;\n  }"
          if old not in s: raise SystemExit('workspace loadBaseline snippet missing')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('package.json'); s=p.read_text()
          old='"test": "node tests/issues-521-527.mjs &&'
          new='"test": "node tests/backend-disposal.mjs && node tests/issues-521-527.mjs &&'
          if old not in s: raise SystemExit('package test prefix missing')
          s=s.replace(old,new,1); p.write_text(s)
          PY
          cat > tests/backend-disposal.mjs <<'EOF'
          import assert from 'node:assert/strict';

          const workers=[];
          let added=0,removed=0;
          class FakeWorker{
            constructor(){this.sent=[];this.terminated=false;this.onmessage=null;workers.push(this);}
            postMessage(m){this.sent.push(m);}
            terminate(){this.terminated=true;}
          }
          globalThis.Worker=FakeWorker;
          globalThis.document={hidden:false,addEventListener(){added++;},removeEventListener(){removed++;}};
          const { Backend }=await import('../js/backend.js');
          {
            const b=new Backend();
            assert.equal(added,1);
            const pending=b._callTo('legacy','probe',{});
            b.dispose();
            let error=null;try{await pending;}catch(e){error=e;}
            assert.equal(error?.code,'BACKEND_DISPOSED');
            assert.ok(workers.slice(0,2).every((w)=>w.terminated));
            assert.equal(removed,1);
            b.dispose();
            assert.equal(removed,1,'dispose must be idempotent');
            let after=null;try{await b.probe();}catch(e){after=e;}
            assert.equal(after?.code,'BACKEND_DISPOSED');
          }

          delete globalThis.document;
          const { ProductWorkspace }=await import('../js/workspace.js');
          const region={id:'text',exec:true,vmAddr:0x1000n,size:0x100n,fileOffset:0n};
          const makeBackend=(hash,{fail=false}={})=>({
            disposed:0,
            async open(){return {name:'base',slices:[{info:{architecture:'arm64'},capability:{architecture:'arm64'},regions:[region]}]};},
            async ensureContentHash(){if(fail)throw new Error('hash failed');return hash;},
            async analyze(){return {addrs:new BigUint64Array(0),kinds:new Uint8Array(0),flags:new Uint8Array(0),names:[],funcs:new BigUint64Array([0x1000n]),functionStartsComplete:true};},
            dispose(){this.disposed++;},
          });
          {
            const made=[];
            const app={store:{get:()=>null},backend:{},symbols:null};
            const ws=new ProductWorkspace(app,{backendFactory:()=>{const b=makeBackend('h'+made.length);made.push(b);return b;},storage:null});
            ws.identity={hash:'current',metadata:{architecture:'arm64'}};
            await ws.loadBaseline({name:'a'});
            assert.equal(made[0].disposed,0);
            await ws.loadBaseline({name:'b'});
            assert.equal(made[0].disposed,1,'replaced owned baseline must be disposed');
            assert.equal(made[1].disposed,0);
            ws.dispose();
            assert.equal(made[1].disposed,1,'workspace dispose must release current owned baseline');
          }
          {
            const failed=makeBackend('bad',{fail:true});
            const app={store:{get:()=>null},backend:{},symbols:null};
            const ws=new ProductWorkspace(app,{backendFactory:()=>failed,storage:null});
            ws.identity={hash:'current',metadata:{architecture:'arm64'}};
            await assert.rejects(()=>ws.loadBaseline({name:'bad'}),/hash failed/);
            assert.equal(failed.disposed,1,'failed owned baseline must be disposed');
          }
          {
            const external=makeBackend('external');
            const owned=makeBackend('owned');
            const app={store:{get:()=>null},backend:{},symbols:null};
            const ws=new ProductWorkspace(app,{backendFactory:()=>owned,storage:null});
            ws.identity={hash:'current',metadata:{architecture:'arm64'}};
            await ws.loadBaseline({name:'external'},{backend:external});
            await ws.loadBaseline({name:'owned'});
            assert.equal(external.disposed,0,'borrowed backend must not be disposed by workspace');
            ws.dispose();
            assert.equal(owned.disposed,1);
          }
          console.log('backend/workspace disposal regressions: PASS');
          EOF
      - run: node tests/backend-disposal.mjs
      - run: npm run userscript:build
      - name: Commit fix and generated bundles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/backend.js js/workspace.js package.json tests/backend-disposal.mjs userscript/hex.user.template.js userscript/platform-worker.bundle.js
          git commit -m 'Dispose replaced binary analysis backends'
          git push origin HEAD:review-backend-resource-disposal
