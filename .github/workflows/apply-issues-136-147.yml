name: Apply issues 136-147
on:
  push:
    branches: [fix/issues-136-147-20260815]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused fixes
        run: python3 tools/apply-issues-136-147.py
      - name: Focused regression
        run: |
          node tests/issues-136-147.mjs
          node tests/cfg-structuring.mjs
          node tests/decompiler-semantic.mjs
          node tests/decompiler-switch.mjs
          node tests/decompiler-pipeline.mjs
      - name: Core static check
        run: node tests/check.mjs
      - name: Commit verified result
        run: |
          git rm tools/apply-issues-136-147.py .github/workflows/apply-issues-136-147.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: resolve CFG and decompiler correctness issues 135-147'
          git push origin HEAD:fix/issues-136-147-20260815
