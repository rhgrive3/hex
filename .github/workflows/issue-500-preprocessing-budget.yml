name: Issue 500 preprocessing budget

on:
  push:
    branches:
      - fix/issue-500-preprocessing-budget

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[issue-500-preprocess-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply preprocessing hardening
        run: |
          python3 tools/apply-issue-500-preprocessing.py
          python3 tools/update-issue-500-preprocessing-tests.py
          python3 tools/reconcile-issue-500-main.py
      - name: Focused matcher regression including raw 100k fixture
        run: node tests/issue-500-matcher-budget.mjs
      - name: Recognition regression suite
        run: node tests/recognition-intelligence.mjs
      - name: Static checks
        run: |
          node --check js/recognition/match-budget.js
          node --check js/recognition/matcher.js
          node --check tests/issue-500-matcher-budget.mjs
      - name: Full lint
        run: npm run lint
      - name: Commit validated implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/recognition/matcher.js tests/issue-500-matcher-budget.mjs
          git commit -m 'Finish #500 preprocessing budgets [issue-500-preprocess-applied]'
          git push
