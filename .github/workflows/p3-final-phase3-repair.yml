name: Phase 3 final scoped repair

on:
  push:
    branches:
      - hex/p3-semantic-ir-integration
    paths:
      - '.github/workflows/p3-final-phase3-repair.yml'

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/p3-semantic-ir-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Narrow compatibility-only state-read compaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/semantics/compat/semantic-ir-v2-to-v1-finalize.js')
          s = p.read_text()
          decl = "    const addressStateAlias = rawSource != null && aliases.has(rawSource.id);\n"
          old = "    } else if (inst.extra?.stateRead && (inst.extra?.localPhysicalViewProjection === true || addressStateAlias) && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          new = "    } else if (inst.extra?.stateRead && inst.extra?.localPhysicalViewProjection === true && Number(source.bits || 0) === Number(inst.dst.bits || 0)) {"
          if s.count(decl) != 1 or s.count(old) != 1:
              raise SystemExit('expected exact broad state-read compaction shape not found once')
          s = s.replace(decl, '', 1).replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Public IR regression 30/30
        shell: bash
        run: |
          set -o pipefail
          node tests/ir.mjs | tee /tmp/p3-ir.log

      - name: Semantic IR v2 full gate
        shell: bash
        run: |
          set -o pipefail
          npm run semantic-v2:test | tee /tmp/p3-semantic-v2.log

      - name: Full Phase 3 repository gates
        run: |
          npm run effects:test
          npm run core:test
          npm run invariants:test
          npm run migration:test
          npm run semantic:test
          npm run decompiler:test
          npm run compiler-truth
          npm run platform:test
          npm run runtime:test
          npm run ui:test
          npm run benchmark:baseline
          npm run ai:test
          npm run userscript:test
          npm run check

      - name: Canonical userscript rebuild and retest
        run: |
          npm run userscript:build
          npm run userscript:test

      - name: Assert temporary workflow cleanup target set
        run: |
          python3 - <<'PY'
          from pathlib import Path
          allowed = {Path('.github/workflows/p3-final-phase3-repair.yml')}
          temporary = {
              p for p in Path('.github/workflows').glob('p3-*.yml')
              if any(k in p.name for k in ('final', 'debug', 'repair', 'validation'))
          }
          extra = temporary - allowed
          if extra:
              raise SystemExit('unexpected temporary Phase 3 workflows: ' + ', '.join(map(str, sorted(extra))))
          PY

      - name: Commit validated repair and generated userscript
        shell: bash
        run: |
          BUILD_ID="$(grep -oE 'buildId["'"']?[:=][[:space:]]*["'"'][0-9a-f]+' userscript/hex.user.template.js | head -n1 | grep -oE '[0-9a-f]{12,}' || true)"
          IR_SUMMARY="$(tail -n 4 /tmp/p3-ir.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          SEM_SUMMARY="$(tail -n 8 /tmp/p3-semantic-v2.log | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/p3-final-phase3-repair.yml
          git add js/semantics/compat/semantic-ir-v2-to-v1-finalize.js userscript/hex.user.template.js
          git diff --cached --check
          git commit -m "Phase 3: finalize scoped public projection after v2 cutover" -m "Validated full Phase 3 command set before commit.\nIR tail: ${IR_SUMMARY}\nSemantic-v2 tail: ${SEM_SUMMARY}\nCanonical userscript buildId: ${BUILD_ID:-unparsed}"
          git push origin HEAD:hex/p3-semantic-ir-integration

      - name: Remove temporary workflow after failed validation
        if: failure()
        shell: bash
        run: |
          git reset --hard HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f .github/workflows/p3-final-phase3-repair.yml ]; then
            git rm .github/workflows/p3-final-phase3-repair.yml
            git commit -m 'Phase 3: remove failed temporary final repair gate'
            git push origin HEAD:hex/p3-semantic-ir-integration
          fi
