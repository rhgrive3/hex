name: Fix state notes issues

on:
  push:
    branches:
      - fix/all-remaining-issues-20260815

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python tools/fix-state-notes-107-432-523.py
          git add js/names.js js/backend.js js/worker-legacy.js js/app.js
          git commit -m "fix: transactional open and nonblocking note identity (#107 #432 #523)"
      - name: Add regressions
        run: |
          cat > tests/issues-107-432-523.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { Backend } from '../js/backend.js';
          import { legacyNoteKeyFor, legacyNoteKeyForSlice, canonicalLegacyNoteSliceIndex, noteKeyFor } from '../js/names.js';
          const file={name:'Game',size:123};
          const fat={slices:[{info:{cpu:'x86_64',uuid:'X'}},{info:{cpu:'arm64',uuid:'A',isArm64:true}}]};
          assert.equal(legacyNoteKeyFor(file,fat,1),'Game|123|X');
          assert.equal(canonicalLegacyNoteSliceIndex(fat),1);
          assert.equal(legacyNoteKeyForSlice(file,fat,1),'Game|123|X');
          assert.equal(legacyNoteKeyForSlice(file,fat,0),null);
          assert.equal(canonicalLegacyNoteSliceIndex({slices:[{info:{cpu:'arm64',uuid:'A',isArm64:true}},{info:{cpu:'x86_64',uuid:'X'}}]}),0);
          assert.equal(legacyNoteKeyFor(file,{slices:[{info:{cpu:'x86_64'}},{info:{cpu:'arm64',isArm64:true}}]}),'Game|123');
          let reads=0;
          const source={size:1024*1024,maxReadLength:1024*1024,async read(offset,length,{signal}={}){if(signal?.aborted){const e=new Error('abort');e.name='AbortError';throw e;}reads++;return new Uint8Array(length);}};
          const fi={slices:[{offset:0n,size:BigInt(source.size),info:{cpu:'arm64',uuid:'U',isArm64:true}}]};
          const k1=await noteKeyFor(source,fi,0); const firstReads=reads; const k2=await noteKeyFor(source,fi,0);
          assert.equal(k1,k2); assert.equal(reads,firstReads);
          const backend=Object.create(Backend.prototype);
          Object.assign(backend,{analysisEpoch:7,transportEpoch:9,file:'old',formatId:'macho',platformInfo:{old:true},legacyInfo:{old:true},arm64Bridge:false,contentHash:'oldhash',onAnalysisProgress:null});
          backend._callTo=async()=>{throw new Error('bad candidate');};
          backend.advanceEpoch=()=>{backend.analysisEpoch++;return backend.analysisEpoch;};
          await assert.rejects(()=>backend.open({name:'bad'}));
          assert.equal(backend.analysisEpoch,7); assert.equal(backend.file,'old'); assert.equal(backend.contentHash,'oldhash');
          const app=fs.readFileSync('js/app.js','utf8');
          const open=app.slice(app.indexOf('async openFile'),app.indexOf('/** 練習用のサンプル'));
          assert.ok(open.indexOf('this.applySlice(sliceIndex,info)') < open.indexOf('this.attachNotes(file,info,sliceIndex,openEpoch)'));
          assert.doesNotMatch(open,/await noteKeyFor/);
          console.log('issues #107 #432 #523 regressions passed');
          EOF
          git add tests/issues-107-432-523.mjs
          git commit -m "test: cover #107 #432 #523"
      - name: Validate
        run: |
          node tests/issues-107-432-523.mjs
          node tests/symbol-identity.mjs
          node tests/run.js
          npm run check
      - name: Finalize branch
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-state-notes-107-432-523.yml tools/fix-state-notes-107-432-523.py
          git commit -m "chore: finalize state and notes fixes [autofix]"
          git push origin HEAD:fix/all-remaining-issues-20260815
