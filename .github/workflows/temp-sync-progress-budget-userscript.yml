name: TEMP Sync progress-budget userscript artifacts

on:
  push:
    branches:
      - fix/dev-supervisor-progress-budget

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dev-supervisor-progress-budget
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build canonical userscript
        run: npm run userscript:build
      - name: Verify progress-budget regression
        run: node tests/dev-agent/supervisor-progress-budget.mjs
      - name: Commit canonical generated artifacts and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-sync-progress-budget-userscript.yml
          git add userscript/hex.user.template.js userscript/release-version.json
          git commit -m "Sync progress-budget userscript release"
          git push origin HEAD:fix/dev-supervisor-progress-budget
