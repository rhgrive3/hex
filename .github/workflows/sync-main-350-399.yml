name: Sync main for issues 350-399

# Temporary integration gate; removed after the branch is verified against main.
on:
  push:
    branches: [fix/issues-350-399]
    paths:
      - '.github/workflows/sync-main-350-399.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issues-350-399
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main and resolve owned conflicts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          echo '=== INITIAL CONFLICTS ==='
          git diff --name-only --diff-filter=U || true

          # CI is not part of these fixes; latest main is authoritative.
          git checkout origin/main -- .github/workflows/cross-binary-accuracy.yml

          # These two feature copies were already reconciled as latest-main + issue fix.
          git checkout HEAD -- package.json js/apple/objc-metadata.js

          # For substantive conflicts, start from latest main and reapply only the
          # audited semantics for #350-#399. This prevents stale feature code from
          # overwriting newer main hardening.
          git checkout origin/main -- js/decompiler/type-recovery.js js/recognition/classifier.js js/runtime/index.js js/emu.js
          node tools/resolve-main-350-399.mjs
          node tools/resolve-main-350-399-tests.mjs
          rm tools/resolve-main-350-399.mjs tools/resolve-main-350-399-tests.mjs

          git add -A
          remaining="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$remaining" ]]; then
            echo '=== UNEXPECTED REMAINING CONFLICTS ==='
            echo "$remaining"
            exit 1
          fi
          git diff --check
      - name: Syntax check reconciled modules
        run: |
          node --check js/decompiler/type-recovery.js
          node --check js/recognition/classifier.js
          node --check js/runtime/index.js
          node --check js/emu.js
          node --check tests/integration-review.mjs
      - name: Focused regression
        run: node tests/issues-350-399.mjs
      - name: Full non-browser check
        run: npm run check
      - name: Commit integrated main
        run: |
          git commit -m 'merge: integrate latest main into issues 350-399'
          git push origin HEAD:fix/issues-350-399
