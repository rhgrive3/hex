name: Fix IL2CPP final

on:
  push:
    branches: [fix/all-remaining-issues-20260815]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply core
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/fix-il2cpp-remaining.py')
          s=p.read_text().replace("if old not in s: raise SystemExit('tools il2cpp picker anchor missing')", "if old not in s: print('tools picker patched separately')")
          p.write_text(s)
          PY
          python tools/fix-il2cpp-remaining.py
          python tools/fix-il2cpp-preflight.py
          python tools/fix-il2cpp-ui.py
          python tools/fix-il2cpp-compat.py
      - name: Existing IL2CPP regression
        run: node tests/issue-496-il2cpp-binding.mjs
      - name: New IL2CPP regressions
        run: node tools/test-il2cpp-remaining.mjs
      - name: Full tests
        run: node tests/run.js
      - name: Static checks
        run: npm run check
      - name: Commit and finalize
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/il2cpp.js js/tools.js
          git commit -m "fix: bound IL2CPP metadata and method binding (#496 #519 #520)"
          cp tools/test-il2cpp-remaining.mjs tests/issues-496-519-520.mjs
          git add tests/issues-496-519-520.mjs
          git rm .github/workflows/fix-il2cpp-final.yml tools/fix-il2cpp-remaining.py tools/fix-il2cpp-preflight.py tools/fix-il2cpp-ui.py tools/fix-il2cpp-compat.py tools/test-il2cpp-remaining.mjs
          git commit -m "test: cover IL2CPP ambiguity and budgets [autofix]"
          git push origin HEAD:fix/all-remaining-issues-20260815
