name: Temp final userscript sync
on:
  push:
    branches: [fix-macho-symbol-truth-completeness]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-macho-symbol-truth-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run userscript:build
      - name: Commit generated bundles only
        run: |
          if git diff --quiet -- userscript/hex.user.template.js userscript/platform-worker.bundle.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add userscript/hex.user.template.js userscript/platform-worker.bundle.js
          git commit -m 'Sync userscript bundles after Mach-O truth changes'
          git push origin HEAD:fix-macho-symbol-truth-completeness
