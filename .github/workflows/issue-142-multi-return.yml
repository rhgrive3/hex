name: Validate issue 142 multi-return recovery

on:
  push:
    branches: [fix/issue-142-multi-return-recovery]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[issue-142-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fix
        run: python3 tools/apply-issue-142.py
      - name: Syntax
        run: |
          node --check js/decompiler/passes/stack-phi-recovery.js
          node --check tests/issue-142-multi-return.mjs
      - name: Focused multi-return regressions
        run: node tests/issue-142-multi-return.mjs
      - name: Decompiler regression suite
        run: npm run decompiler:test
      - name: Full regression
        run: npm run check
      - name: Commit validated production change
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/decompiler/passes/stack-phi-recovery.js tests/issue-142-multi-return.mjs package.json
          git commit -m 'Fix #142 per-return stack recovery [issue-142-applied]'
          git push
