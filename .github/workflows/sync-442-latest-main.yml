name: Sync PR 442 with latest main

on:
  push:
    branches:
      - fix/latest-430-425

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-430-425
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge latest main safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "latest main already contained"
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unexpected="$(git diff --name-only --diff-filter=U | grep -Ev '^(js/ir-core\.js|package\.json)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts:"
              echo "$unexpected"
              exit 1
            fi
            git checkout --ours js/ir-core.js package.json
          fi

          # Keep the #430 IR changes, while preserving #405's post-extend scale
          # semantics that landed on main after this branch was created.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/ir-core.js')
          s = p.read_text()
          old = "scale: mem && mem.shift && mem.shift.op === 'lsl' ? mem.shift.amount : 0,"
          new = "scale: mem && mem.shift ? (mem.shift.amount || 0) : 0,"
          if old in s:
              s = s.replace(old, new, 1)
          if new not in s:
              raise SystemExit('failed to preserve current main indexed-address scale semantics')
          p.write_text(s)
          PY

          # Package scripts are integration wiring: take current main verbatim,
          # then add only the #430 regression to semantic:test.
          git show origin/main:package.json > /tmp/main-package.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/main-package.json').read_text())
          cmd = data['scripts']['semantic:test']
          test = 'node tests/issue-430-memory-escape.mjs'
          if test not in cmd:
              data['scripts']['semantic:test'] = test + ' && ' + cmd
          Path('package.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          git add js/ir-core.js package.json
          git add -A
          git commit -m "Merge latest main into fix/latest-430-425"
      - name: Verify issue 430 regression
        run: node tests/issue-430-memory-escape.mjs
      - name: Verify semantic suite
        run: npm run semantic:test
      - name: Verify decompiler suite
        run: npm run decompiler:test
      - name: Verify lint
        run: npm run lint
      - name: Push synchronized branch
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/fix/latest-430-425)" ]; then
            git push origin HEAD:fix/latest-430-425
          fi
