name: Temporary conversation storage validation

on:
  push:
    branches: [hex/security-chatgpt-conversation-storage]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused trust-boundary regression
        run: node tests/chatgpt-conversation-storage-security.mjs
      - name: Lint
        run: npm run lint
      - name: Userscript regressions and build
        run: npm run userscript:test
      - name: AI and worker regressions
        run: |
          npm run ai:test
          node tests/gemini.mjs
          node tests/worker-classic-harness.mjs
      - name: Install pinned browser engines
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install-deps chromium webkit
          npx --no-install playwright install chromium webkit
      - name: Opaque sandbox browser regressions
        run: |
          node tests/userscript-srcdoc-probe.mjs
          node tests/userscript-sandbox-browser-e2e.mjs
          node tests/chatgpt-web-production-dom.mjs
      - name: Commit regenerated userscript loader when needed
        run: |
          if ! git diff --quiet -- userscript/hex.user.template.js; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add userscript/hex.user.template.js
            git commit -m "Regenerate userscript loader for conversation storage hardening"
            git push
          fi
