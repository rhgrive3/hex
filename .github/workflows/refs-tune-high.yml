name: High reference window tuning

on:
  push:
    branches:
      - accuracy-ywp-tsumtsum-20260814
    paths:
      - .github/workflows/refs-tune-high.yml

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accuracy-ywp-tsumtsum-20260814
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install oracle dependencies
        run: python -m pip install --disable-pip-version-check lief capstone
      - name: Build independent oracles
        run: |
          python tests/oracle.py tests/battlecats /tmp/oracle.battlecats.json.gz
          python tests/oracle.py tests/YWP /tmp/oracle.YWP.json.gz
          python tests/oracle.py tests/TsumTsum /tmp/oracle.TsumTsum.json.gz
      - name: Compare wider reference windows
        run: |
          for WINDOW in 256 512 1024 2048 4096; do
            sed -Ei "s/^const PAIR_WINDOW = [0-9]+;/const PAIR_WINDOW = ${WINDOW};/" js/worker.js
            echo "=== WINDOW ${WINDOW} ==="
            node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/battlecats --oracle=/tmp/oracle.battlecats.json.gz --only=refs --json > /tmp/b.json
            node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/YWP --oracle=/tmp/oracle.YWP.json.gz --only=refs --json > /tmp/y.json
            node --max-old-space-size=6000 tests/accuracy.mjs --target=tests/TsumTsum --oracle=/tmp/oracle.TsumTsum.json.gz --only=refs --json > /tmp/t.json
            node -e "for (const [n,p] of [['BattleCats','/tmp/b.json'],['YWP','/tmp/y.json'],['TsumTsum','/tmp/t.json']]) { const r=JSON.parse(require('fs').readFileSync(p))[0]; console.log(n, (r.score*100).toFixed(6)+'%', r.detail); }"
          done
