name: Issue 556 address provenance v3

on:
  push:
    branches: [fix/issue-556-address-provenance-v3]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[issue-556-v3-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply correction to current main
        run: python3 tools/apply-issue-556-v3.py
      - name: Behavioral worker provenance regression
        run: node tests/issue-556-address-provenance.mjs
      - name: Standard ARM64 gate
        run: node tests/words.mjs
      - name: Existing #550-559 regressions
        run: node tests/issues-550-559.mjs
      - name: Static checks
        run: |
          node --check js/address-provenance.js
          node --check js/worker-legacy.js
      - name: Full regression
        run: npm run check
      - name: Commit validated correction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/worker-legacy.js
          git commit -m 'Correct #556 address provenance on current main [issue-556-v3-applied]'
          git push
