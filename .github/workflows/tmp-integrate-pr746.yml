name: One-shot integrate PR 746

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: contains(github.event.head_commit.message, 'Integrate non-Phase5 PR cleanup')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate PR 746 against the exact current main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin fix/dev-supervisor-tool-retry-japanese-default

          git show origin/fix/dev-supervisor-tool-retry-japanese-default:js/ai/dev/protocol/dev-supervisor-prompt.js > js/ai/dev/protocol/dev-supervisor-prompt.js
          git show origin/fix/dev-supervisor-tool-retry-japanese-default:tests/dev-agent/round2-single-tab-supervisor.mjs > tests/dev-agent/round2-single-tab-supervisor.mjs
          git show origin/fix/dev-supervisor-tool-retry-japanese-default:tests/dev-agent/round2-single-worker.mjs > tests/dev-agent/round2-single-worker.mjs

          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/ai/dev/supervisor/dev-supervisor-engine-v0.js')
          text = path.read_text()
          old = '''      for (let step = 0; step < this.maxDecisions; step++) {
                const availableTools = this.availableTools();
                const response = await this.bridge.request(buildDevSupervisorPrompt({
                  run,
                  availableTools,
                  history,
                }), {
                  signal: input.signal,
                  sessionKey: run.supervisorSessionKey,
                  model: input.model || null,
                  reasoning: input.reasoning || null,
                });
                const text = response && typeof response === 'object' ? response.text : response;
                const decision = parseDevSupervisorDecision(text, { availableTools });

                if (decision.type === 'tool') {'''
          new = '''      for (let step = 0; step < this.maxDecisions; step++) {
                const promptTools = this.availableTools();
                const response = await this.bridge.request(buildDevSupervisorPrompt({
                  run,
                  availableTools: promptTools,
                  history,
                }), {
                  signal: input.signal,
                  sessionKey: run.supervisorSessionKey,
                  model: input.model || null,
                  reasoning: input.reasoning || null,
                });
                const text = response && typeof response === 'object' ? response.text : response;
                let decision;
                try {
                  decision = parseDevSupervisorDecision(text);
                } catch (decisionError) {
                  history.push({
                    kind: 'decision-invalid',
                    message: '直前のSupervisor decisionは有効なhex-dev-supervisor-v1 JSONではありません。同じdecision shape契約に従ってJSONオブジェクトを1つだけ再出力してください。',
                    error: String(decisionError?.message || decisionError || 'Invalid Supervisor decision.'),
                  });
                  continue;
                }
                const availableTools = this.availableTools();

                if (decision.type === 'tool' && !availableTools.includes(decision.tool)) {
                  history.push({
                    kind: 'tool-unavailable',
                    tool: decision.tool,
                    message: `要求されたツール「${decision.tool}」は現在利用できません。現在利用可能なツール一覧を確認して再判断してください。`,
                    availableTools,
                  });
                  continue;
                }

                if (decision.type === 'tool') {'''
          if old not in text:
              raise SystemExit('current-main Supervisor loop changed; refusing unsafe integration')
          path.write_text(text.replace(old, new, 1))
          PY

          npm ci
          npm run dev-agent:test
          npm run userscript:build
          npm run userscript:test
          npm run check
          git diff --check

          rm .github/workflows/tmp-integrate-pr746.yml

          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/tmp-integrate-pr746.yml',
              'js/ai/dev/protocol/dev-supervisor-prompt.js',
              'js/ai/dev/supervisor/dev-supervisor-engine-v0.js',
              'tests/dev-agent/round2-single-tab-supervisor.mjs',
              'tests/dev-agent/round2-single-worker.mjs',
              'userscript/hex.user.template.js',
              'userscript/release-version.json',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          actual = {row[3:] for row in rows if len(row) >= 4}
          if actual != allowed:
              raise SystemExit(f'unexpected integration diff: {sorted(actual)}')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A \
            .github/workflows/tmp-integrate-pr746.yml \
            js/ai/dev/protocol/dev-supervisor-prompt.js \
            js/ai/dev/supervisor/dev-supervisor-engine-v0.js \
            tests/dev-agent/round2-single-tab-supervisor.mjs \
            tests/dev-agent/round2-single-worker.mjs \
            userscript/hex.user.template.js \
            userscript/release-version.json
          git commit -m 'Integrate Dev Supervisor replanning and Japanese default'
          git push origin HEAD:main
