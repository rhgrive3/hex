name: Phase 5 repair scalar and synchronize userscript

on:
  push:
    branches:
      - hex/p5-x86-integration

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore exact locally-verified scalar helper
        shell: bash
        run: |
          set -euo pipefail
          echo 'feb9c39cbaf993845c609cd1d49ca245f1e1c503fe4878da3a2682fff206f9cb  .p5-repair/scalar.js.gz.b64' | sha256sum -c -
          base64 -d .p5-repair/scalar.js.gz.b64 | gzip -dc > js/targets/architecture/x86_64/effects/scalar.js
          test "$(git hash-object js/targets/architecture/x86_64/effects/scalar.js)" = d477408031eb6739b3767d02b4efdd32f475337d
          node --check js/targets/architecture/x86_64/effects/scalar.js
      - name: Re-run P5-1/P5-2 seam and MachineEffects gates
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/phase5/effects/int-control/*.test.mjs tests/phase5/effects/memory/*.test.mjs tests/phase5/integration/x86-cross-lane.test.mjs
          npm run effects:test
      - name: Canonical-build and verify generated userscript
        shell: bash
        run: |
          set -euo pipefail
          npm run userscript:build
          test "$(git hash-object userscript/hex.user.template.js)" = be0de3dfc836785b96d57005d077269ce5497bbb
          test "$(git hash-object userscript/release-version.json)" = 2d77a9d8b90d5876e5cc38573f97d4a9c3d688f2
          cp userscript/hex.user.template.js /tmp/hex.user.template.js
          cp userscript/release-version.json /tmp/release-version.json
          npm run userscript:build
          cmp /tmp/hex.user.template.js userscript/hex.user.template.js
          cmp /tmp/release-version.json userscript/release-version.json
      - name: Commit repaired scalar, generated output, and remove temporary transfer harnesses
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p5-repair
          rm -f .github/workflows/p5-sync-userscript.yml .github/workflows/p5-fix-scalar-and-sync.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 5: repair shared scalar helper and sync generated userscript'
          git push origin HEAD:refs/heads/hex/p5-x86-integration
