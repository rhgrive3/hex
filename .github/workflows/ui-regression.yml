name: UI regression

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/app.js'
      - 'js/ui.js'
      - 'js/ux.js'
      - 'js/ui/**'
      - 'js/panels.js'
      - 'js/tools.js'
      - 'js/viewer.js'
      - 'js/graphview.js'
      - 'tests/browser.mjs'
      - 'tests/ui/**'
      - 'tests/ux.mjs'
      - 'package.json'
      - '.github/workflows/ui-regression.yml'
  workflow_dispatch:

concurrency:
  group: ui-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ui:test

  browser-regression:
    name: browser-regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-v1
      - name: Install pinned Playwright Chromium with dependency fallback
        shell: bash
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install chromium
          if ! node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          NODE
          then
            echo 'Preinstalled runner libraries are insufficient; installing pinned Chromium OS dependencies.'
            npx --no-install playwright install-deps chromium
          fi
      - name: Run existing browser regression
        run: npm run browser

  # Only these suites require WebKit. Use Playwright's pinned image so their
  # runners start with the matching Chromium/WebKit binaries and OS libraries
  # instead of installing the same WebKit dependencies repeatedly.
  viewport-webkit-shards:
    name: viewport-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: browser
            command: node tests/ui/browser.mjs
          - name: mobile-state
            command: node tests/ui/mobile-state.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install matching Playwright package
        run: npm install --no-save --save-exact playwright@1.55.0
      - name: Verify pinned Chromium and WebKit image
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright';
          for (const browserType of [chromium, webkit]) {
            const browser = await browserType.launch({ headless: true });
            await browser.close();
          }
          NODE
      - name: Run exact UI browser shard
        env:
          CI: '1'
          UI_SHOTS: tests/ui-shots
        run: ${{ matrix.command }}
      - name: Upload shard screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit-${{ matrix.name }}
          path: tests/ui-shots
          if-no-files-found: ignore
          retention-days: 7

  # Chromium-only suites share one of three runners. The seven AI/browser
  # regressions were previously seven separate Actions jobs even though the
  # repository already defines the exact same suite as `npm run ai:browser`.
  # Keeping the suite intact on one runner removes six repeated checkout /
  # Playwright-cache / npm-install setup cycles and sharply reduces runner-slot
  # contention with cross-binary accuracy.
  viewport-shards:
    name: viewport-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: analysis-navigation
            command: node tests/ui/analysis-navigation.mjs
          - name: accessibility
            command: node tests/ui/accessibility.mjs
          - name: ai-browser
            command: npm run ai:browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-v1
      - name: Install pinned Playwright Chromium with dependency fallback
        shell: bash
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install chromium
          if ! node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          NODE
          then
            echo 'Preinstalled runner libraries are insufficient; installing pinned Chromium OS dependencies.'
            npx --no-install playwright install-deps chromium
          fi
      - name: Run exact UI browser shard
        env:
          CI: '1'
          UI_SHOTS: tests/ui-shots
        run: ${{ matrix.command }}
      - name: Upload shard screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit-${{ matrix.name }}
          path: tests/ui-shots
          if-no-files-found: ignore
          retention-days: 7

  viewport-regression:
    name: viewport-regression
    if: always()
    needs: [viewport-webkit-shards, viewport-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every viewport shard
        env:
          WEBKIT_SHARDS_RESULT: ${{ needs.viewport-webkit-shards.result }}
          CHROMIUM_SHARDS_RESULT: ${{ needs.viewport-shards.result }}
        shell: bash
        run: |
          if [[ "$WEBKIT_SHARDS_RESULT" != "success" || "$CHROMIUM_SHARDS_RESULT" != "success" ]]; then
            echo "::error::UI viewport shard failed (webkit=$WEBKIT_SHARDS_RESULT, chromium=$CHROMIUM_SHARDS_RESULT)."
            exit 1
          fi
      - name: Download screenshot audit shards
        uses: actions/download-artifact@v4
        with:
          pattern: ui-screenshot-audit-*
          path: tests/ui-shots-shards
      - name: Verify screenshot audit
        run: |
          test -d tests/ui-shots-shards
          test "$(find tests/ui-shots-shards -type f -name '*.png' | wc -l)" -ge 30
      - name: Upload combined screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit
          path: tests/ui-shots-shards
          if-no-files-found: error
          retention-days: 7

  browser-matrix:
    name: browser-matrix
    if: always()
    needs: [browser-regression, viewport-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both browser projections
        env:
          BROWSER_RESULT: ${{ needs.browser-regression.result }}
          VIEWPORT_RESULT: ${{ needs.viewport-regression.result }}
        shell: bash
        run: |
          if [[ "$BROWSER_RESULT" != "success" || "$VIEWPORT_RESULT" != "success" ]]; then
            echo "::error::UI browser regression failed (browser=$BROWSER_RESULT, viewport=$VIEWPORT_RESULT)."
            exit 1
          fi
