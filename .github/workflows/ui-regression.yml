name: UI regression

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/app.js'
      - 'js/ui.js'
      - 'js/ux.js'
      - 'js/ui/**'
      - 'js/panels.js'
      - 'js/tools.js'
      - 'js/viewer.js'
      - 'js/graphview.js'
      - 'tests/browser.mjs'
      - 'tests/ui/**'
      - 'tests/ux.mjs'
      - 'package.json'
      - '.github/workflows/ui-regression.yml'
  workflow_dispatch:

concurrency:
  group: ui-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ui:test

  browser-regression:
    name: browser-regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-v1
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install-deps chromium
          npx --no-install playwright install chromium
      - name: Run existing browser regression
        run: npm run browser

  viewport-regression:
    name: viewport-regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore pinned Playwright viewport cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-webkit-v1
          restore-keys: |
            playwright-${{ runner.os }}-1.55.0-chromium-v1
      - name: Install pinned Playwright viewport engines
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install-deps webkit
          npx --no-install playwright install chromium webkit
      - name: Run UI viewport matrix
        env:
          CI: '1'
          UI_SHOTS: tests/ui-shots
        run: npm run ui:browser
      - name: Verify screenshot audit
        run: |
          test -d tests/ui-shots
          test "$(find tests/ui-shots -type f -name '*.png' | wc -l)" -ge 30
      - name: Upload screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit
          path: tests/ui-shots
          if-no-files-found: error
          retention-days: 7

  browser-matrix:
    name: browser-matrix
    if: always()
    needs: [browser-regression, viewport-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both browser projections
        env:
          BROWSER_RESULT: ${{ needs.browser-regression.result }}
          VIEWPORT_RESULT: ${{ needs.viewport-regression.result }}
        shell: bash
        run: |
          if [[ "$BROWSER_RESULT" != "success" || "$VIEWPORT_RESULT" != "success" ]]; then
            echo "::error::UI browser regression failed (browser=$BROWSER_RESULT, viewport=$VIEWPORT_RESULT)."
            exit 1
          fi
