name: UI regression

on:
  pull_request:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/app.js'
      - 'js/ui.js'
      - 'js/ux.js'
      - 'js/ui/**'
      - 'js/panels.js'
      - 'js/tools.js'
      - 'js/viewer.js'
      - 'js/graphview.js'
      - 'tests/browser.mjs'
      - 'tests/ui/**'
      - 'tests/ux.mjs'
      - 'package.json'
      - '.github/workflows/ui-regression.yml'
  workflow_dispatch:

concurrency:
  group: ui-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ui:test

  browser-regression:
    name: browser-regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-v1
      - name: Install pinned Playwright Chromium with dependency fallback
        shell: bash
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install chromium
          if ! node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          NODE
          then
            echo 'Preinstalled runner libraries are insufficient; installing pinned Chromium OS dependencies.'
            npx --no-install playwright install-deps chromium
          fi
      - name: Run existing browser regression
        run: npm run browser

  # This is the only viewport suite that actually exercises WebKit. Run it in
  # Playwright's pinned image so GitHub-hosted runners do not spend 10+ minutes
  # installing WebKit system packages on every PR.
  viewport-browser:
    name: viewport-browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install matching Playwright package
        run: npm install --no-save --save-exact playwright@1.55.0
      - name: Verify pinned Chromium and WebKit image
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium, webkit } from 'playwright';
          for (const browserType of [chromium, webkit]) {
            const browser = await browserType.launch({ headless: true });
            await browser.close();
          }
          NODE
      - name: Run exact UI browser shard
        env:
          CI: '1'
          UI_SHOTS: tests/ui-shots
        run: node tests/ui/browser.mjs
      - name: Upload shard screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit-browser
          path: tests/ui-shots
          if-no-files-found: ignore
          retention-days: 7

  # All remaining viewport suites launch Chromium only. Keep them fully
  # parallel, but do not download/install WebKit or its OS dependencies.
  viewport-shards:
    name: viewport-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - name: analysis-navigation
            command: node tests/ui/analysis-navigation.mjs
          - name: mobile-state
            command: node tests/ui/mobile-state.mjs
          - name: accessibility
            command: node tests/ui/accessibility.mjs
          - name: ai-launcher
            command: node tests/ai-ui-launcher.mjs
          - name: ai-dev-profile
            command: node tests/ai-ui-dev-profile.mjs
          - name: ai-panel
            command: node tests/ai-ui-panel.mjs
          - name: ai-proposal
            command: node tests/ai-ui-proposal.mjs
          - name: ai-fallback
            command: node tests/ai-ui-fallback.mjs
          - name: ai-core-integration
            command: node tests/ai-ui-core-integration.mjs
          - name: dev-agent-browser
            command: node tests/dev-agent/round2-browser.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium-v1
      - name: Install pinned Playwright Chromium with dependency fallback
        shell: bash
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install chromium
          if ! node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          await browser.close();
          NODE
          then
            echo 'Preinstalled runner libraries are insufficient; installing pinned Chromium OS dependencies.'
            npx --no-install playwright install-deps chromium
          fi
      - name: Run exact UI browser shard
        env:
          CI: '1'
          UI_SHOTS: tests/ui-shots
        run: ${{ matrix.command }}
      - name: Upload shard screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit-${{ matrix.name }}
          path: tests/ui-shots
          if-no-files-found: ignore
          retention-days: 7

  viewport-regression:
    name: viewport-regression
    if: always()
    needs: [viewport-browser, viewport-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every viewport shard
        env:
          BROWSER_RESULT: ${{ needs.viewport-browser.result }}
          SHARDS_RESULT: ${{ needs.viewport-shards.result }}
        shell: bash
        run: |
          if [[ "$BROWSER_RESULT" != "success" || "$SHARDS_RESULT" != "success" ]]; then
            echo "::error::UI viewport shard failed (browser=$BROWSER_RESULT, chromium-shards=$SHARDS_RESULT)."
            exit 1
          fi
      - name: Download screenshot audit shards
        uses: actions/download-artifact@v4
        with:
          pattern: ui-screenshot-audit-*
          path: tests/ui-shots-shards
      - name: Verify screenshot audit
        run: |
          test -d tests/ui-shots-shards
          test "$(find tests/ui-shots-shards -type f -name '*.png' | wc -l)" -ge 30
      - name: Upload combined screenshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshot-audit
          path: tests/ui-shots-shards
          if-no-files-found: error
          retention-days: 7

  browser-matrix:
    name: browser-matrix
    if: always()
    needs: [browser-regression, viewport-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both browser projections
        env:
          BROWSER_RESULT: ${{ needs.browser-regression.result }}
          VIEWPORT_RESULT: ${{ needs.viewport-regression.result }}
        shell: bash
        run: |
          if [[ "$BROWSER_RESULT" != "success" || "$VIEWPORT_RESULT" != "success" ]]; then
            echo "::error::UI browser regression failed (browser=$BROWSER_RESULT, viewport=$VIEWPORT_RESULT)."
            exit 1
          fi
