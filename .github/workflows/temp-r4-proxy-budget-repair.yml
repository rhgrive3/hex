name: TEMP R4 proxy budget repair

on:
  push:
    branches:
      - fix/r4-proxy-progress-budget
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r4-proxy-progress-budget
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply proxy-free progress budget repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          engine = Path('js/ai/dev/supervisor/dev-supervisor-engine-v0.js')
          text = engine.read_text()

          old = """    try {\n      for (let step = 0; step < this.maxDecisions; step++) {\n"""
          new = """    let decisionsSinceProgress = 0;\n    const markProgress = () => { decisionsSinceProgress = 0; };\n\n    try {\n      while (decisionsSinceProgress < this.maxDecisions) {\n        decisionsSinceProgress += 1;\n"""
          assert old in text, 'decision-loop anchor changed'
          text = text.replace(old, new, 1)

          replacements = [
            (
              """              history.push({ kind: 'tool-result', tool: decision.tool, purpose: decision.purpose, result: sanitize(result) });\n              continue;\n""",
              """              history.push({ kind: 'tool-result', tool: decision.tool, purpose: decision.purpose, result: sanitize(result) });\n              markProgress();\n              continue;\n""",
              1,
            ),
            (
              """              history.push({ kind: 'tool-result', tool: decision.tool, purpose: decision.purpose, result: sanitize(result) });\n              history.push({ kind: 'runtime-activation', ...this.observeRuntimeIdentityResult(result) });\n              continue;\n""",
              """              history.push({ kind: 'tool-result', tool: decision.tool, purpose: decision.purpose, result: sanitize(result) });\n              history.push({ kind: 'runtime-activation', ...this.observeRuntimeIdentityResult(result) });\n              markProgress();\n              continue;\n""",
              1,
            ),
            (
              """              if (decision.tool === requiredBootstrapCapability) requiredBootstrapObserved = true;\n              continue;\n""",
              """              if (decision.tool === requiredBootstrapCapability) requiredBootstrapObserved = true;\n              markProgress();\n              continue;\n""",
              1,
            ),
            (
              """            this.settings.setLastRun(run);\n            history.push({ kind: 'tool-result', tool: decision.tool, purpose: decision.purpose, result: sanitize(executed.result) });\n            continue;\n""",
              """            this.settings.setLastRun(run);\n            history.push({ kind: 'tool-result', tool: decision.tool, purpose: decision.purpose, result: sanitize(executed.result) });\n            markProgress();\n            continue;\n""",
              1,
            ),
          ]
          for old_piece, new_piece, count in replacements:
            assert text.count(old_piece) >= count, f'missing progress anchor: {old_piece[:100]!r}'
            text = text.replace(old_piece, new_piece, count)

          engine.write_text(text)

          wrapper = Path('js/ai/dev/supervisor/dev-supervisor-progress-budget.js')
          wrapper.write_text("""import { DevSupervisorEngineV0 as BaseDevSupervisorEngineV0 } from './dev-supervisor-engine-v0.js';\n\n/* Compatibility name retained for callers introduced by PR #780.\n * Progress accounting now lives in the base decision loop itself so no bridge\n * Proxy or property interposition is required. This is important because the\n * production ChatGPT bridge exposes a frozen request method and ECMAScript\n * Proxy invariants forbid a get trap from substituting another value for a\n * non-configurable, non-writable property. */\nexport class ProgressBudgetDevSupervisorEngineV0 extends BaseDevSupervisorEngineV0 {}\n""")

          test = Path('tests/dev-agent/supervisor-progress-budget.mjs')
          test.write_text(r'''import assert from 'node:assert/strict';
import { DevSupervisorV0 } from '../../js/ai/dev/supervisor/dev-supervisor-v0.js';
import { ProgressBudgetDevSupervisorEngineV0 } from '../../js/ai/dev/supervisor/dev-supervisor-progress-budget.js';
import { DevAgentUiSettings } from '../../js/ai/dev/ui/settings.js';
import { AGENT_PROFILE } from '../../js/ai/dev/policy/agent-profile.js';
import { DEV_RUN_STATUS } from '../../js/ai/dev/run/dev-run.js';

await successfulToolsResetDecisionBudgetWithFrozenBridge();
console.log('Dev Supervisor progress budget: ok');

async function successfulToolsResetDecisionBudgetWithFrozenBridge() {
  const requests = [];
  const client = workerClient(async () => [{ tabNodeId: 'same-tab' }]);
  const supervisor = new DevSupervisorV0({
    workerClient: client,
    idFactory: (kind) => `progress-${kind}`,
    now: () => '2026-08-18T08:00:00.000Z',
  });
  const storage = { getItem: () => null, setItem() {} };
  const settings = new DevAgentUiSettings({ storage });
  settings.setAgentProfile(AGENT_PROFILE.DEV);

  let count = 0;
  const bridge = Object.freeze({
    async request(_prompt, options = {}) {
      count += 1;
      requests.push(options.sessionKey);
      if (count <= 5) {
        return { text: JSON.stringify({ type: 'tool', tool: 'worker.discover', arguments: {}, purpose: `progress-${count}` }) };
      }
      return { text: JSON.stringify({ type: 'final', answer: 'done', completedTasks: ['progress-budget'], remaining: [] }) };
    },
  });
  const descriptor = Object.getOwnPropertyDescriptor(bridge, 'request');
  assert.equal(descriptor.configurable, false);
  assert.equal(descriptor.writable, false);

  const engine = new ProgressBudgetDevSupervisorEngineV0({ supervisor, settings, bridge, maxDecisions: 2 });
  const result = await engine.run({ goal: 'make repeated successful tool progress', conversationId: 'hex-progress' });

  assert.equal(result.answer, 'done');
  assert.equal(requests.length, 6, 'successful tool calls must replenish the no-progress decision budget');
  assert.equal(new Set(requests).size, 1, 'budget replenishment must retain the same Supervisor session');
  assert.equal(settings.lastRun.status, DEV_RUN_STATUS.COMPLETED);
}

function workerClient(discover) {
  const noop = async (args = {}) => args;
  return {
    enabled: true,
    discover,
    claim: noop,
    createChat: noop,
    send: noop,
    observe: noop,
    followup: noop,
    nudge: noop,
    stop: noop,
    result: noop,
    release: noop,
    waitEvent: async () => ({ type: 'worker.completed', data: {}, observedAt: '2026-08-18T08:00:00.000Z' }),
  };
}
''')
          PY
      - name: Focused regression
        run: node tests/dev-agent/supervisor-progress-budget.mjs
      - name: Dev Agent regression
        run: npm run dev-agent:test
      - name: Build canonical userscript
        run: npm run userscript:build
      - name: Canonical userscript regression
        run: npm run userscript:test
      - name: Commit repair and generated artifacts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-r4-proxy-budget-repair.yml
          git add js/ai/dev/supervisor/dev-supervisor-engine-v0.js \
                  js/ai/dev/supervisor/dev-supervisor-progress-budget.js \
                  tests/dev-agent/supervisor-progress-budget.mjs \
                  userscript/hex.user.template.js \
                  userscript/release-version.json
          git commit -m "Fix R4 bootstrap bridge Proxy invariant"
          git push origin HEAD:fix/r4-proxy-progress-budget
