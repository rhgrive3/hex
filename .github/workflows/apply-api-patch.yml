name: Apply runtime API patch

on:
  push:
    branches:
      - accuracy-ywp-tsumtsum-20260814
    paths:
      - .github/workflows/apply-api-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accuracy-ywp-tsumtsum-20260814
          fetch-depth: 0
      - name: Patch runtime API knowledge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/blocks.js')
          s = p.read_text()

          replacements = [
            (
              "{ id: 'objc_retain', re: /^_?(objc_retain|objc_release|objc_autorelease|objc_storeStrong|objc_retainAutorelease)/i,",
              "{ id: 'objc_retain', re: /^_?(objc_retain|objc_release|objc_autorelease|objc_storeStrong|objc_retainAutorelease(?:ReturnValue)?|objc_retainAutoreleasedReturnValue|objc_autoreleaseReturnValue|objc_claimAutoreleasedReturnValue|objc_unsafeClaimAutoreleasedReturnValue)/i,"
            ),
            (
              "opt_class|opt_isKindOfClass|opt_respondsToSelector|getClass",
              "opt_class|opt_self|opt_isKindOfClass|opt_respondsToSelector|getClass"
            ),
            (
              "storeEnumTagSinglePayload|getEnumTagSinglePayload|arrayInitWithCopy",
              "storeEnumTagSinglePayload|getEnumTagSinglePayload|storeEnumTagMultiPayload|getEnumCaseMultiPayload|arrayInitWithCopy"
            ),
            (
              "cxa_(atexit|guard_acquire|guard_release|throw|begin_catch",
              "cxa_(atexit|guard_acquire|guard_release|guard_abort|throw|begin_catch"
            ),
          ]
          for old, new in replacements:
            assert old in s, old
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add js/blocks.js
          git commit -m 'fix: classify common ObjC Swift and C++ runtime calls [api-patched]'
          git push origin HEAD:accuracy-ywp-tsumtsum-20260814
