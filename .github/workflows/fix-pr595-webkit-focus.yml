name: Finalize PR595 WebKit focus regression
on:
  push:
    branches:
      - finish-ai-control-plane
permissions:
  contents: write
jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden synthetic keyboard viewport focus helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/ui/mobile-state.mjs')
          s = p.read_text()
          old = """  const retained = await field.evaluate((node) => document.activeElement === node);\n  if (!retained) await field.focus();\n  await page.waitForTimeout(16);\n}"""
          new = """  const retained = await field.evaluate((node) => document.activeElement === node);\n  if (!retained) await field.focus();\n  // WebKit may drop focus one frame after Playwright's synthetic viewport resize.\n  // Settle layout, then restore focus once more; the caller still strictly\n  // verifies activeElement and visual visibility after this helper returns.\n  await page.waitForTimeout(16);\n  const settled = await field.evaluate((node) => document.activeElement === node);\n  if (!settled) {\n    await field.focus();\n    await page.waitForTimeout(16);\n  }\n}"""
          if old not in s:
              raise SystemExit('focus helper anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install browser test runtime
        run: |
          npm install --no-save --save-exact playwright@1.55.0
          npx --no-install playwright install-deps chromium webkit
          npx --no-install playwright install chromium webkit
      - name: Validate mobile focus state
        run: node tests/ui/mobile-state.mjs
      - name: Finalize branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/ui/mobile-state.mjs
          git commit -m "test(ui): stabilize WebKit keyboard viewport focus"
          git rm .github/workflows/fix-pr595-webkit-focus.yml
          git commit -m "chore: remove PR595 focus finalizer"
          git push origin HEAD:finish-ai-control-plane