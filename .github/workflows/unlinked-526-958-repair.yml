name: Unlinked issues 526 958 repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'work/unlinked-526-958-call-inputs'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconcile dependency branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin fix/issues-925-926-932-935-948-current-main
          git merge origin/fix/issues-925-926-932-935-948-current-main --no-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical call-input repair
        run: python3 .github/apply-unlinked-526-958.py
      - name: Rebuild canonical userscript before suites
        run: npm run userscript:build
      - name: Focused regression
        run: node tests/semantic-v2/issues-526-958-call-inputs.test.mjs
      - name: Semantic v2 suite
        run: npm run semantic-v2:test
      - name: Phase 5 ABI suite
        run: npm run phase5:test
      - name: Remove bootstrap files
        run: rm -f .github/apply-unlinked-526-958.py .github/workflows/unlinked-526-958-repair.yml
      - name: Full repository check
        run: npm run check
      - name: Generated-output idempotence and diff hygiene
        run: |
          before=$(git diff -- userscript/hex.user.template.js userscript/release-version.json | git hash-object --stdin)
          npm run userscript:build
          after=$(git diff -- userscript/hex.user.template.js userscript/release-version.json | git hash-object --stdin)
          test "$before" = "$after"
          git diff --check
      - name: Publish verified implementation
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'fix: preserve ABI call inputs before SSA (#526 #958)'
          git push origin HEAD:${{ github.head_ref }}
