name: Verify existing top unlinked fixes
on:
  push:
    branches:
      - fix/top-issues-496-434
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          npm run check
      - name: Finalize
        run: |
          rm -f .github/workflows/verify-top-unlinked.yml
          git add -A
          git commit -m "chore: finalize validated unlinked fixes" || exit 0
          git push origin HEAD
