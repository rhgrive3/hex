name: Verify issue 428 schema provenance

on:
  push:
    branches:
      - fix/issue-428-schema-provenance

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-428-schema-provenance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/apply-issue-428.py
      - run: node tests/issue-428-schema-provenance.mjs
      - run: node tests/run.js
      - run: npm run lint
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/schema.js package.json tests/issue-428-schema-provenance.mjs
          git diff --cached --check
          git commit -m 'fix: require provenance for unrolled schemas (#428)'
          git push origin HEAD:fix/issue-428-schema-provenance
