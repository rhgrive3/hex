name: Unlinked issues 954 955 repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'work/unlinked-954-955-win64-abi'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconcile dependency branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin fix/issues-924-930-934-940-941
          git merge origin/fix/issues-924-930-934-940-941 --no-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Win64 ABI repair
        run: |
          python3 .github/apply-unlinked-954-955.py
          python3 .github/adjust-unlinked-954-955.py
      - name: Rebuild canonical userscript before suites
        run: npm run userscript:build
      - name: Focused regression
        run: node --test tests/phase5/abi/issues-954-955-win64-abi.test.mjs
      - name: Phase 5 suite
        run: npm run phase5:test
      - name: Remove bootstrap files
        run: rm -f .github/apply-unlinked-954-955.py .github/adjust-unlinked-954-955.py .github/workflows/unlinked-954-955-repair.yml
      - name: Full repository check
        run: npm run check
      - name: Generated-output idempotence and diff hygiene
        run: |
          before=$(git diff -- userscript/hex.user.template.js userscript/release-version.json | git hash-object --stdin)
          npm run userscript:build
          after=$(git diff -- userscript/hex.user.template.js userscript/release-version.json | git hash-object --stdin)
          test "$before" = "$after"
          git diff --check
      - name: Publish verified implementation
        run: |
          git add -A
          git diff --cached --check
          git commit -m 'fix: preserve Win64 calling-convention and sret truth (#954 #955)'
          git push origin HEAD:${{ github.head_ref }}
