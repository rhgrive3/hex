name: Verify runtime and dataflow unlinked batch
on:
  push:
    branches:
      - fix/unlinked-runtime-432-441-20260815
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - run: python3 tools/fix-runtime-unlinked.py
      - run: node tests/issues-433-441-unlinked.mjs
      - run: npm run check
      - name: Commit verified implementation
        run: |
          rm -f tools/fix-runtime-unlinked.py .github/workflows/verify-runtime-unlinked.yml
          git add -A
          git commit -m "fix: harden runtime/dataflow correctness (#433-#441)"
          git push origin HEAD
