name: P3 TsumTsum asm fallback diff
on:
  push:
    branches: [hex/p3-local-debug-350]
    paths: ['.github/workflows/p3-tsum-asm-diff.yml']
permissions:
  contents: read
env:
  HEX_FIXTURE_TSUMTSUM_URL: https://raw.githubusercontent.com/rhgrive3/hex/bd7bd61d093592d07fdd9e9b14a859e19dd4c3a9/tests/TsumTsum
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            ref: b132f5add38a9bb335281315146fa5643a7481b5
          - label: phase3
            ref: 75c393a7e89a1154963b03a34b8e2ada0bebe9f9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fetch-real-fixtures.mjs TsumTsum
      - name: Compare known fallback functions
        env:
          P3_LABEL: ${{ matrix.label }}
        run: |
          cat > tests/.p3-tsum-asm-diff.mjs <<'EOF'
          import { openBinary } from './harness.mjs';
          import { decompile } from '../js/decompile.js';
          const ranges = [
            [0x10052eba0n,0x10052eca0n],
            [0x1005eff8cn,0x1005f03c0n],
            [0x100822ce4n,0x100822e20n],
            [0x1011af0d4n,0x1011af380n],
            [0x101a438e4n,0x101a43b10n],
          ];
          const w = await openBinary('tests/.real-fixtures/TsumTsum');
          for (const [a,end] of ranges) {
            const t=Date.now();
            const model=await w.analyze(a,end);
            let result;
            try {
              result=decompile(model,{addr:a,rowOfAddress:x=>x==null?null:Number((x-w.region.vmAddr)/4n),addrOfRow:r=>w.region.vmAddr+BigInt(r)*4n,symbolFor:x=>w.symbols.nameAt(x)});
            } catch (err) {
              console.error(`[P3ASM ${process.env.P3_LABEL}] 0x${a.toString(16)} ERROR ${err?.stack||err}`);
              continue;
            }
            const semanticLines=(result.lines||[]).filter(l=>l.kind==='stmt'||l.kind==='ctrl');
            const asm=semanticLines.filter(l=>/__asm\(/.test(l.text)&&!/__asm\("br\s+x\d+"\)/.test(l.text));
            console.error(`[P3ASM ${process.env.P3_LABEL}] 0x${a.toString(16)} ms=${Date.now()-t} lines=${semanticLines.length} asm=${asm.length}`);
            for (const l of asm) console.error(`[P3ASM-LINE ${process.env.P3_LABEL}] 0x${a.toString(16)} ${l.text}`);
          }
          EOF
          node --max-old-space-size=6000 tests/.p3-tsum-asm-diff.mjs
