name: Phase 6 ownership

on:
  pull_request:
    paths:
      - 'js/targets/architecture/**'
      - 'js/targets/abi/**'
      - 'js/analysis/semantic-function.js'
      - 'js/decompiler/**'
      - 'js/binary/elf.js'
      - 'js/platform/capability-maturity.js'
      - 'tests/phase6/**'
      - 'tests/capability-maturity.mjs'
      - 'tools/validation/phase6/**'
      - 'tools/validation/phase6-ownership.mjs'
      - 'tools/validation/phase-ownership/phase6.json'
      - 'reports/phase5/**'
      - 'reports/phase6/**'
      - '.github/workflows/phase6-*.yml'
      - 'docs/SUPPORT_MATRIX.md'
      - 'docs/PHASE6_CHECKPOINT.md'
      - 'package.json'

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ownership manifest structure
        run: node tools/validation/phase6-ownership.mjs --check-manifest
      - name: Run Phase 6 governance regressions
        run: node tests/phase6/run.mjs --group ownership
      - name: Run Phase 6 canonical discovery regressions
        run: node tests/phase6/run.mjs --group foundation
      # Ownership is judged from the actual changed-file inventory between the
      # exact base and head commits, never from the PR description.
      - name: Enforce exact-SHA changed-file inventory
        if: github.head_ref == 'hex/p6-riscv64-integration'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/validation/phase6-ownership.mjs --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
