name: Phase 2 MachineEffects Integration

on:
  pull_request:
    paths:
      - 'js/targets/architecture/**'
      - 'js/semantics/effects/**'
      - 'js/semantics/compat/**'
      - 'js/ir-core.js'
      - 'tests/machine-effects/**'
      - 'tools/validation/machine-effects/**'
      - '.github/workflows/phase2-effects-integration.yml'
      - '.github/workflows/ghidra-differential.yml'
      - 'userscript/hex.user.template.js'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'js/targets/architecture/**'
      - 'js/semantics/effects/**'
      - 'js/semantics/compat/**'
      - 'js/ir-core.js'
      - 'tests/machine-effects/**'
      - 'tools/validation/machine-effects/**'
      - '.github/workflows/phase2-effects-integration.yml'
      - '.github/workflows/ghidra-differential.yml'
      - 'userscript/hex.user.template.js'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: phase2-machine-effects-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  effects-core:
    name: effects-core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run effects:test

  semantic-decompiler-shards:
    name: phase2-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: semantic
            command: npm run semantic:test
          - name: decompiler
            command: npm run decompiler:test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}

  semantic-decompiler:
    name: semantic-decompiler
    if: always()
    needs: semantic-decompiler-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require semantic and decompiler shards
        env:
          RESULT: ${{ needs.semantic-decompiler-shards.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Semantic/decompiler shard failed ($RESULT)."
            exit 1
          fi

  platform-runtime-shards:
    name: phase2-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: platform
            command: npm run platform:test
          - name: runtime
            command: npm run runtime:test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}

  platform-runtime:
    name: platform-runtime
    if: always()
    needs: platform-runtime-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require platform and runtime shards
        env:
          RESULT: ${{ needs.platform-runtime-shards.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Platform/runtime shard failed ($RESULT)."
            exit 1
          fi

  baseline-check:
    name: baseline-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run benchmark:baseline

  userscript-ios:
    name: userscript-ios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and test protected userscript runtime
        run: npm run userscript:test
      - name: Require committed loader synchronization
        run: git diff --exit-code -- userscript/hex.user.template.js
