name: Cleanup generated dependency artifacts

on:
  push:
    branches:
      - fix-remaining-macho-issues

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-remaining-macho-issues
          fetch-depth: 0
      - name: Remove generated artifacts and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r node_modules
          git rm .github/workflows/cleanup-node-modules.yml
          git commit -m "Remove generated dependency artifacts"
          git push origin HEAD:fix-remaining-macho-issues
