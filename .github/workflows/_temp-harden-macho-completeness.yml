name: Temp harden Mach-O completeness
on:
  push:
    branches: [fix-macho-symbol-truth-completeness]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-macho-symbol-truth-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch fail-closed Mach-O metadata status
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('js/binary/macho-dyld.js')
          s = p.read_text()
          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'missing expected macho-dyld snippet: {old[:100]!r}')
              s = s.replace(old, new, 1)

          rep("  if (!dc.size || dc.offset + dc.size > r.length || dc.size < 28) return null;",
              "  if (!dc?.size || dc.offset + dc.size > r.length || dc.size < 28) {\n    image.metadata.chainedFixups = { complete:false, symbolsComplete:false, importsComplete:false, bindingSitesComplete:false, partialReason:'invalid-or-truncated-payload' };\n    image.warnings.push('chained-fixups payload is missing or truncated; results are partial');\n    return null;\n  }")
          rep("  image.metadata.chainedFixups = { version, startsOffset, importsCount, importsFormat, symbolsFormat, complete: true, symbolsComplete: true };",
              "  const status = image.metadata.chainedFixups = { version, startsOffset, importsCount, importsFormat, symbolsFormat, complete:true, symbolsComplete:true, importsComplete:true };\n  if (version !== 0) {\n    status.complete=false; status.importsComplete=false; status.importsPartialReason='unsupported-version';\n    image.warnings.push(`chained-fixups version ${version} is not supported; results are partial`);\n    return null;\n  }")
          rep("  if (!entrySize) { image.warnings.push(`unknown chained import format ${importsFormat}`); return null; }",
              "  if (!entrySize) { status.complete=false; status.importsComplete=false; status.importsPartialReason='unsupported-import-format'; image.warnings.push(`unknown chained import format ${importsFormat}`); return null; }")
          rep("  if (importsBase + importsCount * entrySize > base + dc.size) { image.warnings.push('chained imports are truncated'); return null; }",
              "  if (importsOffset >= dc.size || symbolsOffset >= dc.size || importsBase + importsCount * entrySize > base + dc.size) { status.complete=false; status.importsComplete=false; status.importsPartialReason='truncated-import-table'; image.warnings.push('chained imports are truncated'); return null; }")
          rep("    if(!budget.take({inputBytes:entrySize,records:1,objects:1,operations:2,estimatedHeapBytes:224},'chained-import-record')){image.metadata.chainedFixups.importsComplete=false;image.metadata.chainedFixups.importsPartialReason='metadata-budget';break;}",
              "    if(!budget.take({inputBytes:entrySize,records:1,objects:1,operations:2,estimatedHeapBytes:224},'chained-import-record')){status.complete=false;status.importsComplete=false;status.importsPartialReason='metadata-budget';break;}")
          rep("    if (strp < base || strp >= base + dc.size) continue;",
              "    if (strp < base || strp >= base + dc.size) { status.complete=false;status.importsComplete=false;status.importsPartialReason ||= 'invalid-name-offset';continue; }")
          rep("    if (!name) continue;",
              "    if (!name) { status.complete=false;status.importsComplete=false;status.importsPartialReason ||= 'invalid-import-name';continue; }")
          rep("    if(!budget.take({stringBytes:name.length*2,estimatedHeapBytes:name.length*2+32},'chained-import-name'))break;",
              "    if(!budget.take({stringBytes:name.length*2,estimatedHeapBytes:name.length*2+32},'chained-import-name')){status.complete=false;status.importsComplete=false;status.importsPartialReason='metadata-budget';break;}")

          rep("  const budget=ensureMachOMetadataBudget(image,sharedBudget);\n  if (!dc || !dc.size || dc.offset + dc.size > r.length) return null;\n  const BIND_OPCODE_MASK = 0xf0, BIND_IMMEDIATE_MASK = 0x0f;",
              "  const budget=ensureMachOMetadataBudget(image,sharedBudget);\n  image.metadata.dyldBindings ||= { complete:true, streams:{} };\n  if (!dc || !dc.size) return null;\n  if (dc.offset + dc.size > r.length) {\n    const invalid={source,complete:false,decodedBinds:0,threadedApplies:0,unsupportedOpcodes:[],partialReason:'truncated-range'};\n    image.metadata.dyldBindings.complete=false;image.metadata.dyldBindings.streams[source]=invalid;\n    image.warnings.push(`${source}: binding stream is truncated`);return invalid;\n  }\n  const BIND_OPCODE_MASK = 0xf0, BIND_IMMEDIATE_MASK = 0x0f;")

          rep("  const budget=ensureMachOMetadataBudget(image,sharedBudget);\n  if (!dc || !dc.size || dc.offset + dc.size > r.length) return null;\n  const base = dc.offset, end = dc.offset + dc.size;",
              "  const budget=ensureMachOMetadataBudget(image,sharedBudget);\n  if (!dc || !dc.size) return null;\n  if (dc.offset + dc.size > r.length) {\n    const invalid={complete:false,nodes:0,edges:0,cycleDetected:false,budgetExceeded:false,partialReason:'truncated-range'};\n    image.metadata.exportTrie=invalid;image.warnings.push('exports trie: payload is truncated');return invalid;\n  }\n  const base = dc.offset, end = dc.offset + dc.size;")
          p.write_text(s)

          p = Path('js/binary/macho.js')
          s = p.read_text()
          if "import { createMachOMetadataBudget, ensureMachOMetadataBudget } from './macho-budget.js';" not in s:
              raise SystemExit('missing macho budget import')
          s = s.replace("import { createMachOMetadataBudget, ensureMachOMetadataBudget } from './macho-budget.js';",
                        "import { createMachOMetadataBudget, ensureMachOMetadataBudget, markMachOMetadataPartial } from './macho-budget.js';", 1)
          old = "  if (st.symoff + st.nsyms * ent > r.length || st.stroff + st.strsize > r.length) {\n    image.warnings.push('Mach-O symbol table is truncated'); return;\n  }"
          new = "  if (st.symoff + st.nsyms * ent > r.length || st.stroff + st.strsize > r.length) {\n    markMachOMetadataPartial(image, 'symbol-table-truncated');\n    image.warnings.push('Mach-O symbol table is truncated'); return;\n  }"
          if old not in s: raise SystemExit('missing symtab truncation snippet')
          s = s.replace(old,new,1)
          old = "    if (p + 8 > commandEnd) { image.warnings.push(`truncated load command ${i}`); break; }"
          new = "    if (p + 8 > commandEnd) { markMachOMetadataPartial(image, 'load-command-truncated'); image.warnings.push(`truncated load command ${i}`); break; }"
          if old not in s: raise SystemExit('missing truncated command snippet')
          s = s.replace(old,new,1)
          old = "      image.warnings.push(`invalid load command ${i} size ${cmdsize}`);\n      break;"
          new = "      markMachOMetadataPartial(image, 'load-command-invalid-size');\n      image.warnings.push(`invalid load command ${i} size ${cmdsize}`);\n      break;"
          if old not in s: raise SystemExit('missing invalid command snippet')
          s = s.replace(old,new,1)
          old = "      image.warnings.push(`load command 0x${cmd.toString(16)}: ${e.message}`);"
          new = "      markMachOMetadataPartial(image, `load-command-0x${cmd.toString(16)}-parse-error`);\n      image.warnings.push(`load command 0x${cmd.toString(16)}: ${e.message}`);"
          if old not in s: raise SystemExit('missing command catch snippet')
          s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - run: node tests/issues-521-527.mjs
      - run: npm run userscript:build
      - name: Commit parser and generated bundle changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/binary/macho-dyld.js js/binary/macho.js userscript/hex.user.template.js userscript/platform-worker.bundle.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fail closed on incomplete Mach-O metadata streams'
          git push origin HEAD:fix-macho-symbol-truth-completeness
