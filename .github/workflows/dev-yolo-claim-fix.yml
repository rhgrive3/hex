name: Apply Dev YOLO claim hydration repair

on:
  push:
    branches:
      - hex/fix-dev-yolo-worker-claim-hydration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hex/fix-dev-yolo-worker-claim-hydration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply narrow runtime and regression fixes
        run: python3 tools/tmp-dev-yolo-claim-fix.py
      - name: Run focused Dev and ChatGPT regressions
        run: |
          npm run dev-agent:test
          node tests/userscript-dev-worker-runtime.mjs
          node tests/chatgpt-web-runtime.mjs
      - name: Build protected userscript and run full userscript suite
        run: |
          npm run userscript:build
          npm run userscript:test
      - name: Commit canonical source, tests, and generated userscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/dev-yolo-claim-fix.yml tools/tmp-dev-yolo-claim-fix.py
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden Dev YOLO Worker claim hydration'
          git push origin HEAD:hex/fix-dev-yolo-worker-claim-hydration
