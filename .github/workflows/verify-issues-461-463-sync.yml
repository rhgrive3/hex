name: Verify issues 461 and 463 after main sync

on:
  push:
    branches:
      - fix/latest-463-461-binary-boundaries

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Focused binary regressions
        run: node tests/issues-461-463-binary.mjs
      - name: Full static and regression suite
        run: npm run check
      - name: Remove temporary verifier after success
        run: |
          rm -f .github/workflows/verify-issues-461-463-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary #461/#463 verifier" || exit 0
          git push
