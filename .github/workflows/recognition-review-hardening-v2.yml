name: Recognition review hardening v2

on:
  push:
    branches: [finish-recognition-knowledge-intelligence]

permissions:
  contents: write

jobs:
  harden-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count}, found {actual}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          # Fingerprint schema changes because operand normalization semantics change.
          replace('js/fingerprint/index.js', 'export const FUNCTION_FINGERPRINT_VERSION = 2;', 'export const FUNCTION_FINGERPRINT_VERSION = 3;')
          replace('js/fingerprint/index.js',
            "const REGEX_REG = /\\b([xwvsdqhb])(\\d{1,2})\\b/gi;\nconst IMM_HEX = /#?0x[0-9a-f]+/gi;",
            "const REGEX_REG = /\\b([xwvsdqhb])(\\d{1,2})\\b/gi;\nconst IMM_HEX = /#?0x[0-9a-f]+/gi;\n\nfunction registerFamily(cls) { return /^[xw]$/i.test(cls) ? 'gpr' : 'vec'; }\nfunction normalizeRegisters(text, options = {}) {\n  const registerMap = options.registerMap instanceof Map ? options.registerMap : new Map();\n  const registerCounters = options.registerCounters instanceof Map ? options.registerCounters : new Map();\n  return text.replace(REGEX_REG, (_m, cls, number) => {\n    const family = registerFamily(cls), key = `${family}:${number}`;\n    let id = registerMap.get(key);\n    if (id == null) {\n      id = registerCounters.get(family) || 0;\n      registerCounters.set(family, id + 1);\n      registerMap.set(key, id);\n    }\n    return `${cls.toLowerCase()}R${id}`;\n  });\n}\nfunction normalizeInstructionList(instructions = [], options = {}) {\n  const shared = { ...options, registerMap:new Map(), registerCounters:new Map() };\n  return instructions.map((x) => normalizeInstruction(x, shared)).filter(Boolean);\n}\nfunction normalizeInstructionBag(instructions = [], options = {}) {\n  return instructions.map((x) => normalizeInstruction(x, { ...options, registerMap:new Map(), registerCounters:new Map() })).filter(Boolean);\n}\n")
          replace('js/fingerprint/index.js',
            ".replace(/\\bsp\\b/gi, 'SP')\n    .replace(REGEX_REG, (_m, cls) => `${cls.toLowerCase()}R`);",
            ".replace(/\\bsp\\b/gi, 'SP');\n  normalized = normalizeRegisters(normalized, options);")
          replace('js/fingerprint/index.js',
            "  return out;\n}\n\nfunction cfgShape(cfg = {}) {",
            "  return out;\n}\n\nfunction stratifiedByteSample(bytes, maxBytes = 256) {\n  if (!bytes?.length) return [];\n  if (bytes.length <= maxBytes) return Array.from(bytes);\n  const first = Math.floor(maxBytes / 3), middle = Math.floor(maxBytes / 3), last = maxBytes - first - middle;\n  const middleStart = Math.max(first, Math.floor((bytes.length - middle) / 2));\n  const endStart = bytes.length - last;\n  return [...bytes.subarray(0, first), ...bytes.subarray(middleStart, middleStart + middle), ...bytes.subarray(endStart)];\n}\n\nfunction cfgShape(cfg = {}) {")
          replace('js/fingerprint/index.js',
            "    const instructions = (block.instructions || block.insns || []).map((x) => normalizeInstruction(x)).filter(Boolean);",
            "    const instructions = normalizeInstructionList(block.instructions || block.insns || []);")
          replace('js/fingerprint/index.js',
            "  if (fn?.schema === 'hex.function-fingerprint' && fn.version >= 2 && options.includeSemantic !== false) return fn;",
            "  if (fn?.schema === 'hex.function-fingerprint' && fn.version >= FUNCTION_FINGERPRINT_VERSION && options.includeSemantic !== false) return fn;")
          replace('js/fingerprint/index.js',
            "  if (fn?.schema === 'hex.function-fingerprint-fast' && fn.version >= 2) return fn;",
            "  if (fn?.schema === 'hex.function-fingerprint-fast' && fn.version >= FUNCTION_FINGERPRINT_VERSION) return fn;")
          replace('js/fingerprint/index.js',
            "  const instructions = (fn.instructions || []).map((x) => normalizeInstruction(x, fn.normalization)).filter(Boolean);",
            "  const instructions = normalizeInstructionList(fn.instructions || [], fn.normalization);", count=2)
          replace('js/fingerprint/index.js',
            "  const operands = instructions.map((x) => `${x.mnemonic} ${x.operands}`.trim());",
            "  const operands = instructions.map((x) => `${x.mnemonic} ${x.operands}`.trim());\n  const bagOperands = normalizeInstructionBag(fn.instructions || [], fn.normalization).map((x) => `${x.mnemonic} ${x.operands}`.trim());")
          replace('js/fingerprint/index.js',
            "  const mnemonics = instructions.map((x) => x.mnemonic), operands = instructions.map((x) => `${x.mnemonic} ${x.operands}`.trim());",
            "  const mnemonics = instructions.map((x) => x.mnemonic), operands = instructions.map((x) => `${x.mnemonic} ${x.operands}`.trim());\n  const bagOperands = normalizeInstructionBag(fn.instructions || [], fn.normalization).map((x) => `${x.mnemonic} ${x.operands}`.trim());")
          replace('js/fingerprint/index.js',
            "  const normalizedOperandBagHash = operands.length ? nonEmptyHash([...operands].sort()) : (fn.normalizedOperandBagHash || null);",
            "  const normalizedOperandBagHash = bagOperands.length ? nonEmptyHash([...bagOperands].sort()) : (fn.normalizedOperandBagHash || null);", count=2)
          replace('js/fingerprint/index.js',
            "    byteSample: normalizedBytes ? Array.from(normalizedBytes.subarray(0, Math.min(256, normalizedBytes.length))) : Array.from(fn.byteSample || []),",
            "    byteSample: normalizedBytes ? stratifiedByteSample(normalizedBytes) : Array.from(fn.byteSample || []),")
          replace('js/fingerprint/index.js',
            "  if (a.exactBytesHash && b.exactBytesHash && a.size > 0 && b.size > 0 && a.exactBytesHash === b.exactBytesHash) {",
            "  if (a.exactBytesHash && b.exactBytesHash && a.size > 0 && a.size === b.size && a.exactBytesHash === b.exactBytesHash) {")
          replace('js/fingerprint/index.js',
            "  const normalizedExact = !!a.normalizedBytesHash && a.normalizedBytesHash === b.normalizedBytesHash && a.size > 0 && b.size > 0;",
            "  const normalizedExact = !!a.normalizedBytesHash && a.normalizedBytesHash === b.normalizedBytesHash && a.size > 0 && a.size === b.size;")
          replace('js/fingerprint/index.js',
            "  if (!normalizedExact) add(evidence, 'byte-similarity', byteSampleSimilarity(a.byteSample, b.byteSample), 0.42, 'bytes');",
            "  if (!normalizedExact) add(evidence, 'byte-similarity', byteSampleSimilarity(a.byteSample, b.byteSample), 0.16, 'byte-sample');")
          replace('js/fingerprint/index.js',
            "  let weighted = 0, total = 0;\n  for (const group of byGroup.values()) {\n    for (const e of group) { weighted += e.value * e.weight; total += e.weight; }\n  }\n  let confidence = total ? weighted / total : 0;\n  const strongPositive = evidence.filter((e) => ['bytes','instruction','semantic','cfg'].includes(e.group) && e.value >= 0.9);\n  const onlyWeak = strongPositive.length === 0;\n  if (onlyWeak) confidence = Math.min(confidence, 0.59);\n  if (normalizedExact) confidence = Math.max(confidence, 0.985);\n  const semanticExact = evidence.some((e) => e.signal === 'semantic-ir' && e.value === 1);\n  if (semanticExact && strongPositive.length >= 2) confidence = Math.max(confidence, 0.9);\n  const instructionExact = evidence.some((e) => e.signal === 'instruction-sequence' && e.value === 1);\n  if (instructionExact && evidence.some((e) => e.signal === 'normalized-operands' && e.value === 1)) confidence = Math.max(confidence, 0.86);\n  confidence = Math.max(0, Math.min(1, confidence));\n\n  let identity = 'unrelated';\n  if (normalizedExact) identity = 'normalized-identical';\n  else if (semanticExact && confidence >= 0.88) identity = 'semantic-equivalent';\n  else if (confidence >= 0.78 && strongPositive.length >= 1) identity = 'probable-same';\n  else if (confidence >= 0.55) identity = 'similar';",
            "  let weighted = 0, total = 0;\n  for (const group of byGroup.values()) {\n    const groupWeight = Math.max(...group.map((e) => e.weight));\n    const signalWeight = group.reduce((sum, e) => sum + e.weight, 0);\n    const groupValue = signalWeight ? group.reduce((sum, e) => sum + e.value * e.weight, 0) / signalWeight : 0;\n    weighted += groupValue * groupWeight; total += groupWeight;\n  }\n  let confidence = total ? weighted / total : 0;\n  const strongPositiveGroups = new Set(evidence.filter((e) => ['bytes','instruction','semantic','cfg'].includes(e.group) && e.value >= 0.9).map((e) => e.group));\n  const onlyWeak = strongPositiveGroups.size === 0;\n  if (onlyWeak) confidence = Math.min(confidence, 0.59);\n  if (normalizedExact) confidence = Math.max(confidence, 0.985);\n  const semanticExact = evidence.some((e) => e.signal === 'semantic-ir' && e.value === 1);\n  if (semanticExact && strongPositiveGroups.size >= 2) confidence = Math.max(confidence, 0.9);\n  const instructionExact = evidence.some((e) => e.signal === 'instruction-sequence' && e.value === 1);\n  if (instructionExact && evidence.some((e) => e.signal === 'normalized-operands' && e.value === 1) && strongPositiveGroups.size >= 2) confidence = Math.max(confidence, 0.86);\n  if (!normalizedExact && strongPositiveGroups.size < 2) confidence = Math.min(confidence, 0.77);\n  confidence = Math.max(0, Math.min(1, confidence));\n\n  let identity = 'unrelated';\n  if (normalizedExact) identity = 'normalized-identical';\n  else if (semanticExact && strongPositiveGroups.size >= 2 && confidence >= 0.88) identity = 'semantic-equivalent';\n  else if (confidence >= 0.78 && strongPositiveGroups.size >= 2) identity = 'probable-same';\n  else if (confidence >= 0.55) identity = 'similar';")
          replace('js/fingerprint/index.js',
            "export function coarseTokens(fp) {\n  if (!fp?.schema) fp = fingerprintFunctionFast(fp);",
            "export function coarseTokens(fp) {\n  if (!fp?.schema || Number(fp.version || 0) < FUNCTION_FINGERPRINT_VERSION) fp = fingerprintFunctionFast(fp);")

          # Matcher upgrades stale fingerprints and does not silently promote plain similarity.
          replace('js/recognition/matcher.js',
            "    this.items = functions.map((x) => mode === 'full' ? fingerprintFunction(x) : (x?.schema ? x : fingerprintFunctionFast(x)));",
            "    this.items = functions.map((x) => mode === 'full' ? fingerprintFunction(x) : fingerprintFunctionFast(x));")
          replace('js/recognition/matcher.js',
            "    const fp = input?.schema ? input : fingerprintFunctionFast(input);",
            "    const fp = fingerprintFunctionFast(input);")
          replace('js/recognition/matcher.js',
            "  all.sort((a, b) => b.confidence - a.confidence || b.baseConfidence - a.baseConfidence || a.i - b.i || a.j - b.j);\n  const usedBefore = new Set(), usedAfter = new Set(), matches = [];\n  for (const c of all) {",
            "  const eligible = all.filter((c) => {\n    if (c.identity !== 'similar' || options.allowSimilar === true) return true;\n    if (c.baseConfidence >= 0.7 && c.confidence >= 0.78 && c.reasons.includes('call-neighborhood')) { c.identity = 'probable-same'; return true; }\n    return false;\n  });\n  eligible.sort((a, b) => b.confidence - a.confidence || b.baseConfidence - a.baseConfidence || a.i - b.i || a.j - b.j);\n  const usedBefore = new Set(), usedAfter = new Set(), matches = [];\n  for (const c of eligible) {")
          replace('js/recognition/matcher.js',
            "    const alternatives = all.filter((x) => x.i === c.i && x.j !== c.j && !usedAfter.has(x.j) && c.confidence - x.confidence <= ambiguityWindow)",
            "    const alternatives = eligible.filter((x) => x.i === c.i && x.j !== c.j && !usedAfter.has(x.j) && c.confidence - x.confidence <= ambiguityWindow)")

          # Diff is intentionally broader than identity matching, while preserving legacy status strings.
          replace('js/diff/index.js',
            "maxCandidates:options.maxCandidates ?? 128});",
            "maxCandidates:options.maxCandidates ?? 128, allowSimilar:options.allowSimilar ?? true});")
          replace('js/diff/index.js',
            "    const status=changeType==='same'?'identical':changeType==='changed'?'slightly changed':changeType;",
            "    const status=changeType==='same'?'identical':changeType==='moved'?'moved':'slightly changed';")

          # Knowledge defaults are conservative; negative knowledge is scoped.
          replace('js/knowledge/index.js',
            "    const confirmation = CONFIRMATION_LEVELS.includes(input.confirmation) ? input.confirmation :\n      input.userConfirmed ? 'user-confirmed' : input.debuggerConfirmed ? 'debugger-confirmed' : input.metadataConfirmed ? 'metadata-confirmed' :\n      clamp(input.confidence ?? 1) >= 0.9 ? 'high-confidence-inferred' : 'weak-inferred';",
            "    const requestedConfirmation = CONFIRMATION_LEVELS.includes(input.confirmation) ? input.confirmation : null;\n    const userConfirmed = input.userConfirmed || requestedConfirmation === 'user-confirmed';\n    const debuggerConfirmed = input.debuggerConfirmed || requestedConfirmation === 'debugger-confirmed';\n    const metadataConfirmed = input.metadataConfirmed || requestedConfirmation === 'metadata-confirmed';\n    const resolvedConfidence = input.confidence == null ? (userConfirmed || debuggerConfirmed ? 1 : metadataConfirmed ? 0.95 : 0.5) : clamp(input.confidence);\n    const confirmation = requestedConfirmation || (userConfirmed ? 'user-confirmed' : debuggerConfirmed ? 'debugger-confirmed' : metadataConfirmed ? 'metadata-confirmed' : resolvedConfidence >= 0.9 ? 'high-confidence-inferred' : 'weak-inferred');")
          replace('js/knowledge/index.js',
            "      sourceBinaryHash, versions: uniq(input.versions), confidence: clamp(input.confidence ?? 1), confirmation,",
            "      sourceBinaryHash, versions: uniq(input.versions), confidence: resolvedConfidence, confirmation,")
          replace('js/knowledge/index.js',
            "    const record = { id:key, sourceBinaryHash:input.sourceBinaryHash || 'unknown', candidateName:input.candidateName || null, candidateIdentity:input.candidateIdentity || null,\n      targetHash:targetFingerprint?.hash || null, targetSemanticHash:targetFingerprint?.semanticHash || null, reason:input.reason || 'rejected', updatedAt:Date.now() };",
            "    const targetAddress = input.address ?? targetFingerprint?.address ?? null;\n    const record = { id:key, sourceBinaryHash:input.sourceBinaryHash || 'unknown', candidateName:input.candidateName || null, candidateIdentity:input.candidateIdentity || null,\n      targetHash:targetFingerprint?.hash || null, targetSemanticHash:targetFingerprint?.semanticHash || null, targetNormalizedBytesHash:targetFingerprint?.normalizedBytesHash || null,\n      targetAddress:targetAddress == null ? null : addrText(targetAddress), targetSize:targetFingerprint?.size || null, reason:input.reason || 'rejected', updatedAt:Date.now() };")
          replace('js/knowledge/index.js',
            "    return records.some((r) => (!r.candidateName || r.candidateName === name) && (!r.candidateIdentity || r.candidateIdentity === identity) && (!fp || !r.targetHash || r.targetHash === fp.hash || r.targetSemanticHash === fp.semanticHash));",
            "    return records.some((r) => {\n      if (r.candidateName && r.candidateName !== name) return false;\n      if (r.candidateIdentity && r.candidateIdentity !== identity) return false;\n      if (fp) {\n        if (r.targetHash && fp.hash && r.targetHash === fp.hash) return true;\n        if (r.targetNormalizedBytesHash && fp.normalizedBytesHash && r.targetNormalizedBytesHash === fp.normalizedBytesHash) return true;\n        if (r.candidateIdentity && r.targetSemanticHash && fp.semanticHash && r.targetSemanticHash === fp.semanticHash && (!r.targetSize || !fp.size || r.targetSize === fp.size)) return true;\n      }\n      const address = input.address ?? fp?.address ?? null;\n      const sameBinary = r.sourceBinaryHash !== 'unknown' && input.sourceBinaryHash && r.sourceBinaryHash === input.sourceBinaryHash;\n      return !r.targetHash && !r.targetNormalizedBytesHash && !r.targetSemanticHash && sameBinary && address != null && r.targetAddress === addrText(address);\n    });")

          # Classification does not confuse linked runtime APIs with runtime ownership.
          replace('js/recognition/classifier.js',
            "const GENERATED = [/thunk/i, /outlined/i, /block_invoke/i, /partial apply/i, /witness thunk/i, /metadata accessor/i];",
            "const GENERATED = [/\\bthunk\\b/i, /^outlined(?: function)?\\b/i, /block_invoke/i, /partial apply/i, /witness thunk/i, /metadata accessor/i];\nconst RUNTIME_NAMES = [/^_?(?:objc_|swift_|dyld_|__?cxa_|pthread_)/i];")
          replace('js/recognition/classifier.js',
            "  const libs = [...(context.libraries || []), ...fp.imports];\n  const runtimeHits = libs.filter((x) => SYSTEM_LIBS.some((rx) => rx.test(String(x))))\n    .concat(fp.imports.filter((x) => RUNTIME_IMPORTS.some((rx) => rx.test(String(x)))));\n  if (runtimeHits.length >= 2 && !(fp.objc.class || fp.swift.typeDescriptor || context.appType)) return { classification: 'RUNTIME', confidence: Math.min(0.94, 0.72 + runtimeHits.length * 0.04), evidence: runtimeHits.slice(0, 6) };",
            "  if (RUNTIME_NAMES.some((rx) => rx.test(name))) return { classification:'RUNTIME', confidence:0.88, evidence:['runtime-symbol-name'] };\n  const runtimeImports = fp.imports.filter((x) => RUNTIME_IMPORTS.some((rx) => rx.test(String(x))));")
          replace('js/recognition/classifier.js',
            "  if (context.notKnownVendor) { appScore += 0.14; evidence.push('not-known-vendor'); }",
            "  if (context.notKnownVendor) { appScore += 0.14; evidence.push('not-known-vendor'); }\n  if (runtimeImports.length) evidence.push('uses-runtime-api');")

          # Generic vendor fallback requires appropriate evidence provenance.
          replace('js/signature/index.js',
            "  const vendorHits = new Map();\n  for (const value of [...libraries, ...symbols, ...strings]) {\n    const text = textOf(value); if (!text) continue; const vendor = vendorInText(text); if (!vendor) continue;\n    let record = vendorHits.get(vendor.vendor); if (!record) vendorHits.set(vendor.vendor, record = { values:new Set(), kind:vendor.kind }); record.values.add(text);\n  }\n  for (const [name, hit] of vendorHits) {\n    if (existing.has(name.toLowerCase())) continue;\n    const evidence=[...hit.values].slice(0,12); const confidence=Math.min(0.94,0.76+0.04*Math.min(4,evidence.length));\n    results.push({ name, library:name, classification:hit.kind==='library'?'LIBRARY':'SDK', kind:hit.kind, confidence, confirmed:false, evidence });\n  }",
            "  const vendorHits = new Map();\n  for (const [source, values] of [['library',libraries],['symbol',symbols],['string',strings]]) {\n    for (const value of values) {\n      const text = textOf(value); if (!text) continue; const vendor = vendorInText(text); if (!vendor) continue;\n      let record = vendorHits.get(vendor.vendor);\n      if (!record) vendorHits.set(vendor.vendor, record = { values:new Set(), sources:new Set(), kind:vendor.kind });\n      record.values.add(text); record.sources.add(source);\n    }\n  }\n  for (const [name, hit] of vendorHits) {\n    if (existing.has(name.toLowerCase())) continue;\n    const evidence=[...hit.values].slice(0,12), evidenceKinds=[...hit.sources];\n    let confidence = hit.sources.has('library') ? 0.82 : hit.sources.has('symbol') ? (evidence.length >= 2 ? 0.68 : 0.56) : (evidence.length >= 2 ? 0.56 : 0.46);\n    if (hit.sources.size >= 2) confidence += 0.08;\n    confidence = Math.min(0.92, confidence);\n    results.push({ name, library:name, classification:hit.kind==='library'?'LIBRARY':'SDK', kind:hit.kind, confidence, confirmed:false, evidence, evidenceKinds });\n  }")

          # Focused regressions for review findings.
          p = Path('tests/recognition-intelligence.mjs')
          s = p.read_text()
          marker = "assert.equal(normalizeInstruction('adrp x8, #0x100120000').operands.includes('@address'), true, 'relocatable addresses normalize');\n"
          insert = """const aliasSame=fingerprintFunction({...base,bytes:null,semantic:{},cfg:{},strings:[],imports:[],calls:[],constants:[],instructions:['add x3,x1,x1','ret']});\nconst aliasDifferent=fingerprintFunction({...base,bytes:null,semantic:{},cfg:{},strings:[],imports:[],calls:[],constants:[],instructions:['add x3,x1,x2','ret']});\nassert.notEqual(aliasSame.normalizedOperandsHash,aliasDifferent.normalizedOperandsHash,'register normalization preserves same-vs-different aliases');\nconst spoofA=fingerprintFunction({address:30n,size:4,byteHash:'same-precomputed-hash'}), spoofB=fingerprintFunction({address:31n,size:8,byteHash:'same-precomputed-hash'});\nassert.notEqual(compareFingerprints(spoofA,spoofB).identity,'exact','equal precomputed hash with different size is not exact identity');\n"""
          if marker not in s: raise SystemExit('recognition marker 1 missing')
          s = s.replace(marker, marker + insert, 1)
          marker = "assert.equal(schedA.instructionBagHash,schedB.instructionBagHash,'instruction scheduling keeps bag identity');\n"
          if marker not in s: raise SystemExit('recognition marker 2 missing')
          s = s.replace(marker, marker + "assert.equal(schedA.normalizedOperandBagHash,schedB.normalizedOperandBagHash,'scheduling-tolerant operand bag preserves local register roles');\n", 1)
          marker = "// unrelated collision resistance: same size/empty metadata alone cannot match.\n"
          insert = """// Common prefixes and one correlated signal family are insufficient identity evidence.\nconst longA=Uint8Array.from({length:1024},(_,i)=>i<300?0x55:(i*13)&255);\nconst longB=Uint8Array.from({length:1024},(_,i)=>i<300?0x55:(i*29+7)&255);\nconst longCmp=compareFingerprints(fingerprintFunction({address:40n,architecture:'arm64',bytes:longA}),fingerprintFunction({address:41n,architecture:'arm64',bytes:longB}));\nassert.ok(longCmp.confidence<0.55,'stratified sampling prevents common-prefix false matches');\nconst instructionOnlyA={address:42n,architecture:'arm64',size:16,instructions:['mov x8,x9','add x8,x8,#1','ret']};\nconst instructionOnlyB={address:43n,architecture:'arm64',size:16,instructions:['mov x20,x21','add x20,x20,#1','ret']};\nassert.equal(matchFunctions([instructionOnlyA],[instructionOnlyB]).matches.length,0,'correlated instruction evidence alone is not identity');\nconst staleFast={schema:'hex.function-fingerprint-fast',version:2,address:44n,architecture:'arm64',size:16,instructionSequenceHash:'legacy'};\nassert.equal(new FunctionMatchIndex([staleFast]).items[0].version,3,'stale fast fingerprints are upgraded before indexing');\n\n"""
          if marker not in s: raise SystemExit('recognition marker 3 missing')
          s = s.replace(marker, insert + marker, 1)
          marker = "assert.equal(classifyFunction(base,{owningLibrary:'/usr/lib/libSystem.B.dylib'}).classification,'SYSTEM');\n"
          insert = """const cAppRuntimeCalls={address:55n,architecture:'arm64',imports:['malloc','free'],instructions:['bl malloc','bl free','ret']};\nassert.notEqual(classifyFunction(cAppRuntimeCalls,{libraries:['Foundation.framework','/usr/lib/libSystem.B.dylib']}).classification,'RUNTIME','linked frameworks plus malloc/free do not imply runtime ownership');\nconst fallbackVendor=recognizeLibraries({strings:['AppLovin internal marker only']}).find((x)=>x.name==='AppLovin MAX');\nif (fallbackVendor) assert.ok(fallbackVendor.confidence<0.8,'one vendor string cannot reach suppression confidence');\n"""
          if marker not in s: raise SystemExit('recognition marker 4 missing')
          s = s.replace(marker, marker + insert, 1)
          marker = "const db=new KnowledgeDB({indexedDB:null,memory:new Map(),negativeMemory:new Map()});\n"
          insert = """const defaultDb=new KnowledgeDB({indexedDB:null,memory:new Map(),negativeMemory:new Map()});\nconst defaultRecord=await defaultDb.remember({fingerprint:base,name:'heuristic-name'});\nassert.equal(defaultRecord.confirmation,'weak-inferred'); assert.equal(defaultRecord.confidence,0.5);\nconst explicitConfirmed=await defaultDb.remember({fingerprint:{...base,address:0x1111n},name:'confirmed-name',confirmation:'user-confirmed'});\nassert.equal(explicitConfirmed.confidence,1); assert.equal(explicitConfirmed.confirmation,'user-confirmed');\nawait defaultDb.reject({sourceBinaryHash:'v2',candidateName:'address-scoped',address:0x1234n});\nassert.equal(await defaultDb.isRejected({sourceBinaryHash:'v2',candidateName:'address-scoped',address:0x1234n}),true);\nassert.equal(await defaultDb.isRejected({sourceBinaryHash:'v2',candidateName:'address-scoped',address:0x5678n}),false,'address-only rejection is not global negative knowledge');\n\n"""
          if marker not in s: raise SystemExit('recognition marker 5 missing')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
      - name: Core and recognition regressions
        run: npm run check
      - name: Platform suite
        run: npm run platform:test
      - name: Binary suite
        run: npm run binary:test
      - name: Binary gate
        run: npm run binary:gate
      - name: Commit reviewed hardening
        shell: bash
        run: |
          rm -f .github/workflows/recognition-review-hardening-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden recognition false-positive controls after review'
          git push origin HEAD:finish-recognition-knowledge-intelligence
