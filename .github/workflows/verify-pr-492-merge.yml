name: Verify PR 492 after main sync

on:
  push:
    branches:
      - fix/latest-470-469-distributed-quota-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full static and regression suite
        run: npm run check
      - name: Worker deployment shape
        run: npx --yes wrangler@latest deploy --dry-run
