name: Merge latest main for ready PR 460
on:
  push:
    branches: [fix/issue-456-report-completeness]
permissions:
  contents: write
jobs:
  merge-main:
    if: startsWith(github.event.head_commit.message, 'ready-pr-merge-helper:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            expected=$'js/ir-core.js\njs/report.js\njs/schema.js\npackage.json'
            test "$conflicts" = "$expected" || { echo "Unexpected conflicts: $conflicts"; exit 1; }
            git checkout --theirs js/ir-core.js js/report.js js/schema.js package.json
            python3 .github/resolve-ready-460.py
            git add js/ir-core.js js/report.js js/report-legacy.js js/schema.js package.json
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/merge-ready-460.yml .github/resolve-ready-460.py
          npm run check
          git add -A
          git commit -m 'Merge latest main into #460'
          git push origin HEAD
