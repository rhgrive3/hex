name: Temporary ready PR merge helper
on:
  push:
    branches: [fix/issue-456-report-completeness]
permissions:
  contents: write
jobs:
  merge-main:
    if: startsWith(github.event.head_commit.message, 'ready-pr-merge-helper:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Merge current main and preserve both contracts
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          test "$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ')" = "js/query/planner.js package.json "

          git checkout --theirs js/query/planner.js package.json

          python3 <<'PY'
          from pathlib import Path
          p = Path('js/query/planner.js')
          s = p.read_text()
          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('planner merge anchor missing: ' + old[:100])
              s = s.replace(old, new, 1)

          rep("    functionExhausted: false,\n    unaccountedToolCost: false,",
              "    functionExhausted: false,\n    candidateTruncated: false,\n    candidateCount: 0,\n    unaccountedToolCost: false,")
          rep("  const list = Array.from(map.values()).sort((a, b2) => b2.score - a.score).slice(0, b.maxFunctions);",
              "  const ordered = Array.from(map.values()).sort((a, b2) => b2.score - a.score);\n  b.candidateCount = ordered.length;\n  b.candidateTruncated = ordered.length > b.maxFunctions;\n  const list = ordered.slice(0, b.maxFunctions);")
          rep("function publicCandidate(c) {", "function publicCandidate(c, completeness = null) {")
          rep("    evidence: Array.from(c.evidence || []),\n  };",
              "    evidence: Array.from(c.evidence || []),\n    complete: completeness ? completeness.complete === true : true,\n    budgetLimited: completeness ? completeness.budgetLimited === true : false,\n  };")
          rep("    if (b.functionExhausted) missingEvidence.push('function-budget');",
              "    if (b.functionExhausted || b.candidateTruncated) missingEvidence.push('function-budget');")
          anchor = "    if (query.confident === false) missingEvidence.push(...(query.missing || []));\n\n    return {\n      query,\n      candidates: ranked.slice(0, Math.min(20, b.maxFunctions)).map(publicCandidate),\n      best: publicCandidate(best),\n      evidence: Array.from(evidence),\n      missingEvidence: Array.from(new Set(missingEvidence)),\n      exhausted: expired(b),\n      stats: {\n        analyzedFunctions: ranked.length,\n        candidateFunctions: candidates.size,"
          replacement = "    if (query.confident === false) missingEvidence.push(...(query.missing || []));\n\n    const incomplete = expired(b) || b.candidateTruncated;\n    const budgetLimited = b.disassemblyExhausted || b.functionExhausted || b.candidateTruncated;\n    const candidateCount = candidates.size;\n    const analyzedCount = ranked.length;\n    const candidateCoverage = candidateCount === 0 ? 1 : Math.min(1, analyzedCount / candidateCount);\n    const reason = b.candidateTruncated || b.functionExhausted ? 'function-budget'\n      : b.disassemblyExhausted ? 'disassembly-budget'\n        : timedOut(b) ? 'timeout'\n          : cancelled(b) ? 'cancelled' : null;\n    const completeness = {\n      complete: !incomplete,\n      partial: incomplete,\n      budgetLimited,\n      reason,\n      candidateCoverage,\n      analyzedFunctions: analyzedCount,\n      candidateFunctions: candidateCount,\n      unanalyzedFunctions: Math.max(0, candidateCount - analyzedCount),\n    };\n\n    return {\n      query,\n      candidates: ranked.slice(0, Math.min(20, b.maxFunctions)).map((c) => publicCandidate(c, completeness)),\n      best: publicCandidate(best, completeness),\n      evidence: Array.from(evidence),\n      missingEvidence: Array.from(new Set(missingEvidence)),\n      exhausted: incomplete,\n      partial: incomplete,\n      completeness,\n      stats: {\n        analyzedFunctions: analyzedCount,\n        candidateFunctions: candidateCount,\n        unanalyzedFunctions: Math.max(0, candidateCount - analyzedCount),"
          rep(anchor, replacement)
          p.write_text(s)
          PY

          git show HEAD:package.json > /tmp/ours-package.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const current = JSON.parse(fs.readFileSync('package.json','utf8'));
          const ours = JSON.parse(fs.readFileSync('/tmp/ours-package.json','utf8'));
          current.scripts ||= {};
          for (const [name, value] of Object.entries(ours.scripts || {})) {
            if (!(name in current.scripts)) { current.scripts[name] = value; continue; }
            if (current.scripts[name] === value) continue;
            const have = current.scripts[name].split(' && ');
            const extra = value.split(' && ').filter((cmd) => !have.includes(cmd));
            if (extra.length) current.scripts[name] = [...extra, ...have].join(' && ');
          }
          fs.writeFileSync('package.json', JSON.stringify(current, null, 2) + '\n');
          NODE

          git add js/query/planner.js package.json
          test -z "$(git diff --name-only --diff-filter=U)"
          rm .github/workflows/merge-ready-460.yml
          git add -A
          npm run check
          git commit -m 'Merge current main into #460 without dropping planner completeness'
          git push origin HEAD:fix/issue-456-report-completeness
