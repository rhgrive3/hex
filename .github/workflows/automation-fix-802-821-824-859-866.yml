name: Apply five issue fix batch
on:
  push:
    branches:
      - fix/issues-802-821-824-859-866
permissions:
  contents: write
jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[applied-802-821-824-859-866]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal source fixes and regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once('js/emu.js',
          """    if (mn === 'neg' || mn === 'negs') { this.set(ops[0].text, -R(ops[1])); return null; }""",
          """    if (mn === 'neg' || mn === 'negs') {
      const wide = isWide(ops[0]);
      const operand = R(ops[1]);
      const result = BigInt.asUintN(wide ? 64 : 32, -operand);
      this.set(ops[0].text, result);
      if (mn === 'negs') this.setFlags('subs', 0n, operand, result, wide);
      return null;
    }""")

          replace_once('js/emu.js',
          """        else if (o === 'asr') v = BigInt.asIntN(64, v) >> s;""",
          """        else if (o === 'asr') v = BigInt.asIntN(op.bits === 32 ? 32 : 64, v) >> s;""")

          replace_once('js/expr.js',
          """    } else if (base === 'ubfx' || base === 'sbfx') {
      const lsb = insn.ops[2] && insn.ops[2].value != null ? insn.ops[2].value : 0n;
      const width = insn.ops[3] && insn.ops[3].value != null ? insn.ops[3].value : 0n;
      const shifted = bin('shr', A(), constNode(lsb), bits);
      emit(dst, width > 0n && width < 64n ? bin('and', shifted, constNode((1n << width) - 1n), bits) : shifted);
""",
          """    } else if (base === 'ubfx' || base === 'sbfx') {
      const lsb = insn.ops[2] && insn.ops[2].value != null ? insn.ops[2].value : 0n;
      const width = insn.ops[3] && insn.ops[3].value != null ? insn.ops[3].value : 0n;
      const destWidth = BigInt(bits);
      if (lsb < 0n || width <= 0n || lsb + width > destWidth) {
        regs.delete(dst);
      } else {
        const shifted = bin('shr', A(), constNode(lsb), bits);
        const field = width < destWidth
          ? bin('and', shifted, constNode((1n << width) - 1n), bits)
          : shifted;
        if (base === 'sbfx' && width < destWidth) {
          // Sign-extend an extracted unsigned field without assuming host width:
          // (field ^ signBit) - signBit is exact for field in [0, 2^width).
          const signBit = 1n << (width - 1n);
          emit(dst, bin('sub', bin('xor', field, constNode(signBit), bits), constNode(signBit), bits));
        } else {
          emit(dst, field);
        }
      }
""")

          replace_once('js/ir.js',
          """function sizeCompatible(a, b) {
  if (a.size == null || b.size == null) return true;
  return a.size === b.size;
}""",
          """function sizeCompatible(a, b) {
  // MustAlias is an extent-equality proof. An unknown extent cannot prove that
  // two accesses denote the same memory range, even when their starts match.
  if (a.size == null || b.size == null) return false;
  return a.size === b.size;
}""")

          replace_once('js/ir.js',
          """    const sa = BigInt(x.size || 8), sb = BigInt(y.size || 8);
    return !(pa + sa <= pb || pb + sb <= pa);""",
          """    if (x.size == null || y.size == null) return true;
    const sa = BigInt(x.size), sb = BigInt(y.size);
    return !(pa + sa <= pb || pb + sb <= pa);""")

          replace_once('js/ir.js',
          """    const sa = BigInt(x.size || 8), sb = BigInt(y.size || 8);
    return !(x.disp + sa <= y.disp || y.disp + sb <= x.disp);""",
          """    if (x.size == null || y.size == null) return true;
    const sa = BigInt(x.size), sb = BigInt(y.size);
    return !(x.disp + sa <= y.disp || y.disp + sb <= x.disp);""")

          replace_once('js/semantics/ir/normalize-effects.js',
          """  'add', 'sub', 'mul', 'sdiv', 'udiv', 'div', 'and', 'or', 'orr', 'xor', 'eor', 'bic', 'orn', 'eon',""",
          """  'add', 'sub', 'mul', 'sdiv', 'udiv', 'div', 'srem', 'urem', 'and', 'or', 'orr', 'xor', 'eor', 'bic', 'orn', 'eon',""")

          test = r'''import assert from 'node:assert/strict';
import { Emulator } from '../js/emu.js';
import { buildValues } from '../js/expr.js';
import { MK, mustAlias, mayAliasProvenance } from '../js/ir.js';
import { classifyMachineValueOpcode } from '../js/semantics/ir/normalize-effects.js';

function gp(text, bits = text.startsWith('w') ? 32 : 64) {
  const m = /^(?:x|w)(\d+)$/.exec(text);
  return { k:'reg', text, cls:'gp', bits, num:m ? Number(m[1]) : 0 };
}
function imm(value) { return { k:'imm', value:BigInt(value) }; }

// #802: NEGS updates width-aware NZCV, NEG preserves flags.
{
  const e = new Emulator({});
  e.set('w1', 1n);
  e.nzcv = { n:false, z:true, c:true, v:true };
  await e.execute('negs', 'w0, w1', 0n);
  assert.equal(e.get('w0'), 0xffffffffn);
  assert.deepEqual(e.nzcv, { n:true, z:false, c:false, v:false });
  e.set('w1', 0n);
  await e.execute('negs', 'w0, w1', 0n);
  assert.deepEqual(e.nzcv, { n:false, z:true, c:true, v:false });
  e.set('w1', 0x80000000n);
  await e.execute('negs', 'w0, w1', 0n);
  assert.deepEqual(e.nzcv, { n:true, z:false, c:false, v:true });
  e.nzcv = { n:false, z:false, c:true, v:true };
  await e.execute('neg', 'w0, w1', 0n);
  assert.deepEqual(e.nzcv, { n:false, z:false, c:true, v:true });
  assert.equal(e.cond('mi'), false);
}

// #824: shifted W-register ASR uses bit 31; X-register ASR keeps bit 63 semantics.
{
  const e = new Emulator({});
  e.set('w1', 0n); e.set('w2', 0x80000000n);
  await e.execute('add', 'w0, w1, w2, asr #1', 0n);
  assert.equal(e.get('w0'), 0xc0000000n);
  e.set('w2', 0x40000000n);
  await e.execute('orr', 'w0, wzr, w2, asr #1', 0n);
  assert.equal(e.get('w0'), 0x20000000n);
  e.set('x1', 0n); e.set('x2', 0x8000000000000000n);
  await e.execute('add', 'x0, x1, x2, asr #1', 0n);
  assert.equal(e.get('x0'), 0xc000000000000000n);
}

function evalExpr(n) {
  if (!n) throw new Error('missing expression');
  if (n.k === 'const') return n.v;
  if (n.k === 'un') {
    const a = evalExpr(n.a);
    if (n.op === 'uxt32') return BigInt.asUintN(32, a);
    if (n.op === 'sxt32') return BigInt.asIntN(32, a);
    if (n.op === 'neg') return -a;
    throw new Error('unsupported unary ' + n.op);
  }
  if (n.k === 'bin') {
    const a = evalExpr(n.a), b = evalExpr(n.b);
    if (n.op === 'shr') return BigInt.asUintN(64, a) >> b;
    if (n.op === 'and') return a & b;
    if (n.op === 'xor') return a ^ b;
    if (n.op === 'sub') return a - b;
    throw new Error('unsupported binary ' + n.op);
  }
  throw new Error('unsupported node ' + n.k);
}
function instruction(row, mnemonic, ops, reads, writes) {
  return { row, address:BigInt(row * 4), mnemonic, ops, reads, writes, data:false, isCall:false, isReturn:false };
}
function sbfxResult(dst, srcValue, lsb, width) {
  const bits = dst.startsWith('w') ? 32 : 64;
  const src = bits === 32 ? 'w1' : 'x1';
  const model = { instructions:[
    instruction(0, 'mov', [gp(src,bits), imm(srcValue)], [], ['x1']),
    instruction(1, 'sbfx', [gp(dst,bits), gp(src,bits), imm(lsb), imm(width)], ['x1'], ['x0']),
  ], basicBlocks:[], calls:[], addressRefs:[] };
  return buildValues(model).defAt(1, 'x0');
}
// #821: signed bitfields are sign-extended; positive/nonzero-lsb and W view stay correct.
assert.equal(evalExpr(sbfxResult('x0', 0x80n, 0n, 8n)), -128n);
assert.equal(evalExpr(sbfxResult('x0', 0x7fn, 0n, 8n)), 127n);
assert.equal(evalExpr(sbfxResult('x0', 0x8000n, 8n, 8n)), -128n);
assert.equal(evalExpr(sbfxResult('w0', 0x80n, 0n, 8n)), 0xffffff80n);

// #859: unknown extents never become MustAlias or an invented 8-byte NoAlias proof.
for (const [a, b] of [
  [{ kind:MK.GLOBAL, address:0x1000n, size:null }, { kind:MK.GLOBAL, address:0x1000n, size:4 }],
  [{ kind:MK.STACK, disp:0n, size:null }, { kind:MK.STACK, disp:0n, size:4 }],
  [{ kind:MK.FIELD, base:{ provenance:{ kind:'object', root:'r', offset:0n, must:true } }, disp:0n, size:null }, { kind:MK.FIELD, base:{ provenance:{ kind:'object', root:'r', offset:0n, must:true } }, disp:0n, size:4 }],
]) assert.equal(mustAlias(a, b), false);
assert.equal(mayAliasProvenance({ kind:MK.GLOBAL, address:0x1000n, size:null }, { kind:MK.GLOBAL, address:0x1008n, size:8 }), true);
assert.equal(mayAliasProvenance({ kind:MK.STACK, disp:0n, size:null }, { kind:MK.STACK, disp:8n, size:8 }), true);
assert.equal(mayAliasProvenance({ kind:MK.GLOBAL, address:0x1000n, size:8 }, { kind:MK.GLOBAL, address:0x1008n, size:8 }), false);
assert.equal(mustAlias({ kind:MK.GLOBAL, address:0x1000n, size:8 }, { kind:MK.GLOBAL, address:0x1000n, size:8 }), true);

// #866: exact remainder operations stay generic Semantic IR binary nodes.
assert.deepEqual(classifyMachineValueOpcode('srem'), { kind:'binary', operator:'srem' });
assert.deepEqual(classifyMachineValueOpcode('urem'), { kind:'binary', operator:'urem' });
assert.deepEqual(classifyMachineValueOpcode('riscv64-srem'), { kind:'intrinsic', operator:'riscv64-srem' });

console.log('issues 802/821/824/859/866: ok');
'''
          Path('tests/issues-802-821-824-859-866.mjs').write_text(test)

          package = Path('package.json')
          text = package.read_text()
          needle = '"test": "node tests/phase4/integration/backend-open-race-current-oracle.test.mjs'
          replacement = '"test": "node tests/issues-802-821-824-859-866.mjs && node tests/phase4/integration/backend-open-race-current-oracle.test.mjs'
          if text.count(needle) != 1:
              raise SystemExit('package.json test script anchor mismatch')
          package.write_text(text.replace(needle, replacement, 1))

          Path('.github/workflows/automation-fix-802-821-824-859-866.yml').unlink()
          PY
      - name: Targeted regression
        run: node tests/issues-802-821-824-859-866.mjs
      - name: Static and semantic checks
        run: |
          npm run lint
          npm run semantic-v2:test
      - name: Full repository test
        run: npm test
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: resolve issues 802 821 824 859 866 [applied-802-821-824-859-866]'
          git push origin HEAD:${GITHUB_REF_NAME}
