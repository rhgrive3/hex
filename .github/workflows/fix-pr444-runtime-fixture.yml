name: Fix PR444 runtime fixture

on:
  push:
    branches:
      - fix/first-50-unreferenced-open-issues

permissions:
  contents: write

jobs:
  fix-runtime-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align runtime fixtures with hardened executable and wire contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/runtime-platform.mjs')
          text = path.read_text()
          old_program = """    fetch: async (addr) => table.get(BigInt(addr).toString()) || (fallback ? fallback(addr) : null),\n    read: async () => null,\n    symbolFor: () => null,"""
          new_program = """    fetch: async (addr) => table.get(BigInt(addr).toString()) || (fallback ? fallback(addr) : null),\n    read: async () => null,\n    isExecutable: (addr) => table.has(BigInt(addr).toString()),\n    symbolFor: () => null,"""
          old_wire = "const req=sent.find((x)=>x.type==='request'); assert.equal(req.params.address,'4660');"
          new_wire = "const req=sent.find((x)=>x.type==='request'); assert.deepEqual(req.params.address,{__hex_wire_type__:'bigint',value:'4660'});"
          if old_program not in text:
              raise SystemExit('program fixture target not found; refusing unsafe edit')
          if old_wire not in text:
              raise SystemExit('wire fixture target not found; refusing unsafe edit')
          text = text.replace(old_program, new_program, 1).replace(old_wire, new_wire, 1)
          path.write_text(text)
          PY
          node tests/runtime-platform.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/runtime-platform.mjs
          git commit -m "test: align runtime fixtures with hardened contracts"
          git push origin HEAD:fix/first-50-unreferenced-open-issues
