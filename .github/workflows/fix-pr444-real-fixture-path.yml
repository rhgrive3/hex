name: Fix PR444 real fixture path

on:
  push:
    branches:
      - fix/first-50-unreferenced-open-issues

permissions:
  contents: write

jobs:
  fix-real-fixture-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Point heavyweight binary tests at opt-in verified fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/universal-binary.mjs')
          text = path.read_text()
          old = "    const file=path.join(__dirname,c.name);"
          new = "    const file=path.join(__dirname,'.real-fixtures',c.name);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy fixture path, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          npm run binary:test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/universal-binary.mjs
          git commit -m "test: use opt-in real binary fixture directory"
          git push origin HEAD:fix/first-50-unreferenced-open-issues
