name: Fix PR444 real fixture path

on:
  push:
    branches:
      - fix/first-50-unreferenced-open-issues

permissions:
  contents: write

jobs:
  fix-real-fixture-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Point all heavyweight binary checks at opt-in verified fixtures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/universal-binary-gate.mjs'): (
                  "  const file=path.join(root,t.file);",
                  "  const file=path.join(root,'.real-fixtures',t.file);",
              ),
              Path('tests/universal-binary-benchmark.mjs'): (
                  "const files = process.argv.slice(2).length ? process.argv.slice(2) : ['battlecats','TsumTsum','YWP'].map((x) => path.join(root, x));",
                  "const files = process.argv.slice(2).length ? process.argv.slice(2) : ['battlecats','TsumTsum','YWP'].map((x) => path.join(root, '.real-fixtures', x));",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one legacy fixture path, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))
          PY
          npm run binary:test
          npm run binary:gate
          npm run binary:benchmark > /tmp/universal-platform-benchmark.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/universal-binary-gate.mjs tests/universal-binary-benchmark.mjs
          git commit -m "test: align binary gate and benchmark fixture paths"
          git push origin HEAD:fix/first-50-unreferenced-open-issues
