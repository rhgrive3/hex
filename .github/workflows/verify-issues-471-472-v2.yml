name: Verify latest-main legacy type issues 471-472

on:
  push:
    branches:
      - fix/latest-472-471-legacy-types-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-472-471-legacy-types-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply already-verified type source onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/latest-472-471-legacy-types
          git checkout origin/fix/latest-472-471-legacy-types -- js/types-legacy.js tests/issues-471-472-legacy-types.mjs
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const t = 'node tests/issues-471-472-legacy-types.mjs';
          if (!p.scripts['decompiler:test'].includes(t)) p.scripts['decompiler:test'] = `${t} && ${p.scripts['decompiler:test']}`;
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Focused regressions
        run: node tests/issues-471-472-legacy-types.mjs
      - name: Decompiler regressions
        run: npm run decompiler:test
      - name: Static checks
        run: |
          node --check js/types-legacy.js
          npm run lint
      - name: Commit latest-main source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/types-legacy.js tests/issues-471-472-legacy-types.mjs package.json
          git commit -m "fix: harden legacy alias lifetime and SIMD typing (#471 #472)"
          git push origin HEAD:fix/latest-472-471-legacy-types-v2
