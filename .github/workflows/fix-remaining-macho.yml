name: Fix remaining Mach-O issues

on:
  push:
    branches:
      - fix-remaining-macho-issues

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-remaining-macho-issues
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused fixes
        run: |
          python3 .github/scripts/fix_remaining_macho.py
          python3 .github/scripts/fix_remaining_macho_followup.py
      - name: Syntax checks
        run: |
          node --check js/platform/analysis-result.js
          node --check js/platform/worker.js
          node --check js/macho-analysis-merge.js
          node --check js/binary/source-loaders.js
          node --check js/binary/macho.js
          node --check js/chained.js
          node --check js/objc-stub-recovery.js
          node --check js/worker-legacy.js
      - name: Focused regressions
        run: |
          node tests/issues-521-527.mjs
          node tests/issue-569-chained-segment-bounds.mjs
          node tests/issue-570-macho-metadata-budget.mjs
          node tests/issue-529-objc-integration.mjs
          node tests/universal-binary-source.mjs
          node tests/binary-platform.mjs
          node tests/worker-classic-harness.mjs
      - name: Lint
        run: npm run lint
      - name: Full test suite
        run: npm test
      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-remaining-macho.yml .github/scripts/fix_remaining_macho.py .github/scripts/fix_remaining_macho_followup.py
          git add -A
          git commit -m "Fix Mach-O symbol truth and recovery budgets (#521 #527)"
          git push origin HEAD:fix-remaining-macho-issues
