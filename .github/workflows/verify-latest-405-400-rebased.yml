name: Verify rebased latest issue fixes

on:
  push:
    branches:
      - fix/latest-405-400-rebased

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Latest issue regressions
        run: node tests/issues-400-405.mjs
      - name: Decompiler regression suite
        run: npm run decompiler:test
      - name: Semantic IR regression suite
        run: npm run semantic:test
      - name: Static checks
        run: npm run lint
